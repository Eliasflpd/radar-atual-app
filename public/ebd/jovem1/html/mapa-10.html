var DADOS={"n":10,"centro":"O Novo e Vivo Caminho: Um único sacrifício abriu o caminho; permaneçamos na fé","aureo":{"texto":"Tendo, pois, irmãos, ousadia para entrar no Santuário, pelo sangue de Jesus, pelo novo e vivo caminho que ele nos consagrou, pelo véu, isto é, pela sua carne","ref":"Hb 10.19,20"},"pratica":"O sacrifício de Cristo substituiu completamente o antigo modelo de sacrifícios dos hebreus.","ramos":[{"num":"I","titulo":"A necessidade de um único sacrifício","sinopse":"A lei era sombra dos bens futuros; Cristo ofereceu um único sacrifício pelos pecados.","filhos":[{"titulo":"O sangue de touros e de bodes não tira pecados","ref":"Hb 10.4","folhas":["A lei era boa, mas não podia salvar o pecador: era apenas sombra dos bens futuros (Hb 10.1)","Se a lei tivesse atingido sua finalidade, não seriam necessários novos sacrifícios (Hb 10.2)","A lei organizava a vida e orientava o homem a buscar a Deus e evitar o pecado"]},{"titulo":"Um único sacrifício","ref":"Hb 10.12","folhas":["Os israelitas voltavam aos sacrifícios anuais, pois continuavam quebrando a Lei","Os sacrifícios anuais não tiravam a consciência do pecado, e havia vários tipos (Lv 3; 4)","Jesus, com sua entrega como sacrifício vivo, extinguiu a necessidade de outros (Hb 10.12)"]},{"titulo":"Dos seus pecados não me lembrarei","ref":"Hb 10.17","folhas":["Ler e recitar a Lei fazia parte da memória dos hebreus desde a infância","Deus não se esquece das boas obras feitas para servir aos irmãos (Hb 6.10)","Deus colocaria suas leis no coração do povo e se esqueceria dos seus pecados (Hb 10.16,17)"]}]},{"num":"II","titulo":"Deus proporciona um novo e vivo caminho","sinopse":"Pelo sangue de Jesus há ousadia para entrar na presença de Deus e não abandonar a congregação.","filhos":[{"titulo":"O novo e vivo caminho","ref":"Hb 10.19","folhas":["Pelo sangue de Jesus, o novo e vivo caminho dá ousadia para entrar no Santuário (Hb 10.19,20)","Para se achegar com coragem: coração sem fingimento, consciência limpa e corpo lavado","As barreiras foram removidas pelo sangue de Jesus, e o leitor deve ser corajoso para entrar"]},{"titulo":"Não deixe a congregação","ref":"Hb 10.25","folhas":["Manter firme a confissão da esperança e incentivar-se às boas obras (Hb 10.24)","Não deixem a nossa congregação: é a advertência do autor (Hb 10.25)","Alguns deixavam a congregação, talvez desanimados pela perseguição; o risco era grande"]},{"titulo":"O Senhor julgará o seu povo","ref":"Hb 10.30","folhas":["Deus é misericordioso, mas também julga o próprio povo, corrigindo e advertindo (Hb 10.30)","Pedro adverte que já é tempo de o julgamento começar pela casa de Deus (1 Pe 4.17)","O julgamento alcança a forma como os leitores tratavam a fé em Jesus após serem salvos"]}]},{"num":"III","titulo":"O justo viverá da fé","sinopse":"Diante da perseguição, o justo vive pela fé e persevera, sem se retirar para a perdição.","filhos":[{"titulo":"Suportando a tribulação","ref":"Hb 10.37","folhas":["Os hebreus haviam resistido ao longo da história, suportando adversidades por fidelidade","A tribulação era momentânea, pois o que há de vir virá e não tardará (Hb 10.37)","Mesmo expostos e hostilizados, os irmãos não haviam retrocedido na fé"]},{"titulo":"O justo viverá da fé","ref":"Hc 2.4","folhas":["O profeta Habacuque anunciou que os caldeus destruiriam Jerusalém e o Templo","Deus mostrou que o justo, pela sua fé, viverá, em contraste com o ímpio (Hc 2.4)","Quando tudo parece não fazer sentido, Deus desafia o seu povo a viver pela fé (Hb 10.38,39)"]},{"titulo":"Aqueles que se retiram para a perdição","ref":"Hb 10.39","folhas":["Compara os que se retiram para a perdição com os que creem para a conservação da alma (Hb 10.39)","Crer e manter a fé é o segredo para a vitória em momentos de perseguição","Retirar-se ou permanecer: dessa escolha dependiam todas as ações desses irmãos"]}]}]};
