var DADOS={"n":2,"centro":"Preste Atenção nas Palavras de Deus: ouvir e reter mostra o compromisso com o Senhor","aureo":{"texto":"Como escaparemos nós, se não atentarmos para uma tão grande salvação, a qual, começando a ser anunciada pelo Senhor, foi-nos, depois, confirmada pelos que a ouviram.","ref":"Hb 2.3"},"pratica":"Ouvir e reter os mandamentos do Senhor mostram o compromisso que temos com Ele.","ramos":[{"num":"I","titulo":"Tão grande salvação","sinopse":"Hebreus adverte a não nos desviarmos do que ouvimos: a Palavra de Deus é firme e a salvação custou caro.","filhos":[{"titulo":"Não se desvie do que aprendeu","ref":"Nm 23.19","folhas":["Hebreus 2 chama os leitores a atentar ao que já ouviram, para não se desviarem (Hb 2.1)","A Palavra de Deus é firme, verdadeira e não muda (Nm 23.19; Sl 119.160; Is 40.8; Ml 3.6)","O problema não está em Deus, mas na nossa capacidade de manter os ouvidos fixos nele"]},{"titulo":"É possível escapar se desprezarmos tão grande salvação?","ref":"Rm 3.24","folhas":["A salvação é dada de graça, mas custou o sangue de Jesus, o Filho de Deus (Rm 3.24,25)","Se Deus respeitou a palavra dos anjos, quanto mais a palavra de salvação trazida pelo Filho","Rejeitar a Jesus traz a ira de Deus, que é real (Rm 1.18; 5.9; 1 Ts 1.10)"]},{"titulo":"Deus testifica de suas obras","ref":"Hb 2.4","folhas":["Deus testifica a sua mensagem com sinais, milagres, maravilhas e dons do Espírito (Hb 2.4)","O testemunho de Deus corrobora a mensagem e confirma os que pregam movidos pelo Espírito","A salvação também é um milagre de Deus, sem excluir sinais e maravilhas do seu Espírito"]}]},{"num":"II","titulo":"Os anjos e o homem","sinopse":"Deus coroou o homem de glória; Jesus, feito um pouco menor que os anjos, provou a morte por todos.","filhos":[{"titulo":"O que é o homem?","ref":"Sl 8.4","folhas":["O salmista compara a grandeza de Deus na criação com a pequenez do homem (Sl 8.4,5)","Anjos e homens são criaturas de Deus, distintas entre si; o homem é a coroa da criação","Um dia os homens julgarão os anjos, pois os anjos não governam sobre os homens (1 Co 6.2,3)"]},{"titulo":"Todas as coisas lhe sujeitaste","ref":"Hb 2.8","folhas":["O autor aplica a Jesus o salmo: “todas as coisas lhe sujeitaste” (Hb 2.8a)","Jesus recebeu do Pai todo o poder no céu e na terra (Mt 28.18)","Que ainda não vejamos tudo sujeito a Jesus não altera a soberania de Deus (Hb 2.8c)"]},{"titulo":"Jesus, coroado por Deus","ref":"Hb 2.10","folhas":["Jesus foi feito um pouco menor que os anjos e, depois, coroado de glória e honra (Hb 2.9)","Ele pagou o preço da salvação com o próprio sangue e por isso foi exaltado pelo Pai","Jesus é o Príncipe da salvação; quem conhece o preço da cruz não a trata como comum (Hb 2.10)"]}]},{"num":"III","titulo":"O Filho nos socorre","sinopse":"Jesus venceu a morte e a tentação sem pecar; por isso, pode socorrer os que são tentados.","filhos":[{"titulo":"A realidade da morte","ref":"Ec 7.29","folhas":["O homem é a coroa da criação, mas também é mortal","Criado reto, o homem perdeu a imortalidade ao desobedecer a Deus (Ec 7.29)","A serpente os convenceu de que seriam como Deus, e a morte atingiu toda a humanidade"]},{"titulo":"Cristo provou a morte","ref":"1 Co 15.21","folhas":["A morte faz cessar a vida e é a consequência contínua de todo pecado","A morte veio por um homem; a ressurreição dos crentes vem por Jesus Cristo (1 Co 15.21)","Jesus venceu a morte com a ressurreição e a aniquilará no futuro (1 Co 15.26)"]},{"titulo":"Jesus foi tentado","ref":"Jo 14.30","folhas":["Todos somos tentados; a carne não morre ao aceitarmos a Jesus, só no corpo glorificado","Jesus foi tentado, mas nunca cedeu; Satanás nada tinha contra ele (Jo 14.30)","Por isso, Jesus pode socorrer os que são tentados (Hb 2.18)"]}]}]};
