var DADOS={"n":6,"centro":"Advertência contra a Apostasia: a apostasia é um risco real e precisa ser combatida","aureo":{"texto":"Mas desejamos que cada um de vós mostre o mesmo cuidado até ao fim, para completa certeza da esperança","ref":"Hb 6.11"},"pratica":"A apostasia sempre será um risco para o povo de Deus, e precisa ser combatida.","ramos":[{"num":"I","titulo":"A importância da maturidade","sinopse":"Os crentes devem avançar para além dos rudimentos, sem abandoná-los, e buscar a maturidade.","filhos":[{"titulo":"Em busca da perfeição","ref":"Hb 5.13","folhas":["O autor chama os leitores a avançar até a perfeição, deixando os rudimentos (Hb 6.1)","Rudimentos são elementos básicos: têm valor, mas não encerram a completude do pensamento","A perfeição vem pelo aprimoramento e pela busca de coisas sólidas (Hb 5.13,14)"]},{"titulo":"Doutrinas importantes","ref":"Hb 6.1","folhas":["Arrependimento, fé em Deus, batismos e juízo eterno formavam o fundamento (Hb 6.1,2)","O autor não desprezava essas doutrinas; elas são base para os ensinamentos que se seguem","Uma casa não é só alicerce: os hebreus precisavam de outros ensinos para se edificar"]},{"titulo":"Recaindo nos modos antigos","ref":"Hb 6.4","folhas":["Quem rejeita a Cristo após recebê-lo não pode ser renovado para o arrependimento (Hb 6.4-6)","Apostasia é o abandono consciente da fé em Cristo para trilhar caminho opositor ao evangelho","O apóstata já provou a luz, o dom celestial e a boa palavra de Deus, e mesmo assim recuou"]}]},{"num":"II","titulo":"Advertência contra a apostasia","sinopse":"A apostasia é abandono consciente da fé em Cristo; o perigo era real, e a perseverança é necessária.","filhos":[{"titulo":"Crucificando novamente o Filho de Deus","ref":"Hb 6.6","folhas":["Quem recai crucifica de novo o Filho de Deus e o expõe ao vitupério (Hb 6.6)","A apostasia é possível e tem consequências eternas, por isso a advertência existe","O autor não afirma que eles apostataram; ele diz: esperamos coisas melhores (Hb 6.9)"]},{"titulo":"O tipo de terra que Deus reprova","ref":"Hb 6.8","folhas":["A terra que recebe chuva e produz erva proveitosa recebe a bênção de Deus (Hb 6.7)","A terra que produz espinhos é reprovada, perto da maldição, e seu fim é ser queimada (Hb 6.8)","Espinhos não têm valor e machucam; a terra que Deus reprova recebeu cuidado e insiste no inútil"]},{"titulo":"Deus não é injusto para se esquecer","ref":"Hb 6.10","folhas":["Deus não é injusto para se esquecer da obra e do trabalho de amor (Hb 6.10)","Os irmãos foram destacados por seu serviço aos santos, e ainda continuavam servindo","O autor espera que cada um mostre o mesmo cuidado até o fim (Hb 6.11)"]}]},{"num":"III","titulo":"Abraão e Jesus","sinopse":"Abraão esperou com paciência; Deus não mente, e Jesus entrou por nós como âncora segura da esperança.","filhos":[{"titulo":"Abraão como exemplo de firmeza","ref":"Hb 6.15","folhas":["Abraão, esperando com paciência, alcançou a promessa (Hb 6.15)","Nossa cultura tem dificuldade para esperar, por isso a paciência de Abraão nos desafia","Abraão soube esperar e tornou-se exemplo de perseverança na fé"]},{"titulo":"Deus não pode mentir","ref":"Hb 6.18","folhas":["Deus não pode mentir: é impossível que minta, e suas promessas são imutáveis (Hb 6.18)","A mentira é afirmar como verdade o que se sabe falso; seu pai é o Diabo (Jo 8.44)","Deus jurou por si mesmo, porque não há ninguém maior; Ele é a verdade (Hb 6.13)"]},{"titulo":"Jesus entrou por nós","ref":"Hb 6.20","folhas":["Jesus, nosso precursor, entrou além do véu por nós como Sumo Sacerdote (Hb 6.20)","Ele abriu o caminho para que outros o sigam, e essa é a vontade de Deus","A esperança é âncora da alma, segura e firme, que penetra até o interior do véu (Hb 6.19)"]}]}]};
