var DADOS={"n":7,"centro":"Novo Sacerdócio e Nova Lei: o sacerdócio de Cristo é superior ao levítico","aureo":{"texto":"Porque, mudando-se o sacerdócio, necessariamente se faz também mudança da lei.","ref":"Hb 7.12"},"pratica":"O sacerdócio de Cristo se baseia no sacerdócio de Melquisedeque, que é superior ao sacerdócio levítico.","ramos":[{"num":"I","titulo":"Quem foi Melquisedeque","sinopse":"Melquisedeque, sacerdote do Deus Altíssimo, abençoou Abraão, que lhe deu os dízimos e o reconheceu superior.","filhos":[{"titulo":"Sacerdote do Deus Altíssimo","ref":"Gn 14.18","folhas":["Melquisedeque era sacerdote do Deus Altíssimo; a Bíblia não narra como Deus se revelou a ele","Ele era rei e sacerdote, funções que a religião dos hebreus não misturava (1 Sm 13)","Melquisedeque abençoou Abraão, e Abraão reconheceu nele um sacerdote superior a si"]},{"titulo":"Paz e justiça","ref":"Hb 7.2","folhas":["Ele é rei de justiça e rei de paz, além de sacerdote do Deus Altíssimo (Hb 7.1,2)","Hebreus o apresenta “sem pai, sem mãe”, pois sua genealogia não é contada no texto (Hb 7.3)","Ele abençoou Abraão, mas não abençoou os reis ímpios daquela região"]},{"titulo":"Abraão entrega seu dízimo","ref":"Hb 7.4","folhas":["Abraão deu os dízimos dos despojos a Melquisedeque, reconhecendo que ele era superior (Hb 7.4)","O dízimo reconhece que Deus é o responsável pela nossa provisão, não as riquezas","Os levitas, em Abraão, entregaram os dízimos a Melquisedeque, reconhecendo sua grandeza"]}]},{"num":"II","titulo":"A mudança do sacerdócio","sinopse":"Abraão, Levi e Arão reconheceram o sacerdócio de Melquisedeque; mudado o sacerdócio, a lei também muda.","filhos":[{"titulo":"Abraão, Levi e Arão","ref":"Jo 8.56","folhas":["Abraão, Levi e Arão aparecem em ordem cronológica, pois Abraão é antecessor de Levi e Arão","Em Abraão, as gerações de sacerdotes já haviam reconhecido o sacerdócio de Melquisedeque","Abraão viu o dia de Jesus e alegrou-se com a salvação que ele traria (Jo 8.56)"]},{"titulo":"Mudando-se o sacerdócio, muda-se a lei","ref":"Hb 7.12","folhas":["A lei anterior não pôde levar à perfeição por causa da natureza humana dominada pelo pecado","A lei apontava para uma lei superior e um sacerdote superior, que viriam no tempo oportuno","O padrão em Jesus é a graça de Deus, que nos move a buscar a virtude proposta por Ele"]},{"titulo":"Jurou o Senhor","ref":"Sl 110.4","folhas":["Deus estabeleceu seu Filho como sacerdote eterno, segundo a ordem de Melquisedeque (Sl 110.4)","O autor reconhece essa profecia cumprida em Jesus (Hb 7.17)","Quando Deus jura, empenha a sua palavra de que enviaria um sacerdote melhor e perfeito"]}]},{"num":"III","titulo":"Sacerdotes levitas e Jesus","sinopse":"O sacerdócio levítico era limitado e temporário; Jesus é o Sacerdote perfeito, definitivo e eterno.","filhos":[{"titulo":"Um sumo sacerdote melhor","ref":"Hb 7.19","folhas":["A lei de Moisés nada aperfeiçoou; agora uma melhor esperança nos leva a Deus (Hb 7.19)","Com Cristo, a lei antiga deixa de vigorar e a graça é estendida a hebreus e gentios","Em Jesus temos o Sacerdote perfeito e definitivo (Hb 7.24)"]},{"titulo":"Não teve sacrifício por si mesmo","ref":"Hb 7.25","folhas":["Jesus não teve pecado e foi aceito como cordeiro sem mácula","Seu sacrifício foi voluntário e perfeito, pois ele não foi obrigado a se oferecer","Esse sacrifício basta para a salvação; quem não pecou não precisa oferecer por si (Hb 7.25-27)"]},{"titulo":"Sacerdotes fracos e o Filho","ref":"Hb 7.28","folhas":["Homens fracos foram chamados ao sacerdócio; o Filho é perfeito para sempre (Hb 7.28)","Os levitas serviam por laço de consanguinidade, e sua comunhão era temporária e limitada","Os sacerdotes levíticos eram guardiões temporários da aliança (Hb 7.11)"]}]}]};
