var DADOS={"n":12,"centro":"Enquanto Corremos para o Alvo: Olhar para Jesus e perseverar até o fim da corrida","aureo":{"texto":"Considerai, pois, aquele que suportou tais contradições dos pecadores contra si mesmo, para que não enfraqueçais, desfalecendo em vossos ânimos","ref":"Hb 12.3"},"pratica":"A vida cristã é como uma corrida de resistência, que deve ser trilhada olhando para Jesus.","ramos":[{"num":"I","titulo":"Estamos sendo observados","sinopse":"Os crentes correm cercados por testemunhas; devem deixar o pecado e os embaraços e olhar para Jesus.","filhos":[{"titulo":"Uma grande nuvem de testemunhas","ref":"Hb 12.1","folhas":["Estamos cercados de uma grande nuvem de testemunhas, que são exemplos para nós (Hb 12.1)","O pecado afasta de Deus e o embaraço distrai; ambos retardam o atleta cristão","Qualquer coisa que nos distraia ou impeça de chegar ao fim da corrida deve ser rejeitada"]},{"titulo":"Olhando para Jesus","ref":"Hb 12.2","folhas":["Devemos olhar para Jesus, autor e consumador da fé, sem nos perder no caminho (Hb 12.2)","Comparar-se com as falhas dos irmãos faz muitos abandonarem a corrida por perder o foco","A constância é mais importante que a velocidade; a vitória é de quem termina a corrida"]},{"titulo":"Você suporta a correção?","ref":"Hb 12.6","folhas":["A correção de Deus é ato de amor, pois o Senhor corrige o que ama (Hb 12.6)","Suportar a correção é sinal de filiação: Deus nos trata como filhos (Hb 12.7)","Deus nos corrige primeiro e, se não houver mudança, vem o açoite"]}]},{"num":"II","titulo":"Renovando as nossas forças","sinopse":"Fortalecidos pela comunhão, os crentes devem seguir a paz, a santificação e não se privar da graça.","filhos":[{"titulo":"Fazei veredas","ref":"Hb 12.12","folhas":["Veredas são caminhos pelos quais as pessoas passavam, mantidos prontos para servir de passagem","Antes de fazer veredas, é preciso levantar as mãos cansadas e firmar os joelhos (Hb 12.12)","A comunhão dos santos tem capacidade terapêutica diante dos movimentos de perseguição"]},{"titulo":"Siga a paz e a santificação","ref":"Hb 12.14","folhas":["Um cristão pacífico é referencial em qualquer ambiente, mas ter paz com todos nem sempre é fácil","A santificação é necessária, pois Deus é santo e nos ordena a ser santos (1 Pe 1.15,16)","A santidade é requerida em todas as áreas da vida, e por ela veremos a Deus (Hb 12.14)"]},{"titulo":"Não se prive da graça de Deus","ref":"Hb 12.15","folhas":["A graça é oferecida a todos em Jesus, mas pode ser resistida (Hb 12.15)","A privação da graça não se deve ao pecado nem ao inimigo, mas à ação do próprio crente","Uma pequena raiz de amargura pode perturbar e contaminar os que servem ao Senhor"]}]},{"num":"III","titulo":"Não despreze as bênçãos de Deus","sinopse":"Esaú vendeu a primogenitura por um prato de comida; devemos valorizar o que Deus valoriza.","filhos":[{"titulo":"Esaú, o profano","ref":"Hb 12.16","folhas":["Esaú vendeu o direito de primogenitura por um prato de comida (Hb 12.16)","Para Esaú a primogenitura parecia um costume antiquado, mas para Deus era bênção espiritual","Depois, mesmo com lágrimas, não achou lugar de arrependimento (Hb 12.17)"]},{"titulo":"A que lugar chegamos?","ref":"Hb 12.22","folhas":["Os leitores não chegaram ao monte de fogo, escuridão e tempestade (Hb 12.18)","Chegaram ao monte Sião, à cidade do Deus vivo, à Jerusalém celestial (Hb 12.22)","Chegaram até Jesus, o intermediário da nova aliança, e devem aceitar a exortação"]},{"titulo":"Retenha a graça","ref":"Hb 12.28","folhas":["O autor ordena que retenham a graça e sirvam a Deus com reverência e piedade (Hb 12.28)","Recebem um reino que não pode ser abalado, por isso devem se manter firmes","Por terem recebido esse presente, devem guardar a graça servindo a Deus com piedade"]}]}]};
