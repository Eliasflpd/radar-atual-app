tulo":"Isaque, Jacó e José","ref":"Hb 11.20","folhas":["Isaque, homem de oração e trabalho, orou 20 anos para ser pai (Gn 25.20-26)","Jacó aprendeu a viver pela fé e foi transformado por Deus, deixando o engano","José confiou na promessa de Deus e pediu que seus ossos não ficassem no Egito (Hb 11.22)"]},{"titulo":"Moisés, Josué e Raabe","ref":"Hb 11.24","folhas":["Moisés recusou ser chamado filho da filha de Faraó e levou Israel para fora do Egito (Hb 11.24)","Moisés celebrou a primeira Páscoa e o povo atravessou o Mar Vermelho a seco","Raabe creu em Deus, acolheu os espias e foi salva com sua família (Hb 11.31)"]}]},{"num":"III","titulo":"Pessoas das quais o mundo não era digno","sinopse":"Juízes, Davi e profetas também agiram pela fé, e morreram sem ver a promessa cumprida em Jesus.","filhos":[{"titulo":"Juízes, reis e profetas","ref":"Jz 11","folhas":["Juízes foram chamados por Deus para libertar Israel de seus inimigos em tempos de apostasia","Gideão reduziu seu exército a 300 homens para vencer amalequitas e midianitas","Profetas recebiam a revelação de Deus e a transmitiam ao povo (Am 3.7)"]},{"titulo":"Testemunho, mas sem ver a promessa","ref":"Hb 10.39","folhas":["Essas pessoas viveram pela fé e agradaram a Deus, mas morreram sem ver a promessa cumprida","Não viram o novo concerto que Deus traria em Jesus, mas criam que ele viria","Não há registro de que tenham desanimado por não ver a promessa cumprida (Hb 10.39,40)"]},{"titulo":"Somos indignos deste mundo?","ref":"Hb 11.38","folhas":["Hebreus 11 pergunta se nossa vida mostra que esperamos um mundo futuro com Deus","Podemos nos acomodar com as coisas deste mundo e esquecer que nossa pátria é o céu","Os antigos eram “homens dos quais o mundo não era digno” (Hb 11.38)"]},{"titulo":"Sem fé, é impossível agradar a Deus","ref":"Hb 11.6","folhas":["Recursos e talentos podem faltar, mas, havendo fé, Deus se agrada (Hb 11.6)","Quem se aproxima de Deus deve crer que Ele existe e não é um pensamento vazio","Deus recompensa quem crê nele e se achega a Ele"]}]}]};
