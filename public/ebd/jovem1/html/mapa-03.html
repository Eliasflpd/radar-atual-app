var DADOS={"n":3,"centro":"Não Tenha um Coração Mau e Infiel: a incredulidade endurece o coração","aureo":{"texto":"Vede, irmãos, que nunca haja em qualquer de vós um coração mau e infiel, para se apartar do Deus vivo.","ref":"Hb 3.12"},"pratica":"A incredulidade pode endurecer nosso coração e nos impedir de cumprir o plano de Deus.","ramos":[{"num":"I","titulo":"Moisés e Jesus","sinopse":"Jesus é superior a Moisés: Filho sobre a própria casa, enquanto Moisés foi servo fiel.","filhos":[{"titulo":"Jesus: apóstolo e sumo sacerdote","ref":"Hb 3.1","folhas":["O autor chama os leitores de irmãos santos e participantes da vocação celestial (Hb 3.1)","Jesus é apóstolo por ter sido enviado por Deus para representá-lo","Não precisou sacrificar por si mesmo, como os sumos sacerdotes antigos (Hb 7.27)"]},{"titulo":"Moisés foi um servo fiel","ref":"Hb 3.5","folhas":["Moisés foi fiel em toda a casa como servo, para testemunho do que se anunciaria (Hb 3.5)","Por quarenta anos liderou o povo, administrou a rebeldia e intercedeu por ele","Títulos perdem valor se falta fidelidade no chamado; o autor aponta para a fidelidade"]},{"titulo":"Jesus é superior","ref":"Dt 34.10","folhas":["Moisés foi honrado por Deus, mas nunca mais surgiu profeta igual a ele (Dt 34.10)","Jesus cumpriu a promessa de um profeta semelhante a Moisés (Dt 18.15)","Jesus é digno de maior glória, como o construtor é maior que a casa (Hb 3.3)"]}]},{"num":"II","titulo":"Hoje, se ouvirdes a sua voz","sinopse":"Deus continua falando hoje; o problema é se conseguimos ouvir, sem endurecer o coração.","filhos":[{"titulo":"Hoje, se ouvirdes a sua voz","ref":"Hb 3.15","folhas":["A questão não é se Deus fala, pois Ele fala até hoje; o problema é ouvir (Hb 1.1)","O autor chama a atenção para prestar atenção às palavras de Deus (Hb 3.15)","Os hebreus, libertos e testemunhas de milagres, escolheram ignorar o plano de Deus"]},{"titulo":"Deus impede que a bênção venha sobre o seu povo","ref":"Nm 14.23","folhas":["Diante da recusa, Deus prometeu que aquela geração não entraria na terra prometida (Nm 14.23)","Deus opera bênçãos, mas também priva o povo incrédulo e indigno delas","Bênçãos podem ser adiadas para a próxima geração quando não são valorizadas"]},{"titulo":"Um coração mau e infiel","ref":"Pv 13.13","folhas":["Maldade e infidelidade andam juntas; o texto fala de filhos de Israel, não de povos pagãos","Desprezar o que Deus diz e suas promessas é uma forma de maldade e infidelidade (Pv 13.13)","Para Deus, ser mau também é desvalorizar o que Ele falou, não só praticar crueldade"]}]},{"num":"III","titulo":"Por causa da sua incredulidade","sinopse":"A incredulidade tem preço: a geração do deserto deu mais crédito ao medo do que à palavra de Deus.","filhos":[{"titulo":"Exortai-vos uns aos outros","ref":"Hb 3.12","folhas":["Exortar uns aos outros evita que alguém perca a sensibilidade ao engano do pecado (Hb 3.13)","Pecar afasta da comunhão com Deus e endurece para a voz do seu Espírito (Is 59.2)","O deserto deveria ser passagem para a Terra Prometida, não sepultura do povo"]},{"titulo":"Deixando Deus indignado","ref":"Hb 3.11","folhas":["Deus é bom e misericordioso, mas também é justo; por isso se indignou (Hb 3.11)","Graça é receber o que não merecemos; misericórdia é não receber o que merecemos","Como um pai que se indigna com o filho que ignora orientações, Deus se irritou com Israel"]},{"titulo":"O preço da incredulidade","ref":"Nm 14.9","folhas":["Os hebreus deram mais crédito às palavras negativas do que ao que Deus falara","Quiseram apedrejar Josué e Calebe, que creram na palavra do Senhor (Nm 14.9)","A geração que viu os milagres morreu no deserto pelo preço da incredulidade (Nm 14.29)"]}]}]};
