var DADOS={"n":9,"centro":"O Sacrifício que Deus Aceitou: Cristo se ofereceu uma vez, obra perfeita e suficiente","aureo":{"texto":"Assim também Cristo, oferecendo-se uma vez, para tirar os pecados de muitos, aparecerá segunda vez, sem pecado, aos que o esperam para a salvação","ref":"Hb 9.28"},"pratica":"Cristo entrou no tabernáculo eterno, fazendo-se sacrifício por nós e tornando a sua obra perfeita.","ramos":[{"num":"I","titulo":"Um santuário terrestre","sinopse":"Deus deu a Israel ordenanças de culto e um santuário terrestre, com véu e sacerdotes em serviço contínuo.","filhos":[{"titulo":"Ordenanças divinas para um santuário terrestre","ref":"Hb 9.1","folhas":["Deus deu a Israel ordenanças de culto divino e um santuário terrestre (Hb 9.1)","No deserto, Israel precisava aprender a crer no Deus único e verdadeiro, deixando o Egito","A liturgia ensinada por Deus duraria séculos e apontava para a salvação vindoura"]},{"titulo":"Os utensílios do culto e o véu","ref":"Hb 9.1-5","folhas":["O tabernáculo tinha dois espaços separados pelo véu: o lugar santo e o Santo dos Santos","No lugar santo estavam o altar do incenso, a mesa dos pães e o castiçal de ouro de sete braços","A Arca da Aliança ficava no Santo dos Santos; Hebreus põe ali o incensário (Hb 9.1-5)"]},{"titulo":"Sacerdotes e o sumo sacerdote","ref":"Hb 9.6","folhas":["Os sacerdotes eram auxiliares, e o sumo sacerdote coordenava e orientava o culto (Hb 9.6,7)","Só por meio da tribo dos levitas o povo podia se aproximar de Deus para o sacrifício","O serviço dos sacerdotes era contínuo: lâmpadas, pães da proposição e incenso (Hb 9.6)"]}]},{"num":"II","titulo":"Jesus e o sangue do Novo Testamento","sinopse":"Cristo, Sumo Sacerdote dos bens futuros, entrou no santuário eterno com seu próprio sangue.","filhos":[{"titulo":"A ação do Espírito Santo","ref":"Hb 9.8","folhas":["O Espírito Santo mostrou que o caminho do santuário ainda não estava disponível (Hb 9.8)","O tabernáculo terrestre era alegoria e não aperfeiçoava a consciência dos que vinham a ele","Um homem pecador não podia entrar onde não lhe era permitido"]},{"titulo":"Veio Jesus Cristo","ref":"Hb 9.11","folhas":["Jesus é o Sumo Sacerdote dos bens futuros, e seu tabernáculo superior é eterno (Hb 9.11)","O tabernáculo do deserto foi feito por homens; o de Jesus foi feito pelo próprio Deus","Seu sangue basta para entrar no santuário uma única vez, sem sacrifícios contínuos (Hb 9.12)"]},{"titulo":"Sangue nos dois testamentos","ref":"Hb 9.16","folhas":["No testamento, o sangue representa a morte de quem o fez, dando-lhe validade (Hb 9.16,17)","Em Jesus e em sua morte vemos um novo testamento, com força de ser cumprido por todos","Os homens podem rejeitar o evangelho, mas não podem alterar o que Deus determinou"]}]},{"num":"III","titulo":"Só se morre uma vez","sinopse":"Cristo se ofereceu uma vez, sem pecado, e virá outra vez para salvar os que o esperam.","filhos":[{"titulo":"Sem derramamento de sangue, não há remissão","ref":"Hb 9.22","folhas":["O sangue dos animais não conseguia fazer limpeza interior dos pecados (Hb 9.22)","O sangue de Jesus purifica e fortalece a consciência de que fomos perdoados","O que o sangue dos animais não fazia, Jesus realizou, e isso deve mudar nosso modo de agir"]},{"titulo":"O santuário onde Cristo entrou","ref":"Hb 9.12","folhas":["Para ter acesso a Deus, o sumo sacerdote tinha de oferecer sacrifício antes por si mesmo","Jesus entrou no Santuário Eterno depois de se oferecer como sacrifício (Hb 9.12)","Assim, Ele se tornou o mediador por excelência de todos os homens"]},{"titulo":"Só se morre uma vez","ref":"Hb 9.27","folhas":["Aos homens está ordenado morrer uma vez, vindo depois disso o juízo (Hb 9.27)","Desse juízo não há a quem recorrer, mas Jesus se ofereceu uma única vez","Ele virá outra vez aos que o esperam para a salvação, na segunda vinda do Senhor"]}]}]};
