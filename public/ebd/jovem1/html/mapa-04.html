":"Deus repousa de suas obras","ref":"Hb 4.8","folhas":["O repouso de Deus é a certeza de que sua obra na criação foi iniciada e completada","Josué entrou na Terra Prometida, mas o texto não diz que trouxe descanso ao povo (Hb 4.8)","Josué creu nas promessas de Deus e foi preservado para chegar ao local da promessa"]},{"titulo":"Não endureça o seu coração","ref":"Hb 4.1","folhas":["O coração duro não é resiliência, mas resistência à ação do Espírito","Deus disse duas vezes que aquele povo não entraria no seu repouso (Hb 4.3,5)","Ninguém chega aonde Deus deseja sem atenção à sua voz e coração pronto para obedecer"]}]},{"num":"III","titulo":"Por Jesus, podemos chegar ao trono da graça","sinopse":"Jesus, tentado sem pecado, é nosso Sumo Sacerdote; por isso podemos chegar com confiança ao trono.","filhos":[{"titulo":"O poder da Palavra de Deus","ref":"Hb 4.12","folhas":["A Palavra de Deus penetra além dos tecidos humanos, como uma espada","Ela avalia profundamente, pois vem de Deus, que conhece nossos pensamentos e vontades","Nossas consciências estão diante do Senhor, e nossos pensamentos não podem ser encobertos dele"]},{"titulo":"Jesus, nosso Sumo Sacerdote","ref":"Hb 4.15","folhas":["Jesus é o Sumo Sacerdote que se compadece de nós, pois foi tentado em tudo (Hb 4.15)","Ele foi tentado por Satanás, mas nunca pecou, para não haver dúvida sobre sua humanidade","Não há área da vida humana em que Jesus não tenha sido tentado, mas venceu todas"]},{"titulo":"Chegando com confiança ao trono da graça","ref":"Hb 4.16","folhas":["Confiança não é soberba, mas ação de fé baseada no que a Palavra diz sobre Jesus","No trono da graça, não de juízo, alcançamos misericórdia e socorro em tempo oportuno (Hb 4.16)","Em Cristo, os salvos podem entrar na presença de Deus sem serem expulsos ou condenados"]}]}]};
