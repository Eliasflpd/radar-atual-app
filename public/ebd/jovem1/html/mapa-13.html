var DADOS={"n":13,"centro":"Finalizando a Carreira: Somos aperfeiçoados por um Deus que não muda","aureo":{"texto":"E, assim, com confiança, ousemos dizer: O Senhor é o meu ajudador, e não temerei o que me possa fazer o homem","ref":"Hb 13.6"},"pratica":"Na corrida cristã, somos aperfeiçoados por um Deus que não muda.","ramos":[{"num":"I","titulo":"Sinais do amor prático","sinopse":"Amor fraternal, hospitalidade e pureza no matrimônio são sinais práticos de quem vive a fé.","filhos":[{"titulo":"Permaneça o amor fraternal","ref":"Hb 13.1","folhas":["O amor fraternal é o sentimento que une irmãos, e o autor pede que ele permaneça (Hb 13.1)","Os crentes participam da igreja dos primogênitos inscritos nos céus (Hb 12.23)","Se fora da igreja eram desprezados, dentro dela deveriam se sentir amados e respeitados"]},{"titulo":"A hospitalidade","ref":"Hb 13.2","folhas":["Não vos esqueçais da hospitalidade; por ela alguns hospedaram anjos sem saber (Hb 13.2)","Por causa da perseguição, os leitores podiam estar menos dispostos a receber visitantes","Deus podia visitá-los de forma sobrenatural por meio dessa prática, como em Israel"]},{"titulo":"Leito sem mácula","ref":"Hb 13.4","folhas":["O matrimônio e o leito sem mácula são venerados, e Deus honra a pureza sexual (Hb 13.4)","A prostituição e o adultério destroem quem os pratica e atraem o juízo de Deus (Hb 13.4)","O que fazemos com o nosso corpo tem consequências diante de Deus"]}]},{"num":"II","titulo":"Jesus como nossa segurança","sinopse":"Jesus é a segurança do crente: a confiança não deve ir para o dinheiro, pois Ele não muda.","filhos":[{"titulo":"Cuidado com a avareza","ref":"1 Tm 6.10","folhas":["O amor ao dinheiro é raiz de toda espécie de males e pode desviar da fé (1 Tm 6.10)","Ter projetos financeiros não é errado; o problema é o dinheiro determinar onde está a segurança","Quando a confiança sai de Deus e vai para o dinheiro, torna-se idolatria, mesmo na comunhão"]},{"titulo":"Lembrai-vos dos vossos pastores","ref":"Hb 13.7","folhas":["Os pastores eram homens de fé que ensinavam as Escrituras (Hb 13.7)","Num cenário de perseguição, eles seriam os primeiros a ser fustigados e presos","Lembramo-nos deles orando, honrando a Palavra que ensinam e imitando sua fé"]},{"titulo":"Jesus Cristo não muda","ref":"Hb 13.8","folhas":["Jesus Cristo é o mesmo ontem, hoje e eternamente (Hb 13.8)","Essa declaração é uma promessa: Cristo permanece conosco no presente e será nossa segurança","Por ser imutável, Jesus nos desafia a não nos deixar levar por doutrinas estranhas (Hb 13.9)"]}]},{"num":"III","titulo":"Deus está nos aperfeiçoando","sinopse":"Deus continua aperfeiçoando seus filhos por meio do louvor, da obediência aos pastores e das boas obras.","filhos":[{"titulo":"Sacrifícios de louvor","ref":"Hb 13.15","folhas":["O autor pede sacrifício de louvor: o fruto dos lábios que confessam o nome de Deus (Hb 13.15)","O louvor expressa nossa comunhão com Deus e testemunha diante dos homens a quem confessamos","A vida que honra a Deus fora da igreja também é um verdadeiro sacrifício"]},{"titulo":"Obedecei aos vossos pastores","ref":"Hb 13.17","folhas":["Obedecer e sujeitar-se aos pastores, que velam por nossa alma (Hb 13.17)","Os pastores prestarão contas a Deus, e Ele quer que o façam com alegria, não gemendo","A resposta do rebanho pode ajudar o pastor ou torná-lo um fardo"]},{"titulo":"Deus vos aperfeiçoe","ref":"Hb 13.21","folhas":["O escritor deseja que Deus nos aperfeiçoe em toda boa obra e na sua vontade (Hb 13.21)","Os leitores estavam em crescimento, mas com o risco de se tornarem estagnados","Deus não concluiu sua obra na vida daqueles irmãos, e o mesmo se dá conosco (Fp 1.6)"]}]}]};
