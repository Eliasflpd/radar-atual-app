(function(){

// ── desenho ──
var sel=null, selF=0;     // selF: 0..1 (suaviza o "escurecer o resto")
function mundo(px,py){ return {x:(px-T.x)/T.k,y:(py-T.y)/T.k}; }
function ajusta(){ W=cv.clientWidth;H=cv.clientHeight; cv.width=W*DPR;cv.height=H*DPR; }
function alvoAjuste(){ var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; nos.forEach(function(n){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);}); var pw=x1-x0+120, ph=y1-y0+170; var k=Math.min(W/pw,(H-90)/ph,1.25); return {k:k,x:W/2-((x0+x1)/2)*k,y:(H+10)/2-((y0+y1)/2)*k}; }

// ── laço de animação ──
var inicio=performance.now();
function laco(ts){

  nos.forEach(function(n){ var d=n.tipo==='raiz'?0:(n.tipo==='esp'||n.tipo==='ramo')?0.25:n.tipo==='filho'?0.7:1.1; var alvo=tempo>=d?1:0; n.vis+= (alvo-n.vis)*0.07; });

// ── toque / mouse ──
var ptrs={}, nptr=0, mov=0, t0=0, alvo=null, pinca=null;
