var DADOS={"n":8,"centro":"O Juízo de Deus sobre as Nações Inimigas de Israel: Deus governa a história e julga as nações inimigas","aureo":{"texto":"Os carros de Deus são vinte milhares, milhares de milhares. O Senhor está entre eles, como em Sinai, no lugar santo.","ref":"Sl 68.17"},"pratica":"As oito visões revelam que Deus governa a história, consola o seu povo e anuncia o juízo sobre as nações inimigas.","ramos":[{"num":"I","titulo":"Os quatro carros e os quatro cavalos","sinopse":"Os quatro carros que saem dos montes de bronze simbolizando o poder e a execução do juízo de Deus.","filhos":[{"titulo":"Pontos de interseção","ref":"Zc 6.1","folhas":["A expressão “E outra vez levantei os meus olhos” já aparece em 5.1, marcando a sequência","Os elementos quase repetem a primeira visão: cavalos coloridos, mensageiros angelicais","A primeira visão traz o relatório da inspeção da terra; a última inaugura o reino messiânico"]},{"titulo":"Os carros e cavalos","ref":"Zc 6.1","folhas":["Os carros representavam força na guerra (Sl 20.7)","Além do transporte oficial, eram usados como carros de guerra (1 Rs 1.5; 2 Rs 6.14,15)","Estavam aparelhados para a batalha, saindo dos montes de bronze para executar o juízo"]},{"titulo":"Os montes de bronze","ref":"Zc 6.1","folhas":["Para a maioria dos intérpretes, os montes indicam o poder messiânico e o domínio de Deus","O bronze, liga de cobre e estanho, foi usado no Tabernáculo e no Templo (Êx 26.37)","Os montes são metáfora; alguns os associam aos montes das Oliveiras e de Sião"]}]},{"num":"II","titulo":"A origem dos carros e o significado das cores dos cavalos","sinopse":"Os símbolos da oitava visão de Zacarias e seus paralelos às revelações no livro de Apocalipse.","filhos":[{"titulo":"Comparação entre a primeira e a oitava visões","ref":"Zc 1.7","folhas":["A primeira visão tem cavaleiros; a oitava destaca carros e cavalos (Zc 1.7-17)","Na primeira, o relatório dos patrulheiros; na oitava, a execução do juízo de Deus","Os objetivos e a observação do profeta também são diferentes entre as duas visões"]},{"titulo":"Comparação entre as visões de Zacarias e do apóstolo João","ref":"Zc 6.2","folhas":["A profecia de Zacarias com símbolos encerra um tipo que reaparece em Apocalipse","Em Apocalipse, o cavalo branco representa a vitória e o vermelho, a guerra (Ap 6.2-8)","Em Zacarias, o texto não revela o significado das cores; associá-las é apenas uma possibilidade"]},{"titulo":"Os quatro ventos","ref":"Zc 6.4","folhas":["O anjo intérprete responde ao profeta: “Estes são os quatro ventos do céu” (Zc 6.5)","O hebraico ruḥôt pode ser “ventos” ou “espíritos”; às vezes designa anjos (Sl 104.4)","Os ventos servem a Javé para juízo (Jr 49.36) e restauração (Ez 37.9)"]}]},{"num":"III","titulo":"Destinatários do juízo divino","sinopse":"As simbologias do juízo escatológico, apontando o alcance global do tribunal do Senhor e o futuro Reino Messiânico.","filhos":[{"titulo":"Os cavalos pretos, brancos e grisalhos","ref":"Zc 6.6","folhas":["Os cavalos pretos vão ao Norte, seguidos pelos brancos; os grisalhos, ao Sul (Zc 6.6)","Norte e Sul apontam para Babilônia e Egito, mas a visão alcança o futuro (Ez 20.46,47)","A linguagem da missão é escatológica e aponta para o reino messiânico (Zc 6.7)"]},{"titulo":"A ausência dos cavalos vermelhos","ref":"Zc 6.6","folhas":["O anjo intérprete nada diz sobre a missão dos cavalos vermelhos (Zc 6.6)","Qualquer explicação sobre eles seria especulação, pois a palavra profética não afirma nada","A glória de Deus saiu de Jerusalém pelo oriente e voltará pelo mesmo caminho (Ez 43.1-5)"]},{"titulo":"Missão cumprida","ref":"Zc 6.8","folhas":["Segundo o anjo, os que foram ao Norte fizeram repousar o Espírito na terra do Norte (Zc 6.8)","Para a maioria dos expositores, “meu espírito” é a ira de Javé no juízo (Zc 1.15)","Rûaḥ também significa “ira” em algumas versões (Jz 8.3; Pv 29.11)"]}]}]};
