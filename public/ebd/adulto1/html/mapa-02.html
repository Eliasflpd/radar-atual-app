var DADOS={"n":2,"centro":"Deus Está Presente entre o seu Povo: Deus vê, zela e consola; sua presença sustenta a esperança","aureo":{"texto":"Porque assim diz o SENHOR: Certamente que, passados setenta anos na Babilônia, vos visitarei e cumprirei sobre vós a minha boa palavra, tornando-vos a trazer a este lugar.","ref":"Jr 29.10"},"pratica":"O infinito amor de Deus é revelado com clareza nas Escrituras.","ramos":[{"num":"I","titulo":"A visão do homem entre as murtas","sinopse":"A visão das murtas revela que Deus conhece e acompanha a realidade do seu povo.","filhos":[{"titulo":"O homem do cavalo vermelho","ref":"Zc 1.8","folhas":["O homem do cavalo vermelho é identificado como o “anjo do SENHOR” (Zc 1.11,12)","Esse anjo aparece na forma humana no Antigo Testamento (Gn 19.1,2; Jz 13.9,10)","Trata-se, sem dúvida, de uma das manifestações messiânicas (Jz 6.11-24)"]},{"titulo":"As murtas","ref":"Zc 1.8","folhas":["Jerusalém era cercada de vales cobertos de murtas (Ne 8.15)","A murta, segundo a tradição judaica, simboliza paz, prosperidade e esperança","Os judeus usavam ramos de murta na Festa dos Tabernáculos para cobrir as suas barracas"]},{"titulo":"Os cavalos e os cavaleiros","ref":"Zc 1.9","folhas":["O anjo intérprete explica que os cavaleiros são anjos enviados em missão de reconhecimento","Esse cuidado com a terra faz parte da providência divina para preservar a criação (Ne 9.6)","Javé se interessa pelas condições da terra (Ap 11.18), sobretudo quanto ao seu povo (Ml 3.17)"]}]},{"num":"II","titulo":"Deus zela por Jerusalém e pelo seu povo","sinopse":"Deus zela por Jerusalém e não permanece indiferente à situação do seu povo.","filhos":[{"titulo":"Resposta dos patrulheiros angelicais","ref":"Zc 1.10","folhas":["Os batedores celestiais relatam que toda a terra está pacificada (Zc 1.11)","Dario I, que reinou de 522 a 486 a.C., autorizou a continuação da obra do Templo","Dario é citado nas Escrituras simplesmente como “Dario” (Zc 1.1,7; Ed 6.1,12,13; Ag 1.1)"]},{"titulo":"Os setenta anos do cativeiro","ref":"Zc 1.12","folhas":["Jeremias diz que Deus entregou as nações ao rei da Babilônia por setenta anos (Jr 25.11)","Para Jeremias, a supremacia da Babilônia duraria setenta anos (Jr 29.10)","Zacarias usa o período para as devastações de Israel causadas pelo cativeiro (Zc 1.12; 7.5)"]},{"titulo":"O pedido do anjo do SENHOR","ref":"Zc 1.12","folhas":["O anjo do SENHOR é a segunda Pessoa da Trindade, o Messias pré-encarnado (Gn 22.11,12)","O cativeiro foi castigo corretivo, mas o povo ainda não tinha aprendido a lição na Diáspora","Diante do relatório de paz, o anjo intercede por Jerusalém e pelas cidades de Judá (Zc 1.12)"]}]},{"num":"III","titulo":"O consolo e a esperança da presença divina","sinopse":"A presença de Deus traz consolo e renova a esperança de restauração do seu povo.","filhos":[{"titulo":"O zelo de Deus por Jerusalém","ref":"Zc 1.13","folhas":["A resposta divina ao anjo é declaração do amor de Deus pelo seu povo (Zc 1.13,14)","Oseias descreve esse amor não correspondido em linguagem pitoresca (Os 11.3,4)","A história prova que Javé castigou Israel, mas não o abandonou (Rm 11.1,2)"]},{"titulo":"A ira de Deus contra as nações em descanso","ref":"Zc 1.15","folhas":["Deus revela indignação contra as nações ímpias, tranquilas enquanto Israel vivia em ruínas (Zc 1.15)","Javé anuncia sua ira contra as nações inimigas e promete abençoar Israel (Is 60.1; 61.1-3)","A visão foi destinada a renovar a esperança do povo"]},{"titulo":"Promessa de restauração","ref":"Zc 1.16","folhas":["Há contraste entre a ira de Javé contra as nações e o seu amor por Israel (Zc 1.16,17)","Jeremias promete que Israel não terá fim, ainda que castigado com medida (Jr 30.11b)","O cordel estendido sobre Jerusalém (Zc 1.16b) é palavra de consolo que sinaliza a reconstrução"]}]}]};
