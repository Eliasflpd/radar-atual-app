var DADOS={"n":5,"centro":"O Simbolismo da Purificação do Sumo Sacerdote Josué: Deus perdoa, purifica e restaura os que se aproximam pela fé","aureo":{"texto":"Ouve, pois, Josué, sumo sacerdote, tu e os teus companheiros que se assentam diante de ti, porque são homens portentosos; eis que eu farei vir o meu servo, o Renovo.","ref":"Zc 3.8"},"pratica":"Em Cristo, Deus perdoa, purifica e restaura todos os que se aproximam dEle pela fé.","ramos":[{"num":"I","titulo":"Josué diante do acusador","sinopse":"Satanás é o acusador, mas o Senhor é o defensor do seu povo.","filhos":[{"titulo":"Quem mostrou a visão ao profeta?","ref":"Zc 3.1","folhas":["A revelação não especifica quem mostrou a visão ao profeta","Alguns intérpretes veem o próprio Deus como autor, pois a introdução difere das anteriores","Outra possibilidade: a continuação das visões, com o mesmo anjo intérprete como mediador (Zc 1.8; 2.1)"]},{"titulo":"O sumo sacerdote Josué","ref":"Zc 3.1","folhas":["Josué voltou da Babilônia com Zorobabel, em 538 a.C. (Ed 2.2; Ne 7.6,7; 12.1)","Seu nome tem duas formas: yeshu'â, “salvação” (Ed 3.2), e yehôshu'â, “Javé é salvação” (Ag 1.1)","Descendia de Zadoque (1 Rs 2.35); seu avô e pai foram levados cativos (1 Cr 6.12-15)"]},{"titulo":"Satanás, o opositor","ref":"Zc 3.1","folhas":["A cena parece um tribunal celestial: réu, Josué; acusador, Satanás; defensor, o Senhor","Satanás, do hebraico sāṭān, significa “adversário” ou “acusador” (1 Cr 21.1)","Acusar é uma das principais atividades atribuídas ao inimigo do povo de Deus (Ap 12.10)"]}]},{"num":"II","titulo":"O perdão e a troca das vestes","sinopse":"As vestes sujas retratavam a condição espiritual de Israel que, assim como o sacerdote, será purificado e restaurado por Deus.","filhos":[{"titulo":"O sacerdócio","ref":"Êx 28.29","folhas":["O sumo sacerdote representava o povo diante de Deus (Êx 28.29)","Israel foi chamado a ser reino sacerdotal entre as nações (Êx 19.6), propriedade de Javé (Dt 7.6)","As vestes sujas simbolizam os pecados do povo, não apenas os de Josué (Zc 3.9)"]},{"titulo":"As vestes","ref":"Êx 28.2","folhas":["As vestes sacerdotais são santas (Êx 28.2; Lv 16.4) e têm forte significado simbólico (Lv 8.5-9)","Elas representam a função ou a dignidade de quem as veste (1 Rs 22.10)","Josué também era pecador (1 Jo 1.8); Satanás é o acusador e pai da mentira (Jo 8.44)"]},{"titulo":"O ritual da mudança de vestes","ref":"Zc 3.4","folhas":["A troca das vestes simboliza purificação e perdão: “passe de ti a tua iniquidade” (Zc 3.4)","As vestes novas representam a salvação de Deus (Is 61.10); a mitra, a restauração do ofício","As vestes sujas retratam Israel, que será purificado e restaurado por Deus no tempo determinado"]}]},{"num":"III","titulo":"O Renovo e a promessa da salvação","sinopse":"Deus prometeu trazer o renovo por meio do sacerdócio de Cristo no tempo determinado.","filhos":[{"titulo":"Os “homens portentosos”","ref":"Zc 3.8","folhas":["A TB e a ARA traduzem “homens de presságio”; a NAA diz “um sinal do que há de vir”","A maioria vê neles os sacerdotes companheiros de Josué, que prefiguram o Messias","Josué é tipo de Cristo, cujo sacerdócio é eterno, segundo a ordem de Melquisedeque (Hb 6.20)"]},{"titulo":"O meu servo, o Renovo","ref":"Zc 3.8","folhas":["Zacarias usa títulos messiânicos já conhecidos: “meu Servo” (Is 42.1; 52.13) e “Renovo”","O Renovo é o descendente de Davi prometido, cuja realeza aparece em Jeremias (Jr 23.5; 33.15)","Cumpriu-se em Jesus Cristo (Mt 1.1; Rm 1.1-3) e terá consumação no Reino (Lc 1.32-33)"]},{"titulo":"A figura do Messias","ref":"Zc 3.9","folhas":["A pedra é o Messias (Is 28.16; 1 Pe 2.6); os sete olhos, a plenitude do seu conhecimento","A gravura alude ao sofrimento do Messias, que removeu a iniquidade no Calvário (Hb 9.28)","A união entre realeza e sacerdócio de Cristo é prefigurada por Melquisedeque (Gn 14.18)"]}]}]};
