var DADOS={"n":10,"centro":"Religião sem Justiça não Agrada a Deus: Deus rejeita o formalismo e exige justiça e misericórdia","aureo":{"texto":"A religião pura e imaculada para com Deus, o Pai, é esta: visitar os órfãos e as viúvas nas suas tribulações e guardar-se da corrupção do mundo.","ref":"Tg 1.27"},"pratica":"Deus rejeita o formalismo religioso e requer do seu povo uma vida de verdadeira piedade, justiça e misericórdia.","ramos":[{"num":"I","titulo":"Consultando sacerdotes e profetas do Templo","sinopse":"A consulta sobre os jejuns conduz o povo a examinar sua verdadeira motivação.","filhos":[{"titulo":"Assunto da profecia","ref":"Zc 7.1","folhas":["O “ano quarto do rei Dario” corresponde a 518 a.C., quando Zacarias recebe a delegação (Zc 7.1)","Uma delegação de Betel, liderada por Sarezer e Regém-Meleque, consulta sobre o jejum (Zc 7.2,3)","Em Betel, Jeroboão I instituiu o culto do bezerro (1 Rs 12.28,29)"]},{"titulo":"Os jejuns dos setenta anos do cativeiro","ref":"Zc 7.3","folhas":["Eram quatro jejuns no exílio, em quatro meses, não ordenados pelo Senhor (Zc 7.3,5)","O jejum do quarto mês lembra o rompimento dos muros de Jerusalém pelos caldeus (2 Rs 25.3,4)","O jejum do quinto mês lembra o incêndio do Templo por Nebuzaradã (2 Rs 25.8,9)"]}]},{"num":"II","titulo":"A justiça e a misericórdia que Deus requer","sinopse":"Deus requer uma piedade expressa em justiça, misericórdia e cuidado com o próximo.","filhos":[{"titulo":"O jejum dos remanescentes do cativeiro","ref":"Zc 7.5","folhas":["Em vez de responder, Javé pergunta: “jejuastes vós para mim, mesmo para mim?” (Zc 7.5)","Aquele jejum era para o próprio povo, e o pecado levara Javé a castigá-lo (Zc 7.6)","Tudo deve visar à glória de Deus, e não a posição e cargos, como Diótrefes (3 Jo 9; 1 Co 10.31)"]},{"titulo":"O que aconteceu no passado?","ref":"Zc 7.7","folhas":["A delegação recebeu um duro sermão, em vez da resposta que buscava (Zc 7.7)","Jerusalém teve chances de escapar da destruição, mas o povo não ouviu os profetas (Is 1.16-20)","O jejum dos remanescentes era mera formalidade, um ritual sem espiritualidade (Mt 6.16-18)"]},{"titulo":"O jejum que agrada a Deus","ref":"Zc 7.9","folhas":["A Lei chama o jejum de “afligir a alma”, sacrifício da vontade pessoal (Lv 16.29)","O verdadeiro jejum é odiar o pecado e seguir a justiça, a misericórdia e a fé (Mt 23.23)","Deus pede que não se oprima o pobre, o órfão, a viúva e o estrangeiro (Zc 7.9,10; Êx 22.22-27)"]}]},{"num":"III","titulo":"O perigo da religião sem transformação","sinopse":"A religião sem obediência à Palavra endurece o coração e não transforma a vida.","filhos":[{"titulo":"Eles rejeitaram a Deus e a sua Palavra","ref":"Zc 7.11","folhas":["“Me deram o ombro” é metáfora de obstinação e rebeldia (Ne 9.29; Dt 9.6)","“Ensurdeceram os seus ouvidos” significa que taparam os ouvidos para não ouvir (Jr 7.26)","Eles viraram as costas a Deus e recusaram a Palavra enviada pelos profetas (Zc 7.11,12)"]},{"titulo":"Um coração duro","ref":"Zc 7.12","folhas":["O coração “duro como diamante” é um símile que expressa a extrema dureza do povo (Zc 7.12)","O diamante é o mineral mais duro da natureza; Ezequiel usa imagem semelhante (Ez 3.9)","Pela própria rebeldia, os antepassados contribuíram para a desolação da terra (Zc 7.11,12)"]},{"titulo":"O desastre nacional","ref":"Zc 7.13","folhas":["Os profetas anunciaram que o pecado levaria à destruição e ao cativeiro (Is 1.15; Jr 14.2)","O povo não ouviu a Palavra, e Deus também não os ouviu no dia da angústia (Zc 7.13)","Deus os espalhou “com tempestade entre todas as nações”, sinal de sua ira (Zc 7.14)"]}]}]};
