var DADOS={"n":4,"centro":"Jerusalém e o Homem com o Cordel de Medir: Jerusalém ontem, hoje e no seu futuro glorioso","aureo":{"texto":"Assim, virão muitos povos e poderosas nações buscar, em Jerusalém, o SENHOR dos Exércitos e suplicar a bênção do SENHOR.","ref":"Zc 8.22"},"pratica":"Essa é uma das mensagens proféticas que apresenta o estado de Jerusalém ontem, hoje e o seu futuro glorioso.","ramos":[{"num":"I","titulo":"O homem com o cordel de medir","sinopse":"O agrimensor mede a cidade de Jerusalém como um sinal de preparação para a restauração divina.","filhos":[{"titulo":"A identidade do agrimensor","ref":"Zc 2.1","folhas":["O agrimensor parece alguém empolgado com a restauração de Jerusalém, e não um anjo","Ele esperava para a cidade a mesma medida que ela tinha antes da destruição","Se o “jovem” do v.4 for o mesmo “homem” do v.1, confirma-se que o agrimensor não é um anjo"]},{"titulo":"O cordel","ref":"Zc 2.1","folhas":["O profeta já vira que “o cordel será estendido sobre Jerusalém” (Zc 1.16)","A palavra hebraica varia: em Zc 2.1 é “linha”, e em Zc 1.16, “corda” ou “cordão”","Em Ezequiel aparece “cana de medir” (Ez 40.3; 42.16-20), mas a ação de medir é a mesma"]},{"titulo":"A medição de Jerusalém","ref":"Zc 2.2","folhas":["A cidade estava em ruínas desde a destruição pelos caldeus, em 587/586 a.C. (2 Rs 25.9,10)","Ageu convocara o povo a reconstruir a Casa de Deus cerca de seis meses antes (Ag 1.1,2)","Neemias chegou cerca de oitenta anos depois (445 a.C.) e viu a cidade ainda abandonada (Ne 1.3)"]}]},{"num":"II","titulo":"Jerusalém sem muros e o muro de fogo divino","sinopse":"O Senhor será como um muro de fogo, oferecendo paz e segurança para o seu povo.","filhos":[{"titulo":"A perspectiva humana é substituída pela perspectiva de Deus","ref":"Zc 2.3","folhas":["“Jerusalém será habitada como as aldeias sem muros”: sua segurança não depende dos muros (Zc 2.4)","O próprio Javé será como muro de fogo ao redor da cidade (Zc 2.5)","Deus protegeu Israel no deserto desse modo, e a profecia aponta para a Jerusalém do Milênio (Êx 14.24)"]},{"titulo":"A ordem para fugir de Babilônia","ref":"Zc 2.6","folhas":["A “terra do Norte” refere-se à Babilônia (Jr 4.6; 5.15; 6.22; 21.2)","Deus também espalhou Babilônia e nações como Egito, Moabe, Amon e Edom (Is 43.5,6)","Os judeus devem fugir por duas razões: Javé julgará a Babilônia e quer livrar o seu povo"]},{"titulo":"Os judeus no mundo hoje","ref":"Mt 24.30","folhas":["A população judaica dispersa pelo mundo continua expressiva, como nos dias de Zacarias","Hoje a diáspora reúne mais judeus do que o atual Estado de Israel","O cumprimento pleno ocorrerá quando o Messias reunir o seu povo na Terra Santa (Mt 24.30,31)"]},{"titulo":"Qual o significado de “depois da glória”?","ref":"Zc 2.8","folhas":["A expressão é de difícil interpretação e pode ser traduzida como “obter a glória”","Mais plausível: Javé enviará o Messias para julgar as nações que maltrataram Israel","“Ele me enviou às nações” refere-se ao Messias, e não ao profeta (Ap 18.4)"]}]},{"num":"III","titulo":"A presença de Deus no meio do seu povo","sinopse":"Deus prometeu habitar no meio do seu povo. Nós, cristãos, já desfrutamos dessa promessa porque Cristo habita em nós.","filhos":[{"titulo":"A metáfora da “menina do olho”","ref":"Zc 2.8","folhas":["Tocar em Israel é como tocar a “menina do olho” de Deus, o mais sensível e precioso","Javé guarda Israel desde a sua eleição (Dt 32.10); agredi-lo é atacar o próprio Deus","Esse cuidado revela o amor divino, que nos alcança em Cristo (Jo 3.16; Rm 5.8)"]},{"titulo":"O levantar a mão e o reverso","ref":"Zc 2.9","folhas":["Levantar a mão indica o poder de Deus e pode ser símbolo militar (Jr 21.5; Sl 89.13)","Em hebraico, “mão” e “braço” são a mesma palavra, yād, com o mesmo sentido","Os que despojaram Israel virão a ser presa dos que os serviram, como no Êxodo (Êx 12.36)"]},{"titulo":"O alcance da bênção de Israel","ref":"Zc 2.10","folhas":["Deus prometeu habitar no meio do seu povo, reafirmado duas vezes na visão (Êx 25.8)","Cristãos já desfrutam dessa realidade: Cristo habita em nós (Jo 14.23)","Muitas nações se ajuntarão ao Senhor e serão o seu povo (Is 2.3,4; Ez 37.26-28)"]},{"titulo":"Revitalização da promessa de Deus","ref":"Zc 2.12","folhas":["As rebeliões e o exílio não anularam a eleição de Israel; os castigos foram corretivos","Javé possuirá Judá como sua porção e escolherá Jerusalém de novo (Zc 2.12; Is 41.8)","Servos de todas as nações (Ef 2.13-17), e Jerusalém segue a Cidade do Grande Rei (Mt 5.35)"]}]}]};
