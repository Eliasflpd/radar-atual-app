var DADOS={"n":9,"centro":"O Rei-Sacerdote e a Era Messiânica: Josué aponta para Cristo, o Rei-Sacerdote","aureo":{"texto":"Onde Jesus, nosso precursor, entrou por nós, feito eternamente sumo sacerdote, segundo a ordem de Melquisedeque.","ref":"Hb 6.20"},"pratica":"A coroação simbólica de Josué aponta profeticamente para Cristo, o Rei-Sacerdote, e para o futuro glorioso da Igreja e de Israel.","ramos":[{"num":"I","titulo":"Um fato histórico com implicações teológicas","sinopse":"As visões de Zacarias marcam a transição da revelação e situam a comitiva vinda da Babilônia.","filhos":[{"titulo":"Transição na forma de comunicação da Revelação","ref":"Zc 6.9","folhas":["Depois das visões, a revelação passa à palavra: “E a palavra do Senhor veio a mim” (Zc 6.9)","No Antigo Testamento a revelação ocorria por visão e audição, imagem e palavra (2 Sm 7.17)","A coroação de Josué é o desfecho das visões, sobretudo da quarta (Zc 3.1-10)"]},{"titulo":"A comitiva vinda da Babilônia","ref":"Zc 6.10","folhas":["Javé ordena que Zacarias receba prata e ouro de uma comitiva vinda da Babilônia (Zc 6.10)","A oferta, enviada por três exilados, destinava-se à confecção de coroas (Zc 6.11)","O verbo “receber” é o mesmo usado para a oferta voluntária ao Tabernáculo (Êx 25.2,3)"]},{"titulo":"Sobre os membros da comitiva","ref":"Zc 6.10","folhas":["O contexto indica uma cerimônia de entrega da doação na casa de Josias (Zc 6.10)","Os nomes são comuns no Antigo Testamento, como Tobias, Jedaías e Heldai (1 Cr 27.15)","O nome Hem (Zc 6.14) não tem paralelo no Antigo Testamento"]}]},{"num":"II","titulo":"A coroação de Josué e o simbolismo messiânico","sinopse":"A coroação de Josué simboliza o Messias, e a coroa torna-se tipologia e memorial sagrado no Templo.","filhos":[{"titulo":"As coroas na cabeça do sumo sacerdote","ref":"Zc 6.11","folhas":["A coroação costuma ser do rei, mas aqui é simbólica: Josué é tipo de Cristo (Zc 6.11)","Coroar Zorobabel, herdeiro de Davi, geraria crise política com os persas (1 Cr 3.13-19)","Por isso a cena é messiânica e aponta para o Messias"]},{"titulo":"Há muitas discussões sobre as duas coroas","ref":"Zc 6.11","folhas":["A ideia de duas coroas não está no texto e pode vir da menção a prata e ouro (Zc 6.11,14)","No hebraico, o verbo “ser” está no singular, indicando uma coroa (Zc 6.14)","Duas coroas podem indicar dois ofícios: o sacerdotal e o régio"]},{"titulo":"Um memorial no templo do Senhor","ref":"Zc 6.14","folhas":["Depois da coroação, a coroa é depositada no Templo como memorial (Zc 6.14)","Há certo paralelismo com a oferta de ouro para o Tabernáculo, guardada por lembrança (Nm 31.54)","O verbo “receber” é o mesmo usado na passagem do Pentateuco (Nm 31.54)"]}]},{"num":"III","titulo":"Cristo: o Rei-Sacerdote que edifica o Templo espiritual","sinopse":"Jesus Cristo é o Renovo prometido, que exerce os ofícios de sacerdote e rei que governará em seu Reino milenial.","filhos":[{"titulo":"Evidência significativa do simbolismo da coroação","ref":"Zc 6.12","folhas":["A cerimônia não tinha conotação política; era uma representação profética (Zc 6.12)","Josué era sacerdote e levita, não da descendência de Davi (1 Cr 6.14,15)","Josué não usou a coroa, que foi guardada no Templo como memorial (Zc 6.14)"]},{"titulo":"A glória do Rei-Sacerdote","ref":"Zc 6.12","folhas":["O Renovo é título ligado à realeza; só Jesus reuniu os dois ofícios (Jr 23.5; Hb 7.21,22)","“Eis aqui o homem” cumpriu-se em Jesus quando Pilatos o apresentou à multidão (Jo 19.5)","O pronome hebraico hû’ é enfático e fala da glória do Rei-Sacerdote após o Calvário (Fp 2.5-11)"]},{"titulo":"O contexto escatológico","ref":"Zc 6.15","folhas":["A oferta babilônica prenuncia o reino do Messias, quando povos trarão ofertas (Zc 6.15)","O Renovo edificará o templo do Senhor (Zc 6.12); Isaías também fala dessa Casa (Is 2.2-5)","Ezequiel descreve em detalhes o complexo do Templo nos capítulos 40-48 (Ez 40-48)"]}]}]};
