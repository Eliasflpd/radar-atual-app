var DADOS={"n":11,"centro":"O Deus que Restaura e Consola: Deus é fiel às suas promessas e assegura um futuro glorioso","aureo":{"texto":"E virão muitos povos e dirão: Vinde, subamos ao monte do SENHOR, à casa do Deus de Jacó, para que nos ensine o que concerne aos seus caminhos, e andemos nas suas veredas; [...].","ref":"Is 2.3a"},"pratica":"Deus é fiel às suas promessas e assegura um futuro glorioso para Israel e para as nações sob o governo do Messias.","ramos":[{"num":"I","titulo":"A fidelidade de Deus na restauração de Sião","sinopse":"Deus reafirma seu zelo por Sião e promete restaurá-la em verdade e santidade.","filhos":[{"titulo":"O zelo de Javé por Sião","ref":"Zc 8.1","folhas":["Após o cativeiro, Javé volta-se com zelo para o seu povo, em promessa de futuro (Zc 8.2)","Javé é Deus zeloso, e “Zeloso” é um dos seus nomes (Êx 34.14)","Sião, fortaleza conquistada por Davi, refere-se a Jerusalém e a Israel (2 Sm 5.6-9; Sl 74.2)"]},{"titulo":"A indignação de Javé","ref":"Zc 8.2","folhas":["“Zelei por Sião com grande zelo” expressa o forte amor de Deus por Israel (Jr 31.3)","O zelo de Javé por Sião está ligado à sua ira contra as nações que se opõem a Israel","Deus reafirma o que já mostrara na primeira visão (Zc 1.14-16)"]},{"titulo":"Restauração de Jerusalém","ref":"Zc 8.3","folhas":["Javé promete voltar a Sião e habitar no meio de Jerusalém (Sf 3.15-17; Zc 2.10)","Jerusalém será chamada “cidade de verdade”, marcada pela verdade e pela santidade (Zc 8.3)","“Verdade” (’emet) significa fidelidade, veracidade e firmeza, base do compromisso do concerto"]}]},{"num":"II","titulo":"O jejum transformado em festa","sinopse":"Deus transforma a memória do sofrimento em alegria, segurança e celebração.","filhos":[{"titulo":"Velhos e velhas, e crianças na Cidade","ref":"Zc 8.4","folhas":["A promessa de idosos nas praças e crianças nas ruas significa segurança total (Zc 8.4,5)","A cena lembra a prosperidade do reinado de Salomão e tem contexto milenial (1 Rs 4.25)","Neemias descreve a desolação da cidade, em contraste com a promessa de Zacarias (Ne 1.3)"]},{"titulo":"Uma resposta aos incrédulos","ref":"Zc 8.6","folhas":["A promessa só se cumpre por um ato de Javé, anunciado pelos profetas (Is 65.19,20; Jr 30.19,20)","Deus pergunta aos incrédulos: “será também maravilhoso aos meus olhos?” (Zc 8.6)","Para Deus nada é impossível, mesmo quando a promessa parece grande demais (Gn 18.14; Lc 1.37)"]},{"titulo":"O retorno dos judeus","ref":"Zc 8.7","folhas":["A salvação do Oriente e do Ocidente é o livramento dos judeus dispersos pelo mundo (Zc 8.7)","A promessa inclui também a salvação espiritual do povo (Jr 31.33; Rm 11.26)","Deus habitará no meio do povo e renovará o concerto: “eu serei o seu Deus” (Zc 8.8)"]}]},{"num":"III","titulo":"As nações buscando o Deus de Israel","sinopse":"A restauração de Israel culminará no Reino do Messias e alcançará as nações.","filhos":[{"titulo":"Última seção da mensagem","ref":"Zc 8.18","folhas":["Os jejuns de luto são retomados, e Javé promete transformá-los em festas (Zc 8.18,19)","“Gozo, e alegria, e festividades solenes” substituem o luto dos quatro jejuns (Zc 8.19)","Jesus disse que não se jejua em dias de festa (Mt 9.15; Mc 2.19)"]},{"titulo":"A promessa de Israel será extensiva às nações","ref":"Zc 8.20","folhas":["Povos e cidades virão buscar o Senhor em Jerusalém (Zc 8.20-22)","O Milênio, com Cristo reinando por mil anos, é o horizonte dessa promessa (Ap 20.4-6)","Os judeus têm participação nisso, pois “a salvação vem dos judeus” (Jo 4.22)"]},{"titulo":"A profecia é para o Milênio","ref":"Zc 8.23","folhas":["A expressão “naquele dia” é escatológica e aponta para o Milênio (Zc 2.11; Os 2.16)","O plano de Deus, anunciado desde Moisés, será estabelecido no reinado de Cristo (Dt 28.13)","Zacarias já mostrara essa bênção para as nações na terceira visão noturna (Zc 2.11)"]},{"titulo":"A “orla da veste de um judeu”","ref":"Zc 8.23","folhas":["Dez homens de todas as línguas seguram a veste de um judeu, desejando as bênçãos (Zc 8.23)","O número dez é simbólico e indica quantidade indefinida (Gn 31.7; Nm 14.22)","Se a queda de Israel trouxe riqueza ao mundo, quanto mais a plenitude dos gentios (Rm 11.11-14)"]}]}]};
