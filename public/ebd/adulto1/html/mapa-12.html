var DADOS={"n":12,"centro":"O Messias de Israel em Zacarias: veio para salvar e voltará em glória","aureo":{"texto":"E sobre a casa de Davi e sobre os habitantes de Jerusalém derramarei o Espírito de graça e de súplicas; e olharão para mim, a quem traspassaram.","ref":"Zc 12.10a"},"pratica":"O Messias prometido veio para salvar e voltará em glória para julgar as nações e estabelecer o seu Reino.","ramos":[{"num":"I","titulo":"O juízo sobre as nações vizinhas inimigas","sinopse":"O juízo das nações revela a soberania de Deus sobre os inimigos de Israel.","filhos":[{"titulo":"A sentença","ref":"Zc 9.1","folhas":["A fórmula “Peso da palavra do SENHOR” aparece também em Zc 12.1 e em Malaquias (Ml 1.1)","O termo hebraico massā’ significa peso, sentença, pronunciamento ou oráculo","A fórmula aparece em profetas pré-exílicos, como Isaías, Naum e Habacuque (Is 13.1; Na 1.1)"]},{"titulo":"“Peso da palavra do SENHOR contra a terra de Hadraque e Damasco”","ref":"Zc 9.1","folhas":["Antes da bênção vêm os juízos: Javé castiga as nações e depois realiza a grande libertação","Zacarias fala da ira de Deus sobre o Norte na terceira e na oitava visão (Zc 2.6; 6.6-8)","Os inimigos são Síria (Jr 49.23), Fenícia (Ez 27.8) e filisteus (Jr 25.20; Am 1.6-8)"]},{"titulo":"O cumprimento da profecia","ref":"Zc 9.2","folhas":["A Síria é identificada com Damasco, e a Fenícia, com Tiro e Sidom (Zc 9.1,2)","Na Filístia, só Gate não é citada; as outras são Asquelom, Ecrom, Gaza e Asdode (1 Sm 6.17)","Alexandre, o Grande, conquistou essas regiões, mas Jerusalém foi poupada"]}]},{"num":"II","titulo":"O Rei humilde e justo que viria","sinopse":"O Messias vem como Rei justo, Salvador e humilde, trazendo salvação e paz.","filhos":[{"titulo":"Os remanescentes das nações vizinhas","ref":"Zc 9.7","folhas":["Javé promete purificar os filisteus, que abandonarão suas práticas abomináveis (Zc 9.7)","Josué já havia integrado Gaza, Ecrom e Asdode (Js 15.20,45-47)","Filipe evangelizou em Azoto, forma grega de Asdode (At 8.40; 1 Sm 5.5)"]},{"titulo":"“E me acamparei ao redor da minha casa”","ref":"Zc 9.8","folhas":["“Minha casa” pode ser o Templo (Ag 1.9), a dinastia de Davi (2 Sm 7.11) ou o povo","Zacarias anuncia a proteção de Israel durante as incursões de Alexandre, o Grande","Josefo relata que o sumo sacerdote Jadua recebeu Alexandre e que a cidade não foi atacada"]},{"titulo":"A chegada de um Rei diferente","ref":"Zc 9.9","folhas":["Enquanto a chegada de Alexandre trazia ruínas e mortes, a do Messias traz alegria (Zc 9.9)","Israel é convidado a alegrar-se com o Rei Messias, que traz salvação e paz (Zc 9.9)","Esse Rei “andou fazendo o bem e curando a todos os oprimidos do diabo” (At 10.38)"]},{"titulo":"O cumprimento da profecia","ref":"Zc 9.9","folhas":["A entrada triunfal de Jesus em Jerusalém, num jumento, cumpriu a profecia (Mt 21.5)","Rei justo e Salvador, pobre e em jumento, em contraste com o aparato militar (Zc 9.9,10)","Os cavalos eram usados na guerra; esse Rei chega num jumento e anuncia paz às nações (Zc 9.10)"]}]},{"num":"III","titulo":"O Messias traído e o Pastor ferido","sinopse":"O Pastor rejeitado e ferido é Jesus, o Messias que seguimos e aguardamos em glória.","filhos":[{"titulo":"As trinta moedas","ref":"Zc 11.12","folhas":["Zacarias é avaliado em trinta moedas de prata, preço de um escravo ferido por um boi (Êx 21.32)","A expressão “esse belo preço em que fui avaliado” é uma ironia (Zc 11.13)","Cinco séculos depois, a cena se repete com Jesus, o Pastor rejeitado (Jo 10.11)"]},{"titulo":"Explicando a autoria da profecia","ref":"Zc 11.13","folhas":["As trinta moedas para o oleiro aparecem numa profecia atribuída a Jeremias (Mt 27.9,10)","Mateus combina elementos de Jeremias e Zacarias e cita o autor de maior relevância","Para alguns intérpretes, “arrojar ao oleiro” era ditado para jogar fora algo imprestável"]},{"titulo":"O Pastor ferido","ref":"Zc 13.7","folhas":["O Pastor é “o varão que é o meu companheiro”: relação entre Pai e Filho (Jo 10.30)","O Pastor ferido é o traspassado (Zc 12.10); Jesus identificou-se com ele (Mt 26.31)","A imagem do Traspassado reaparece em João 19.37 e em Apocalipse 1.7"]},{"titulo":"A purificação de Israel","ref":"Zc 13.8","folhas":["A profecia não se consumou com a destruição de Jerusalém, no ano 70","Javé promete purificar a terra e o povo no fim da Grande Tribulação (Zc 13.8,9; Rm 11.26)","O livramento dos inimigos será seguido pela conversão de Israel (Jr 30.18-22; Ez 11.19,20)"]}]}]};
