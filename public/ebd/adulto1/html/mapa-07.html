var DADOS={"n":7,"centro":"O Juízo de Deus e o Pecado no Meio do Povo: Deus julgará o mundo inteiro, a começar pelo povo de Israel","aureo":{"texto":"Porquanto tem determinado um dia em que com justiça há de julgar o mundo, por meio do varão que destinou; e disso deu certeza a todos, ressuscitando-o dos mortos.","ref":"At 17.31"},"pratica":"A sexta e a sétima visões tratam do juízo de Deus contra o pecado e revelam que Deus vai julgar o mundo inteiro, a começar pelo povo de Israel.","ramos":[{"num":"I","titulo":"O rolo que voava: o juízo de Deus sobre o pecado","sinopse":"O rolo voador e suas dimensões representam a maldição e o juízo individual e coletivo advindos da quebra da Lei pelo seu povo.","filhos":[{"titulo":"O “rolo voante”","ref":"Zc 5.1","folhas":["A visão tem a mesma introdução das anteriores: “levantei os meus olhos, e olhei” (Zc 1.18)","Megillāh, “rolo”, indica um volume enrolado e contínuo (Jr 36.2; Ez 2.9)","A imagem do “rolo voante” não tem paralelo nas Escrituras Sagradas"]},{"titulo":"A pergunta do anjo e a resposta do profeta","ref":"Zc 5.2","folhas":["O rolo era material de escrita de papiro (2 Jo 12) ou pergaminho (Jr 36.21; 2 Tm 4.13)","Suas medidas, vinte por dez côvados, equivalem a nove por quatro metros e meio (NAA)","Muitos relacionam essa medida com o pórtico do Templo de Salomão (1 Rs 6.3)"]},{"titulo":"O conteúdo do rolo voante","ref":"Zc 5.3","folhas":["O rolo é “a maldição que sairá pela face de toda a terra”, causada por roubo e perjúrio (Zc 5.3)","Roubo e perjúrio violam mandamentos do Decálogo que representam toda a Lei (Êx 20.7,15,16)","A maldição é coletiva e também individual, atingindo a residência dos transgressores (Zc 5.4)"]}]},{"num":"II","titulo":"A mulher no meio do efa: a iniquidade removida","sinopse":"O efa desproporcional e a tampa de chumbo apontam para a personificação e contenção da impiedade que domina o sistema mundial.","filhos":[{"titulo":"A visão do efa","ref":"Zc 5.5","folhas":["O efa, medida para secos (Ez 45.11), tem capacidade estimada entre 17 e 37 litros","Pote de cerâmica para cereais, de tamanho desproporcional, pois cabia uma mulher agachada","O anjo explica que “isto é a iniquidade em toda a terra” (Zc 5.6, ARA)"]},{"titulo":"A mulher agachada no meio do efa","ref":"Zc 5.7","folhas":["A tampa de chumbo impede a saída da mulher, personificação da iniquidade (Zc 5.8)","A tampa pesada parece barra de construção, pois o contexto das visões é a obra do Templo","Ela simboliza o sistema mundial dominado por Satanás (Ap 17.3-5)"]},{"titulo":"As duas mulheres aladas","ref":"Zc 5.9","folhas":["Duas mulheres aladas, com asas de cegonha, levantaram o efa entre a terra e o céu (Zc 5.9)","Elas contrastam com a mulher do efa e parecem impulsionadas pelo vento (Sl 104.3,4)","Os ventos também estão a serviço de Javé (Gn 8.1; Êx 15.10)"]}]},{"num":"III","titulo":"O destino do efa e o seu significado","sinopse":"O transporte do cesto à terra de Sinar simboliza o retorno da iniquidade à sua origem, completando o ciclo de toda idolatria e oposição a Deus que movem o sistema mundano até o derradeiro juízo.","filhos":[{"titulo":"A terra de Sinar","ref":"Zc 5.10","folhas":["Sinar é nome alternativo da Babilônia (Gn 10.10; 11.2)","Hoje a Babilônia representa os princípios que movem o mundo em conflito com Deus (Lawrence Richards)","Babilônia, berço da idolatria, opõe-se a Deus desde Ninrode e a Torre de Babel (Gn 10.8-10)"]},{"titulo":"Qual o significado da “casa na terra de Sinar”?","ref":"Zc 5.4","folhas":["A casa é o local do juízo divino sobre o pecado (Zc 5.4, 11)","Roubo e perjúrio dizem respeito ao comércio, que nutriu o comercialismo da meretriz (Ap 18.3)","A casa seria um templo aos deuses, como os zigurates da Babilônia, do tipo da Torre de Babel"]}]}]};
