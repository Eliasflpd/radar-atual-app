var DADOS={"n":13,"centro":"O Futuro Glorioso de Israel e a Aparição do Messias: O Messias virá em glória para derrotar as nações e reinar","aureo":{"texto":"E acontecerá que todos os que restarem de todas as nações que vieram contra Jerusalém subirão de ano em ano para adorarem o Rei, o SENHOR dos Exércitos.","ref":"Zc 14.16a"},"pratica":"No fim dos tempos, o Messias virá em glória para derrotar as nações inimigas, restaurar Israel e estabelecer o seu Reino de paz.","ramos":[{"num":"I","titulo":"O cerco de Jerusalém","sinopse":"O Deus Criador governa a história e derrotará os inimigos que cercarem Jerusalém.","filhos":[{"titulo":"O Deus Todo-Poderoso fala","ref":"Zc 12.1","folhas":["Quem fala tem poder para estender o céu, pois ele mesmo criou os céus e a terra (Gn 1.1)","Deus criou o ser humano completo, com corpo, alma e espírito (Gn 1.26,27; 2.7)","Ele é o Deus de todas as nações e de todo o Universo, capaz de cumprir a profecia (Is 43.11-13)"]},{"titulo":"Significado","ref":"Zc 12.2","folhas":["O “copo de tremor” e a “pedra pesada” mostram que os inimigos serão vencidos pelo poder de Javé","Essas figuras são barreiras e tropeços que levarão os invasores de Jerusalém à completa ruína","O “copo de tremor” descreve o atordoamento das nações que atacam Jerusalém (Jr 25.17,18)"]}]},{"num":"II","titulo":"A derrocada da confederação inimiga","sinopse":"Deus derrotará a confederação inimiga quando Cristo manifestar-se gloriosamente.","filhos":[{"titulo":"O reverso da loucura e cegueira","ref":"Zc 12.4","folhas":["Os povos confederados atacarão Jerusalém, e Javé os derrotará (Zc 14.2; Ez 38.4)","O espanto dos cavalos é o reverso do juízo contra Israel (Dt 28.28)","Esse reverso já aparece em Zacarias: a maldição recai sobre os inimigos (Zc 2.9)"]},{"titulo":"A interjeição “eis”","ref":"Zc 12.2","folhas":["A interjeição “eis” inicia os discursos finais de Zacarias (Zc 12.2; 14.1)","Na Septuaginta, a palavra hebraica hineh é traduzida por idou, “vede”","O uso dessa interjeição chama a atenção para a importância do assunto"]},{"titulo":"A expressão “naquele dia”","ref":"Zc 12.4","folhas":["A expressão aparece pelo menos dezesseis vezes e refere-se ao “dia do SENHOR” (Zc 14.1; Jl 2.1)","O Senhor identifica esse período como “grande tribulação” (1 Ts 5.2; 2 Ts 2.2)","Esse cenário nunca aconteceu na história; é para o fim dos tempos"]},{"titulo":"A batalha final","ref":"Zc 12.9","folhas":["Na batalha final, Jerusalém será saqueada e parte do povo levada cativa (Zc 14.2)","Javé pelejará contra as nações, e Cristo em glória encerrará o conflito (Zc 14.3,4)","Nesse dia, Israel reconhecerá o Messias e se converterá (Zc 12.10; Rm 11.26)"]}]},{"num":"III","titulo":"O futuro glorioso de Israel e a glória do Messias","sinopse":"O Messias restaurará Israel e reinará sobre toda a terra em justiça e paz.","filhos":[{"titulo":"A fonte de águas vivas","ref":"Zc 14.8","folhas":["Deus é a fonte de águas vivas, que Israel rejeitou, levando à dispersão (Jr 17.13; 2.13)","No Milênio, águas sanadoras fertilizarão as terras estéreis do mar Morto (Ez 47.1,8)","Essas águas trarão colheitas para a Festa das Cabanas, festa de alegria (Lv 23.39)"]},{"titulo":"“O SENHOR será rei sobre toda a terra”","ref":"Zc 14.9","folhas":["O futuro glorioso de Israel vem após o juízo dos judeus e a vinda do Libertador (Is 59.20,21)","O Messias estabelecerá paz universal, e seu Reino não terá fim (Is 11.3-10; Lc 1.32,33)","Três salmos começam com “O SENHOR reina” e descrevem o Reino do Messias (Sl 93.1,2; 97.1; 99.1)"]},{"titulo":"O shema’ das nações","ref":"Zc 14.9","folhas":["“Naquele dia, um será o SENHOR, e um será o seu nome” (Zc 14.9b)","A confissão judaica “Ouve, Israel, o SENHOR... é o único SENHOR” aparece em Dt 6.4","Falta “Ouve, Israel”, pois Javé reina em toda a terra e abençoa os gentios (Rm 11.12)"]},{"titulo":"O que aprendemos?","ref":"Gn 12.3","folhas":["Os antissemitas e antissionistas não têm a bênção de Deus (Gn 12.3; 27.29)","O Estado de Israel hoje serve de aviso de que a vinda de Cristo está próxima (Lc 21.29-31)","Devemos orar por Israel e por seus governantes, que nem sempre acertam (Sl 122.6)"]}]}]};
