var DADOS={"n":6,"centro":"O Simbolismo do Castiçal de Ouro e das Duas Oliveiras: A obra de Deus é realizada pelo poder do Espírito Santo","aureo":{"texto":"E virei-me para ver quem falava comigo. E, virando-me, vi sete castiçais de ouro.","ref":"Ap 1.12"},"pratica":"A obra de Deus é realizada pelo poder do Espírito Santo, e não somente pelos recursos humanos.","ramos":[{"num":"I","titulo":"O castiçal de ouro e as duas oliveiras","sinopse":"Deus anuncia ao profeta, por meio de simbologia, que a Luz que ilumina as nações virá com poder sacerdotal e real.","filhos":[{"titulo":"O despertar do profeta","ref":"Zc 4.1","folhas":["O anjo despertou Zacarias “como a um homem que é despertado do seu sono” (Zc 4.1)","A linguagem é comparativa; não se trata de alguém literalmente dormindo","O contexto parece indicar uma perda de concentração entre uma visão e outra"]},{"titulo":"O castiçal","ref":"Zc 4.2","folhas":["A menorá é o castiçal de sete braços, de ouro maciço, com forma de árvore de luz (Êx 25.31-37)","As sete lâmpadas eram a única fonte de luz do Lugar Santo, que não recebia luz natural (Êx 25.37)","Simboliza iluminação e plenitude (Is 42.6; 49.6), cumpridas em Jesus, a Luz do mundo (Jo 8.12)"]},{"titulo":"As duas oliveiras","ref":"Zc 4.3","folhas":["As oliveiras simbolizam o suprimento contínuo de azeite que mantém as lâmpadas acesas","Na alegoria de Jotão, o óleo da oliveira é “apreciado por Deus e pelos homens” (Jz 9.9)","Os gentios, como o zambujeiro, foram enxertados na oliveira e participam da sua seiva (Rm 11.17-24)"]}]},{"num":"II","titulo":"Não por força nem por poder, mas pelo meu Espírito","sinopse":"Não é pelo poder humano, e sim pelo poder do Espírito Santo que a vontade de Deus é estabelecida.","filhos":[{"titulo":"Diálogo entre Zacarias e o anjo intérprete","ref":"Zc 4.4","folhas":["Agora é o profeta quem faz perguntas, e o anjo espera que ele saiba o que vê (Zc 4.5)","O castiçal fazia parte da cultura do povo, e Zacarias conhecia bem o que era um castiçal","Zacarias não viu o Templo de Salomão, mas havia sobreviventes que viram sua destruição (Ag 2.3)"]},{"titulo":"A construção do Templo, uma obra do Espírito Santo","ref":"Zc 4.6","folhas":["“Não por força nem por poder, mas pelo meu Espírito” é dirigido a Zorobabel (Zc 4.6)","Entre os textos mais conhecidos do Antigo Testamento, é praticamente o lema da Igreja","“Força” (ḥayil) é força física (Ec 10.10); “poder” (kôaḥ) indica recursos humanos (Ne 4.10)"]},{"titulo":"O construtor do Templo","ref":"Zc 4.7","folhas":["A obra dependia da palavra de Javé; o “monte grande” representa as barreiras que cairiam","Zorobabel lançou a pedra fundamental sob Ciro; depois a obra foi interrompida (Ed 4.23,24)","O mesmo Zorobabel que iniciou a obra a concluiu em 516 a.C. (Zc 4.9; Ed 6.15-17)"]}]},{"num":"III","titulo":"O significado das duas oliveiras","sinopse":"Deus também age nas pequenas coisas e nos chama a confiar em sua obra desde o início.","filhos":[{"titulo":"As coisas pequenas, o prumo e os sete olhos de Javé","ref":"Zc 4.10","folhas":["A mensagem era dirigida a um povo que via apenas ruínas e não confiava na liderança de Zorobabel","Javé exorta a não desprezar “o dia das coisas pequenas” (Zc 4.10); nada é impossível (Lc 1.37)","Os “sete olhos do SENHOR” simbolizam a sua onisciência (2 Cr 16.9; Ap 5.6)"]},{"titulo":"Quem são as duas oliveiras?","ref":"Zc 4.11","folhas":["“Estes são os dois ungidos, que estão diante do Senhor de toda a terra” (Zc 4.14)","Os ungidos são Josué, o religioso, e Zorobabel, o político (Ag 1.1; 2.4)","Prefiguram o Messias nas funções sacerdotal e real; Jesus descende de Zorobabel (Lc 3.27)"]}]}]};
