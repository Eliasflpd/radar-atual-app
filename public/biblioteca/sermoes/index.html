<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sermões — Escavador de Pérolas Bíblicas</title>
<style>
  :root{--branco:#fff;--texto:#1c2230;--navy:#0f3d5c;--teal:#0f6d78;--dourado:#a9791c}
  *{box-sizing:border-box;-webkit-text-size-adjust:100%}
  html{font-size:17px}
  body{
    margin:0 auto;max-width:820px;background:var(--branco);color:var(--texto);
    font-family:'Segoe UI',system-ui,Arial,sans-serif;line-height:1.6;
    padding:16px 13px calc(46px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;
  }
  .voltar{display:inline-block;margin:0 0 16px;background:#1c2230;color:#fff;border:none;border-radius:999px;padding:9px 17px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer}
  .selo{text-align:center;color:var(--teal);font-size:.82rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
  h1{font-family:Georgia,serif;text-align:center;color:var(--navy);font-size:1.95rem;font-weight:800;margin:2px 0 4px}
  .sub{text-align:center;color:#6b7280;font-size:1rem;margin-bottom:8px}
  .divisor{height:3px;width:64px;background:var(--dourado);border-radius:3px;margin:0 auto 22px}
  .card{
    display:block;text-decoration:none;color:inherit;background:#fff;
    border:1px solid #e4e7ec;border-radius:16px;padding:16px 16px;margin-bottom:14px;
    box-shadow:0 2px 10px rgba(15,61,92,.06);cursor:pointer;
  }
  .card .top{display:flex;gap:13px;align-items:center}
  .card .ic{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--teal));display:flex;align-items:center;justify-content:center;font-size:27px;flex-shrink:0}
  .card .tit{font-family:Georgia,serif;font-weight:800;font-size:1.18rem;color:var(--navy);line-height:1.25}
  .card .ref{color:var(--dourado);font-weight:800;font-size:.9rem;margin-top:2px}
  .card .desc{font-size:.98rem;color:#4b5563;margin-top:9px;text-align:justify;line-height:1.55}
  .vazio{text-align:center;color:#9aa1ad;padding:30px 0;font-size:.95rem}
</style>
</head>
<body>

  <button class="voltar" onclick="if(history.length>1){history.back()}else{location.href='/?mod=manuais'}">← Biblioteca</button>

  <div class="selo">✦ Escavador de Pérolas Bíblicas ✦</div>
  <h1>Sermões</h1>
  <div class="sub">Estudos profundos pra edificar a igreja</div>
  <div class="divisor"></div>

  <div id="lista"></div>

<script>
  // ── CRM de Sermões — pra postar um novo, é só adicionar aqui em cima ──
  var SERMOES = [
    {
      arquivo:'trombeta-terra-nao-silencia.html',
      titulo:"A Trombeta que a Terra Não Poderá Silenciar",
      ref:"1 Tessalonicenses 4:13–18 · 1 Coríntios 15:51–52",
      emoji:'📯',
      desc:"O arrebatamento da Igreja: os mortos em Cristo ressuscitam, os vivos são transformados num abrir e fechar de olhos, e o Senhor reúne os seus nos ares."
    },
    {
      arquivo:'altares-molhados.html',
      titulo:"O Deus que Incendeia Altares Molhados",
      ref:"1 Reis 18:30–39",
      emoji:'🔥',
      desc:"Elias no Carmelo: quando tudo parece encharcado demais para queimar, Deus responde com fogo do céu e restaura o altar em ruínas."
    },
    {
      arquivo:'ultima-geracao-ceu.html',
      titulo:"Quando a Última Geração Olhar para o Céu",
      ref:"Mateus 24:3–14, 36–44",
      emoji:'⏳',
      desc:"Os últimos dias: o amor esfriando, o engano crescendo — e uma Igreja chamada a permanecer acordada até a volta de Cristo."
    },
    {
      arquivo:'vale-voltou-respirar.html',
      titulo:"Quando o Vale Voltou a Respirar",
      ref:"Ezequiel 37:1–14",
      emoji:'🦴',
      desc:"O vale de ossos secos: Deus não pergunta se parecem vivos, mas se ainda cremos que a Sua Palavra pode ressuscitá-los."
    },
    {
      arquivo:'quarto-homem-no-fogo.html',
      titulo:"Há um Quarto Homem Dentro do Fogo",
      ref:"Daniel 3:19–27",
      emoji:'✝️',
      desc:"A fornalha sete vezes mais quente: Deus nem sempre impede o fogo, mas entra nele, quebra as amarras e preserva os seus."
    },
    {
      arquivo:'sangue-na-porta.html',
      titulo:"O Sangue na Porta e a Morte do Lado de Fora",
      ref:"Êxodo 12:1–13 · 1 Coríntios 5:7",
      emoji:'🩸',
      desc:"O Cordeiro da Páscoa apontando para Cristo: a segurança não estava na força de quem estava dentro, mas no sangue do lado de fora."
    },
    {
      arquivo:'noite-jaboque.html',
      titulo:"A Noite em que Deus Feriu um Homem para Salvá-lo",
      ref:"Gênesis 32:24–31",
      emoji:'🌙',
      desc:"Jacó em Jaboque: entrou lutando, saiu mancando — e descobriu que algumas feridas são o começo de uma nova identidade."
    },
    {
      arquivo:'migalhas-cananeia.html',
      titulo:"As Migalhas que Fizeram Jesus Parar",
      ref:"Mateus 15:21–28",
      emoji:'🍞',
      desc:"A mulher cananeia e a fé perseverante: não abandonou a presença diante do silêncio, da resistência ou da humilhação — permaneceu até receber."
    },
    {
      arquivo:'../saudacao-mateus24.html',
      titulo:"Saudação — O Princípio das Dores",
      ref:"Mateus 24",
      emoji:'📜',
      desc:"O princípio das dores: os sinais do fim se avolumando — e a saudação que prepara o coração da igreja para a vinda do Senhor."
    },
    {
      arquivo:'o-mundo-se-posicionando.html',
      titulo:"O Mundo Não Está Desmoronando — Está Se Posicionando",
      ref:"2 Tessalonicenses 2 · Apocalipse 13",
      emoji:'🌍',
      desc:"A convergência entre atualidade e profecia: o tabuleiro sendo montado para o xeque-mate final — e o Cordeiro que já venceu."
    },
    {
      arquivo:'quando-o-dinheiro.html',
      titulo:"Quando o Dinheiro Deixar de Ser Dinheiro",
      ref:"Ezequiel 7:19 · Ageu 2:8",
      emoji:'🪙',
      desc:"A falência do sistema e a economia do maná: quando a moeda cai, a obediência é a única moeda com poder de compra."
    },
    {
      arquivo:'ninguem-vai-se-esconder.html',
      titulo:"O Dia em Que Ninguém Mais Conseguirá Se Esconder",
      ref:"Apocalipse 6:16 · Hebreus 4:13",
      emoji:'🔦',
      desc:"Do Éden ao Grande Trono Branco: a última sombra será removida. Quem se deixa expor pela Graça hoje não será exposto pelo Juízo amanhã."
    },
    {
      arquivo:'leis-da-natureza.html',
      titulo:"Quando Deus Suspende as Leis da Natureza",
      ref:"A Soberania do Criador sobre o Natural",
      emoji:'🌌',
      desc:"Do sol parado em Josué ao machado que flutua: Deus não quebra leis — Ele exerce uma Lei Superior, e o milagre é a Sua assinatura na matéria."
    },
    {
      arquivo:'heroi-de-um-versiculo.html',
      titulo:'O Herói de Um Só Versículo',
      ref:'Juízes 3:31',
      emoji:'🐂',
      desc:'A subversão da tecnologia: Deus unge o que já está na sua mão. Uma aguilhada de boi contra 600 filisteus.'
    },
    {
      arquivo:'contraria-a-logica-humana.html',
      titulo:'Quando Deus Contraria a Lógica Humana',
      ref:'5 Momentos em Que o Impossível Aconteceu',
      emoji:'🌀',
      desc:'Gideão, Sara, Moisés, Lázaro e a Cruz: quando o Autor edita o roteiro e o impossível vira o padrão do Reino.'
    },
    {
      arquivo:'nada-dificil-para-o-senhor.html',
      titulo:'Quando Deus Vai Além das Impossibilidades Humanas',
      ref:'Gênesis 18:14 · Lucas 1:37',
      emoji:'⚡',
      desc:'Do carvalho de Manre ao ventre estéril: a impossibilidade humana é o solo da glória de Deus — e um retrato da Ressurreição.'
    },
    {
      arquivo:'120-anos-de-noe.html',
      titulo:'O Último Prego',
      ref:'Gênesis 6',
      emoji:'🔩',
      desc:'A engenharia espiritual do período pré-diluviano: misericórdia, paciência e a Arca que prefigura Cristo.'
    }
  ];

  var box=document.getElementById('lista');
  if(!SERMOES.length){
    box.innerHTML='<div class="vazio">Nenhum sermão postado ainda.</div>';
  } else {
    box.innerHTML=SERMOES.map(function(s){
      return '<a class="card" href="'+s.arquivo+'">'
        +'<div class="top">'
        +'<div class="ic">'+(s.emoji||'📜')+'</div>'
        +'<div><div class="tit">'+s.titulo+'</div><div class="ref">'+s.ref+'</div></div>'
        +'</div>'
        +(s.desc?'<div class="desc">'+s.desc+'</div>':'')
        +'</a>';
    }).join('');
  }
</script>

<!-- ══════════ CRIADOR DE SERMÕES (Escavador de Pérolas) ══════════ -->
<style>
  .criador{margin-top:34px;border-top:2px dashed #e2d4b0;padding-top:22px}
  .cr-selo{text-align:center;color:var(--teal);font-size:.8rem;font-weight:800;letter-spacing:2.5px;text-transform:uppercase}
  .cr-tit{font-family:Georgia,serif;text-align:center;color:var(--navy);font-size:1.42rem;margin:4px 0 6px}
  .cr-dica{text-align:center;color:#6b7280;font-size:.95rem;margin:0 auto 14px;max-width:560px;line-height:1.5}
  #cr-tema{width:100%;border:2px solid #e4e7ec;border-radius:13px;padding:12px 13px;font-size:1.02rem;font-family:inherit;color:var(--texto);resize:vertical}
  #cr-tema:focus{outline:none;border-color:var(--teal)}
  #cr-btn{display:block;width:100%;margin-top:11px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border:none;border-radius:13px;padding:14px;font-size:1.05rem;font-weight:800;font-family:inherit;cursor:pointer}
  #cr-btn:disabled{opacity:.55;cursor:default}
  #cr-quem{text-align:center;color:var(--dourado);font-weight:700;margin:14px 0 0;font-size:.95rem}
  #cr-saida{margin-top:14px}
  #cr-saida h1{font-family:Georgia,serif;text-align:center;color:var(--navy);font-size:1.5rem;line-height:1.25;margin:6px 0 4px}
  #cr-saida .cr-ref{text-align:center;color:var(--dourado);font-weight:800;margin-bottom:12px}
  #cr-saida h2{font-family:Georgia,serif;color:var(--navy);font-size:1.16rem;margin:20px 0 8px;padding-top:12px;border-top:1px solid #eee}
  #cr-saida p{font-size:1.07rem;margin:0 0 13px;text-align:justify;line-height:1.65}
  #cr-saida .cr-li{padding-left:6px;margin:0 0 9px;font-size:1.05rem}
  #cr-saida strong{color:#8a1c1c;font-weight:800}
  #cr-saida em{color:var(--navy);font-style:italic}
  #cr-acoes{display:flex;gap:9px;margin-top:16px}
  .cr-sec{flex:1;background:rgba(15,61,92,.07);border:1px solid #e4e7ec;color:var(--navy);border-radius:12px;padding:11px;font-size:.98rem;font-weight:800;font-family:inherit;cursor:pointer}
</style>
<div class="criador">
  <div class="cr-selo">✦ Criador de Sermões ✦</div>
  <h2 class="cr-tit">✍️ Forjar um sermão novo</h2>
  <p class="cr-dica">Digite o texto-base ou o tema. O <b>Escavador de Pérolas</b> cava o texto até a pérola aparecer — estudo profundo em 13 seções.</p>
  <textarea id="cr-tema" rows="2" placeholder="Ex.: Salmo 23  •  Zaqueu  •  a graça que sustenta"></textarea>
  <button id="cr-btn">✍️ Forjar sermão</button>
  <div id="cr-quem"></div>
  <div id="cr-saida"></div>
  <div id="cr-acoes" style="display:none">
    <button id="cr-copiar" class="cr-sec">📋 Copiar</button>
    <button id="cr-outro" class="cr-sec">🔁 Fazer outro</button>
  </div>
</div>
<script>
(function(){
  var ACAO='perola', LABEL='✍️ Forjar sermão', PENSANDO='O Escavador está cavando o texto…';
  var $=function(id){return document.getElementById(id);};
  var tema=$('cr-tema'), btn=$('cr-btn'), saida=$('cr-saida'), quem=$('cr-quem'), acoes=$('cr-acoes');
  var raw='', ocupado=false;
  function escH(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inl(s){return escH(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');}
  function render(txt){
    var lines=txt.split(/\r?\n/), h='', para=[];
    function flush(){ if(para.length){ h+='<p>'+inl(para.join(' '))+'</p>'; para=[]; } }
    for(var i=0;i<lines.length;i++){
      var L=lines[i].trim();
      if(!L){ flush(); continue; }
      var mT=L.match(/^T[IÍ]TULO:\s*(.*)$/i); if(mT){ flush(); h+='<h1>'+inl(mT[1])+'</h1>'; continue; }
      var mR=L.match(/^REFER[EÊ]NCIA:\s*(.*)$/i); if(mR){ flush(); h+='<div class="cr-ref">'+escH(mR[1])+'</div>'; continue; }
      var mI=L.match(/^INTRO:\s*(.*)$/i); if(mI){ flush(); para.push(mI[1]); continue; }
      var mH=L.match(/^\*\*(.+?)\*\*:?\s*$/); if(mH){ flush(); h+='<h2>'+inl(mH[1])+'</h2>'; continue; }
      if(/^[•\-]\s+/.test(L)){ flush(); h+='<div class="cr-li">◆ '+inl(L.replace(/^[•\-]\s+/,''))+'</div>'; continue; }
      para.push(L);
    }
    flush();
    saida.innerHTML=h;
  }
  function forjar(){
    var t=tema.value.trim(); if(!t||ocupado) return;
    ocupado=true; btn.disabled=true; btn.textContent='✍️ Forjando…'; raw=''; saida.innerHTML=''; acoes.style.display='none';
    quem.textContent=PENSANDO;
    fetch('/api/concilio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:ACAO,tema:t})})
    .then(function(r){
      if(!r.body||!r.body.getReader) return r.text().then(function(x){ raw=x; render(raw); });
      var reader=r.body.getReader(), dec=new TextDecoder();
      return (function pump(){ return reader.read().then(function(x){ if(x.done) return; raw+=dec.decode(x.value,{stream:true}); render(raw); return pump(); }); })();
    })
    .then(function(){ quem.textContent=''; if(raw.trim()) acoes.style.display='flex'; })
    .catch(function(e){ quem.textContent=''; saida.innerHTML='<p style="color:#b91c1c">Não deu certo agora: '+escH(e.message||'falha')+'. Tente de novo.</p>'; })
    .then(function(){ ocupado=false; btn.disabled=false; btn.textContent=LABEL; });
  }
  btn.addEventListener('click',forjar);
  tema.addEventListener('keydown',function(e){ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) forjar(); });
  $('cr-outro').addEventListener('click',function(){ saida.innerHTML=''; acoes.style.display='none'; tema.value=''; tema.focus(); });
  $('cr-copiar').addEventListener('click',function(){
    var t=saida.innerText||saida.textContent||'';
    function fb(){ var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.focus();a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(fb); } else fb();
    var b=$('cr-copiar'), o=b.textContent; b.textContent='✅ Copiado'; setTimeout(function(){b.textContent=o;},1500);
  });
})();
</script>
</body>
</html>
