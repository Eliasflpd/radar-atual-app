<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bíblias — RADAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#faf6ee; --papel2:#f3ecdd; --tinta:#2b2620; --tinta2:#5a5247;
    --ouro:#9a7b33; --ouro2:#c9a54a; --linha:#e6dcc7; --navy:#12314a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--papel);color:var(--tinta);
    font-family:'Lora',Georgia,serif;overflow-x:hidden}
  .wrap{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

  /* ---- barra topo ---- */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:var(--papel);border-bottom:1px solid var(--linha)}
  .top .voltar{border:none;background:var(--papel2);color:var(--tinta);width:40px;height:40px;
    border-radius:12px;font-size:20px;cursor:pointer;flex-shrink:0}
  .top .tit{flex:1;text-align:center;font-family:'Playfair Display',serif;font-weight:800;font-size:18px;color:var(--navy)}
  .top .tit small{display:block;font-family:'Lora';font-weight:400;font-size:11.5px;color:var(--ouro);letter-spacing:.5px}
  .top .sp{width:40px;flex-shrink:0}

  .tela{display:none;flex:1;padding:18px 16px 40px}
  .tela.on{display:block}

  /* ---- CAPA ---- */
  #capa{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:40px 24px;background:radial-gradient(120% 80% at 50% 0%,#fffdf8 0%,var(--papel) 55%,var(--papel2) 100%)}
  #capa.on{display:flex}
  .livro-capa{width:210px;max-width:66vw;aspect-ratio:3/4;border-radius:10px;position:relative;
    background:linear-gradient(155deg,#173c5a,#0d2438 60%,#0a1c2c);
    box-shadow:0 22px 50px rgba(10,25,40,.45),inset 0 0 0 2px rgba(201,165,74,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#f6edd6;padding:26px 18px}
  .livro-capa::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:4px;border-radius:3px;
    background:linear-gradient(var(--ouro2),var(--ouro))}
  .livro-capa .cruz{font-size:34px;color:var(--ouro2)}
  .livro-capa h1{font-family:'Playfair Display',serif;font-weight:900;font-size:30px;line-height:1.05;margin:0}
  .livro-capa p{margin:0;font-size:12px;letter-spacing:2px;color:#cddcea;text-transform:uppercase}
  .livro-capa .borda{position:absolute;inset:10px;border:1px solid rgba(201,165,74,.4);border-radius:6px;pointer-events:none}
  .capa-img{width:236px;max-width:72vw;border-radius:16px;box-shadow:0 26px 60px rgba(10,25,40,.55);border:1px solid rgba(201,165,74,.4)}
  #capa .nome-b{margin:26px 0 4px;font-family:'Playfair Display',serif;font-weight:800;font-size:22px;color:var(--navy)}
  #capa .sub-b{margin:0 0 26px;color:var(--tinta2);font-size:14px}
  .btn-abrir{border:none;background:linear-gradient(135deg,var(--ouro2),var(--ouro));color:#2a2008;
    font-family:'Lora';font-weight:600;font-size:16px;padding:14px 34px;border-radius:40px;cursor:pointer;
    box-shadow:0 10px 24px rgba(154,123,51,.4)}

  /* ---- ÍNDICE ---- */
  .test-tit{text-align:center;font-family:'Playfair Display',serif;font-weight:800;color:var(--navy);
    font-size:16px;margin:18px 0 12px;position:relative}
  .test-tit::before,.test-tit::after{content:"";position:absolute;top:50%;width:22%;height:1px;background:var(--linha)}
  .test-tit::before{left:6%}.test-tit::after{right:6%}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .liv{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--linha);border-radius:12px;
    padding:11px 12px;cursor:pointer;transition:.12s}
  .liv:active{transform:scale(.97);background:var(--papel2)}
  .liv .n{width:26px;height:26px;border-radius:8px;background:var(--papel2);color:var(--ouro);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
  .liv .nm{font-size:14.5px;font-weight:600;color:var(--tinta)}

  /* ---- CAPÍTULOS (bolinhas) ---- */
  #capsGrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
  .cap{aspect-ratio:1;border:1px solid var(--linha);background:#fff;border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--navy)}
  .cap:active{background:var(--ouro2);color:#fff}

  /* ---- LEITURA ---- */
  #leitura{padding:26px 22px 60px}
  #leitura .cabec{text-align:center;margin:6px 0 22px}
  #leitura .cabec h2{font-family:'Playfair Display',serif;font-weight:800;font-size:26px;color:var(--navy);margin:0}
  #leitura .cabec .cap-n{color:var(--ouro);font-size:14px;letter-spacing:3px;text-transform:uppercase;margin-top:4px}
  #leitura .cabec .orn{color:var(--ouro2);font-size:18px;margin-top:8px}
  .vtexto{font-size:19px;line-height:1.8;color:#26211b}
  /* cada versiculo em BLOCO proprio, empilhado, numero dourado com recuo pendurado */
  .vtexto .v{display:block;position:relative;padding-left:2.2em;margin:0 0 .62em;
    text-align:justify;text-justify:inter-word}
  .vtexto .vn{position:absolute;left:0;top:.12em;font-family:'Playfair Display',serif;
    font-weight:700;font-size:13.5px;color:var(--ouro);line-height:1}
  .navcap{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:34px;
    padding-top:18px;border-top:1px solid var(--linha)}
  .navcap button{flex:1;border:1px solid var(--linha);background:#fff;color:var(--navy);
    font-family:'Lora';font-weight:600;font-size:14px;padding:12px;border-radius:12px;cursor:pointer}
  .navcap button:disabled{opacity:.35}
  .notemk{display:inline-block;margin-left:5px;color:#fff;background:var(--ouro);font-size:10.5px;font-weight:600;
    padding:1px 8px;border-radius:10px;vertical-align:middle;cursor:pointer;font-family:'Lora';letter-spacing:.3px}
  .notebox{display:none;margin:11px 0 18px;padding:14px 16px;background:#fff;border-left:3px solid var(--ouro);
    border-radius:0 12px 12px 0;box-shadow:0 5px 16px rgba(0,0,0,.07);font-size:16px;line-height:1.72;
    text-align:left;color:#3a352c}
  .notebox.on{display:block}
  .notebox .lem{color:var(--navy);font-family:'Playfair Display',serif;font-weight:700}
  .notebox .fnt{display:block;margin-top:9px;font-size:11.5px;color:var(--ouro);font-style:italic}
  .creditos{margin-top:26px;text-align:center;color:var(--tinta2);font-size:12px;font-style:italic}
  /* escolha de bíblia */
  .bcell{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 14px;cursor:pointer;margin-bottom:9px}
  .bcell:active{background:var(--papel2)}
  .bcell .ic{width:42px;height:54px;border-radius:6px;flex-shrink:0;background:linear-gradient(150deg,#173c5a,#0a1c2c);display:flex;align-items:center;justify-content:center;color:#c9a54a;font-size:19px;box-shadow:inset 0 0 0 1px rgba(201,165,74,.35)}
  .bcell .bnome{font-weight:600;font-size:15px;color:var(--tinta);line-height:1.25}
  .bcell .btag{font-size:11.5px;margin-top:3px}
  .bcell .btag.ok{color:#2c8a4a;font-weight:600}
  .bcell .btag.no{color:var(--tinta2)}
  /* painel da nota (bottom-sheet) */
  #notaModal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(20,15,8,.5)}
  #notaModal.on{display:flex}
  .nota-card{width:100%;max-width:760px;max-height:82vh;background:var(--papel);border-radius:22px 22px 0 0;box-shadow:0 -12px 44px rgba(0,0,0,.4);display:flex;flex-direction:column;animation:sobe .22s ease}
  @keyframes sobe{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .nota-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--linha)}
  .nota-head #notaRef{font-family:'Playfair Display',serif;font-weight:800;color:var(--navy);font-size:17px}
  .nota-x{border:none;background:var(--papel2);color:var(--tinta);width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;flex-shrink:0}
  .nota-scroll{overflow-y:auto;padding:20px 20px 34px;font-size:17px;line-height:1.78;color:#332e26;text-align:left}
  .nota-scroll .lem{color:var(--navy);font-family:'Playfair Display',serif;font-weight:700}
  .nota-scroll .fnt{display:block;margin-top:16px;font-size:11.5px;color:var(--ouro);font-style:italic}
  .navcap .meio{flex:0 0 auto;color:var(--tinta2);font-size:13px}
  /* ---- SUBTÍTULO de seção (estilo impresso) ---- */
  .secao{display:block;text-align:center;font-family:'Playfair Display',serif;font-weight:700;
    color:var(--ouro);font-variant:small-caps;letter-spacing:.6px;font-size:17px;line-height:1.25;
    margin:22px 8px 12px;padding:0 6px}
  .secao .orn{display:block;color:var(--ouro2);font-size:13px;margin-bottom:2px;font-family:'Lora'}
  /* ---- botão/CARD Introdução ---- */
  .introbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
    background:linear-gradient(135deg,#fffdf8,var(--papel2));border:1px solid var(--linha);
    border-left:3px solid var(--ouro);border-radius:14px;padding:13px 15px;margin:2px 0 16px;
    font-family:'Lora'}
  .introbtn .ib-ic{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:linear-gradient(150deg,#173c5a,#0a1c2c);
    display:flex;align-items:center;justify-content:center;color:var(--ouro2);font-size:18px}
  .introbtn .ib-tt{font-weight:600;font-size:15px;color:var(--navy)}
  .introbtn .ib-sb{font-size:11.5px;color:var(--tinta2);margin-top:1px}
  .introbtn .ib-ar{margin-left:auto;color:var(--ouro);font-size:20px}
  /* ---- VIEW da introdução ---- */
  #introView{padding:24px 20px 60px}
  .intro-doc{font-size:16.5px;line-height:1.75;color:#2e2920;text-align:justify}
  .intro-doc h2.ititulo{font-family:'Playfair Display',serif;font-weight:800;color:var(--navy);
    text-align:center;font-size:24px;margin:2px 0 4px}
  .intro-doc .isub{text-align:center;color:var(--ouro);font-size:12.5px;letter-spacing:2px;
    text-transform:uppercase;margin-bottom:4px}
  .intro-doc .orn{text-align:center;color:var(--ouro2);font-size:18px;margin:2px 0 20px}
  .intro-doc h4{font-family:'Playfair Display',serif;font-weight:700;color:var(--navy);
    font-variant:small-caps;letter-spacing:.5px;font-size:18px;margin:20px 0 6px;
    border-bottom:1px solid var(--linha);padding-bottom:3px}
  .intro-doc p{margin:0 0 12px}
  .intro-doc .fonte{margin-top:26px;text-align:center;color:var(--tinta2);font-size:12px;font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="topbar" style="display:none">
    <button class="voltar" onclick="voltar()">‹</button>
    <div class="tit" id="topTit">Bíblia<small id="topSub">Almeida R.C.</small></div>
    <div class="sp"></div>
  </div>

  <!-- CAPA -->
  <div id="capa" class="on">
    <img src="/biblioteca/biblias/biblia-icone2.png" class="capa-img" alt="Bíblia Sagrada">
    <div class="nome-b">Bíblias de Estudo</div>
    <div class="sub-b">64 bíblias · toque para escolher e ler</div>
    <button class="btn-abrir" onclick="verBiblias()">Ver as Bíblias</button>
  </div>

  <!-- ESCOLHER BÍBLIA -->
  <div id="escolha" class="tela"></div>

  <!-- ÍNDICE DE LIVROS -->
  <div id="indice" class="tela"></div>

  <!-- CAPÍTULOS -->
  <div id="caps" class="tela">
    <div id="introSlot"></div>
    <div class="test-tit" id="capsTit">Capítulos</div>
    <div id="capsGrade"></div>
  </div>

  <!-- LEITURA -->
  <div id="leitura" class="tela"></div>

  <!-- INTRODUÇÃO DO LIVRO -->
  <div id="introView" class="tela"></div>
</div>

<!-- PAINEL DA NOTA (por cima, não move o texto) -->
<div id="notaModal" onclick="if(event.target===this)fecharNota()">
  <div class="nota-card">
    <div class="nota-head"><span id="notaRef">Nota</span><button class="nota-x" onclick="fecharNota()">✕</button></div>
    <div class="nota-scroll" id="notaScroll"><div id="notaCorpo"></div></div>
  </div>
</div>

<script>
const NOMES=["Gênesis","Êxodo","Levítico","Números","Deuteronômio","Josué","Juízes","Rute","1 Samuel","2 Samuel","1 Reis","2 Reis","1 Crônicas","2 Crônicas","Esdras","Neemias","Ester","Jó","Salmos","Provérbios","Eclesiastes","Cânticos","Isaías","Jeremias","Lamentações","Ezequiel","Daniel","Oseias","Joel","Amós","Obadias","Jonas","Miqueias","Naum","Habacuque","Sofonias","Ageu","Zacarias","Malaquias","Mateus","Marcos","Lucas","João","Atos","Romanos","1 Coríntios","2 Coríntios","Gálatas","Efésios","Filipenses","Colossenses","1 Tessalonicenses","2 Tessalonicenses","1 Timóteo","2 Timóteo","Tito","Filemom","Hebreus","Tiago","1 Pedro","2 Pedro","1 João","2 João","3 João","Judas","Apocalipse"];
let BIB=null, NOTAS=null, FONTE_NOTAS='', BIBLIAS=[], liv=0, cap=0;
let INTROS={}, SUBS={};

function mostrar(id){
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('on'));
  document.getElementById('capa').classList.remove('on');
  document.getElementById('topbar').style.display = id==='capa' ? 'none':'flex';
  if(id==='capa'){document.getElementById('capa').classList.add('on');}
  else document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}
async function garantir(){
  if(BIB) return BIB;
  const r=await fetch('/biblia.json'); BIB=await r.json();
  try{ const rb=await fetch('/biblioteca/biblias/bibles.json'); BIBLIAS=(await rb.json()).biblias||[]; }catch(e){ BIBLIAS=[]; }
  return BIB;
}
async function verBiblias(){ await garantir(); renderEscolha(); mostrar('escolha');
  document.getElementById('topTit').innerHTML='Bíblias<small>escolha uma</small>'; }
function renderEscolha(){
  var box=document.getElementById('escolha');
  box.innerHTML='<div class="test-tit">Bíblias de Estudo</div>'+BIBLIAS.map(function(b,i){
    var nm=b.nome.replace(/^[\s\-]+/,'');
    return '<div class="bcell" onclick="escolherBiblia('+i+')"><div class="ic">✝</div>'
      +'<div style="flex:1;min-width:0"><div class="bnome">'+nm+'</div>'
      +'<div class="btag '+(b.temNotas?'ok':'no')+'">'+(b.temNotas?'✦ com notas de estudo':'texto bíblico · notas em breve')+'</div></div>'
      +'<div style="color:var(--tinta2);font-size:20px">›</div></div>';
  }).join('');
}
async function escolherBiblia(i){
  var b=BIBLIAS[i]; FONTE_NOTAS=b.temNotas?(b.fonte||'Bíblia de Estudo'):''; window._bibleFonte=FONTE_NOTAS; NOTAS={}; INTROS={}; SUBS={};
  if(b.temNotas){
    try{ const rn=await fetch('/biblioteca/biblias/notas-'+b.id+'.json'); NOTAS=await rn.json(); }catch(e){ NOTAS={}; }
    try{ const ri=await fetch('/biblioteca/biblias/intros-'+b.id+'.json'); INTROS=await ri.json(); }catch(e){ INTROS={}; }
    try{ const rs=await fetch('/biblioteca/biblias/subtitulos-'+b.id+'.json'); SUBS=await rs.json(); }catch(e){ SUBS={}; }
  }
  window._bibleNome=b.nome.replace(/^[\s\-]+/,'');
  irIndice();
}
function fmtNota(txt){
  // "1.1 NO PRINCÍPIO, CRIOU DEUS. corpo..." -> lema em destaque
  var m=txt.match(/^\d+\.\d+\s+(.+?)\.\s+([\s\S]+)$/);
  if(m) return '<span class="lem">'+m[1]+'.</span> '+m[2];
  return txt.replace(/^\d+\.\d+\s+/,'');
}
function abrirNota(chap,verse){
  var ab=window._curAb;
  var txt=(NOTAS&&NOTAS[ab]&&NOTAS[ab][chap]&&NOTAS[ab][chap][verse])||'';
  if(!txt) return;
  document.getElementById('notaRef').textContent=NOMES[liv]+' '+chap+'.'+verse;
  document.getElementById('notaCorpo').innerHTML=fmtNota(txt)+'<span class="fnt">📖 '+(FONTE_NOTAS||'Notas de estudo')+'</span>';
  document.getElementById('notaModal').classList.add('on');
  document.getElementById('notaScroll').scrollTop=0;
}
function fecharNota(){ document.getElementById('notaModal').classList.remove('on'); }
async function irIndice(){
  await garantir(); renderIndice(); mostrar('indice');
  document.getElementById('topTit').innerHTML=(window._bibleNome||'Bíblia')+'<small>Almeida R.C.</small>';
}
function renderIndice(){
  const box=document.getElementById('indice');
  function grupo(tit,ini,fim){
    let h='<div class="test-tit">'+tit+'</div><div class="grade">';
    for(let i=ini;i<fim;i++){
      h+='<div class="liv" onclick="abrirLivro('+i+')"><div class="n">'+(i+1)+'</div><div class="nm">'+NOMES[i]+'</div></div>';
    }
    return h+'</div>';
  }
  box.innerHTML=grupo('Antigo Testamento',0,39)+grupo('Novo Testamento',39,66);
}
function abrirLivro(i){
  liv=i;
  const caps=BIB[i].chapters.length;
  const ab=BIB[i].abbrev;
  document.getElementById('capsTit').textContent=NOMES[i];
  document.getElementById('topTit').innerHTML=NOMES[i]+'<small>escolha o capítulo</small>';
  var slot=document.getElementById('introSlot');
  if(INTROS && INTROS[ab]){
    slot.innerHTML='<div class="introbtn" onclick="abrirIntro()">'
      +'<div class="ib-ic">✦</div>'
      +'<div><div class="ib-tt">Introdução ao livro</div>'
      +'<div class="ib-sb">Autor · data · tema · esboço — '+(window._bibleFonte||'Bíblia de Estudo')+'</div></div>'
      +'<div class="ib-ar">›</div></div>';
  } else slot.innerHTML='';
  let h='';
  for(let c=0;c<caps;c++) h+='<div class="cap" onclick="lerCap('+c+')">'+(c+1)+'</div>';
  document.getElementById('capsGrade').innerHTML=h;
  mostrar('caps');
}
function abrirIntro(){
  var ab=BIB[liv].abbrev;
  var html=(INTROS&&INTROS[ab])||'';
  if(!html) return;
  document.getElementById('introView').innerHTML=
    '<div class="intro-doc">'
    +'<div class="isub">Introdução</div>'
    +'<h2 class="ititulo">'+NOMES[liv]+'</h2>'
    +'<div class="orn">❦</div>'
    +html
    +'<div class="fonte">📖 '+(window._bibleFonte||'Bíblia de Estudo')+'</div>'
    +'</div>';
  document.getElementById('topTit').innerHTML=NOMES[liv]+'<small>introdução</small>';
  mostrar('introView');
}
function lerCap(c){
  cap=c;
  const versos=BIB[liv].chapters[c];
  const ab=BIB[liv].abbrev;
  const notasCap=(NOTAS&&NOTAS[ab]&&NOTAS[ab][c+1])||{};
  const subsCap=(SUBS&&SUBS[ab]&&SUBS[ab][c+1])||{};
  const temNotasLivro=!!(NOTAS&&NOTAS[ab]);
  window._curAb=ab;
  let corpo='';
  for(let v=0;v<versos.length;v++){
    const vn=v+1;
    if(subsCap[vn]) corpo+='<span class="secao"><span class="orn">❦</span>'+subsCap[vn]+'</span>';
    corpo+='<span class="v"><span class="vn">'+vn+'</span>'+versos[v];
    if(notasCap[vn]) corpo+=' <span class="notemk" onclick="abrirNota('+(c+1)+','+vn+')">✦ nota</span>';
    corpo+=' </span>';
  }
  const total=BIB[liv].chapters.length;
  document.getElementById('leitura').innerHTML=
    '<div class="cabec"><h2>'+NOMES[liv]+'</h2><div class="cap-n">Capítulo '+(c+1)+'</div><div class="orn">❦</div></div>'
    +'<div class="vtexto">'+corpo+'</div>'
    +(temNotasLivro?'<div class="creditos">Notas de estudo: '+(window._bibleFonte||FONTE_NOTAS)+' — toque em “✦ nota”</div>':'')
    +'<div class="navcap">'
    +'<button onclick="lerCap('+(c-1)+')" '+(c<=0?'disabled':'')+'>‹ Anterior</button>'
    +'<div class="meio">'+(c+1)+' / '+total+'</div>'
    +'<button onclick="lerCap('+(c+1)+')" '+(c>=total-1?'disabled':'')+'>Próximo ›</button>'
    +'</div>';
  document.getElementById('topTit').innerHTML=NOMES[liv]+'<small>capítulo '+(c+1)+'</small>';
  try{localStorage.setItem('biblia_pos',JSON.stringify({liv:liv,cap:c}));}catch(e){}
  mostrar('leitura');
}
function voltar(){
  if(document.getElementById('notaModal').classList.contains('on')){ fecharNota(); return; }
  const leOn=document.getElementById('leitura').classList.contains('on');
  const capOn=document.getElementById('caps').classList.contains('on');
  const indOn=document.getElementById('indice').classList.contains('on');
  const escOn=document.getElementById('escolha').classList.contains('on');
  const introOn=document.getElementById('introView').classList.contains('on');
  if(introOn) abrirLivro(liv);
  else if(leOn) abrirLivro(liv);
  else if(capOn) irIndice();
  else if(indOn) verBiblias();
  else if(escOn) mostrar('capa');
  else location.href='/?mod=manuais';
}
</script>
