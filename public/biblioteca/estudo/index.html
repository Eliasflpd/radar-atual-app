<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Estudo — RADAR</title>
<style>
  :root{--branco:#fff;--texto:#1c2230;--navy:#0f3d5c;--teal:#0f6d78;--dourado:#a9791c;--vinho:#8a1c1c;--linha:#e4e7ec}
  *{box-sizing:border-box;-webkit-text-size-adjust:100%}
  html{font-size:17px}
  body{margin:0 auto;max-width:860px;background:var(--branco);color:var(--texto);
    font-family:'Segoe UI',system-ui,Arial,sans-serif;line-height:1.6;
    padding:16px 13px calc(48px + env(safe-area-inset-bottom))}
  .voltar{display:inline-block;margin:0 0 14px;background:#1c2230;color:#fff;border:none;border-radius:999px;padding:9px 17px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer}
  .selo{text-align:center;color:var(--teal);font-size:.8rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
  h1{font-family:Georgia,serif;text-align:center;color:var(--navy);font-size:1.9rem;font-weight:800;margin:2px 0 6px}
  .sub{text-align:center;color:#6b7280;font-size:.98rem;margin-bottom:18px}
  .cad{max-width:420px;margin:26px auto;background:#f2f7f8;border:1px solid #d5e6e8;border-radius:16px;padding:22px 18px;text-align:center}
  .cad .lock{font-size:44px;margin-bottom:6px}
  .cad p{color:#4b5563;font-size:.95rem;margin:6px 0 14px}
  .cad input{width:100%;padding:13px 14px;border:1.5px solid var(--linha);border-radius:12px;font-size:1.05rem;font-family:inherit;text-align:center}
  .cad button{width:100%;margin-top:12px;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:13px;font-size:1.05rem;font-weight:800;font-family:inherit;cursor:pointer}
  .cad .rem{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;font-size:.9rem;color:#4b5563}
  .erro{color:var(--vinho);font-weight:700;margin-top:12px;min-height:1.2em}
  .lista{display:none}
  .busca{position:sticky;top:0;z-index:5;background:var(--branco);padding:4px 0 10px}
  .busca input{width:100%;padding:12px 15px;border:1.5px solid var(--linha);border-radius:12px;font-size:1.02rem;font-family:inherit}
  .grupo{margin:18px 0 8px;display:flex;align-items:center;gap:9px}
  .grupo .capa-au{width:38px;height:52px;border-radius:6px;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.18);flex-shrink:0;background:linear-gradient(135deg,var(--navy),var(--dourado))}
  .grupo .nm{font-family:Georgia,serif;font-weight:800;color:var(--navy);font-size:1.15rem}
  .grupo .qt{color:#9aa1ad;font-size:.82rem;font-weight:700}
  .livro{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer;box-shadow:0 2px 8px rgba(15,61,92,.05)}
  .livro .ic{width:44px;height:58px;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,var(--navy),var(--dourado));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .livro .tt{font-family:Georgia,serif;font-weight:800;color:var(--navy);font-size:1.05rem;line-height:1.25}
  .livro .au{color:var(--dourado);font-weight:700;font-size:.8rem}
  .nada{text-align:center;color:#9aa1ad;padding:30px 0}
  .btmotor{width:100%;margin:2px 0 8px;background:linear-gradient(135deg,var(--teal),var(--navy));color:#fff;border:none;border-radius:12px;padding:12px;font-size:1rem;font-weight:800;font-family:inherit;cursor:pointer}
  .hit{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:12px 13px;margin-bottom:9px;cursor:pointer}
  .hit .meta{font-size:.8rem;font-weight:800;color:var(--teal)}
  .hit .meta b{color:var(--navy)}
  .hit .sn{font-size:.95rem;color:#333;line-height:1.5;margin-top:4px}
  .hit .sn mark{background:#fdeec2;color:#000;font-weight:700}
  .secmotor{font-family:Georgia,serif;font-weight:800;color:var(--navy);font-size:1.05rem;margin:14px 0 8px;border-top:1px solid var(--linha);padding-top:12px}
  .carregando{text-align:center;color:var(--teal);font-weight:700;padding:18px}
  #leitor{display:none}
  .barra{position:sticky;top:0;background:#fff;padding:8px 0;border-bottom:1px solid var(--linha);display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .barra button{background:#eef2f4;border:1px solid var(--linha);border-radius:10px;padding:7px 12px;font-weight:700;font-family:inherit;cursor:pointer}
  .barra .tit{flex:1;font-family:Georgia,serif;font-weight:800;color:var(--navy);font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #texto{word-wrap:break-word;font-family:Georgia,serif;font-size:1.02rem;line-height:1.7;color:#1c2230}
  #texto .par{margin:0 0 13px;text-align:justify;text-justify:inter-word;-webkit-hyphens:auto;hyphens:auto}
  #texto .cap{font-family:Georgia,serif;font-weight:800;color:var(--navy);font-size:1.18rem;text-align:center;margin:22px 0 12px;padding-top:6px}
  #texto .rosto{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 10px}
  #texto .rosto .rt{font-family:Georgia,serif;font-weight:800;color:var(--navy);font-size:1.9rem;line-height:1.25}
  #texto .rosto .ra{color:var(--dourado);font-weight:800;font-size:1.05rem;margin-top:12px;text-transform:uppercase;letter-spacing:1px}
  #texto .rosto .rl{width:70px;height:3px;background:var(--dourado);border-radius:3px;margin-top:18px}
  .idx-ov{position:fixed;inset:0;z-index:50;background:rgba(15,61,92,.5)}
  .idx-cx{position:absolute;left:0;right:0;bottom:0;max-width:860px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;max-height:82vh;display:flex;flex-direction:column}
  .idx-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--linha);font-family:Georgia,serif;font-weight:800;color:var(--navy);font-size:1.15rem}
  .idx-top button{background:#eef2f4;border:none;border-radius:9px;width:32px;height:32px;font-size:16px;cursor:pointer}
  .idx-lista{overflow-y:auto;padding:6px 0}
  .idx-it{display:flex;justify-content:space-between;gap:10px;padding:12px 18px;border-bottom:1px solid #f0f2f4;cursor:pointer;color:#1c2230;font-size:1rem}
  .idx-it span{color:#9aa1ad;font-size:.82rem;flex-shrink:0}
  .pagbar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:center;gap:14px;background:#fff;border-top:1px solid var(--linha);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:10px}
  .pagbar button{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:1.1rem;font-weight:800;cursor:pointer}
  .pagbar button:disabled{opacity:.35}
  .pagbar span{font-weight:700;color:#4b5563;min-width:70px;text-align:center}
  .aviso{text-align:center;color:#9aa1ad;font-size:.82rem;margin-top:20px;border-top:1px solid var(--linha);padding-top:12px}
</style>
</head>
<body>
  <button class="voltar" onclick="if(history.length>1){history.back()}else{location.href='/?mod=manuais'}">← Biblioteca</button>
  <div class="selo">✦ Privado · só você ✦</div>
  <h1>Meu Estudo</h1>
  <div class="sub">Seus comentários, trancados com a sua senha</div>

  <!-- CADEADO -->
  <div class="cad" id="cad">
    <div class="lock">🔒</div>
    <p>Estes livros ficam <b>criptografados</b> — sem a sua senha, ninguém lê. Digite pra abrir:</p>
    <input id="senha" type="password" placeholder="sua senha" autocomplete="off" enterkeyhint="go">
    <button id="btn" onclick="abrir()">Abrir meu estudo</button>
    <label class="rem"><input type="checkbox" id="lembrar" checked> Lembrar neste celular</label>
    <div class="erro" id="erro"></div>
  </div>

  <!-- LISTA DE LIVROS -->
  <div class="lista" id="lista"></div>

  <!-- LEITOR -->
  <div id="leitor">
    <div class="barra">
      <button onclick="fecharLivro()">← Livros</button>
      <div class="tit" id="ltit"></div>
      <button onclick="abrirIndice()" title="Índice">📑</button>
      <button onclick="fonte(-1)">A−</button>
      <button onclick="fonte(1)">A+</button>
    </div>
    <div id="texto"></div>
    <div class="pagbar"><button id="pg-ant" onclick="irPag(-1)">◀</button><span id="pag-ind">—</span><button id="pg-prox" onclick="irPag(1)">▶</button></div>
  </div>

<script>
let SENHA=null, MANIFEST=null, FS=parseInt(localStorage.getItem('estudo_fs')||'17',10);
const $=id=>document.getElementById(id);

document.addEventListener('DOMContentLoaded',()=>{
  const salva=localStorage.getItem('estudo_pass');
  if(salva){ $('senha').value=salva; abrir(); }
  $('senha').addEventListener('keydown',e=>{ if(e.key==='Enter') abrir(); });
});

async function deriveKey(pass, salt, iter){
  const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
}

async function decifrar(arquivo){
  const buf=new Uint8Array(await (await fetch(arquivo,{cache:'force-cache'})).arrayBuffer());
  const salt=buf.slice(0,16), iv=buf.slice(16,28), ct=buf.slice(28);
  const key=await deriveKey(SENHA, salt, MANIFEST.iter);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder('utf-8').decode(pt);
}

async function abrir(){
  const s=$('senha').value.trim();
  if(!s){ $('erro').textContent='Digite a senha.'; return; }
  $('btn').textContent='Abrindo…'; $('erro').textContent='';
  try{
    if(!MANIFEST) MANIFEST=await (await fetch('estudo-manifest.json')).json();
    // testa a senha decifrando o 1º livro (só o começo)
    SENHA=s;
    await decifrar(MANIFEST.livros[0].arquivo);   // se a senha estiver errada, lança erro
    if($('lembrar').checked) localStorage.setItem('estudo_pass', s); else localStorage.removeItem('estudo_pass');
    mostrarLista();
  }catch(e){
    SENHA=null; localStorage.removeItem('estudo_pass');
    $('erro').textContent='Senha errada. Tente de novo.';
  }
  $('btn').textContent='Abrir meu estudo';
}

function capaDe(autor){ return (MANIFEST.capas&&MANIFEST.capas[autor])||''; }
function thumb(l){
  const c=capaDe(l.autor);
  return c ? `<img class="ic" src="${c}" loading="lazy" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment('<div class=ic>📖</div>').firstChild)">`
           : `<div class="ic">📖</div>`;
}
function mostrarLista(){
  $('cad').style.display='none'; $('leitor').style.display='none';
  const L=$('lista'); L.style.display='block';
  const total=MANIFEST.livros.length;
  L.innerHTML=
    `<div class="busca"><input id="q" placeholder="🔎 Buscar livro, autor, tema ou versículo (ex: Rm 8:28)…" autocomplete="off" enterkeyhint="search"></div>
     <div id="motor"></div>
     <div id="resultados"></div>
     <div class="aviso">${total} livros · trancado com a sua senha · <a href="#" onclick="sair();return false" style="color:#8a1c1c">sair/bloquear</a></div>`;
  $('q').addEventListener('input',e=>renderLista(e.target.value));
  $('q').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.value.trim().length>=2) buscarConteudo(e.target.value.trim()); });
  renderLista('');
}
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
const ETOKEN='radar-elias-2026';
function renderLista(qraw){
  const R=$('resultados'); if(!R) return;
  const M=$('motor'); if(M) M.innerHTML='';   // limpa resultados do motor ao digitar
  const termo=(qraw||'').trim();
  const q=norm(qraw);
  // botão do motor (busca dentro do conteúdo) quando há termo
  const btn = termo.length>=2
    ? `<button class="btmotor" onclick="buscarConteudo('${termo.replace(/'/g,"\\'")}')">🔎 Buscar “${termo}” DENTRO de todos os livros →</button>` : '';
  const livros=q ? MANIFEST.livros.filter(l=>norm(l.titulo).includes(q)||norm(l.autor).includes(q)) : MANIFEST.livros;
  if(!livros.length){ R.innerHTML=btn+'<div class="nada">Nenhum título/autor com esse nome. Tente buscar dentro dos livros ↑</div>'; return; }
  R.innerHTML=btn+renderGrupos(livros); return;
}
function renderGrupos(livros){
  // agrupa por autor, preservando a ordem
  const grupos={}, ordem=[];
  for(const l of livros){ if(!grupos[l.autor]){grupos[l.autor]=[];ordem.push(l.autor);} grupos[l.autor].push(l); }
  return ordem.map(au=>{
    const c=capaDe(au);
    const cap=c?`<img class="capa-au" src="${c}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">`:`<div class="capa-au"></div>`;
    const itens=grupos[au].map(l=>
      `<div class="livro" onclick="abrirLivro('${l.slug}')">${thumb(l)}
         <div><div class="tt">${l.titulo}</div><div class="au">${l.autor}</div></div></div>`).join('');
    return `<div class="grupo">${cap}<div><div class="nm">${au}</div><div class="qt">${grupos[au].length} livro(s)</div></div></div>${itens}`;
  }).join('');
}

// ==== MOTOR: busca dentro do conteúdo de TODOS os livros ====
function escapeH(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function realce(sn){ return escapeH(sn).replace(/«/g,'<mark>').replace(/»/g,'</mark>'); }
async function buscarConteudo(termo){
  const M=$('motor'); if(!M) return;
  M.innerHTML='<div class="carregando">🔎 Procurando em todos os livros…</div>';
  try{
    const r=await fetch('/api/estudo-busca?token='+ETOKEN+'&q='+encodeURIComponent(termo));
    const d=await r.json();
    if(!d.ok){ M.innerHTML='<div class="nada">O motor não respondeu agora. Tente de novo.</div>'; return; }
    if(!d.total){ M.innerHTML=`<div class="secmotor">Dentro dos livros: “${escapeH(termo)}”</div><div class="nada">Nada encontrado no conteúdo.</div>`; return; }
    const tit = d.modo==='versiculo'
      ? `🕸️ O que cada autor diz sobre <b>${escapeH(d.ref||termo)}</b> · ${d.total}`
      : `📚 “${escapeH(termo)}” dentro dos livros · ${d.total}`;
    const hits=d.itens.map((it,i)=>{
      const alvo=(it.snippet||'').replace(/[«»]/g,'').slice(0,60).replace(/'/g,"\\'");
      const ref=it.ref?` · ${escapeH(it.ref)}`:'';
      return `<div class="hit" onclick="abrirEmTrecho('${it.slug}','${alvo}')">
        <div class="meta"><b>${escapeH(it.livro||it.titulo)}</b> — ${escapeH(it.autor)}${ref}</div>
        <div class="sn">${realce(it.snippet)}…</div></div>`;
    }).join('');
    M.innerHTML=`<div class="secmotor">${tit}</div>${hits}`;
    M.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){ M.innerHTML='<div class="nada">Sem conexão com o motor agora.</div>'; }
}
let _alvoTrecho=null;
function abrirEmTrecho(slug,alvo){ _alvoTrecho=alvo? norm(alvo):null; abrirLivro(slug); }

let _paginas=[], _pag=0;
let _indice=[];
// Limpa o lixo de OCR, junta linhas em parágrafos, detecta títulos de seção.
function limparEstruturar(md, titulo, autor){
  const linhas=md.split(/\r?\n/); const blocos=[]; let para='';
  function fechaPara(){ if(para.trim()) blocos.push({t:'p',x:para.replace(/\s+/g,' ').trim()}); para=''; }
  for(const raw of linhas){
    const t=raw.trim();
    if(!t){ fechaPara(); continue; }
    if(t[0]==='>') continue;                              // metadata do topo
    if(/^#\s/.test(t)) continue;                          // título markdown (mostrado no rosto)
    if(t.length<=16 && /^[\d\W_]+$/.test(t)) continue;    // lixo: "278 !170401", símbolos soltos
    if(/^[\dIVXLC]{1,5}\s*$/.test(t)) continue;           // número de página solto
    const ehTitulo = (t.length>=3 && t.length<=68 && t===t.toUpperCase() && /[A-ZÁÉÍÓÚÂÊÔÃÕÇ]{3}/.test(t) && !/\.{2,}/.test(t))
                  || (t.length<=45 && /^[A-ZÁÉÍÓÚÂÊÔÃÕÇ]/.test(t) && /^(CAP[IÍ]TULO|CAP\.\s|ESBO[ÇC]O|INTRODU[ÇC][ÃA]O|CONCLUS[ÃA]O|PREF[ÁA]CIO|AP[ÊE]NDICE)\b/i.test(t));
    if(ehTitulo){ fechaPara(); blocos.push({t:'h',x:t}); }
    else para+=(para?' ':'')+t;
  }
  fechaPara();
  blocos.unshift({t:'rosto', x:titulo, autor:autor});     // página de rosto profissional
  return blocos;
}
function paginarBlocos(blocos, tam){
  const pgs=[]; let cur=[], len=0;
  for(const b of blocos){
    const bl=(b.x||'').length+40;
    if(len+bl>tam && cur.length){ pgs.push(cur); cur=[]; len=0; }
    cur.push(b); len+=bl;
    if(b.t==='rosto'){ pgs.push(cur); cur=[]; len=0; }     // rosto sozinho na 1ª página
  }
  if(cur.length) pgs.push(cur);
  return pgs.length?pgs:[[{t:'p',x:''}]];
}
async function abrirLivro(slug){
  const l=MANIFEST.livros.find(x=>x.slug===slug);
  $('lista').style.display='none';
  $('leitor').style.display='block';
  $('ltit').textContent=l.titulo+' · '+l.autor;
  $('texto').textContent='Descriptografando… (uns segundos, é grande)';
  $('pag-ind').textContent='—';
  window.scrollTo(0,0);
  await new Promise(r=>setTimeout(r,50));
  try{
    const md=await decifrar(l.arquivo);
    const blocos=limparEstruturar(md, l.titulo, l.autor);
    _paginas=paginarBlocos(blocos, 3000);
    _indice=[]; _paginas.forEach((pg,i)=>pg.forEach(b=>{ if(b.t==='h') _indice.push({titulo:b.x, pag:i}); }));
    _pag=0;
    if(_alvoTrecho){
      const alvo=_alvoTrecho; _alvoTrecho=null;
      const idx=_paginas.findIndex(pg=>norm(pg.map(b=>b.x||'').join(' ')).includes(alvo));
      if(idx>=0) _pag=idx;
    }
    renderPagina();
  }catch(e){ $('texto').textContent='Erro ao abrir. Volte e tente de novo.'; }
}
function renderPagina(){
  $('texto').style.fontSize=FS+'px';
  const pg=_paginas[_pag]||[];
  $('texto').innerHTML=pg.map(function(b){
    if(b.t==='rosto') return '<div class="rosto"><div class="rt">'+escapeH(b.x)+'</div><div class="ra">'+escapeH(b.autor||'')+'</div><div class="rl"></div></div>';
    if(b.t==='h') return '<div class="cap">'+escapeH(b.x)+'</div>';
    return '<p class="par">'+escapeH(b.x)+'</p>';
  }).join('');
  $('pag-ind').textContent=(_pag+1)+' / '+_paginas.length;
  $('pg-ant').disabled=_pag<=0;
  $('pg-prox').disabled=_pag>=_paginas.length-1;
  window.scrollTo(0,0);
}
function irPag(d){ if(!_paginas.length)return; _pag=Math.max(0,Math.min(_paginas.length-1,_pag+d)); renderPagina(); }
function abrirIndice(){
  if(!_indice.length){ alert('Este livro não tem seções detectadas para índice.'); return; }
  let ov=$('idx-ov'); if(!ov){ ov=document.createElement('div'); ov.id='idx-ov'; document.body.appendChild(ov); }
  ov.className='idx-ov';
  ov.innerHTML='<div class="idx-cx"><div class="idx-top">📑 Índice<button onclick="document.getElementById(\'idx-ov\').remove()">✕</button></div><div class="idx-lista">'
    + _indice.map(function(it){ return '<div class="idx-it" onclick="irIndice('+it.pag+')">'+escapeH(it.titulo)+'<span>pág. '+(it.pag+1)+'</span></div>'; }).join('')
    + '</div></div>';
}
function irIndice(p){ _pag=p; renderPagina(); const o=$('idx-ov'); if(o)o.remove(); }

function fecharLivro(){ $('leitor').style.display='none'; $('lista').style.display='block'; _paginas=[]; window.scrollTo(0,0); }
function fonte(d){ FS=Math.max(13,Math.min(26,FS+d)); localStorage.setItem('estudo_fs',FS); if(_paginas.length) renderPagina(); else $('texto').style.fontSize=FS+'px'; }
function sair(){ SENHA=null; localStorage.removeItem('estudo_pass'); location.reload(); }
</script>
</body>
</html>
