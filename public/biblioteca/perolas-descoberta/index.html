<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pérolas Descoberta — RADAR</title>
<!--
  PÉROLAS DESCOBERTA (antes 'Estudos MARIA') — a coleção de estudos do Elias (pasta D:\MEUS ESTUDOS\MARIA), SÓ TEXTO,
  no mesmo padrão visual das lições da EBD (Georgia 21px, título vinho, cabeçalhos azuis,
  caixas de texto bíblico, referências clicáveis que abrem o versículo).
  Por que tem cadeado: é material com direitos autorais e o repositório do RADAR é público.
  O texto fica CIFRADO em dados/<estudo>/texto.enc (AES-256-GCM) e só abre com a senha do
  Elias — a mesma do Meu Estudo (reaproveitamos localStorage.estudo_pass: quem já abriu o
  Meu Estudo entra aqui sem digitar nada). Um salt pro módulo inteiro (manifest.json): a
  chave é derivada uma vez. Formato de cada .enc: [iv 12][ciphertext+tag].
  Gerado por scripts/estudos-maria/cifrar.mjs a partir de _estudos-maria-trabalho/ (gitignored).
-->
<style>
  *{box-sizing:border-box;-webkit-text-size-adjust:100%}
  body{box-sizing:border-box;margin:0;padding:12px 7px 56px;background:#fff;font-family:Georgia,serif;font-size:var(--fs,21px);line-height:1.6;color:#1a1a1a;max-width:860px;margin:0 auto}
  p{margin:0 0 12px}
  strong{font-weight:900}
  /* ── cabeçalho da página / navegação (mesma cara do Meu Estudo) ── */
  .voltar{display:inline-block;margin:0 0 14px;background:#1c2230;color:#fff;border:none;border-radius:999px;padding:9px 17px;font-size:16px;font-weight:700;font-family:'Segoe UI',system-ui,sans-serif;cursor:pointer}
  .selo{text-align:center;color:#0f6d78;font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;font-family:'Segoe UI',system-ui,sans-serif}
  h1{text-align:center;color:#7b0000;font-size:25px;font-weight:900;margin:2px 0 6px;line-height:1.3}
  .sub{text-align:center;color:#888;font-size:16px;font-weight:600;margin-bottom:18px;font-family:'Segoe UI',system-ui,sans-serif}
  .cad{max-width:420px;margin:26px auto;background:#f2f7f8;border:1px solid #d5e6e8;border-radius:16px;padding:22px 18px;text-align:center;font-family:'Segoe UI',system-ui,sans-serif;font-size:16px}
  .cad .lock{font-size:44px;margin-bottom:6px}
  .cad p{color:#4b5563;margin:6px 0 14px}
  .cad input{width:100%;padding:13px 14px;border:1.5px solid #e4e7ec;border-radius:12px;font-size:18px;font-family:inherit;text-align:center}
  .cad button{width:100%;margin-top:12px;background:#0f3d5c;color:#fff;border:none;border-radius:12px;padding:13px;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer}
  .cad .rem{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;font-size:15px;color:#4b5563}
  .erro{color:#8a1c1c;font-weight:700;margin-top:12px;min-height:1.2em}
  .carregando{text-align:center;color:#0f6d78;font-weight:700;padding:18px;font-family:'Segoe UI',system-ui,sans-serif;font-size:16px}
  /* ── lista de estudos e de capítulos (como a lista de lições da EBD) ── */
  .lista,.caps{display:none}
  .item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer;box-shadow:0 2px 8px rgba(15,61,92,.06);font-family:'Segoe UI',system-ui,sans-serif}
  .item:active{background:#f7fafb}
  .item .num{width:40px;height:40px;border-radius:10px;background:#f0f4ff;color:#1d3a8a;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
  .item .tt{font-family:Georgia,serif;font-weight:800;color:#1d3a8a;font-size:17px;line-height:1.25}
  .item .au{color:#7a4e00;font-weight:700;font-size:13px;margin-top:2px}
  .item .qt{color:#9aa1ad;font-size:12px;margin-top:2px}
  .item .chev{margin-left:auto;color:#c9a14a;font-size:22px;font-weight:700;flex-shrink:0}
  .grupo-h{color:#1d3a8a;font-size:14px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin:20px 0 8px;padding:8px 0 0;border-top:1px solid #eaeaea;font-family:'Segoe UI',system-ui,sans-serif}
  .busca{position:sticky;top:0;z-index:5;background:#fff;padding:4px 0 10px}
  .busca input{width:100%;padding:11px 14px;border:1.5px solid #e4e7ec;border-radius:12px;font-size:16px;font-family:'Segoe UI',system-ui,sans-serif}
  .aviso{text-align:center;color:#9aa1ad;font-size:13px;margin:22px 0 0;font-family:'Segoe UI',system-ui,sans-serif}
  /* ── barra do leitor ── */
  #leitor{display:none}
  .barra{position:sticky;top:0;z-index:5;background:#fff;display:flex;gap:6px;align-items:center;padding:6px 0 8px;border-bottom:1px solid #eaeaea;margin-bottom:6px;font-family:'Segoe UI',system-ui,sans-serif}
  .barra button{background:#eef2f4;border:1px solid #e4e7ec;border-radius:9px;padding:7px 10px;font-weight:800;font-family:inherit;cursor:pointer;font-size:14px;white-space:nowrap}
  .barra .esp{flex:1}
  .prog{height:4px;background:#eef1f4;border-radius:3px;overflow:hidden;margin:0 0 14px}
  .prog i{display:block;height:100%;background:#c9a14a;width:0;transition:width .2s}
  /* ── O TEXTO: exatamente a paleta das lições da EBD ── */
  .titulo{text-align:center;color:#7b0000;font-size:25px;font-weight:900;line-height:1.3;margin:10px 0 2px;padding:0 4px}
  .data{text-align:center;font-size:16px;color:#888;font-weight:600;letter-spacing:.5px;margin-bottom:18px}
  .sec-head{text-align:center;font-size:17px;font-weight:900;color:#1d3a8a;letter-spacing:1.5px;margin:24px 0 10px;padding:10px 0 0;border-top:1px solid #eaeaea;text-transform:uppercase}
  .roman-head{font-weight:900;color:#1d3a8a;font-size:20px;margin:26px 0 6px;padding:10px 12px;background:#f0f4ff;border-left:4px solid #1d3a8a;border-radius:0 6px 6px 0;text-align:left}
  .subpoint{text-align:justify;margin-bottom:12px}
  .box-aureo{background:#fffaf0;border-radius:8px;padding:0 16px 14px;margin:14px 0;font-style:italic;color:#5a3a00;text-align:justify;overflow:hidden}
  .box-aureo .lbl{display:block;font-style:normal;font-size:13px;font-weight:900;color:#7a4e00;letter-spacing:2.5px;text-transform:uppercase;margin:0 -16px 12px;padding:6px 16px;text-align:center;background:rgba(201,161,74,.18);border-bottom:1px solid rgba(201,161,74,.35)}
  .nota{font-size:15px;color:#888;text-align:center;margin:0 0 12px;font-style:italic}
  .bref{color:#1d4ed8;font-weight:700;text-decoration:underline dotted;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  mark{background:#fdeec2;color:#000;font-weight:700;border-radius:3px;padding:0 1px}
  .pagbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 0;font-family:'Segoe UI',system-ui,sans-serif}
  .pagbar button{background:#1d3a8a;color:#fff;border:none;border-radius:12px;padding:12px 18px;font-weight:800;font-family:inherit;font-size:16px;cursor:pointer;min-width:84px}
  .pagbar button:disabled{opacity:.35}
  .pagbar span{color:#6b7280;font-size:14px;text-align:center;font-weight:700}
  .findbar{display:none;gap:7px;align-items:center;margin:0 0 10px;font-family:'Segoe UI',system-ui,sans-serif}
  .findbar.on{display:flex}
  .findbar input{flex:1;min-width:0;padding:9px 12px;border:1.5px solid #e4e7ec;border-radius:10px;font-size:16px;font-family:inherit}
  .findbar button{background:#eef2f4;border:1px solid #e4e7ec;border-radius:9px;padding:8px 11px;font-weight:800;font-family:inherit;cursor:pointer}
  .findbar .cnt{color:#6b7280;font-size:13px;font-weight:700;min-width:52px;text-align:center;flex-shrink:0}
  /* ── ficha do versículo (igual à da EBD) ── */
  #ref-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
  #ref-sheet{display:none;position:fixed;left:0;right:0;bottom:0;max-width:860px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;max-height:78vh;overflow-y:auto;z-index:51;padding:14px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.25)}
  #ref-sheet .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-family:'Segoe UI',system-ui,sans-serif}
  #ref-sheet .top b{color:#1d3a8a;font-size:16px}
  #ref-sheet .top button{background:#eef2f4;border:none;border-radius:9px;width:32px;height:32px;font-size:16px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f3d5c;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92%;text-align:center;font-family:'Segoe UI',system-ui,sans-serif}
  .toast.on{opacity:1}
  body.lendo .voltar,body.lendo .selo,body.lendo h1,body.lendo .sub{display:none}
</style>

<body>
  <button class="voltar" onclick="if(history.length>1){history.back()}else{location.href='/?mod=manuais'}">← Biblioteca</button>
  <div class="selo">✦ Privado · só você ✦</div>
  <h1>PÉROLAS DESCOBERTA</h1>
  <div class="sub">Pérolas de estudo, trancadas com a sua senha</div>

  <div class="cad" id="cad">
    <div class="lock">🔒</div>
    <p>Estes estudos ficam <b>criptografados</b> — sem a sua senha ou o seu PIN, ninguém lê:</p>
    <input id="senha" type="password" placeholder="senha ou PIN" autocomplete="off" enterkeyhint="go">
    <button id="btn" onclick="abrir()">Abrir meus estudos</button>
    <label class="rem"><input type="checkbox" id="lembrar" checked> Lembrar neste celular</label>
    <div class="erro" id="erro"></div>
  </div>

  <div class="lista" id="lista"></div>
  <div class="caps" id="caps"></div>

  <div id="leitor">
    <div class="barra">
      <button onclick="voltarCaps()">← Capítulos</button>
      <span class="esp"></span>
      <button onclick="toggleFind()" title="Buscar neste estudo">🔍</button>
      <button onclick="copiarCapitulo(this)" title="Copiar">📋</button>
      <button onclick="fonte(-1)">A−</button>
      <button onclick="fonte(1)">A+</button>
    </div>
    <div class="findbar" id="findbar">
      <input id="findq" placeholder="Buscar neste estudo…" autocomplete="off" enterkeyhint="search">
      <span class="cnt" id="findcnt">—</span>
      <button onclick="findGo(-1)">◀</button><button onclick="findGo(1)">▶</button><button onclick="toggleFind()">✕</button>
    </div>
    <div class="prog"><i id="progf"></i></div>
    <div id="texto"></div>
    <div class="pagbar"><button id="pg-ant" onclick="irCap(-1)">◀ Anterior</button><span id="pag-ind">—</span><button id="pg-prox" onclick="irCap(1)">Próximo ▶</button></div>
  </div>

  <div id="ref-overlay" onclick="fecharRef()"></div>
  <div id="ref-sheet"><div class="top"><b id="ref-titulo">Referência</b><button onclick="fecharRef()">✕</button></div><div id="ref-body"></div></div>

<script>
/* ═══ CHAVE E CIFRA ═══ */
const $=id=>document.getElementById(id);
let MANIFEST=null, CHAVE=null, FS=parseInt(localStorage.getItem('maria_fs')||'21',10);
document.documentElement.style.setProperty('--fs',FS+'px');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
class FalhaDeRede extends Error{ constructor(m){ super(m); this.name='FalhaDeRede'; } }
// Abre com SENHA ou PIN: o manifest traz a chave de conteúdo "embrulhada" uma vez para cada
// segredo (PBKDF2 + AES-GCM). Tenta cada embrulho com o que foi digitado; o que abrir, abriu.
async function derivar(segredo){
  const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(segredo), 'PBKDF2', false, ['deriveKey']);
  const todos=MANIFEST.embrulhos||[];
  const primeiro=todos.filter(e=>/^\d+$/.test(segredo) ? e.tipo==='pin' : e.tipo!=='pin');
  for(const em of primeiro.concat(todos.filter(e=>!primeiro.includes(e)))){
    try{
      const kw=await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(em.salt), iterations:em.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const buf=b64(em.chave);
      const raw=await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, kw, buf.slice(12));
      return crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['decrypt']);
    }catch(e){ /* não era este embrulho */ }
  }
  throw new Error('senha');
}
async function decifrarTexto(url){
  let r; try{ r=await fetch(url,{cache:'force-cache'}); }catch(e){ throw new FalhaDeRede('sem conexão'); }
  if(!r.ok) throw new FalhaDeRede('servidor devolveu '+r.status);
  const buf=new Uint8Array(await r.arrayBuffer());
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, CHAVE, buf.slice(12));
  return new TextDecoder('utf-8').decode(pt);
}
/* ═══ CADEADO ═══ */
document.addEventListener('DOMContentLoaded',()=>{
  $('senha').addEventListener('keydown',e=>{ if(e.key==='Enter') abrir(); });
  const salva=localStorage.getItem('maria_pass')||localStorage.getItem('estudo_pass');
  if(salva){ $('senha').value=salva; abrir(true); }
  const fq=$('findq'); fq.addEventListener('input',findRun); fq.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); findGo(1); } });
});
async function abrir(silencioso){
  const s=$('senha').value.trim();
  if(!s){ $('erro').textContent='Digite a senha.'; return; }
  $('btn').textContent='Abrindo…'; $('erro').textContent='';
  try{
    if(!MANIFEST) MANIFEST=await (await fetch('manifest.json',{cache:'no-cache'})).json();
    CHAVE=await derivar(s);
    if((await decifrarTexto(MANIFEST.prova))!=='RADAR-ESTUDOS-MARIA-OK') throw new Error('prova');
    if($('lembrar').checked) localStorage.setItem('maria_pass', s); else localStorage.removeItem('maria_pass');
    mostrarLista();
    const q=new URLSearchParams(location.search); if(q.get('e')) abrirEstudo(q.get('e'), q.get('c'));
  }catch(e){
    CHAVE=null;
    if(e instanceof FalhaDeRede) $('erro').textContent='Não foi o seu erro — os estudos não estão respondendo ('+e.message+'). Tente de novo mais tarde.';
    else { localStorage.removeItem('maria_pass'); $('erro').textContent=silencioso?'':'Senha errada. Tente de novo.'; }
  }
  $('btn').textContent='Abrir meus estudos';
}
function sair(){ CHAVE=null; localStorage.removeItem('maria_pass'); location.reload(); }
/* ═══ LISTA DE ESTUDOS ═══ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pos(slug){ try{ return JSON.parse(localStorage.getItem('maria_pos_'+slug)||'{}'); }catch(e){ return {}; } }
function guardarPos(slug,o){ try{ localStorage.setItem('maria_pos_'+slug, JSON.stringify(Object.assign(pos(slug),o))); }catch(e){} }
function mostrarLista(){
  $('cad').style.display='none'; $('leitor').style.display='none'; $('caps').style.display='none'; document.body.classList.remove('lendo');
  const L=$('lista'); L.style.display='block';
  const itens=MANIFEST.estudos.slice().sort((a,b)=>a.ordem-b.ordem);
  L.innerHTML=itens.map((e,i)=>{ const p=pos(e.slug); const lido=p.cap>0?' · parou no cap. '+(p.cap+1):'';
    return '<div class="item" onclick="abrirEstudo(\''+esc(e.slug)+'\')"><div class="num">'+(i+1)+'</div><div><div class="tt">'+esc(e.titulo)+'</div><div class="au">'+esc(e.sub)+'</div><div class="qt">'+e.capitulos+' capítulos'+lido+'</div></div><span class="chev">›</span></div>'; }).join('')
    +'<div class="aviso">'+itens.length+' estudos · trancados com a sua senha · <a href="#" onclick="sair();return false" style="color:#8a1c1c">sair/bloquear</a></div>';
  history.replaceState({},'',location.pathname); window.scrollTo(0,0);
}
/* ═══ CAPÍTULOS ═══ */
let EST=null, TEXTO=null, CAP=0, _findTerm='', _findHits=[], _findAt=-1;
async function abrirEstudo(slug, capInicial){
  const e=MANIFEST.estudos.find(x=>x.slug===slug); if(!e) return;
  EST=e; TEXTO=null; _findTerm=''; _findHits=[]; _findAt=-1;
  $('lista').style.display='none'; $('caps').style.display='block'; $('caps').innerHTML='<div class="carregando">Descriptografando…</div>';
  try{ TEXTO=JSON.parse(await decifrarTexto('dados/'+slug+'/texto.enc')); }
  catch(err){ $('caps').innerHTML='<div class="carregando">Não consegui abrir agora. Volte e tente de novo.</div>'; return; }
  if(capInicial!=null && TEXTO.capitulos[+capInicial]){ CAP=+capInicial; mostrarCap(); return; }
  mostrarCaps();
}
function mostrarCaps(){
  document.body.classList.remove('lendo'); $('leitor').style.display='none'; $('lista').style.display='none';
  const C=$('caps'); C.style.display='block';
  const p=pos(EST.slug);
  let html='<button class="voltar" onclick="mostrarLista()">← Estudos</button><p class="titulo">'+esc(EST.titulo).toUpperCase()+'</p><p class="data">'+esc(EST.sub)+'</p>'
    +'<div class="busca"><input id="q" placeholder="🔎 Filtrar capítulos…" autocomplete="off" oninput="filtrarCaps(this.value)"></div>'
    +(p.cap>0?'<div class="item" onclick="CAP='+p.cap+';mostrarCap()"><div class="num">▶</div><div><div class="tt">Continuar de onde parei</div><div class="au">'+esc(TEXTO.capitulos[p.cap].t)+'</div></div><span class="chev">›</span></div>':'')
    +'<div id="caps-lista"></div>';
  C.innerHTML=html; filtrarCaps(''); history.replaceState({},'',location.pathname+'?e='+encodeURIComponent(EST.slug)); window.scrollTo(0,0);
}
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function filtrarCaps(q){
  const nq=norm(q); let g=null, html='';
  TEXTO.capitulos.forEach((c,i)=>{ if(nq && !norm(c.t+' '+(c.sub||'')+' '+(c.ref||'')).includes(nq)) return;
    if((c.grupo||'')!==g){ g=c.grupo||''; if(g) html+='<div class="grupo-h">'+esc(g)+'</div>'; }
    html+='<div class="item" onclick="CAP='+i+';mostrarCap()"><div class="num">'+(i+1)+'</div><div><div class="tt">'+esc(c.t)+'</div>'+(c.sub||c.ref?'<div class="au">'+esc(c.sub||c.ref)+'</div>':'')+'</div><span class="chev">›</span></div>'; });
  $('caps-lista').innerHTML=html||'<div class="aviso">Nenhum capítulo com esse nome.</div>';
}
function voltarCaps(){ mostrarCaps(); }
/* ═══ LEITURA (paleta da EBD) ═══ */
function _hl(txt){ if(!_findTerm) return txt; try{ const re=new RegExp('('+_findTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); return txt.replace(re,'<mark>$1</mark>'); }catch(e){ return txt; } }
function mostrarCap(){
  const c=TEXTO.capitulos[CAP]; if(!c) return;
  document.body.classList.add('lendo'); $('caps').style.display='none'; $('lista').style.display='none'; $('leitor').style.display='block';
  let html=(c.grupo?'<p class="sec-head">'+esc(c.grupo)+'</p>':'')+'<p class="titulo">'+_hl(esc(c.t)).toUpperCase()+'</p>'+(c.sub||c.ref?'<p class="data">'+refs(esc(c.sub||c.ref))+'</p>':'');
  for(let i=0;i<c.blocos.length;i++){ const b=c.blocos[i];
    const x=refs(_hl(esc(b.x)));
    // "Texto bíblico" seguido da citação: a caixa já traz esse rótulo, não repete o cabeçalho
    if(b.t==='h' && /^texto b[ií]blico$/i.test(b.x) && c.blocos[i+1] && c.blocos[i+1].t==='q') continue;
    if(b.t==='h') html+='<p class="roman-head">'+x+'</p>';
    else if(b.t==='q') html+='<div class="box-aureo"><span class="lbl">Texto bíblico</span>'+x+'</div>';
    else if(b.t==='s') html+='<p class="nota">'+x+'</p>';
    else html+='<p class="subpoint">'+x+'</p>';
  }
  $('texto').innerHTML=html; if(window.hifenizar) hifenizar($('texto'));   // hifeniza o capítulo (texto montado na hora)
  $('pag-ind').textContent=(CAP+1)+' de '+TEXTO.capitulos.length;
  $('pg-ant').disabled=CAP<=0; $('pg-prox').disabled=CAP>=TEXTO.capitulos.length-1;
  $('progf').style.width=Math.round((CAP+1)/TEXTO.capitulos.length*100)+'%';
  guardarPos(EST.slug,{cap:CAP});
  history.replaceState({},'',location.pathname+'?e='+encodeURIComponent(EST.slug)+'&c='+CAP);
  window.scrollTo(0,0);
}
function irCap(d){ CAP=Math.max(0,Math.min(TEXTO.capitulos.length-1,CAP+d)); mostrarCap(); }
function fonte(d){ FS=Math.max(15,Math.min(30,FS+d)); localStorage.setItem('maria_fs',FS); document.documentElement.style.setProperty('--fs',FS+'px'); }
/* ═══ REFERÊNCIAS BÍBLICAS CLICÁVEIS (abre o versículo, como na EBD) ═══ */
const ABREV={'at':'atos','mt':'mt','mc':'mc','lc':'lc','jo':'jo','rm':'rm','1co':'1co','2co':'2co','gl':'gl','ef':'ef','fp':'fp','cl':'cl','1ts':'1ts','2ts':'2ts','1tm':'1tm','2tm':'2tm','tt':'tt','fm':'fm','hb':'hb','tg':'tg','1pe':'1pe','2pe':'2pe','1jo':'1jo','2jo':'2jo','3jo':'3jo','jd':'jd','ap':'ap','gn':'gn','ex':'ex','lv':'lv','nm':'nm','dt':'dt','js':'js','jz':'jz','rt':'rt','1sm':'1sm','2sm':'2sm','1rs':'1rs','2rs':'2rs','1cr':'1cr','2cr':'2cr','ed':'ed','ne':'ne','et':'et','jo.':'jó','sl':'sl','pv':'pv','ec':'ec','ct':'ct','is':'is','jr':'jr','lm':'lm','ez':'ez','dn':'dn','os':'os','jl':'jl','am':'am','ob':'ob','jn':'jn','mq':'mq','na':'na','hc':'hc','sf':'sf','ag':'ag','zc':'zc','ml':'ml',
  'genesis':'gn','exodo':'ex','levitico':'lv','numeros':'nm','deuteronomio':'dt','josue':'js','juizes':'jz','rute':'rt','1 samuel':'1sm','2 samuel':'2sm','1 reis':'1rs','2 reis':'2rs','1 cronicas':'1cr','2 cronicas':'2cr','esdras':'ed','neemias':'ne','ester':'et','jo':'jo','salmos':'sl','salmo':'sl','proverbios':'pv','eclesiastes':'ec','cantares':'ct','isaias':'is','jeremias':'jr','lamentacoes':'lm','ezequiel':'ez','daniel':'dn','oseias':'os','joel':'jl','amos':'am','obadias':'ob','jonas':'jn','miqueias':'mq','naum':'na','habacuque':'hc','sofonias':'sf','ageu':'ag','zacarias':'zc','malaquias':'ml','mateus':'mt','marcos':'mc','lucas':'lc','joao':'jo','atos':'atos','romanos':'rm','1 corintios':'1co','2 corintios':'2co','galatas':'gl','efesios':'ef','filipenses':'fp','colossenses':'cl','1 tessalonicenses':'1ts','2 tessalonicenses':'2ts','1 timoteo':'1tm','2 timoteo':'2tm','tito':'tt','filemom':'fm','hebreus':'hb','tiago':'tg','1 pedro':'1pe','2 pedro':'2pe','1 joao':'1jo','2 joao':'2jo','3 joao':'3jo','judas':'jd','apocalipse':'ap'};
const RE_REF=/((?:[123]\s?)?[A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-záéíóúâêôãõç]{1,14})\s(\d{1,3})[:.](\d{1,3})(?:\s?[-–]\s?(\d{1,3}))?/g;
function refs(html){
  return html.replace(RE_REF,(m,livro,cap,v1,v2)=>{ const k=norm(livro).replace(/\s+/g,' '); const ab=ABREV[k]; if(!ab) return m;
    return '<span class="bref" data-ref="'+ab+'|'+cap+'|'+v1+'|'+(v2||'')+'">'+m+'</span>'; });
}
let _biblia=null;
document.addEventListener('click',async e=>{ const el=e.target.closest('.bref'); if(!el) return; e.preventDefault();
  if(!_biblia){ try{ _biblia=await (await fetch('/biblia.json')).json(); }catch(err){ toast('Bíblia não disponível agora.'); return; } }
  const [ab,cap,v1,v2]=el.dataset.ref.split('|'); const livro=_biblia.find(x=>x.abbrev===ab); const ch=livro&&livro.chapters[+cap-1];
  if(!ch){ toast('Não achei essa passagem.'); return; }
  const a=+v1-1, b=v2?+v2-1:a; let h='';
  for(let i=a;i<=Math.min(b,ch.length-1);i++) if(ch[i]) h+='<p style="margin:0 0 8px;text-align:justify;font-size:17px;line-height:1.75"><sup style="color:#c9a14a;font-weight:900;font-size:11px">'+(i+1)+'</sup> '+esc(ch[i])+'</p>';
  $('ref-titulo').textContent=(livro.name||ab)+' '+cap+(v2?':'+v1+'-'+v2:':'+v1); $('ref-body').innerHTML=h||'<p>Versículo não encontrado.</p>';
  $('ref-sheet').style.display='block'; $('ref-overlay').style.display='block';
});
function fecharRef(){ $('ref-sheet').style.display='none'; $('ref-overlay').style.display='none'; }
/* ═══ BUSCAR, COPIAR, TOAST ═══ */
function toggleFind(){ const fb=$('findbar'); const on=fb.classList.toggle('on'); if(on){ setTimeout(()=>$('findq').focus(),50); } else { _findTerm=''; _findHits=[]; _findAt=-1; $('findq').value=''; $('findcnt').textContent='—'; mostrarCap(); } }
function findRun(){
  const termo=$('findq').value.trim();
  if(termo.length<2){ _findTerm=''; _findHits=[]; _findAt=-1; $('findcnt').textContent='—'; mostrarCap(); return; }
  _findTerm=termo; const nt=norm(termo); _findHits=[];
  TEXTO.capitulos.forEach((c,i)=>{ if(norm(c.t+' '+c.blocos.map(b=>b.x).join(' ')).includes(nt)) _findHits.push(i); });
  if(!_findHits.length){ _findAt=-1; $('findcnt').textContent='0'; mostrarCap(); return; }
  let p=_findHits.findIndex(i=>i>=CAP); _findAt=p<0?0:p; CAP=_findHits[_findAt]; $('findcnt').textContent=(_findAt+1)+'/'+_findHits.length; mostrarCap();
}
function findGo(d){ if(!_findHits.length) return; _findAt=(_findAt+d+_findHits.length)%_findHits.length; CAP=_findHits[_findAt]; $('findcnt').textContent=(_findAt+1)+'/'+_findHits.length; mostrarCap(); }
function copiarCapitulo(btn){
  const c=TEXTO&&TEXTO.capitulos[CAP]; if(!c) return;
  const txt=[c.t+(c.sub||c.ref?' — '+(c.sub||c.ref):'')].concat(c.blocos.map(b=>b.x)).join('\n\n');
  const ok=()=>{ const o=btn.innerHTML; btn.innerHTML='✓'; setTimeout(()=>{btn.innerHTML=o;},1300); toast('Capítulo copiado'); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(()=>_copyFallback(txt,ok)); else _copyFallback(txt,ok);
}
function _copyFallback(txt,cb){ try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); cb&&cb(); }catch(e){ toast('Não consegui copiar.'); } }
let _toastT=null;
function toast(msg){ let t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); } t.textContent=msg; t.classList.add('on'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('on'),2200); }
document.addEventListener('keydown',e=>{ if($('leitor').style.display!=='block') return; const tg=e.target.tagName; if(tg==='INPUT'||tg==='TEXTAREA') return; if(e.key==='ArrowRight'||e.key==='PageDown'){ irCap(1); e.preventDefault(); } else if(e.key==='ArrowLeft'||e.key==='PageUp'){ irCap(-1); e.preventDefault(); } });
</script>
