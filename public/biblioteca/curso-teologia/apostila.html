monstrar que todos esses pontos do dispensacionalismo já foram defendidos por teólogos a partir do 2 sec entre os pais.<\/p><p class='li'>1 - Interpretação literal - Escola antioquena<\/p><p class='li'>2 - Milênio terreno e político - todos os pais ante-nicenos: Clemente - Papias - Policarpo - Inácio - didaquê - barnabé - pastor de hermas. Justino - Irineu - Hypolitus - Tertuliano - Cypriano de carthago - Lactancio - Victorino de Pettau. O esquema de seis por um.<\/p><p class='li'>3 - Futura restauração do Israel etnico - programa especifico, o que denota distinção. Irineu fala do anticristo sentando no templo em Jerusalém - Tertuliano acreditava que os Judeus seriam restaurados à sua condição primitiva - Hipólitus defendeu que o anticristo restauraria a cidade e o templo de Jerusalém - as 70 semanas de Daniel.<\/p><p class='li'>4 - Distinção entre Igreja e Israel - Os pais perceberam um programa distinto para Israel.<\/p><p class='li'>5 - Dispensações - Irineu: “a palavra veio revelando Deus aos homens através várias dispensações” livro V. 23.2,13. Pastor de Hermas - Tertuliano: “do criador deverá vir outras leis, outras palavras, novas dispensações com alianças”, livro IV. 1. Cypriano de Carthago - Clemente: 7 eras. Agostinho “a dispensação do NT deve ser distinguida da dispensação do AT, conforme a adequação das eras e tempos”, sobre a trindade, livro III 11.22. “Portanto, cinco eras já se completaram, e tem se iniciado a sexta”, Philip Chafer.<\/p><p class='li'>6 - Iminência - didaquê: “vigiai pelo bem de vossa vida. Não deixai vossa lâmpada se apagar, nem vosso lombo sem cingir; estais prontos, pois não sabeis a que horas virá nosso Senhor”. Clemente: “Em verdade, breve e subitamente, sua vontade será realizada, do que as Escrituras também dão testemunho dizendo: Brevemente ele virá, e não tardará; e Senhor virá subtamente”. Adolf Harnack; \"Três forças impulsionam a pregação do evangelho: iminência, volta de cristo e reino milenar.”. Barnabé - inácio - Efrém<\/p><p class='li'>7 - Arrebatamento - Victorino: Ap 6.14 “a igreja será tirada”, “os bons serão removidos a fim de evitar a perseguição” - Efrem: “Pois os eleitos de Deus serão reunidos antes da tribulação que está por vir, e serão levados ao Senhor para que não vejam a confusão que há de vir sobre o mundo”.<\/p>"}, {"n": 37, "t": "DISPENSACIONALISMO ANTES DE DARBY - CONCEITOS DISPENSACIONALISTA ENTRE OS PURITANOS", "html": "<p>O século XVII foi um período onde o pré-milenismo ressurge, pois a bíblia é traduzida para diversos idiomas facilitando o acesso ao livro sagrado. Outro fator que colaborou para a volta ao pré-milenismo foi o método histórico gramatical de interpretação, um legado da reforma. Puritanos que defendem conceitos dispensacionalistas:<\/p><p>Pré-milenismo Robert Manton - Thomas Draxe - John Gil - Joseph Mede - Thomas Goodwin - Thomas Parker - Willian Hooke Futura restauração de Israel Thomas Draxe - Hugh Broughton - Giles Fletcher - Henry Finch - Peter Bulkeley.<\/p><p>Dispensaçẽos Jonh Bale (1495-1563) 7 eras com ciclos de infidelidade e declínios.<\/p><p>Rober Pont um pastor Escoces 6 eras citando Agostinho.<\/p><p>George Walker (1581-1651) foi o primeiro a usar o termo dispensação, sendo a primeira inocência.<\/p><p>Thomas Manton (1620-1677) Ministro presbiteriano em 1640 pregou sobre quatro dispensaçẽos: lei natural - lei nas pedras - evangelhos - estado eterno.<\/p><p>Willian Couge (1575-1653) membro da assembleia de Westminster estabeleceu um esquema dividido em sete períodos. “da criação ao dia do juízo são 6 longos dias, sendo o sétimo o descanso eterno.<\/p><p>Thomas Goodwin (1600-1680) Isaac Watts (1674-1748) um esquema com 6 dispensações.<\/p><p>Pierre Poiret (1646-1719) Em 1687 em Amsterdã publicou sua obra em 6 volumes, apresentando 7 dispensações.<\/p>"}, {"n": 38, "t": "DISPENSACIONALISMO ANTES DE DARBY - PRÉ-TRIBULACIONISMO NA PATRÍSTICA - IRINEU DE LIÃO", "html": "<h4>TRIBULACIONISMO NA PATRÍSTICA - IRINEU DE LION<\/h4><h4>OS PAIS ANTENICENOS<\/h4><h4>1. A IGREJA JÁ ESTAVA NA TRIBULAÇÃO<\/h4><h4>2. HAVERÁ UMA TRIBULAÇÃO MAIS INTENSA<\/h4><h4>3. O ANTICRISTO PODERIA SE MANIFESTAR A QUALQUER MOMENTO<\/h4><h4>4. JESUS PODERIA ARREBATAR SUA IGREJA A QUALQUER MOMENTO<\/h4><h4>5. O ARREBATAMENTO NÃO OCORRE NO MOMENTO DA SEGUNDA VINDA<\/h4><h4>6. INTERPRETAÇÃO SEMI-ALEGÓRICA<\/h4><h4>** A ESCATOLOGIA ATUAL É DISTINTA**<\/h4><h4>IRINEU DE LIÃO<\/h4><p>Nasceu em Esmirna (125-202) foi bispo em Lyon da França, teve contato com Policarpo bispo de Esmirna.<\/p><p>Escreveu a obra “contra as heresias” e “epideixis - prova da pregação apostólica”.<\/p><h4>CONTRA AS HERESIAS<\/h4><p>A ideia de um suposto pós-tribulacionismo em Irineu vem de seu texto no livro 5.35.1: \"Eis, pois, diz Isaías, o dia do Senhor terrível, cheio de furor e de ira. Ele vem para tornar deserta a terra e exterminar os pecadores\". Ele diz ainda: \"Será eliminada, para que não veja a glória do Senhor\". E depois que isso tiver acon-tecido, diz: \"O Senhor afastará os homens e os que ficarem se multiplicarão sobre a terra\". \"Construirão casas que eles mesmos habitarão e plantarão vinhas cujos frutos eles mesmos comerão\". Todas estas profecias se referem, sem contestação, à ressurreição dos justos, que se realizará depois do advento do Anticristo e da eliminação de todas as nações submetidas à sua autoridade, quando os justos reinarão sobre a terra, aumentarão pela aparição do Senhor e se acostumaram, por ele, a participar da glória do Pai e, com os santos anjos, participarão da vida da comunhão e da unidade espirituais, neste reino. Os que o Senhor encontrar na carne, esperando-o vindo dos céus, depois de ter suportado a tribulação e escapado das mãos do ímpio, são aqueles dos quais fala o profeta: \"Os deixados sobre a terra se multiplicarão\", e também todos os que, dentre os pagãos, o Senhor tiver preparado, para que, após ser deixados, se multipliquem sobre a terra, sejam governados pelos santos e sirvam a Jerusalém. O profeta Jeremias falou mais claramente ainda sobre Jerusalém e o reino que será estabelecido nela, dizendo: \"Dirige o teu olhar para o oriente, Jerusalém, e vê a alegria que te vem da parte de Deus!<\/p><p>Esse texto não descreve a igreja na tribulação, tão pouco a ressurreição da mesma após a segunda vinda. Irineu está defendendo o mesmo que os pré-tribulacionsitas creem, a perseguição dos santos durante a tribulação, os que sobrevivem tal perseguição, e a ressurreição dos justos após a manifestação do anticristo e segundo advento para o então estabelecimento do Reino.<\/p><blockquote>Livro 5.30.4 Ora, depois que o Anticristo tiver destruído todas as coisas neste mundo, reinado três anos e seis meses e tiver assentado no templo de Jerusalém, o Senhor virá do alto do céu, sobre as nuvens, na glória do Pai, e o lançará no lago de fogo com todos os seus seguidores; para os justos trará os tempos do Reino, isto é, o repouso do sétimo dia santificado, e dará a Abraão a herança prometida, aquele reino, diz o Senhor, ao qual \"muitos virão do oriente e do ocidente para se sentar à mesa com Abraão, Isaac e Jacó\".<\/blockquote><p>Irineu logo após descrever o reinado de três anos e seis meses do Anticristo, apresenta a vinda de Cristo, mas não faz menção ao arrebatamento. Para Irineu a segunda vinda tem o intuito de estabelecer os justos no reino, não arrebatá-los.<\/p><blockquote>Livro 5.28.4 Por isso também é necessária a tribulação para os que se salvam, a fim de que, de certo modo moídos e amassados pela paciência e assados pelo Verbo de Deus, se tornem prontos para a festa de núpcias do Rei, Como disse alguém dos nossos condenado às feras, por causa do testemunho que prestou a Deus: \"Eu Sou O trigo de Cristo moído pelos dentes das feras para me tornar O pão puro de Deus\". INÁCIO DE ANTIOQUIA.<\/blockquote><p>Inicialmente dá a entender que Irineu está afirmando que a é necessário que a igreja passe pela grande tribulação, mas logo adiante fica evidente que tal tribulação é a perseguição de seus dias onde então ele cita Inácio de Antioquia. O pensamento de Irineu é de que a igreja já está passando por algum estágio da tribulação, mas ainda haverá uma tribulação futura mais intensa.<\/p><blockquote>Livro 5.29.1 Por isso, quando, no fim, de repente a Igreja será levada daqui, \"haverá, como está escrito, uma tribulação como nunca houve desde o princípio e nunca mais haverá\": será a última prova dos justos e os vencedores serão coroados com a incorruptibilidade.<\/blockquote><p>Aqui o texto de Irineu apresenta algumas verdades inconfundíveis:<\/p><p>1 No fim dos tempos de repente a Igreja será arrebatada daqui.<\/p><p>2 Haverá uma grande tribulação sem igual 3 Haverá a última prova dos justos 4 O anticristo pode aparecer em breve 5 Haverá a ressurreição dos justos após a manifestação do anticristo 6 Os que estiverem em carne na ocasião da vinda de Cristo entrarão no Reino e procriarão.<\/p>"}, {"n": 39, "t": "DISPENSACIONALISMO ANTES DE DARBY - PRÉ-TRIBULACIONISMO NA PATRÍSTICA - VICTORINO DE PETTAU", "html": "<h4>VICTORINO DE PETTAU<\/h4><p>O primeiro exegeta a escrever em latim foi Victorinus, bispo de Petabio na Panônia Superior, o moderno Pettau na Estíria. Ele morreu como mártir, provavelmente em 304 d.C., vítima da perseguição de Diocleciano. Era familiarizado com o grego, mas nem tanto com o latim, assim, embora suas obras fossem ricas em ideias, eram pobres no estilo literário. Por esse motivo, Jerônimo editou seus escritos, anulando seu pré-tribulacionismo e pré-milenismo, inserindo o amilenismo em seu texto.<\/p><p>O Comentário sobre o Apocalipse De todos os comentários mencionados por Jerônimo ( Gênesis, Êxodo, Levíticos, Cantares, Eclesiastes, Isaias, Ezequiel, Habacuque, Contra todas as Heresias) apenas um existe, o do Apocalipse. Seu texto original não foi publicado até 1916.<\/p><blockquote>Victorinus comentando Apocalipse 6.14 \"E o céu se retirou como um pergaminho enrolado.\" Para que o céu seja rolado, isto é, que a Igreja seja tirada.' E a montanha e as ilhas foram removidas dos seus lugares.\" Montanhas e ilhas removidas de seus lugares indicam que na última perseguição todos os homens partiram de seus lugares; isto é, que os bons serão removidos, a fim de evitar a perseguição”.<\/blockquote><blockquote>Sobre Apocalipse 15.1 “E vi outro grande e maravilhoso sinal, sete anjos tendo as sete últimas pragas; porque nelas se completa a indignação de Deus. Pois a ira de Deus sempre atinge o povo obstinado com sete pragas, isto é, perfeitamente, como é dito em Levíticos e estas ocorrerão no último tempo, quando a Igreja tiver saído do meio.<\/blockquote><p>O texto que está incluso no volume 7 referente aos pais ante-nicenos é a versão de Jerônimo, onde há alguma alterações tanto ao conceito pré-tribulacionista como ao pré-milenismo, posiçẽos defendidas por Victorino em seu texto original.<\/p>"}, {"n": 40, "t": "DISPENSACIONALISMO ANTES DE DARBY - PRÉ-TRIBULACIONISMO NA PATRÍSTICA - EFRÉM O SÍIRIO", "html": "<h4>TRIBULACIONISMO NA PATRÍSTICA - EFRÉM O SÍRIO<\/h4><h4>EFRÉM O SÍRIO<\/h4><p>Os pós-tribulacionistas afirmam que Efrém era pós-tribulacionista, isto com base no parágrafo dez, que quando bem analisado revela o contrário. Entretanto, como veremos, o parágrafo dois do texto de Efrém é nitidamente pré-tribulacionista.<\/p><p>Nasceu próximo a Nisibis, província Romana, um grande poeta e hinólogo da igreja Bizantina. Viveu entre 306 - 373 ou 627 e escreveu o Sermão “Sobre os últimos tempos, o anticristo e o fim do mundo”.<\/p><p>Parágrafo 10 E quando os três anos e meio se tiverem cumprido,o tempo do Anticristo, no qual ele seduzirá o mundo, depois da ressurreição dos dois profetas, na hora que o mundo não conhece, no dia que o inimigo e o filho da perdição não conhecem, virá o sinal do Filho do Homem e apresentando-se, o Senhor aparecerá com grande poder e muita majestade, com o sinal da salvação indo adiante dele e também com todos os poderes do céu, com todos os coros de anjos, com os que trazem nos ombros o sinal da santa cruz, com a trombeta angelical a precedê lo, a soar e declarar: Acordem, vocês que dormem! Acordem, venham ao encontro de Cristo, pois chegou a hora em que Ele vai julgar! Então Cristo virá e o inimigo será lançado em confusão. O Senhor o destruirá pelo Espírito de Sua boca. Ele será amarrado e lançado no abismo de logo inextinguível, junto com seu pai Satanás; e todas as pessoas que lhe fizeram a vontade perecerão com ele para sempre; os justos, porém, herdarão a vida eterna com o Senhor para todo o sempre.<\/p><p>Parágrafo 2 Devemos entender de maneira completa, portanto, meus irmãos o que é iminente ou próximo. Já têm havido fomes e pestes, movimentos violentos entre as nações. Sinais, que foram preditos pelo Senhor, já se cumpriram e não há qualquer outro que reste, exceto o aparecimento do Ímpio no término do reino romano. Por que, então, estar preocupado com coisas deste mundo e por que deixar nossa mente fixa nas concupiscências do mundo ou nas ansiedades das eras? Por que então não rejeitar todo cuidado das atividades mundanas e nos prepararmos para o encontro do Senhor Cristo, para que Ele nos tire da confusão que assolará o mundo? Creiam- me, caríssimos irmãos, pois a vinda do Senhor está próxima, creiam-me pois o fim do mundo está às portas, creiam-me pois é já o último tempo. Ou vocês não crêem a não ser que vejam com seus próprios olhos? Cuidem para que não se cumpra a seu respeito a sentença que o profeta declarou: \"Ai daqueles que desejam ver o Dia do Senhor!\" Porque todos os santos e a Eleita do Senhor serão reunidos antes da tribulação que está por vir e serão levados ao Senhor, para que jamais vejam a confusão que assolará o mundo por causa de nossos pecados. E assim, irmãos muito queridos, é já a undécima hora e o fim deste mundo chega para a colheita e os anjos, armados e preparados, trazem foices em suas mãos, aguardando o império do Senhor. E pensamos que a terra existe em cega infidelidade, chegando cedo à sua destruição. Violentas comoções ocorrerão, guerras entre diversos povos e batalhas e ameaças de invasões dos bárbaros e desolação em nossa região, mas não ficamos muito assustados nem do relato nem da aparência, para assim fazermos confissão de culpa; tais coisas lançam contra nós o medo e nem sequer queremos ser mudados, embora pelo menos precisemos nos arrepender de nossas ações!<\/p>"}, {"n": 41, "t": "DISPENSACIONALISMO ANTES DE DARBY - PRÉ-TRIBULACIONISMO ENTRE OS PURITANOS 200 ANOS ANTES DE DARBY", "html": "<p>Thomas Draxe - Citando Lc 21.36 exortava seus leitores a orar e vigiar para que fossem dignos de escapar das coisas que devem acontecer. Usava o exemplo de Enoque e Elias.<\/p><p>Joseph Mede - pré-ira, considera o exemplo de Noé, assim pregava que Igreja seria arrebatada sendo preservada da grande “conflagração”.<\/p><p>Robert Manton - A ressurreição ocorreria antes da segunda vinda para reinar sobre a terra, e os ímpios seriam deixados para sofrerem a ira divina nos últimos dias.<\/p><p>Elizabeth Avery em 1647 - A mulher em Ap 12 o arrebatamento - Is 26 proteção - 1Ts 4.16. Peter Sterry em 1648 pregou um pré-trib com base no livramento de Noé. “Uma arca para aqueles que são levados com Cristo elevando-os acima de todas as misérias rumo ao céu”. Nathaniel Homes (1599-1692) “Tal encontro é para que eles possam ser preservados durante a conflagração da terra”. Usou o exemplo da arca.<\/p><p class='li'>M. Marsin em 1690 como Darby fez conexão entre 1Ts 4.16 e Lc 17.34. “Um será tomado e outro deixado, então após a vinda do Senhor a maioria das pragas mencionadas em Apocalipse serão derramadas sobre a terra e os ímpios”.<\/p><p>John Hildrop em 1711 publicou a obra, “Os três males dos últimos tempos” como os verdadeiros crentes escaparão das tribulações. “assim como pela graça divina eles tem escapado do contágio e contaminação do espírito anticristão, eles também escaparão dos juízos”. Ap 3.10.<\/p>"}, {"n": 42, "t": "MARGARET MACDONALD ERA PRÉ-TRIBULACIONISTA?", "html": "<p>Margaret McDonald's era pós-tribulacionista!<\/p><p>“Agora será revelado o iníquo, com todo poder, milagres e sinais da mentira, para que se possível fora, até os escolhidos seriam enganados. Essa será uma prova como o fogo para nos tentar. Esse teste virá para purgar e purificar os verdadeiros membros do corpo de Cristo.” “Aqueles que passarem por tal prova serão contados dignos de estarem em pé diante do Filho do Homem.”<\/p><p>“A aflição da igreja virá do anticristo.”<\/p><p>Samuel P. Tregelles (1864) e sua mentira replicada por MacPherson, onde ambos afirmam que Irving e Margaret eram Pré-tribulacionistas e Darby os plagiou.<\/p><p>Como Darby se tornou Pré-Tribulacionista?<\/p><p>Se convenceu que Deus tinha um programa específico para Israel lendo Is 32. Desenvolveu um esquema com 8 dispensações de Noé ao milênio.<\/p>"}, {"n": 43, "t": "O SUPERSESSIONISMO E O DECLÍNIO DO PRÉ-MILENISMO", "html": "<h4>A ORIGEM DO SUPERSESSIONISMO<\/h4><p>Hermenêutica Alegórica - Teogenes de Régio - Filo Zeus deseja Alcmene mulher de Antifrion e gera Hercules - cobiça e traição Freda se apaixona por seu enteado Hipólito - imoralidade Tífon tinha três cabeças - aberração Ares deus da guerra tinha prazer na matança - sadismo Pais Alexandrinos<\/p><p class='li'>a - Clemente - Em Nm 12, Moisés é Cristo, mulher cuxita a Igreja, Moisés e Miriã é o Israel que tem ciúmes da relação de Cristo com a Igreja.<\/p><p>b -Quadriga: João Cassiano, o monge do sul de Gália estabeleceu o método Quadriga: quatro sentidos no texto, que serviu para justificar as inovações que foram entrando na igreja. Assim, havia quatro sentidos para Jerusalém:<\/p><p>Histórico, alegórico, tropológico ou moral, anagógico ou escatológico.<\/p><p>Jerusalém Igreja Alma Jerusalém celeste<\/p><p class='li'>2 - Anti-semitismo na patrística<\/p><p class='li'>A - No início do segundo século a igreja ja era predominantemente gentílica.<\/p><p class='li'>B - Adolph Harnack: “os Cristãos acreditavam que os Judeus tinham sido rejeitados por Deus, e eles, os cristãos, se tornaram o novo povo de Deus”. Assim nasce o supersessionismo, a ideia de que a Igreja substituiu o Israel, tornando-se o Israel de Deus ou o verdadeiro Israel.<\/p><p class='li'>C - João Crisóstomo - 387 em Antioquia da Síria - Prega contra os Judeus - Deus odeia os Judeus - Deicide: Assassinos de Deus<\/p><h4>HERMENÊUTICA SEMI-ALEGÓRICA<\/h4><p class='li'>A - Justino o Mártir: “os Cristão são o verdadeiro Israel” Justino entendia que: Lia é os Judeus - Raquel é a Igreja - Jacó é Cristo que serve ambos.<\/p><p class='li'>B - Tertuliano - Gn 25.23 Esaú, Israel - Jacó, Igreja<\/p><h4>O DECLÍNIO DO PRÉ-MILENISMO NA PATRÍSTICA<\/h4><h4>3 - AMILENISMO<\/h4><p class='li'>a - Ambrosio em 387 batiza Agostinho - Sinagogas deveriam ser queimadas<\/p><p class='li'>b - São Jerônimo - Amilenista<\/p><p class='li'>c- Ticônio o Donatista - Tratado hermenêutico Alegórico - Ap 12 Agostinho Inicialmente defendia o quiliasmo, mais tarde influenciado por Ambrósio e Ticônio se torna amilenista. Assim, a ideia de um milênio literal com bênçãos físicas e materiais, como comer, beber e casar, foi visto como algo carnal.<\/p><p class='li'>4 - Amilenismo - Escatologia Católica<\/p><p class='li'>a - Agostinho: o milênio espiritual foi estabelecido no primeiro advento.<\/p><p class='li'>b - Agostinho: com base em Daniel 2, 7 (Ticônio) e Apocalipse 20 concluiu que a Igreja é o Reino na terra. - Cidade de Deus<\/p><p class='li'>c - A escatologia de Agostinho foi adotada pela Igreja.<\/p><p class='li'>d - Igreja estatal O Supersessionismo é implantado como a base da futura teologia da aliança.<\/p>"}]}, {"n": 8, "t": "A ESCATOLOGIA DE MATEUS", "aulas": [{"n": 44, "t": "O REINO DE DEUS E SEUS VÁRIOS ASPECTOS", "html": "<h4>O REINO DE DEUS<\/h4><h4>O REINO DE DEUS E SEUS VÁRIOS ASPECTOS<\/h4><p>Fazemos parte do reino de Deus? Esse reino foi inaugurado no primeiro advento? Em que consiste esse reino e qual a relação da igreja com o mesmo? As respostas a essas questões podem influenciar o entendimento de como a igreja deve se posicionar hoje diante das questões do nosso tempo, e também quanto ao futuro!<\/p><h4>1 - O REINO E SEU ASPECTO UNIVERSAL<\/h4><p>“Digno és, Senhor, de receber glória, e honra, e poder; porque tu criaste todas as coisas, e por tua vontade são e foram criadas”, Apocalipse 4.11.<\/p><p>O fato de Deus ser o criador de todas as coisas, lhe dá o direito de governar sobre tudo e todos, “O SENHOR reina; tremam os povos. Ele está assentado entre os querubins; comova-se a terra”, Salmos 99.1.<\/p><p>Um outro texto que expressa a soberania e governo de Deus sobre todas as esferas da criação é, “ Tua é, SENHOR, a magnificência, e o poder, e a honra, e a vitória, e a majestade; porque teu é tudo quanto há nos céus e na terra; teu é, SENHOR, o reino, e tu te exaltaste por cabeça sobre todos”, 1 Crônicas 29.11.<\/p><p>Como soberano do universo o Senhor pode agir e interferir na história a qualquer momento, “E ele muda os tempos e as estações; ele remove os reis e estabelece os reis; ele dá sabedoria aos sábios e conhecimento aos entendidos”, Daniel 2.21.<\/p><p>Podemos dizer também que o Reino universal de Deus é tão eterno como o próprio Deus, “O teu trono está firme desde então; tu és desde a eternidade”, Salmos 93.2.<\/p><h4>2 - REINO TEOCRÁTICO<\/h4><p>O reino teocrático diz respeito ao a administração divina por meio de um representante humano, assim, no éden tempos o modelo modelo teocrático através de Adão, “E disse Deus: Façamos o homem à nossa imagem, conforme a nossa semelhança; e domine sobre os peixes do mar, e sobre as aves dos céus, e sobre o gado, e sobre toda a terra, e sobre todo o réptil que se move sobre a terra”, Gênesis 1.26. Este é o modelo teocrático, trata-se de uma fase ou aspecto mais limitado do reino de Deus, pois abrange apenas a terra.<\/p><p>Em termos de comparação, o reino teocrático é como se a terra fosse uma do reino universal de Deus e Adão seu representante sobre toda a terra. Assim, com a queda de Adão, encerra-se a teocracia, pois não há mais um representante de Deus governando sobre toda a terra, entretanto, Cristo que é o segundo Adão restaurará a teocracia por ocasião de seu segundo advento e estabelecimento do milênio. Durante o Reino milenar Cristo terá domínio sobre tudo e todos, seu reino será mundial.<\/p><h4>3 - OS REIS DE ISRAEL E A TEOCRACIA<\/h4><p>Alguns teólogos cogitam a possibilidade que o governo teocŕatico de Deus esteve presente de Moisés até o Saul. Esse pensamento considera que Moisés, Josué e os juízes eram os representantes de Deus em Israel, uma ideia que tem fundamento, pois Deus sempre teve seus representantes sobre essa terra. Entretanto, isso não deve ser considerado uma teocracia por pelo menos dois motivos básicos.<\/p><p>Primeiro, a limitação geográfica, pois o reino teocrático não é local ou nacional, mas global, “Eu estava olhando nas minhas visões da noite, e eis que vinha nas nuvens do céu um como o Filho do homem; e dirigiu-se ao Ancião de dias, e o fizeram chegar até ele. E foi-lhe dado o domínio, e a honra, e o reino, para que todos os povos, nações e línguas o servissem; o seu domínio é um domínio eterno, que não passará, e o seu reino tal, que não será destruído”, Daniel 7.13.<\/p><p>Segundo, na teocracia o representante humano não se opõe à vontade Divina, em caso de oposição encerra-se o governo, como ocorreu no Éden sob a dispensação da inocência.<\/p><h4>4 - É CHEGADO O REINO DOS CÉUS<\/h4><p>Mas esse reino não havia chegado ou inaugurado já nos dias de Jesus? “Desde então, começou Jesus a pregar e a dizer: Arrependei-vos, porque é chegado o Reino dos céus”, Mateus 4.17. Esse reino não é espiritual, mas o reino terreno conforme já foi explicado acima. O termo grego que se traduz por “chegado” é “eggizo” que em Tiago 5.8 é usado em relação à vinda de Cristo para arrebatar sua igreja. Esse termo é melhor traduzido por “pŕoximo”, ao invés de chegado, pois se entendermos que o reino chegou, devemos aceitar que a segunda vinda já ocorreu uma vez que o mesmo termo é usado tanto para a proximidade do reino como da vinda.<\/p><h4>5 - O REINO UNIVERSAL E SEU ASPECTO ESPIRITUAL<\/h4><p>Cristo também não inaugurou o reino em seu aspecto espiritual, seja durante sua missão terrena ou após sua ascensão. É muito comum essa ideia, “cristo inaugurou o reino em seu aspecto espiritual”, é o famoso “agora já mas ainda não”. A inauguração do reino prometido ao descendente de Davi, que é o Cristo, implica na posse do trono de Davi, que por sua natureza é terreno.<\/p><p>“Ao que vencer, lhe concederei que se assente comigo no meu trono, assim como eu venci e me assentei com meu Pai no seu trono”, Apocalipse 3.21. O trono do Pai é celestial, e diz respeito ao seu reino ou governo universal, assim fica claro que Jesus hoje está governando o mundo junto ao Pai em um Reino Universal, que abrange o aspecto espiritual e físico da criação.<\/p><h4>6 - FAZEMOS PARTE DE QUAL ASPECTO DO REINO?<\/h4><p>Agora fica mais fácil para entendermos o que muda após a encarnação, morte, ressurreição e ascensão de Cristo. Em algum momento de seu ministério terreno Jesus falou sobre a presença do aspecto espiritual de Reino Universal de Deus devido Ele como representante do reino estar ali, “E, interrogado pelos fariseus sobre quando havia de vir o Reino de Deus, respondeu-lhes e disse: O Reino de Deus não vem com aparência exterior. Nem dirão: Ei-lo aqui! Ou: Ei-lo ali! Porque eis que o Reino de Deus está entre vós”, Lucas 17.20. O mundo físico existe dentro da esfera desse Reino que é eterno, entretanto, ao invés de Jesus o inaugurar, Ele torna esse Reino que sempre existiu em uma realidade acessível a todos por meio do novo nascimento, “Jesus respondeu: Na verdade, na verdade te digo que aquele que não nascer da água e do Espírito não pode entrar no Reino de Deus”, João 3.5. Paulo confirma esse acesso que temos hoje ao Reino Universal em seu aspecto espiritual, “Ele nos tirou da potestade das trevas e nos transportou para o Reino do Filho do seu amor”, Colossenses 1.13; “Bendito o Deus e Pai de nosso Senhor Jesus Cristo, o qual nos abençoou com todas as bênçãos espirituais nos lugares celestiais em Cristo”, Efésios 1.3. Assim, podemos afirmar seguramente que embora a igreja não seja o Reino em si, pois este é muito mais amplo que a igreja, esta é a expressão terrena e visível do Reino Universal de Deus sobre a terra, assim, somos os súditos desse Reino, “E Jesus, chamado Justo, os quais são da circuncisão; são estes unicamente os meus cooperadores no Reino de Deus e para mim têm sido consolação”, Colossenses 4.11.<\/p>"}, {"n": 45, "t": "A ESCATOLOGIA DE MATEUS - INTRODUÇÃO", "html": "<h4>CONTEXTO E PROPÓSITO DO TEXTO DE MATEUS<\/h4><p>A compreensão adequada sobre o discurso das oliveiras (sermão escatológico) depende do entendimento quanto aos propósitos de Mateus ao escrever seu relato sobre Jesus e seus ensinos. O público alvo não são meramente Judeus, mas sim uma igreja composta majoritariamente por Israelitas cujas esperanças quanto o reino messiânico ainda eram vivas (At 1.6,7).<\/p><p>Mateus inicia seu texto apresentando a linhagem do Rei, Jesus é o descendente de Davi, logo têm direitos legítimos ao trono, sendo o herdeiro do reino. Em Mateus há uma ênfase muito grande sobre a chegada do Reino, pois não apenas durante os dias do ministério de Jesus como após sua ascensão, essa sempre foi a grande expectativa judaica conforme os textos abaixo indicam.<\/p><blockquote>Mateus 3.2 E dizendo: Arrependei-vos, porque está próximo o reino dos céus.<\/blockquote><blockquote>Mateus 4.17 Desde então começou Jesus a pregar, e a dizer: Arrependei-vos, porque está próximo o reino dos céus.<\/blockquote><blockquote>Mateus 10.6 Mas ide antes às ovelhas perdidas da casa de Israel; 7 E, indo, pregai, dizendo: É chegado o reino dos céus.<\/blockquote><p>Estes textos não estão anunciando a chegada de um reino espiritual (o reino espiritual sempre esteve presente Lc 17.20,21), mas sim o reino messiânico prometido por meio dos profetas, cuja natureza é política e terrena, isto é, o reino milenar (Is 2.2-5; 9.7; 11.1-16; Am 9.11-15;<\/p><blockquote>Zc 14.4-16; Lc 1.32,33; At 1.6,7; 3.19-21). Entretanto, o texto afirma que o reino “é chegado”, como pode isso, sendo este reino de natureza terrena, e o mesmo não foi estabelecido no primeiro advento? O problema está na tradução, pois o termo grego “engizó” deve ser traduzido por “próximo” como em Tiago 5.8 que diz, “Sede vós também pacientes, fortalecei os vossos corações; porque já a vinda do Senhor está próxima.” Se o Reino chegou em Mateus, o arrebatamento já ocorreu em Tiago, pois o mesmo termo é usado para descrever ambos eventos. A ideia é de proximidade, desde o primeiro advento foi inaugurado nos últimos dias (At 2.17;<\/blockquote><blockquote>1Jo 2.18), já é a última hora. Assim, João Batista, Jesus e os discípulos anunciam a proximidade do Reino milenar sob a perspectiva dos últimos dias escatológicos, ainda que estes imaginassem uma proximidade imediata sob a óptica humana (At 1.6,7) ), para Jesus o reino sempre esteve tão próximo como sua segunda vinda para seu estabelecimento.<\/blockquote><p>Esse é um dos temas principais que Mateus se propõe a apresentar, Jesus é o Rei, e estabelecerá o reino. Toda expectativa judaica era que o reino fosse estabelecido no primeiro advento de Cristo, contudo, os discípulos percebem que o reino não será estabelecido no momento da primeira vinda, e cientes de uma segunda vinda para o estabelecimento do reino, estes estão desejosos de saberem sobre essa vinda.<\/p><p>Contexto imediato de Mateus 24 O sermão escatológico de Jesus foi proferido no monte das oliveiras após a entrada triunfal (Mt 21), exatamente dois dias antes da páscoa (Mt 26.1,2). Todo o assunto do sermão é em resposta a duas perguntas feitas pelos discípulos, a saber, quando o templo seria destruído e qual o sinal da vinda de Cristo para dar fim a presente era. Essas duas perguntas surgem ao Jesus afirmar que o templo seria destruído, essa declaração está dentro de um contexto mais amplo onde naquela mesma semana, (1) Jesus purificou o templo, (2) Jesus secou a figueira, (3) profetizou a tirada do reino de Israel e sua entrega a quem dê os frutos esperados, (4) a rejeição do convite do rei as bodas, representando a rejeição judaica quanto sua pessoa (5), uma série de ais contra os fariseus, e uma sentença sobre Jerusalém por recusar serem juntados, com o aviso de que a casa deles, isto é, a cidade de Jerusalém e especificamente o templo ficarão desertos! Todas essas informações apontam para uma única verdade, o Messias foi rejeitado por seu povo, e por esse motivo esses seriam também rejeitados temporariamente como nação, mas o texto de Mateus 23 tem um desfecho otimista, Mateus 23.39 “Porque eu vos digo que desde agora me não vereis mais, até que digais: Bendito o que vem em nome do Senhor”. Com essas palavras Jesus está confirmando sua segunda vinda, ocasião em que será reconhecido como Rei, e então estabelecerá o reino profetizado pelos profetas, João Batista e confirmado por Ele mesmo.<\/p>"}, {"n": 46, "t": "A ESCATOLOGIA DE MATEUS - O DISCURSO ESCATOLÓGICO, UM ESBOÇO DOS CAPÍTULOS 24 E 25", "html": "<h4>MATEUS 24 E 25 - ESBOÇO<\/h4><p>Um breve esboço e resumo do conteúdo de Mateus 24 e 25.<\/p><p>Em uma afirmação geral, podemos dizer que nos capítulos 24 e 25 Mateus registrou o conteúdo do sermão escatológico com um propósito em mente, apresentar os eventos e o sinal específico e pontual que antecede imediatamente a segunda vinda do Rei a fim de estabelecer o Reino milenar sobre essa terra, quando então a era presente terá seu fim, e a era de ouro se concretizará.<\/p><h4>UM ESBOÇO GERAL DE MATEUS 24 E 25<\/h4><p class='li'>1 - Os discípulos perguntam sobre o sinal de sua vinda que levará o fim da presente era e estabelecimento da era de ouro, (o milênio).<\/p><p class='li'>2 - Jesus descreve os eventos que ocorrerão antes de seu segundo advento do verso cinco a quatorze, essa é uma declaração geral de todo o período denominado de grande tribulação ou septuagésima semana de Daniel.<\/p><p class='li'>3 - Dos versos cinco a oito Jesus apresentou os três primeiros anos e meio da tribulação, e os denominou de “princípio das dores”.<\/p><p class='li'>4 - Dos versos nove a quatorze Cristo descreveu de forma bem resumida os últimos três anos e meio da tribulação.<\/p><p class='li'>5 - O verso quinze até o trinta apresenta uma recapitulação do conteúdo revelado do verso nove a quatorze, isto é, do verso quinze em diante Jesus começa recapitular os últimos três anos e meio da tribulação, apresentando detalhes não revelados nos versos anteriores.<\/p><p class='li'>6 - O verso trinta e dois ao trinta e cinco temos a parábola da figueira afim de demonstrar que os que estiverem vivos instantes antes do retorno de cristo, pelos sinais saberão que o Senhor está as portas.<\/p><p class='li'>7 - Na sequência, (36-44) Jesus demonstra que assim como o diluvio pegou aquela geração de surpresa e levou todos que estavam fora da arca em juízo, de igual forma a grande tribulação surpreenderá a humanidade e levará boa parte da população a morte (Lc 21.26,27) por meio dos juízos representados por selos, trombetas e taças.<\/p><p class='li'>8 - A parábola dos servos (45-51), ilustra a verdade de que os servos maus, aqueles que mesmo diante dos sinais descritos em (15-30) se manterem céticos em relação a brevidade do retorno do Senhor, isto é, os ímpios e demais religiosos, serão surpreendidos com sua vinda.<\/p><p class='li'>9 - O capítulo (25.1-13) temos a parábola das virgens que ilustra o fato de que no segundo advento, os verdadeiros salvos entrarão no reino, para os demais não haverá uma segunda chance quanto o senhor voltar. Essa parábola deixa claro duas verdades, não haverá oportunidade de salvação quando o Senhor voltar, e apenas os salvos entrarão no reino.<\/p><p class='li'>10 - A parábola dos servos (25.14-30) demonstra que o Senhor concederá a mesma oportunidade a todos durante a grande tribulação, mas nem todos a aproveitará, quando Jesus voltar, apenas quem o serviu durante a tribulação entrará no reino, os ímpios não terão oportunidade de salvação quando Jesus voltar.<\/p><p class='li'>11 - O julgamento das nações (25.31-46), ocorrerá após o segundo advento, haverão bodes e ovelhas, justos e injustos, esses são os sobreviventes da tribulação, antes do estabelecimento do reino serão julgados, e os justos entrarão no reino.<\/p><p>Conclusão Após essa breve análise, fica evidente que Mateus (24-25) trata de três temas centrais, (1) grande tribulação, (2) segundo advento de Cristo e (3) o estabelecimento do reino milenar. A igreja não está inserida nesse contexto, pois o texto de Mateus 24 e 25 apresentam detalhes sobre a septuagésima semana de Daniel que é o dia do Senhor, cujas relações é com Israel (Dn 9.24-27; Jl 2.1,2).<\/p>"}, {"n": 47, "t": "A ESCATOLOGIA DE MATEUS - QUAL O SINAL DA TUA VINDA E DO FIM DO MUNDO?", "html": "<h4>AS DUAS PERGUNTAS EM 24.3<\/h4><p>“Dize-nos, quando serão estas coisas, e que sinal haverá de sua vinda e do fim do mundo”, como identificar as respostas a essas perguntas? Aparentemente são três perguntas, mas uma análise gramatical aponta para apenas duas:<\/p><p class='li'>a - A destruição do templo, Mateus não registrou em seu evangelho sobre a destruição do templo, que foi a primeira pergunta, essa resposta se encontra em Lucas 21.20-24.<\/p><p class='li'>b - O sinal da vinda e do fim do mundo: Ti to semeion tes ses parousias KAI sunteleias tou aionos.<\/p><p>Qual o sinal da tua vinda e do fim do século?<\/p><p>Temos a impressão de serem duas perguntas, isto é, o sinal para a vinda e o sinal para o fim do mundo ou da era. Segundo a gramática do texto grego, a regra de Granville Sharp afirma que quando há dois substantivos do mesmo caso unidos pela conjunção KAI e precedidos por um único artigo, ambos substantivos dizem respeito ao mesmo fato ou evento.<\/p><p>Os judeus entendem a vinda de Cristo e o fim da presente era como um evento que ocorre ao mesmo tempo. Este fim, não é o fim do mundo quando encerrar o reino milenar, mas o fim da presente era governada por gentios (o tempo dos gentios Lc 21.24), e o estabelecimento da era de ouro quando o messias governará o mundo a partir de Jerusalém.<\/p><h4>QUE VINDA É ESSA?<\/h4><p>Não, pois o AT falou sobre a primeira e a segunda vinda, mas nada disse sobre o arrebatamento. Jesus nada tinha falado até o momento sobre arrebatamento, logo seus discípulos nada sabiam sobre o assunto.<\/p><p>O arrebatamento foi um mistério revelado em detalhes para Paulo (Ef 3.45; 1Co 15.51). Assim, os discípulos tinham em mente a vinda para o estabelecimento do Reino, que comumente denominamos de “segunda vinda”, pois ele veio uma primeira vez a essa terra e virá novamente para estabelecer seu reino.<\/p><blockquote>Mateus 23:37 Jerusalém, Jerusalém, que matas os profetas, e apedrejas os que te são enviados! Quantas vezes quis eu ajuntar os teus filhos, como a galinha ajunta os seus pintos debaixo das asas, e tu não quiseste! 38 Eis que a vossa casa vos é deixada deserta; 39 Porque eu vos digo que desde agora me não vereis mais, até que digais: Bendito o que vem em nome do Senhor. Os eventos (falsos cristos, guerras, fome, pestes, terremotos) que antecedem a vinda de Cristo, é o princípio das dores? Esses não são os sinais que apontam que o arrebatamento está próximo? Já estamos vivendo o princípio das dores?<\/blockquote>"}, {"n": 48, "t": "A ESCATOLOGIA DE MATEUS - O PRINCÍPIO DAS DORES", "html": "<h4>O PRINCÍPIO DAS DORES<\/h4><p>Princípio das dores - As dores de parto do messias Jesus não inventou nada novo ao usar a expressão “princípios de dores”, os Rabinos já falavam sobre as dores de parto do messias:<\/p><p>Rafael Patai: “a vinda do messias será precedida por um grande e crescente sofrimento”. Rolos do mar morto denomina as severas tribulações dos sete anos antes da vinda do Messias de “as dores de parto do messias”.<\/p><p>As dores de parto na Bíblia: Jó 21.17; Is 26.17-18; Jr 4.31; Os 13.13. Todos esses textos apontam para o sofrimento do povo de Deus e o compara com as dores de parto. Em algumas passagens essas dores estão estritamente relacionadas a algum período de sofrimento no qual Israel será submetido.<\/p><blockquote>Oséias 13.13 “Dores de mulher de parto lhe sobrevirão; ele é um filho insensato; porque é tempo e não está no lugar em que deve vir à luz”.<\/blockquote><p>Com esses textos bíblicos e as citações de como os rabinos veem os sete anos que precedem a volta do Messias para estabelecer seu reino, fica evidente que o “princípio das dores” aponta para o início da tribulação que sobrevirá a esse mundo após o arrebatamento da igreja, e será um tempo de Deus tratar com Israel e não com a igreja.<\/p><h4>O PRINCÍPIO DAS DORES E OS QUATRO SELOS<\/h4><h4>OS TRÊS ANOS E MEIO FINAIS DA TRIBULAÇÃO E A PERSEGUIÇÃO<\/h4>"}, {"n": 49, "t": "A ESCATOLOGIA DE MATEUS - PERSEVERAR ATÉ O FIM E O EVANGELHO DO REINO", "html": "<h4>O QUE PERSEVERAR ATÉ O FIM SERÁ SALVO<\/h4><h4>O EVANGELHO DO REINO<\/h4><p>Que evangelho é esse? O mesmo evangelho da graça, com ênfase na chegada do Rei e seu reino. Este evangelho será pregado durante a grande tribulação. Há um único evangelho da graça salvadora, contudo durante a grande tribulação a mensagem de que o Rei está prestes a retornar para estabelecer o reino será também proclamada, essa é a boas novas do Reino, que foi pregada pelos profetas, João Batista e Jesus.<\/p>"}, {"n": 50, "t": "A ESCATOLOGIA DE MATEUS - A ABOMINAÇÃO DA DESOLAÇÃO", "html": "<h4>A ABOMINAÇÃO DESOLADORA<\/h4><p>Uma referência a imagem do anticristo que será colocada no lugar santo no templo em Jerusalém, na metade da grande tribulação. O estudante deve atentar para o fato de que Jesus está citando Daniel 9.27, onde o profeta revela detalhes dos três anos e meio finais que compõem a septuagésima semana. Assim, em Mateus 24.15-30 Jesus está relacionando os eventos da septuagésima semana, e a profanação do templo, é um dos principais antecedentes imediatos à sua segunda vinda. Considerando que a segunda vinda de Cristo em glória a fim de estabelecer o reino milenar ainda é um evento futuro, a conclusão bíblica e lógica é de que a septuagésima semana também é futura, e está intimamente relacionada com Israel. Assim como as demais sessenta e nove semanas tiveram um cumprimento literal sobre esse povo, a septuagésima semana igualmente se cumprirá sobre eles. Consequentemente, a lacuna entre a sexagésima nona semana e a septuagésima é necessária, a não ser que alguém afirme que todos os eventos registrados em Daniel 9.24-27 e Mateus 24.15-31 já ocorreram, incluindo a segunda vinda de Cristo em glória e o estabelecimento do reino, contudo, teologicamente isso seria um absurdo. Dessa forma podemos afirmar que há base suficiente para crermos que a grande tribulação ou septuagésima semana é um evento futuro e tem relações com Israel e não com a igreja (Dn 9.27; Mt 24.15; 2Ts 2.4; Ap 13.11-18).<\/p><blockquote>Mateus 24:15 Quando, pois, virdes que a abominação da desolação, de que falou o profeta Daniel, está no lugar santo; quem lê, entenda;<\/blockquote><blockquote>Daniel 9:26 E depois das sessenta e duas semanas será cortado o Messias, mas não para si mesmo; e o povo do príncipe, que há de vir, destruirá a cidade e o santuário, e o seu fim será com uma inundação; e até ao fim haverá guerra; estão determinadas as assolações.<\/blockquote><blockquote>Daniel 9:27 E ele firmará aliança com muitos por uma semana; e na metade da semana fará cessar o sacrifício e a oblação; e sobre a asa das abominações virá o assolador, e isso até à consumação; e o que está determinado será derramado sobre o assolador.<\/blockquote><blockquote>2 Tessalonicenses 2:4 O qual se opõe, e se levanta contra tudo o que se chama Deus, ou se adora; de sorte que se assentará, como Deus, no templo de Deus, querendo parecer Deus.<\/blockquote>"}, {"n": 51, "t": "A ESCATOLOGIA DE MATEUS - A GRANDE TRIBULAÇÃO", "html": "<h4>A GRANDE TRIBULAÇÃO<\/h4><blockquote>Mateus 24.21 “Porque haverá então grande aflição, como nunca houve desde o princípio do mundo até agora, nem tampouco há de haver.”<\/blockquote><p>A grande tribulação é o mesmo dia do Senhor profetizado pelos profetas no antigo testamento (Is 2.10; 13.6-13; Sf 1.15-17; Jl 2.1,2). Sempre os profetas relacionam o dia do senhor como um tempo de angustia sem precedentes:<\/p><blockquote>Daniel 12:1 E NAQUELE tempo se levantará Miguel, o grande príncipe, que se levanta a favor dos filhos do teu povo, e haverá um tempo de angústia, qual nunca houve, desde que houve nação até àquele tempo; mas naquele tempo livrar-se-á o teu povo, todo aquele que for achado escrito no livro.<\/blockquote><blockquote>Jeremias 30:7 Ah! Porque aquele dia é tão grande, que não houve outro semelhante; e é tempo de angústia para Jacó; ele, porém, será salvo dela.8 Porque será naquele dia, diz o SENHOR dos Exércitos, que eu quebrarei o seu jugo de sobre o teu pescoço, e quebrarei os teus grilhões; e nunca mais se servirão dele os estrangeiros. 9 Mas servirão ao SENHOR, seu Deus, como também a Davi, seu rei, que lhes levantarei.<\/blockquote><blockquote>Joel 2.1 “TOCAI a trombeta em Sião, e clamai em alta voz no meu santo monte; tremam todos os moradores da terra, porque o dia do SENHOR vem, já está perto; 2 Dia de trevas e de escuridão; dia de nuvens e densas trevas, como a alva espalhada sobre os montes; povo grande e poderoso, qual nunca houve desde o tempo antigo, nem depois dele haverá pelos anos adiante, de geração em geração.”<\/blockquote><blockquote>Joel 2:28 E há de ser que, depois derramarei o meu Espírito sobre toda a carne, e vossos filhos e vossas filhas profetizarão, os vossos velhos terão sonhos, os vossos jovens terão visões. 29 E também sobre os servos e sobre as servas naqueles dias derramarei o meu Espírito. 30 E mostrarei prodígios no céu, e na terra, sangue e fogo, e colunas de fumaça. 31 O sol se converterá em trevas, e a lua em sangue, antes que venha o grande e terrível dia do SENHOR. 32 E há de ser que todo aquele que invocar o nome do SENHOR será salvo; porque no monte Sião e em Jerusalém haverá livramento, assim como disse o SENHOR, e entre os sobreviventes, aqueles que o SENHOR chamar.<\/blockquote><blockquote>Joel 3:1 PORQUE, eis que naqueles dias, e naquele tempo, em que removerei o cativeiro de Judá e de Jerusalém, 9 Proclamai isto entre os gentios; preparai a guerra, suscitai os fortes; cheguem-se, subam todos os homens de guerra.<\/blockquote><blockquote>Joel 3:17 E vós sabereis que eu sou o SENHOR vosso Deus, que habito em Sião, o meu santo monte; e Jerusalém será santa; estranhos não passarão mais por ela.<\/blockquote><p>Quando Jesus descreve os eventos que antecedem seu retorno a esta terra, ele denomina esse tempo de “grande tribulação” (Mt 24.21).<\/p>"}, {"n": 52, "t": "A ESCATOLOGIA DE MATEUS - OS DIAS SERÃO ABREVIADOS", "html": "<h4>OS DIAS ABREVIADOS<\/h4><p>Hoje temos a sensação que o tempo está passando mais rápido que trinta ou quarenta anos atrás, mas essa é apenas uma sensação, pois o minuto continua tendo os mesmos sessenta segundos de sempre. Antigamente o dia, semana, mês e ano pareciam ser mais longos pelo fato de que não havia o entretenimento que existe hoje. Aguarde um médico lhe chamar para ser atendido por meia hora, com um celular na mão a tempo passa e não percebemos, mas fique sem o aparelho, fique sem conversar com alguém, meia gora parecerá uma eternidade. Hoje devido nossos muitos compromissos e o entretenimento, não percebemos o tempo, mas ele continua o mesmo. Jesus neste texto está se referindo aos dias da grande tribulação, especificamente os últimos três anos e meio, se estes dias não fossem abreviados para 2520 dias (sete anos), não sobraria ninguém vivo. Em outras palavras, Jesus está dizendo que a tribulação será tão severa que se durasse mais que sete anos todos seriam mortos, entretanto, como Deus tem seus escolhidos para entrarem no milênio, foi estabelecido apenas sete anos.<\/p><blockquote>Apocalipse 12:6 E a mulher fugiu para o deserto, onde já tinha lugar preparado por Deus, para que ali fosse alimentada durante mil duzentos e sessenta dias.<\/blockquote><blockquote>Apocalipse 13:5 E foi-lhe dada uma boca, para proferir grandes coisas e blasfêmias; e deu-se- lhe poder para agir por quarenta e dois meses.<\/blockquote>"}, {"n": 53, "t": "A ESCATOLOGIA DE MATEUS - RELÂMPAGO, CADÁVERES E ÁGUIAS", "html": "<h4>RELÂMPAGO E CADÁVERES<\/h4><p>É muito comum o pré-tribulacionista usar o exemplo do relâmpago e comparar a velocidade do arrebatamento. Devemos atentar para o fato de que em todo contexto de Mateus 24 e 25 Jesus está se referindo a sua vinda no fim da tribulação para estabelecer o reino, não para arrebatar sua igreja. Assim, Jesus está extraindo do relâmpago o seu aspecto visível, pois diz “o relâmpago sai do oriente e se ‘mostra’ phainó até o ocidente”. A questão é o termo “mostra”, pois Jesus está falando da visibilidade e não da velocidade. Com isso, nosso mestre está dizendo que da mesma forma que um relâmpago é visto do oriente ao ocidente, isto é, de um extremo ao outro, assim será sua vinda no fim da tribulação. Logo, quando alguém dizer que Jesus veio e está no deserto ou no interior da casa, os crentes da tribulação não devem dar crédito, pois como um relâmpago, a vinda de Cristo para estabelecer o reino será visível a todos (Ap 1.7). O exemplo do cadáver e as águias também são usados como exemplo de visibilidade, podemos não ver o cadáver, mas as águias sobrevoando em sua volta apontam para o fato de que ali há um cadáver. Em suma, Jesus está reiterando o que disse ao usar a figura do relâmpago, isto é, todos saberão quando ele retornar a essa terra e estiver em Jerusalém de onde estabelecerá seu reino.<\/p>"}, {"n": 54, "t": "A ESCATOLOGIA DE MATEUS - ELEITOS ARREBATADOS EM MATEUS 24.31?", "html": "<h4>ELEITOS ARREBATADOS?<\/h4><p>Os eleitos são os judeus crentes e sobreviventes a perseguição do anticristo, eles serão ajuntados por anjos ao soar de uma grande trombeta (Is 27.12-13; Dt 30.1-6).<\/p><blockquote>Isaías 27.12 “E será naquele dia que o SENHOR debulhará seus cereais desde as correntes do rio, até ao rio do Egito; e vós, ó filhos de Israel, sereis colhidos ( טקַ לָ -laqat-recolher, reunir, ajuntar). 13 E será naquele dia que se tocará uma grande trombeta, e os que andavam perdidos pela terra da Assíria, e os que foram desterrados para a terra do Egito, tornarão a vir, e adorarão ao SENHOR no monte santo em Jerusalém.”<\/blockquote><p>Por ocasião do arrebatamento, é o próprio Cristo quem arrebatará sua noiva, não anjos (Jo 14.3;<\/p><blockquote>1Ts 4.16,17). O arrebatamento da igreja não será terceirizado aos anjos, Jesus mesmo é quem nos levará ao céu, em Mateus temos anjos juntando os Israelitas sobreviventes sobre a terra. A ideia de um arrebatamento aqui é absurda, pois não há menção de ressurreição e nem mesmo do traslado. O apelo do pós-tribulacionista é em relação a expressões como “os quatro ventos, de uma a outra extremidade dos céus”, ou como Marcos 13.27 “da extremidade da terra até a extremidade do céu, para os opositores do pré-tribulacionismo isso seria uma referência ao arrebatamento. Por vários motivos devemos rejeitar essa interpretação. Primeiro, o termo usado em 1tessalonicenses 4.17 para arrebatamento é “harpazo”, aqui em Mateus o “ajuntar” é “episunago” que significa juntar algo em um local, logo não tem qualquer relação com “harpazo” cujo significado é “arrancar”, “retirar” ou “arrebatar”. Segundo, a expressão “quatro ventos do céu” não é o arrebatamento aos céus, esse termo é muito comum nos textos do profetas:<\/blockquote><blockquote>Zacarias 2.6 “Ah, ah! Fugi agora da terra do norte, diz o SENHOR, porque vos espalhei pelos quatro ventos do céu, diz o SENHOR.”<\/blockquote><p>Quando o profeta fala sobre a dispersão dos Israelitas usa a expressão “vos espalhei pelos quatro ventos do céu”, trata-se de um juízo sobre o povo, seriam eles arrebatados ao céus aqui? É certo que não, pois a ideia de “Quatro ventos dos céu” fala apenas da amplitude da dispersão, isto é, para o extremo da terra. Quando Jesus usa essa expressão em Mateus 24 está dizendo que os Israelitas espalhados ao extremo do globo terrestre serão ajudados por anjos e conduzidos a Jerusalém. O leitor deve atentar para o fato de que há mais dessemelhanças que semelhança entre o texto de Mateus e Tessalonicenses.<\/p>"}, {"n": 55, "t": "A ESCATOLOGIA DE MATEUS - OLHAI PARA A FIGUEIRA", "html": "<h4>A METÁFORA DA FIGUEIRA<\/h4><blockquote>Mateus 24:32 Aprendei, pois, esta parábola da figueira: Quando já os seus ramos se tornam tenros e brotam folhas, sabeis que está próximo o verão. 33 Igualmente, quando virdes todas estas coisas, sabei que ele está próximo, às portas. 34 Em verdade vos digo que não passará esta geração sem que todas estas coisas aconteçam. 35 O céu e a terra passarão, mas as minhas palavras não hão de passar.<\/blockquote><p>παρέρχομαι De para e erchomai; aproximar-se ou afastar-se, ou seja, aproximar-se (chegar), passar (ou afastar-se), (figurativamente) perecer ou negligenciar, (causativo) desviar — vir (para a frente), ir, passar (para longe, por cima), passado, transgredir.<\/p><p>γενεά De (um derivado presumido de) genos; uma geração; por implicação, uma era (o período ou as pessoas) — idade, geração, nação, tempo.<\/p><blockquote>Lucas 21:29 E disse-lhes uma parábola: Olhai para a figueira, e para todas as árvores; 30 Quando já brotam, vós sabeis por vós mesmos, vendo-as, que perto está já o verão.<\/blockquote><h4>HALL LINDSAY<\/h4>"}, {"n": 56, "t": "A ESCATOLOGIA DE MATEUS - O DILÚVIO, LEVADOS E DEIXADOS", "html": "<h4>QUEM SERÁ LEVADO OU DEIXADO?<\/h4><h4>ARREBATAMENTO EM MT 24.36-44<\/h4><p>Talvez esse seja o texto mais tentador para inserir um arrebatamento me Mateus 24. Lembre- se que Jesus está descrevendo os eventos que antecedem sua vinda para o estabelecimento do Reino, assim Cristo está apresentando detalhes sobre a grande tribulação e sua vinda em glória. Os temas são, grande tribulação, vinda em glória e estabelecimento do reino. Dessa forma, os que são levados é um paralelo aos que foram levados nos dias do dilúvio, isto é, foram levados em juízo, e a família de Noé foi deixada para dar continuidade a vida.<\/p><p>O dilúvio os levou (“airo” levar a força), depois será levado um “paralambano” um e deixado “aphiemi” o outro. O termo “aphíēmi” é composto pela preposição “apo” que significa \"longe de\" e “hiēmi” que traz a ideia de enviar, mandar embora, absolver, deixar de lado. O termo “paralambano” que é usado em João 14.3 também é usado para se referir ao diabo transportando Jesus à cidade santa (Mt 4.5), logo não é usado apenas em situações positivas. O que percebemos no texto de Mateus é o uso dos termos “airo” e “paralambano” como mero estilo linguístico a fim de evitar redundância, sem a intenção de lhes atribuir significados técnicos. O texto paralelo em Lucas deixa claro que os elevados não são arrebatados, mas levados pelos juízos da tribulação, sendo então mortos:<\/p><blockquote>Lucas 17.26 “E, como aconteceu nos dias de Noé, assim será também nos dias do Filho do homem. 27 Comiam, bebiam, casavam, e davam-se em casamento, até ao dia em que Noé entrou na arca, e veio o dilúvio, e os consumiu a todos.” Enquanto Mateus usa “airo” (levou), Lucas fez uso de “apollumi” cujo significado é consumir ou destruir. Assim podemos seguramente concluir que “os levados” não serão arrebatados, seja antes ou depois da tribulação, mas sim destruídos pelos juízos que serão derramados durante a grande tribulação, assim como o dilúvio levou os que não estavam na arca.<\/blockquote>"}, {"n": 57, "t": "A ESCATOLOGIA DE MATEUS - OS DOIS SERVOS", "html": "<h4>A PARÁBOLA DOS DOIS SERVOS<\/h4><p>Essa parábola revela a condição de dois tipos de pessoas durante a tribulação. Um grupo são os salvos, estes estarão aguardando a vinda de Jesus para estabelecer o reino, o outro grupo estará zombando, eles não acreditarão que estão vivendo a grande tribulação, não acreditarão que o apocalipse estará se cumprindo e Jesus está prestes a retornar. Para esses, que são ímpios, o fato de ter demorado mais de dois mil anos para Jesus voltar e estabelecer o reino, os levará a incredulidade e zombaria, por esse motivo serão pegos de surpresa quando Cristo voltar.<\/p><blockquote>2 Pedro 3:4 E dizendo: Onde está a promessa da sua vinda? Porque desde que os pais dormiram, todas as coisas permanecem como desde o princípio da criação.<\/blockquote><blockquote>Daniel 12:10 Muitos serão purificados, e embranquecidos, e provados; mas os ímpios procederão impiamente, e nenhum dos ímpios entenderá, mas os sábios entenderão.<\/blockquote><p>A mensagem central nessa parábola e nas demais é, quando o Rei chegar, quem for salvo entrará no reino, os demais serão surpreendidos e não terão segunda chance, serão condenados e deixados de fora.<\/p>"}, {"n": 58, "t": "A ESCATOLOGIA DE MATEUS - AS DEZ VIRGENS", "html": "<p>Essa parábola sempre foi interpretada como sendo o arrebatamento da igreja. Entretanto, devemos entender que Jesus está finalizando sua mensagem sobre a tribulação e vinda para estabelecer o reino, logo, não existe igreja nesse contexto, tão pouco arrebatamento. Quem popularizou a ideia de uma arrebatamento nesse texto foram os teólogos pelagianos Robert Govett e Gerge Henry Lang. Ao desenvolver a teoria do arrebatamento parcial, Govett e Lang viram nesse texto a passagem ideal para fundamentar sua heresia. O arrebatamento parcial afirma que no arrebatamento, parte da igreja (virgens prudentes) será arrebatada, o restante da noiva será deixada (as loucas) para serem purgadas durante a tribulação. Por crerem em salvação por obras, esses teólogos entendiam que apenas os mais santos ou espirituais seriam arrebatados, ao passo que os carnais é deixados. Entretanto, o texto deixa claro que não salvação para as virgens loucas,<\/p><blockquote>Mateus 25:10 E, tendo elas ido comprá-lo, chegou o esposo, e as que estavam preparadas entraram com ele para as bodas, e fechou-se a porta.<\/blockquote><blockquote>Mateus 25.11 “E depois chegaram também as outras virgens, dizendo: Senhor, Senhor, abre- nos. 12 E ele, respondendo, disse: Em verdade vos digo que não vos conheço.”<\/blockquote><p>Perceba que quando o noivo chega, quem está preparado entra e a porta se fecha, as demais virgens não serão reconhecidas. Essa parábola assim como a anterior deixa claro que, quando Jesus voltar no fim da tribulação não haverá mais oportunidade de salvação. O pré- tribulacionista que usar essa parábola para fundamentar o arrebatamento, terá que afirmar que após arrebatamento não haverá oportunidade de salvação para os que ficarem, pois na parábola não há oportunidade de salvação quando o noivo chegar. Entretanto, o livro de Apocalipse deixa evidente que durante a tribulação haverá muitos salvos dentre todos os povos línguas e nações (Ap 7.9-14).<\/p><p>Assim, afirmamos categoricamente que essa parábola nada trata sobre arrebatamento, seja pré, mid ou pós-tribulacional, e muito menos parcial. Embora as etapas do casamento judaico se harmonizem com o arrebatamento pré-tribulacional, a parábola não serve para esses fins, ainda que muitos a utilizam com esses propósitos. Uma parábola não deve ser interpretada em seus mínimos detalhes, pois não é uma alegoria. Assim a mensagem central da parábola das virgens é uma só, quando o Rei chegar, os salvos entram em seu reino e os ímpios serão deixados de fora.<\/p>"}, {"n": 59, "t": "A ESCATOLOGIA DE MATEUS - OS TALENTOS", "html": "<h4>OS DEZ TALENTOS<\/h4><p>Essa parábola apresenta os servos que recebem os talentos e negocia os multiplicando, ao passo que um dos servos esconde o talento. Creio que essa parábola, assim como as demais, apresenta dois grupo de pessoas durante a grande tribulação, ambos receberão as mesmas oportunidades de servir ao Senhor, entretanto, infelizmente alguns rejeitarão a oportunidade de salvação, e assim como as demais parábolas, essa está ensinando que não haverá oportunidades para os incrédulos quando o Rei chega, pois esses ouvirão,<\/p><blockquote>Mateus 25.30 “Lançai, pois, o servo inútil nas trevas exteriores; ali haverá pranto e ranger de dentes.”<\/blockquote><p>Esse servo não será condenado apenas pelo fato de não ter administrado o talento devidamente, mas sim por que foi incrédulo, ele não confiou no Senhor. Esse servo representa os incrédulos durante a tribulação, e por isso serão condenados, isto é, por sua incredulidade típica de um ímpio não regenerado, e dessa forma será privado do reino.<\/p><p>As três parábolas são enfáticas, no segundo advento de Jesus, haverá dois grupos de pessoas vivas, os salvos e os ímpios, entretanto, para os ímpios não haverá oportunidade de salvação quando Jesus retornar no fim da tribulação, e como consequência serão julgados e condenados ao hades.<\/p>"}, {"n": 60, "t": "A ESCATOLOGIA DE MATEUS - O JULGAMENTO DAS NAÇÕES", "html": "<blockquote>Mateus 25.31-34 “E quando o Filho do homem vier em sua glória, e todos os santos anjos com ele, então se assentará no trono da sua glória; E todas as nações serão reunidas diante dele, e apartará uns dos outros, como o pastor aparta dos bodes as ovelhas; E porá as ovelhas à sua direita, mas os bodes à esquerda. Então dirá o Rei aos que estiverem à sua direita: Vinde, benditos de meu Pai, possui por herança o reino que vos está preparado desde a fundação do mundo.”<\/blockquote><blockquote>Mateus 19:28 E Jesus disse-lhes: Em verdade vos digo que vós, que me seguistes, quando, na regeneração, o Filho do homem se assentar no trono da sua glória, também vos assentareis sobre doze tronos, para julgar as doze tribos de Israel.<\/blockquote><blockquote>Lucas 22:29 E eu vos destino o reino, como meu Pai o destinou a mim, 30 Para que comais e bebais à minha mesa no meu reino, e vos assenteis sobre tronos, julgando as doze tribos de Israel.<\/blockquote><blockquote>Mateus 26:29 E digo-vos que, desde agora, não beberei deste fruto da vide, até aquele dia em que o beba novo convosco no reino de meu Pai.<\/blockquote><blockquote>Mateus 8:11 Mas eu vos digo que muitos virão do oriente e do ocidente, e assentar-se-ão à mesa com Abraão, e Isaque, e Jacó, no reino dos céus; O desfecho do sermão escatológico apresenta um julgamento para definir quem entra ou não no Reino, este é o julgamento das nações que ocorrerá na terra após a segunda vinda, onde então bodes serão separados de ovelhas.<\/blockquote><p>No julgamento das nações os bodes são os gentios que durante a grande tribulação não prestaram assistência aos “pequeninos irmãos” de Jesus que são os Israelitas eleitos (Mt 24.31) . As ovelhas são os crentes de todas as nações, tribos e línguas que durante a grande tribulação, por serem justos (Mt 25.46), isto é, justificados em Cristo, servirão os judeus salvos. As ovelhas não entrarão no reino ou serão aceitas por meramente terem feito boas obras, mas sim por serem regeneradas, o fato de serem salvos é que os levará a prestarem os auxílios descritos por Jesus, como dar de comer, beber, hospedar e visitar os Israelitas salvos em Cristo durante a Tribulação.<\/p><p>O julgamento das nações é um grande problema para os pós-tribulacionistas que são pré- milenistas, pois após a vinda de Cristo no fim da tribulação haverá as ovelhas que sãos os justos que entrarão em seus corpos naturais para viverem uma vida terrena no milênio, casando, trabalhando e gerando filhos. Isso implica que não pode haver arrebatamento no fim da tribulação, se assim fosse, essas ovelhas teriam sido arrebatas em corpos glorificados, dessa forma não haveria o julgamentos das nações e separação entre bodes e ovelhas. Esse é um dos muitos problemas insolúveis do pré-milenismo histórico.<\/p><p>As ovelhas não são ímpios bonzinhos, são justos salvos durante a tribulação. Vale lembrar que após a vinda de Cristo no fim da tribulação, não haverá segunda chance para os ímpios. Zacarias fala sobre esses salvos (ovelhas) em outros termos:<\/p><blockquote>Zacarias 14.16 “E acontecerá que, todos os que restarem de todas as nações que vieram contra Jerusalém, subirão de ano em ano para adorar o Rei, o SENHOR dos Exércitos, e para celebrarem a festa dos tabernáculos.”<\/blockquote><p>Os que sobrarem das nações, são os salvos que não foram arregimentados para a batalha do armagedom contra Israel. E considerando que Jesus explicitamente afirma que apenas os justos entram no reino, estes que “restarem” são as ovelhas referidas por Jesus que ao entrarem no milênio viverão uma vida terrena, casando e procriando. Assim, Zacarias 14.16 deve ser entendido à luz de Mateus 25.31,32,46 onde fica evidente que não haverá salvação para os ímpios quando Jesus voltar e apenas os salvos entram no reino, estes são os restantes das nações.<\/p><p>Diante da necessidade de sustentar um arrebatamento no fim da tribulação, onde todos os justos estariam com corpos glorificados, o que inclui as ovelhas, o pós-tribulacionista, contrariando toda a mensagem de Jesus em Mateus, diz que os ímpios, isto é, os bodes entrarão no milênio! Eu penso que devemos crer em Jesus, e Ele disse que são as ovelhas, isto é, apenas os salvos em seus corpos naturais que entrarão no reino. Contudo, é muito óbvio que nem todos os que nascerem durante o milênio se converterão a Cristo, estes são os ímpios que se negarão a servir Jesus (Zc 14.17-19).<\/p>"}]}, {"n": 9, "t": "TEMPO E PLENITUDE DOS GENTIOS", "aulas": [{"n": 61, "t": "O DISCURSO ESCATOLÓGICO DE JESUS EM LUCAS 21", "html": "<p>Embora seja o mesmo sermão registrado por Mateus nos capítulos 24 e 25, Lucas entretanto, apresenta alguns detalhes que Mateus não mencionou, pois enquanto Mateus escreve para uma igreja composta por Judeus, Lucas escreve para Teófilo, que representa a igreja composta por gentios.<\/p><p>A organização da fala de Jesus em Lucas:<\/p><p>Lucas registra apenas a pergunta sobre a destruição do templo, que não fica sem resposta, mas responde também sobre o sinal da vinda e fim da era.<\/p><h4>1 - VERSOS 8 AO 11 - RESPOSTA SOBRE O SINAL DA VINDA<\/h4><h4>2 - VERSOS 12 AO 19 - O ÍNICIO DA IGREJA PERSEGUIDA<\/h4><h4>3 - VERSOS 20 AO 24 - RESPOSTA SOBRE A DESTRUIÇÃO DO TEMPLO<\/h4><h4>4 - VERSOS 25 AO 33 - RESPOSTA SOBRE O SINAL DA VINDA<\/h4><h4>5 - VERSOS 34 AO 36 - A IGREJA SERÁ ISENTA DA TRIBULAÇÃO<\/h4>"}, {"n": 62, "t": "O ARREBATAMENTO EM JOÃO 14", "html": "<p class='li'>1 - O que é a casa do pai, céu ou corpo de Cristo? Muitos pós-tribulacionistas afirmam ser a igreja.<\/p><p>O pós tem que negar que a casa do pai seja o céu, pois em sua segunda vinda após a tribulação Jesus não leva ninguém ao céu, logo a casa do pai tem que significar qualquer coisa menos o céu:<\/p><p>Rudolf Bultmann: “na morte Jesus leva o crente para morar no céu”.<\/p><p>Robert Gundry: “Casa do Pai é a Igreja, o templo de Deus”.<\/p><p>Craig Keener: “Casa do Pai é a igreja”<\/p><p>Casa do pai em João 2.16 - templo - Sl 65.4; 69.9.<\/p><p class='li'>2 - O templo pode ser uma analogia ao céu como casa do Pai?<\/p><p class='li'>R. Templo céu: Hb 8.5; 8.11, 24; Ap 13.6; 15.5; 16.1.<\/p><p class='li'>W. Hendriksen: “A casa do Pai está no céu, é uma casa com muitos aposentos”. Wener de boor: No final de sua longa trajetória encontra-se para eles essa casa do Pai, sua cidadania nos céus(Fp 3.20) está assegurada. Sua vinda é sua parusia.<\/p><p>F.F. Bruce: Aqui todavia a casa de meu Pai obviamente não é na terra; é o lar celestial para onde Jesus está indo e onde também sua gente tem um lugar prometido.<\/p><p>Everett F. Harrison: A casa de meu Pai é o templo em Jerusalém com seus vastos pátios e numerosos gabinetes, sugere o antítipo do Céu.<\/p><p class='li'>D. A. Carsom: O céu é retratado nesse ponto com a casa de meu Pai. A casa de meu Pai refere- se ao céu, e no céu há muitos aposentos.<\/p><p>Murray J. Harris: Jesus está prometendo que após sua partida da terra para o céu, ele iria providenciar muitas moradas no grande céu de Deus acomodando assim todos seus seguidores.<\/p>"}, {"n": 63, "t": "O TEMPO DOS GENTIOS", "html": "<p>Consiste no período de tempo em que Israel não tem seu Rei e o mundo é governado por ímpios, teve início com o cativeiro babilônioco e findará com a segunda vinda de Cristo à terra e o estabelecimento do reino.<\/p><blockquote>Lucas 21:24 E cairão ao fio da espada, e para todas as nações serão levados cativos; e Jerusalém será pisada pelos gentios, até que os tempos dos gentios se completem.<\/blockquote><blockquote>Daniel 2:32 A cabeça daquela estátua era de ouro fino; o seu peito e os seus braços de prata; o seu ventre e as suas coxas de cobre; 33 As pernas de ferro; os seus pés em parte de ferro e em parte de barro. 34 Estavas vendo isto, quando uma pedra foi cortada, sem auxílio de mão, a qual feriu a estátua nos pés de ferro e de barro, e os esmiuçou. 35 Então foi juntamente esmiuçado o ferro, o barro, o bronze, a prata e o ouro, os quais se fizeram como pragana das eiras do estio, e o vento os levou, e não se achou lugar algum para eles; mas a pedra, que feriu a estátua, se tornou grande monte, e encheu toda a terra. 44 Mas, nos dias desses reis, o Deus do céu levantará um reino que não será jamais destruído; e este reino não passará a outro povo; esmiuçará e consumirá todos esses reinos, mas ele mesmo subsistirá para sempre,<\/blockquote><blockquote>Daniel 7:21 Eu olhava, e eis que este chifre fazia guerra contra os santos, e prevaleceu contra eles. 24 E, quanto aos dez chifres, daquele mesmo reino se levantarão dez reis; e depois deles se levantará outro, o qual será diferente dos primeiros, e abaterá a três reis. 25 E proferirá palavras contra o Altíssimo, e destruirá os santos do Altíssimo, e cuidará em mudar os tempos e a lei; e eles serão entregues na sua mão, por um tempo, e tempos, e a metade de um tempo. 26 Mas o juízo será estabelecido, e eles tirarão o seu domínio, para o destruir e para o desfazer até ao fim. 27 E o reino, e o domínio, e a majestade dos reinos debaixo de todo o céu serão dados ao povo dos santos do Altíssimo; o seu reino será um reino eterno, e todos os domínios o servirão, e lhe obedecerão.<\/blockquote><blockquote>Daniel 9:26 E depois das sessenta e duas semanas será cortado o Messias, mas não para si mesmo; e o povo do príncipe, que há de vir, destruirá a cidade e o santuário, e o seu fim será com uma inundação; e até ao fim haverá guerra; estão determinadas as assolações.<\/blockquote>"}, {"n": 64, "t": "A PLENITUDE DOS GENTIOS", "html": "<p>Período de tempo em que a igreja é o canal bênçãos salvíficas para os povos, findará com o arrebatamento da igreja.<\/p><h4>1 - ISRAEL NÃO FOI REJEITADO<\/h4><h4>2 - A ELEIÇÃO INSTRUMENTAL E SALVÍFICA<\/h4><h4>3 - A QUEDA DE ISRAEL TROUXE SALVAÇÃO AOS GENTIOS<\/h4><h4>4 - SUA PLENITUDE E RECONCILIAÇÃO TRARÁ AINDA MAIS SALVAÇÃO<\/h4><h4>5 - A OLIVERIA, SUA RAIZ E RAMOS<\/h4><h4>6 - O FIM DA PLENITUDE DOS GENTIOS<\/h4><h4>7- A PLENITUDE DE ISRAEL<\/h4><blockquote>Mateus 21:41 Dizem-lhe eles: Dará afrontosa morte aos maus, e arrendará a vinha a outros lavradores, que a seu tempo lhe deem os frutos. 42 Diz-lhes Jesus: Nunca lestes nas Escrituras: A pedra, que os edificadores rejeitaram, essa foi posta por cabeça da esquina; pelo Senhor foi feito isto, e é maravilhoso aos nossos olhos? 43 Portanto, eu vos digo que o reino de Deus vos será tirado, e será dado a uma nação que dê os seus frutos.<\/blockquote><blockquote>Êxodo 19:6 E vós me sereis um reino sacerdotal e o povo santo. Estas são as palavras que falarás aos filhos de Israel.<\/blockquote><p>Ramos, a aliança com os patriarcas Seiva, as bênçãos da aliança Oliveira, a redenção Ramos, os instrumentos da redenção Os ramos na oliveira produzem frutos, a plenitude representa a posição de honra na oliveira, onde por meios da seiva produzem os frutos, isto é, sendo instrumentos de bênçãos salvíficas para todos os povos.<\/p><p>O texto que lida com a plenitude dos gentios é Romanos 11, onde Paulo apresenta a futura restauração do Israel, espiritual e nacional.<\/p>"}]}, {"n": 10, "t": "O ARREBATAMENTO E O DIA DO SENHOR EM PAULO", "aulas": [{"n": 65, "t": "O ARREBATAMENTO EM 1TS 4", "html": "<h4>CONTEXTO HISTÓRICO<\/h4><p>Fruto da segunda viagem At 17.1-9 (48-50), a epístola foi escrita em 49 a.C.<\/p><blockquote>1 Tessalonicenses 1:10 E esperar dos céus o seu Filho, a quem ressuscitou dentre os mortos, a saber, Jesus, que nos livra da ira futura.<\/blockquote><blockquote>1 Tessalonicenses 2:19 Porque, qual é a nossa esperança, ou gozo, ou coroa de glória? Porventura não o sois vós também diante de nosso Senhor Jesus Cristo em sua vinda?<\/blockquote><blockquote>1 Tessalonicenses 3:13 Para confirmar os vossos corações, para que sejais irrepreensíveis em santidade diante de nosso Deus e Pai, na vinda de nosso Senhor Jesus Cristo com todos os seus santos.<\/blockquote><blockquote>1 Tessalonicenses 4:13 Não quero, porém, irmãos, que sejais ignorantes acerca dos que já dormem, para que não vos entristeçais, como os demais, que não têm esperança. 14 Porque, se cremos que Jesus morreu e ressuscitou, assim também aos que em Jesus dormem, Deus os tornará a trazer com ele. 15 Dizemo-vos, pois, isto, pela palavra do Senhor: Que nós, os que ficarmos vivos para a vinda do Senhor, não precederemos os que dormem. 16 Porque o mesmo Senhor descerá do céu com alarido, e com voz de arcanjo, e com a trombeta de Deus; e os que morreram em Cristo ressuscitarão primeiro. 17 Depois nós, os que ficarmos vivos, seremos arrebatados juntamente com eles nas nuvens, a encontrar o Senhor nos ares, e assim estaremos sempre com o Senhor. 18 Portanto, consolai-vos uns aos outros com estas palavras.<\/blockquote><blockquote>Apocalipse 1:10 Eu fui arrebatado no Espírito no dia do Senhor, e ouvi detrás de mim uma grande voz, como de trombeta,<\/blockquote><blockquote>João 14:2 Na casa de meu Pai há muitas moradas; se não fosse assim, eu vo-lo teria dito. Vou preparar-vos lugar. 3 E quando eu for, e vos preparar lugar, virei outra vez, e vos levarei para mim mesmo, para que onde eu estiver estejais vós também.<\/blockquote><blockquote>Mateus 24:31 E ele enviará os seus anjos com rijo clamor de trombeta, os quais ajuntarão os seus escolhidos desde os quatro ventos, de uma à outra extremidade dos céus.<\/blockquote><blockquote>Zacarias 2:6 Ah, ah! Fugi agora da terra do norte, diz o SENHOR, porque vos espalhei pelos quatro ventos do céu, diz o SENHOR.<\/blockquote><blockquote>Deuteronômio 30:4 Ainda que os teus desterrados estejam na extremidade do céu, desde ali te ajuntará o SENHOR teu Deus, e te tomará dali;<\/blockquote><blockquote>Isaías 27:12 E será naquele dia que o SENHOR debulhará seus cereais desde as correntes do rio, até ao rio do Egito; e vós, ó filhos de Israel, sereis colhidos um a um. 13 E será naquele dia que se tocará uma grande trombeta, e os que andavam perdidos pela terra da Assíria, e os que foram desterrados para a terra do Egito, tornarão a vir, e adorarão ao SENHOR no monte santo em Jerusalém.<\/blockquote><p>A mensagem do arrebatamento é de consolo.<\/p>"}, {"n": 66, "t": "A DOUTRINA DA IMINÊNCIA", "html": "<h4>IMINÊNCIA<\/h4><blockquote>Mateus 24:36 Mas daquele dia e hora ninguém sabe, nem os anjos do céu, mas unicamente meu Pai. 44 Por isso, estai vós preparados também; porque o Filho do homem há de vir à hora em que não penseis.<\/blockquote><blockquote>Tiago 5:8 Sede vós também pacientes, fortalecei os vossos corações; porque já a vinda do Senhor está próxima.<\/blockquote><p>Iminência - didaquê: “vigiai pelo bem de vossa vida. Não deixai vossa lâmpada se apagar, nem vosso lombo sem cingir; estais prontos, pois não sabeis a que horas virá nosso Senhor”. Clemente: “Em verdade, breve e subitamente, sua vontade será realizada, do que as Escrituras também dão testemunho dizendo: Brevemente ele virá, e não tardará; e o Senhor virá subtamente”.<\/p><p>Não é em breve - Em breve é o que deve ocorrer em curto período de tempo, sendo assim breve. A vinda de Cristo é dita ser em breve, mas ainda não ocorreu.<\/p><p>Um evento súbito, o qual não sabemos quando ocorrerá. Muitos eventos PODEM ocorrer antes do grande evento iminente, mas nenhum evento específico DEVE ocorrer antes do grande evento iminente.<\/p><p>(eggízō) ocorre 14 vezes no tempo perfeito grego (modo indicativo) no NT que expressa \"proximidade extrema, iminência imediata - até mesmo uma presença ('Está aqui').<\/p><h4>OS TEXTOS DE JOÃO 14 E 1 TESSALONICENSES 4.13-18 NÃO FALAM SOBRE<\/h4><h4>SINAIS<\/h4>"}, {"n": 67, "t": "O ARREBATAMENTO - UM MISTÉRIO REVELADO À PAULO", "html": "<blockquote>Efésios 3:4 Por isso, quando ledes, podeis perceber a minha compreensão do mistério de Cristo, 5 O qual noutros séculos não foi manifestado aos filhos dos homens, como agora tem sido revelado pelo Espírito aos seus santos apóstolos e profetas; 6 A saber, que os gentios são co- herdeiros, e de um mesmo corpo, e participantes da promessa em Cristo pelo evangelho; 9 E demonstrar a todos qual seja a comunhão do mistério, que desde os séculos esteve oculto em Deus, que tudo criou por meio de Jesus Cristo;<\/blockquote><blockquote>1 Coríntios 15:51 Eis aqui vos digo um mistério: Na verdade, nem todos dormiremos, mas todos seremos transformados; 52 Num momento, num abrir e fechar de olhos, ante a última trombeta; porque a trombeta soará, e os mortos ressuscitarão incorruptíveis, e nós seremos transformados.<\/blockquote><h4>O AT FALOU SOBRE O PRIMEIRO E SEGUNDO ADVENTOS DE CRISTO, MAS NADA<\/h4><h4>REVELOU SOBRE O ARREBATAMENTO. JESUS FOI O PRIMEIRO, E OS DETALHES<\/h4><h4>FORAM REVELADOS POR MEIO DE PAULO.<\/h4><h4>IGREJA E O RAPTO SÃO MISTÉRIOS<\/h4>"}, {"n": 68, "t": "A IGREJA SERÁ ARREBATADA ANTES DA GRANDE TRIBULAÇÃO", "html": "<h4>O ARREBATAMENTO PRÉ-TRIBULACIONAL<\/h4><blockquote>1 Tessalonicenses 1:10 E esperar dos céus o seu Filho, a quem ressuscitou dentre os mortos, a saber, Jesus, que nos livra da ira futura.<\/blockquote><blockquote>1 Tessalonicenses 2:16 E nos impedem de pregar aos gentios para que possam ser salvos, a fim de encherem sempre a medida de seus pecados; mas a ira de Deus caiu sobre eles até ao fim.<\/blockquote><blockquote>1 Tessalonicenses 5:9 Porque Deus não nos destinou para a ira, mas para a aquisição da salvação, por nosso Senhor Jesus Cristo,<\/blockquote><blockquote>Apocalipse 15:1 E VI outro grande e admirável sinal no céu: sete anjos, que tinham as sete últimas pragas; porque nelas é consumada a ira de Deus.<\/blockquote><blockquote>1 Tessalonicenses 4:16 Porque o mesmo Senhor descerá do céu com alarido, e com voz de arcanjo, e com a trombeta de Deus; e os que morreram em Cristo ressuscitarão primeiro.<\/blockquote><blockquote>Daniel 12:1 E NAQUELE tempo se levantará Miguel, o grande príncipe, que se levanta a favor dos filhos do teu povo, e haverá um tempo de angústia, qual nunca houve, desde que houve nação até àquele tempo; mas naquele tempo livrar-se-á o teu povo, todo aquele que for achado escrito no livro.<\/blockquote><blockquote>Daniel 10:13 Mas o príncipe do reino da Pérsia me resistiu vinte e um dias, e eis que Miguel, um dos primeiros príncipes, veio para ajudar-me, e eu fiquei ali com os reis da Pérsia.<\/blockquote>"}, {"n": 69, "t": "O DIA DO SENHOR EM 1TS 5", "html": "<blockquote>1 Tessalonicenses 5:1 MAS, irmãos, acerca dos tempos e das estações, não necessitais de que se vos escreva; 2 Porque vós mesmos sabeis muito bem que o dia do Senhor virá como o ladrão de noite; 3 Pois que, quando disserem: Há paz e segurança, então lhes sobrevirá repentina destruição, como as dores de parto àquela que está grávida, e de modo nenhum escaparão. 4 Mas vós, irmãos, já não estais em trevas, para que aquele dia vos surpreenda como um ladrão; 5 Porque todos vós sois filhos da luz e filhos do dia; nós não somos da noite nem das trevas. 6 Não durmamos, pois, como os demais, mas vigiemos, e sejamos sóbrios; 7 Porque os que dormem, dormem de noite, e os que se embebedam, embebedam-se de noite. 8 Mas nós, que somos do dia, sejamos sóbrios, vestindo-nos da couraça da fé e do amor, e tendo por capacete a esperança da salvação; 9 Porque Deus não nos destinou para a ira, mas para a aquisição da salvação, por nosso Senhor Jesus Cristo, 10 Que morreu por nós, para que, quer vigiemos, quer durmamos, vivamos juntamente com ele. 11 Por isso exortai-vos uns aos outros, e edificai-vos uns aos outros, como também o fazeis.<\/blockquote><h4>AS TREVAS É O DIA DO SENHOR<\/h4><blockquote>Sofonias 1:14 O grande dia do SENHOR está perto, sim, está perto, e se apressa muito; amarga é a voz do dia do SENHOR; clamará ali o poderoso. 15 Aquele dia será um dia de indignação, dia de tribulação e de angústia, dia de alvoroço e de assolação, dia de trevas e de escuridão, dia de nuvens e de densas trevas,<\/blockquote><blockquote>Joel 2:1 TOCAI a trombeta em Sião, e clamai em alta voz no meu santo monte; tremam todos os moradores da terra, porque o dia do SENHOR vem, já está perto; 2 Dia de trevas e de escuridão; dia de nuvens e densas trevas, como a alva espalhada sobre os montes; povo grande e poderoso, qual nunca houve desde o tempo antigo, nem depois dele haverá pelos anos adiante, de geração em geração.<\/blockquote><h4>A IRA É O DIA DO SENHOR<\/h4><blockquote>Isaías 13:9 Eis que vem o dia do SENHOR, horrendo, com furor e ira ardente, para pôr a terra em assolação, e dela destruir os pecadores. 13 Por isso farei estremecer os céus; e a terra se moverá do seu lugar, por causa do furor do SENHOR dos Exércitos, e por causa do dia da sua ardente ira.<\/blockquote><h4>A IRA É A GRANDE TRIBULAÇÃO<\/h4><blockquote>Lucas 21:23 Mas ai das grávidas, e das que criarem naqueles dias! Porque haverá grande aperto na terra, e ira sobre este povo.<\/blockquote><blockquote>Apocalipse 15:1 E VI outro grande
