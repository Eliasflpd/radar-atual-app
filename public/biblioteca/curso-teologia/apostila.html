<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apostila — Escatologia Avançada</title>
<style>
  :root{--bg:#f5f7fb;--paper:#ffffff;--txt:#1b2436;--navy:#0f3d5c;--navy2:#14507a;--teal:#0f6d78;--dourado:#a9791c;--dourado2:#c79233;--linha:#e4e7ec;--suave:#6b7480}
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,Arial,sans-serif;max-width:820px;margin:0 auto;min-height:100dvh}
  header{background:var(--navy);color:#fff;padding:calc(9px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(15,61,92,.22)}
  header .t{flex:1;min-width:0}
  header .t b{display:block;font-size:1.02rem;line-height:1.15}
  header .t span{font-size:.73rem;color:#bcd3dc}
  header button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:9px;padding:9px 11px;font-weight:700;font-family:inherit;cursor:pointer;font-size:.88rem;flex-shrink:0}
  .wrap{padding:16px 15px 60px}

  /* GATE */
  #gate{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;text-align:center;gap:14px}
  #gate .lock{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--teal));display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 10px 30px rgba(15,61,92,.28)}
  #gate h2{margin:4px 0 0;color:var(--navy);font-size:1.3rem}
  #gate p{margin:0;color:var(--suave);font-size:.95rem;max-width:330px;line-height:1.5}
  #gate .campo{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
  #gate input{border:1.6px solid var(--linha);border-radius:13px;padding:14px 16px;font-size:1.05rem;font-family:inherit;text-align:center;background:#fff}
  #gate input:focus{outline:none;border-color:var(--teal)}
  #gate .btn{background:var(--navy);color:#fff;border:none;border-radius:13px;padding:14px;font-size:1.05rem;font-weight:800;font-family:inherit;cursor:pointer}
  #gate .erro{color:#a8162a;font-size:.9rem;font-weight:700;min-height:18px}

  /* CONTENT */
  #livro{display:none}
  .capa{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:22px 20px;margin-bottom:16px;box-shadow:0 10px 28px rgba(15,61,92,.2);text-align:center}
  .capa .badge{display:inline-block;background:rgba(255,255,255,.16);color:#ffe4a8;font-size:.7rem;font-weight:800;letter-spacing:.7px;padding:5px 12px;border-radius:20px;text-transform:uppercase}
  .capa h1{margin:12px 0 4px;font-family:Georgia,'Times New Roman',serif;font-size:1.75rem;line-height:1.12;letter-spacing:.2px}
  .capa .prof{color:#cfe3ec;font-size:.95rem;font-style:italic}
  .capa .rule{width:52px;height:3px;background:var(--dourado2);border-radius:3px;margin:14px auto 0}
  .capa .stats{display:flex;justify-content:center;gap:26px;margin-top:16px;font-size:.76rem;color:#e7f1f6}
  .capa .stats b{display:block;font-size:1.25rem;color:#ffd98a;font-family:Georgia,serif}

  .bloco{background:var(--paper);border:1px solid var(--linha);border-radius:15px;padding:20px 20px 6px;margin-bottom:16px;box-shadow:0 2px 8px rgba(20,40,70,.05)}
  .bloco h2.sec{margin:0 0 10px;color:var(--navy);font-family:Georgia,serif;font-size:1.22rem;display:flex;align-items:center;gap:9px}
  .bloco h2.sec:before{content:"";width:5px;height:22px;background:var(--dourado);border-radius:3px}
  .apr p{font-family:Georgia,'Times New Roman',serif;font-size:1.02rem;line-height:1.72;text-align:justify;color:#243043;margin:0 0 14px;hyphens:auto}

  /* INDICE */
  #indice .ix{display:block;text-decoration:none;color:inherit;border:1px solid var(--linha);border-radius:12px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;background:#fff;transition:border-color .15s,background .15s}
  #indice .ix:active{background:#f2f6fb}
  #indice .ix .n{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.92rem;flex-shrink:0;font-family:Georgia,serif}
  #indice .ix .ti{flex:1;min-width:0}
  #indice .ix .ti b{display:block;font-size:.98rem;color:var(--navy);line-height:1.25}
  #indice .ix .ti span{font-size:.74rem;color:var(--suave)}
  #indice .ix .seta{color:var(--dourado);font-size:1.05rem}

  /* MODULOS */
  .mod{background:var(--paper);border:1px solid var(--linha);border-radius:15px;margin-bottom:13px;overflow:hidden;box-shadow:0 2px 8px rgba(20,40,70,.05);scroll-margin-top:64px}
  .mod-h{display:flex;align-items:center;gap:12px;padding:16px 16px;cursor:pointer;user-select:none}
  .mod-h .n{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0;font-family:Georgia,serif}
  .mod-h .ti{flex:1;min-width:0}
  .mod-h .ti small{display:block;font-size:.68rem;color:var(--dourado);font-weight:800;letter-spacing:.6px;text-transform:uppercase}
  .mod-h .ti b{display:block;font-size:1.06rem;color:var(--navy);line-height:1.22;font-family:Georgia,serif}
  .mod-h .ti span{font-size:.74rem;color:var(--suave)}
  .mod-h .seta{color:var(--dourado);font-size:1.15rem;transition:transform .2s;flex-shrink:0}
  .mod.aberto .seta{transform:rotate(90deg)}
  .mod-body{display:none;border-top:1px solid var(--linha);padding:6px 20px 12px}
  .mod.aberto .mod-body{display:block}

  .aula{padding:16px 0 6px;border-top:1px dashed #e7ebf1}
  .aula:first-child{border-top:none}
  .aula h3{margin:0 0 10px;color:var(--navy);font-family:Georgia,serif;font-size:1.12rem;line-height:1.28;display:flex;gap:9px;align-items:baseline}
  .aula h3 .an{color:var(--dourado);font-size:.82rem;font-weight:800;flex-shrink:0;letter-spacing:.4px}
  .aula p{font-family:Georgia,'Times New Roman',serif;font-size:1.03rem;line-height:1.74;text-align:justify;color:#222c3c;margin:0 0 13px;hyphens:auto}
  .aula p.li{margin:0 0 6px;padding-left:16px;text-align:left;border-left:2px solid #eadfbe}
  .aula p.soon{color:var(--suave);font-style:italic;background:#fff8e6;border-left:3px solid var(--dourado);padding:11px 14px;border-radius:8px;text-align:left}
  .aula h4{margin:16px 0 8px;color:var(--teal);font-size:.82rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
  .aula blockquote{margin:0 0 13px;padding:11px 15px;background:#f3f7fb;border-left:4px solid var(--navy2);border-radius:0 9px 9px 0;font-family:Georgia,serif;font-size:.97rem;line-height:1.62;color:#2b3a4d;font-style:italic}

  /* FLOAT */
  #toTop{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;border:none;border-radius:24px;padding:11px 16px;font-weight:800;font-family:inherit;font-size:.86rem;cursor:pointer;box-shadow:0 6px 18px rgba(15,61,92,.35);z-index:30;display:none}
  #toTop.on{display:block}
  footer{text-align:center;color:var(--suave);font-size:.78rem;padding:26px 16px calc(28px + env(safe-area-inset-bottom));line-height:1.6}
  footer b{color:var(--navy)}
</style>
</head>
<body>
  <header>
    <button onclick="location.href='/biblioteca/curso-teologia/'">‹ Voltar</button>
    <div class="t"><b>📖 Apostila</b><span>Escatologia Avançada</span></div>
    <button onclick="location.href='/'">🏠</button>
  </header>

  <div id="gate">
    <div class="lock">🔒</div>
    <h2>Material particular</h2>
    <p>Esta apostila é sua. Digite a senha para abrir a leitura completa do curso.</p>
    <div class="campo">
      <input id="senha" type="password" placeholder="Senha" autocomplete="off" enterkeyhint="go">
      <button class="btn" id="btnEntrar" onclick="entrar()">Abrir apostila 🔓</button>
      <div class="erro" id="erro"></div>
    </div>
  </div>

  <div id="livro" class="wrap"></div>
  <button id="toTop" onclick="irIndice()">↑ Índice</button>

<script>
const $=id=>document.getElementById(id);
const DATA={"apr": "<p>O conteúdo do presente texto serve como material de apoio ao curso “ESCATOLOGIA<\/p><p>AVANÇADA”. O texto está sincronizado com as aulas, para um maior aproveitamento das<\/p><p>aulas é essencial que o aluno esteja com o texto da respectiva aula em mãos.<\/p><p>O curso de escatologia avançada foi elaborado para atender as necessidades do iniciante ao<\/p><p>avançado em escatologia. Evitei o uso excessivo de termos técnicos, pois o objetivo é que até<\/p><p>uma criança compreenda o conteúdo ministrado nas aulas. O grande diferencial deste curso<\/p><p>consiste em informações exclusivas e inéditas, fruto de minhas pesquisas nas melhores obras<\/p><p>escatológicas disponíveis apenas em inglês.<\/p><p>Sou responsável pela tradução e revisão dos melhores autores da escatologia<\/p><p>dispensacionalista, se vc já leu John Walvoord, Renald Showers, Darrell Bock, Craig Blaising,<\/p><p>William Watson dentre outros, provavelmente já teve contato com alguma obra que passou por<\/p><p>minhas mãos.<\/p><p>As aulas e o presente texto lhe proporcionará condições de ministrar em seminários, escolas<\/p><p>bíblicas e teológicas com maestria, pois boa parte das informações deste curso foram extraídas<\/p><p>de obras cujo conteúdo foram apresentados como tese de mestrado e doutorado antes de serem<\/p><p>publicadas.<\/p>", "mods": [{"n": 1, "t": "HERMENÊUTICA ESCATOLÓGICA", "aulas": [{"n": 1, "t": "ESCATOLOGIA - DEFININDO OS TERMOS", "html": "<p>Definição Éschatos (últmo) + Logos (estudo) = O estudo do fim, ou “o estudo das últimas coisas. Por que os teólogos só se debruçaram sobre essa temática teológica nos últimos séculos?<\/p><blockquote>Daniel 12:4 E tu, Daniel, fecha estas palavras e sela este livro, até ao fim do tempo; muitos correrão de uma parte para outra, e a ciência se multiplicará.<\/blockquote><blockquote>Daniel 12:4 Porém tu, ó querido Daniel, tranca em segredo, mediante um selo, as palavras do Livro, até o tempo próprio do fim. Muitos farão de tudo e correrão de uma parte a outra em busca do maior saber; e o conhecimento se multiplicará muitas e muitas vezes!”<\/blockquote><p>A necessidade e importância do estudo escatológico<\/p><p class='li'>a - Diz respeito ao nosso destino eterno<\/p><p class='li'>b - Compreender que estamos na reta final<\/p><p class='li'>c - Não ser levado por ventos de doutrinas<\/p><p class='li'>d - Saber responder a quem perguntar sobre o fim dos tempos O objetivo desse curso:<\/p><p class='li'>a - Estabelecer o fundamento histórico e teológico do pré-milenismo dispensacionalista.<\/p><p class='li'>b - Esclarecer questões complexas da escatologia para o iniciante e mestres.<\/p><p class='li'>c - Preparar pastores e pregadores a pregarem sobre o arrebatamento, o fim dos tempos e a eternidade com convicção e clareza.<\/p><p>O curso apresentará uma visão geral e detalhada sobre sobre as diversas vertentes escatológicas, em seu aspecto histórico e teológico.<\/p>"}, {"n": 2, "t": "HERMENÊUTICA ESCATOLÓGICA - ALIANCISMO X DISPENSACIONALISMO", "html": "<h4>HERMENÊUTICA GERAL<\/h4><p>Toda literatura teológica, exposição bíblica, cânticos, liturgias e práticas cristãs são resultantes de nossas interpretações bíblicas, assim podemos afirmar que toda posição escatológica é resultado de Hermenêutica.<\/p><h4>HERMENÊUTICA ESCATOLÓGICA<\/h4><p>A grande questão que deixa muitos perplexos é, porque há tantas divergências no campo escatológico? Podemos afirmar seguramente que boa parte da discordância entre os escatólogos se dá devido ao método hermenêutico empregado na interpretação das profecias, pois métodos diferentes nos levará a entendimentos distintos.<\/p><h4>A - MÉTODO ALEGÓRICO (ESPIRITUALISTA)<\/h4><p class='li'>1 - Faz de Israel a Igreja<\/p><p class='li'>2 - As promessas feitas a Israel são transferidas a Igreja<\/p><p class='li'>3 - O milênio já está ocorrendo<\/p><p class='li'>4 - O dia do Senhor (grande tribulação) é para Igreja Martinho Lutero chegou a comparar o método alegórico como a escória, algo fétido que para nada serve, Calvino disse que essa metodologia veio das profundezas do inferno com o intuito de obscurecer o sentido claro das escrituras, verdades que todo dispensacionalista concorda<\/p><h4>B - MÉTODO LITERAL (HISTÓRICO GRAMATICAL)<\/h4><p class='li'>1 - O texto é considerado em seu sentido simples e comum<\/p><p class='li'>2 - Distinção entre Israel e Igreja<\/p><p class='li'>3 - A identificação de programas escatológicos distintos<\/p><p class='li'>4 - Milênio (reino mediatório - intermediário) para Israel<\/p><p class='li'>5 - O dia do Senhor (grande tribulação) para Israel<\/p><blockquote>Jeremias 30:7 Ah! Porque aquele dia é tão grande, que não houve outro semelhante; e é tempo de angústia para Jacó; ele, porém, será salvo dela.<\/blockquote><blockquote>Joel 2:1 TOCAI a trombeta em Sião, e clamai em alta voz no meu santo monte; tremam todos os moradores da terra, porque o dia do SENHOR vem, já está perto; 2 Dia de trevas e de escuridão; dia de nuvens e densas trevas, como a alva espalhada sobre os montes; povo grande e poderoso, qual nunca houve desde o tempo antigo, nem depois dele haverá pelos anos adiante, de geração em geração.<\/blockquote><p>Como o profeta e o povo que recebeu essa mensagem a entendeu?<\/p>"}, {"n": 3, "t": "O USO DO ANTIGO NO NOVO TESTAMENTO - AMÓS 9 EM ATOS 15", "html": "<h4>O ANTIGO TESTAMENTO NO NOVO TESTAMENTO<\/h4><p>O texto do antigo testamento deve ser compreendido à luz de seu contexto (gramatical e histórico) primeiramente, sem a dependência do novo testamento, caso contrário os profetas e leitores desses textos estariam na mais absoluta trevas.<\/p><h4>AMÓS 9 EM ATOS 15<\/h4><blockquote>Amós 9:11 Naquele dia tornarei a levantar o tabernáculo caído de Davi, e repararei as suas brechas, e tornarei a levantar as suas ruínas, e o edificarei como nos dias da antiguidade; 12 Para que possuam o restante de Edom, e todos os gentios que são chamados pelo meu nome, diz o SENHOR, que faz essas coisas.<\/blockquote><blockquote>Atos dos Apóstolos 15:15 E com isto concordam as palavras dos profetas; como está escrito: 16 Depois disto voltarei, e reedificarei o tabernáculo de Davi, que está caído, levantá-lo-ei das suas ruínas, e tornarei a edificá-lo. 17 Para que o restante dos homens busque ao Senhor, e todos os gentios, sobre os quais o meu nome é invocado, diz o Senhor, que faz todas estas coisas,<\/blockquote>"}, {"n": 4, "t": "O USO DO ANTIGO NO NOVO TESTAMENTO - OSEIAS 11 EM MATEUS 2", "html": "<h4>OSÉIAS 11 EM MATEUS 2<\/h4><blockquote>Oséias 11:1 QUANDO Israel era menino, eu o amei; e do Egito chamei a meu filho.<\/blockquote><blockquote>Mateus 2:15 E esteve lá, até à morte de Herodes, para que se cumprisse o que foi dito da parte do Senhor pelo profeta, que diz: Do Egito chamei o meu Filho.<\/blockquote>"}, {"n": 5, "t": "O USO DO ANTIGO NO NOVO TESTAMENTO - JOEL 2 EM ATOS 2", "html": "<h4>JOEL 2 EM ATOS 2<\/h4><blockquote>Joel 2:28 E há de ser que, depois derramarei o meu Espírito sobre toda a carne, e vossos filhos e vossas filhas profetizarão, os vossos velhos terão sonhos, os vossos jovens terão visões.<\/blockquote><blockquote>Atos dos Apóstolos 2:16 Mas isto é o que foi dito pelo profeta Joel: 17 E nos últimos dias acontecerá, diz Deus, que do meu Espírito derramarei sobre toda a carne; E os vossos filhos e as vossas filhas profetizarão, os vossos jovens terão visões, e os vossos velhos sonharão sonhos; 18 E também do meu Espírito derramarei sobre os meus servos e sobre as minhas servas naqueles dias, e profetizarão;<\/blockquote>"}]}, {"n": 2, "t": "ALIANÇAS", "aulas": [{"n": 6, "t": "ALIANÇAS BÍBLICAS E SUAS RELAÇÕES COM A ESCATOLOGIA", "html": "<h4>AS CINCO ALIANÇAS BÍBLICAS<\/h4><h4>1 - ALIANÇA ABRAÂMICA<\/h4><h4>2 - ALIANÇA DO SINAI<\/h4><h4>3 - ALIANÇA PALESTÍNICA<\/h4><h4>4 - ALIANÇA DAVÍDICA<\/h4><h4>5 - NOVA ALIANÇA<\/h4>"}, {"n": 7, "t": "ALIANÇA ABRAÂMICA - DESCENDÊNCIA E TERRA", "html": "<h4>ALIANÇA ABRAÂMICA<\/h4><h4>UMA ALIANÇA INCONDICIONAL<\/h4><blockquote>Gênesis 15.9 “E disse-lhe: Toma-me uma bezerra de três anos, e uma cabra de três anos, e um carneiro de três anos, uma rola e um pombinho. 10 E trouxe-lhe todos estes, e partiu-os pelo meio, e pôs cada parte deles em frente da outra; mas as aves não partiu. 17 E sucedeu que, posto o sol, houve escuridão, e eis um forno de fumaça, e uma tocha de fogo, que passou por aquelas metades. 18 Naquele mesmo dia fez o SENHOR uma aliança com Abrão, dizendo: À tua descendência tenho dado esta terra, desde o rio do Egito até ao grande rio Eufrates”.<\/blockquote><h4>A BENÇÃO ATRELADA A ALIANÇA<\/h4><blockquote>Gênesis 12.7 “E apareceu o SENHOR a Abrão, e disse: À tua descendência darei esta terra. E edificou ali um altar ao SENHOR, que lhe aparecera.”<\/blockquote><h4>A ALIANÇA PROMETE A POSSE DA TERRA PARA SEMPRE<\/h4><blockquote>Gênesis 13:15 Porque toda esta terra que vês, te hei de dar a ti, e à tua descendência, para sempre<\/blockquote><h4>PROMESSA CONFIRMADA PELOS PROFETAS<\/h4><blockquote>Amós 9:11 Naquele dia tornarei a levantar o tabernáculo caído de Davi, e repararei as suas brechas, e tornarei a levantar as suas ruínas, e o edificarei como nos dias da antiguidade; 12 Para que possuam o restante de Edom, e todos os gentios que são chamados pelo meu nome, diz o SENHOR, que faz essas coisas. 13 Eis que vêm dias, diz o SENHOR, em que o que lavra alcançará ao que sega, e o que pisa as uvas ao que lança a semente; e os montes destilarão mosto, e todos os outeiros se derreterão. 14 E trarei do cativeiro meu povo Israel, e eles reedificarão as cidades assoladas, e nelas habitarão, e plantarão vinhas, e beberão o seu vinho, e farão pomares, e lhes comerão o fruto. 15 E plantá-los-ei na sua terra, e não serão mais arrancados da sua terra que lhes dei, diz o SENHOR teu Deus<\/blockquote><blockquote>Romanos 11:28 Assim que, quanto ao evangelho, são inimigos por causa de vós; mas, quanto à eleição, amados por causa dos pais. 29 Porque os dons e a vocação de Deus são sem arrependimento.<\/blockquote><blockquote>Isaías 65:17 Porque, eis que eu crio novos céus e nova terra; e não haverá mais lembrança das coisas passadas, nem mais se recordarão. 18 Mas vós folgareis e exultareis perpetuamente no que eu crio; porque eis que crio para Jerusalém uma alegria, e para o seu povo gozo. 19 E exultarei em Jerusalém, e me alegrarei no meu povo; e nunca mais se ouvirá nela voz de choro nem voz de clamor.<\/blockquote>"}, {"n": 8, "t": "ALIANÇA SINAÍTICA - UMA NAÇÃO SACERDOTAL", "html": "<h4>ALIANÇA SINAÍTICA<\/h4><h4>OS TERMOS DA ALIANÇA<\/h4><blockquote>Êxodo 19:5 Agora, pois, se diligentemente ouvirdes a minha voz e guardardes a minha aliança, então sereis a minha propriedade peculiar dentre todos os povos, porque toda a terra é minha. 6 E vós me sereis um reino sacerdotal e o povo santo. Estas são as palavras que falarás aos filhos de Israel.<\/blockquote><h4>1 - UMA ALIANÇA CONDICIONAL<\/h4><p>“se diligentemente ouvirdes a minha voz e guardardes a minha aliança”<\/p><h4>2 - A BENÇÃO<\/h4><p>“propriedade peculiar” - “reino sacerdotal”<\/p><h4>3 - A QUEBRA DA ALIANÇA<\/h4><blockquote>Êxodo 32:19 E aconteceu que, chegando Moisés ao arraial, e vendo o bezerro e as danças, acendeu-se-lhe o furor, e arremessou as tábuas das suas mãos, e quebrou-as ao pé do monte;<\/blockquote><h4>APENAS LEVI É SACERDOTE<\/h4><blockquote>Êxodo 32:26 Pôs-se em pé Moisés na porta do arraial e disse: Quem é do SENHOR, venha a mim. Então se ajuntaram a ele todos os filhos de Levi.<\/blockquote><blockquote>Números 3:6 Faze chegar a tribo de Levi, e põe-na diante de Arão, o sacerdote, para que o sirvam,<\/blockquote><h4>O POVO NÃO TOMA POSSE DA TERRA<\/h4><h4>A IGREJA É INSERIDA NA OLIVEIRA<\/h4><blockquote>Mateus 21:43 Portanto, eu vos digo que o reino de Deus vos será tirado, e será dado a uma nação que dê os seus frutos.<\/blockquote><blockquote>Romanos 11:12 E se a sua queda é a riqueza do mundo, e a sua diminuição a riqueza dos gentios, quanto mais a sua plenitude! 15 Porque, se a sua rejeição é a reconciliação do mundo, qual será a sua admissão, senão a vida dentre os mortos? 24 Porque, se tu foste cortado da natural oliveira brava e, contra a natureza, enxertado na boa oliveira, quanto mais esses, que são naturais, serão enxertados na sua própria oliveira! 25 Porque não quero, irmãos, que ignoreis este segredo (para que não sejais sábios em vós mesmos): que o endurecimento veio em parte sobre Israel, até que a plenitude dos gentios haja entrado. 26 E assim todo o Israel será salvo, como está escrito: De Sião virá o Libertador, e desviará de Jacó as impiedades.<\/blockquote>"}, {"n": 9, "t": "ALIANÇA PALESTÍNICA - A POSSE DA TERRA PROMETIDA", "html": "<h4>ALIANÇA PALESTÍNICA<\/h4><blockquote>Deuteronômio 30:5 E o SENHOR teu Deus te trará à terra que teus pais possuíram, e a possuirás; e te fará bem, e te multiplicará mais do que a teus pais. 6 E o SENHOR teu Deus circuncidará o teu coração, e o coração de tua descendência, para amares ao SENHOR teu Deus com todo o coração, e com toda a tua alma, para que vivas.<\/blockquote><h4>UMA TERRA COMO BENÇÃO<\/h4><p>“E o SENHOR teu Deus te trará à terra que teus pais possuíram, e a possuirás”<\/p><h4>O ASPECTO INCONDICIONAL DA ALIANÇA<\/h4><p>“o SENHOR teu Deus circuncidará o teu coração, e o coração de tua descendência”<\/p><h4>SERÃO ENXERTADOS NA OLIVEIRA<\/h4><blockquote>Romanos 11:23 E também eles, se não permanecerem na incredulidade, serão enxertados; porque poderoso é Deus para os tornar a enxertar. 25 Porque não quero, irmãos, que ignoreis este segredo (para que não sejais sábios em vós mesmos): que o endurecimento veio em parte sobre Israel, até que a plenitude dos gentios haja entrado.<\/blockquote>"}, {"n": 10, "t": "ALIANÇA DAVÍDICA - A PROMESSA DE UM REI", "html": "<h4>ALIANÇA DAVÍDICA<\/h4><p>A importância da aliança abraâmica e davídica para o pré-milenismo é compreendida por todo estudioso que as interpretam literalmente, enquanto a primeira apresenta a terra cuja posse é perpétua, a segunda aponta para um Rei e seu reino, que será eterno.<\/p><h4>UMA ALIANÇA INCONDICIONAL<\/h4><blockquote>2 Samuel 7:12 Quando teus dias forem completos, e vieres a dormir com teus pais, então farei levantar depois de ti um dentre a tua descendência, o qual sairá das tuas entranhas, e estabelecerei o seu reino. 13 Este edificará uma casa ao meu nome, e confirmarei o trono do seu reino para sempre.<\/blockquote><h4>UM REINO ETERNO<\/h4><p>“e confirmarei o trono do seu reino para sempre”<\/p><h4>CONFIRMADO NO AT<\/h4><blockquote>Isaías 9:6 Porque um menino nos nasceu, um filho se nos deu, e o principado estará sobre os seus ombros, e se chamará o seu nome: Maravilhoso, Conselheiro, Deus Forte, Pai da Eternidade, Príncipe da Paz. 7 Do aumento deste principado e da paz não haverá fim, sobre o trono de Davi e no seu reino, para o firmar e o fortificar com juízo e com justiça, desde agora e para sempre; o zelo do SENHOR dos Exércitos fará isto.<\/blockquote><blockquote>Oséias 3:5 Depois tornarão os filhos de Israel, e buscarão ao SENHOR seu Deus, e a Davi, seu rei; e temerão ao SENHOR, e à sua bondade, no fim dos dias.<\/blockquote><h4>CONFIRMADO NO NT<\/h4><blockquote>Lucas 1:31 E eis que em teu ventre conceberás e darás à luz um filho, e chamarás o seu nome Jesus. 32 Este será grande, e será chamado filho do Altíssimo; e o Senhor Deus lhe dará o trono de Davi, seu pai; 33 E reinará eternamente na casa de Jacó, e o seu reino não terá fim.<\/blockquote><h4>CRISTO CUMPRE A ALIANÇA DAVÍDICA<\/h4><blockquote>Mateus 8:11 Mas eu vos digo que muitos virão do oriente e do ocidente, e assentar-se-ão à mesa com Abraão, e Isaque, e Jacó, no reino dos céus;<\/blockquote><h4>OBJEÇÃO<\/h4><h4>CRISTO JÁ ESTÁ ASSENTADO NO TRONO DE DAVI<\/h4><h4>RESPOSTA<\/h4><blockquote>Apocalipse 3:21 Ao que vencer lhe concederei que se assente comigo no meu trono; assim como eu venci, e me assentei com meu Pai no seu trono.<\/blockquote>"}, {"n": 11, "t": "A NOVA ALIANÇA - REDENÇÃO E RESTAURAÇÃO DE ISRAEL", "html": "<h4>NOVA ALIANÇA<\/h4><p>Esta aliança é uma expansão da aliança abraâmica no que diz respeito ao terceiro aspecto daquela aliança, isto é, a benção salvífica (Jr 31.31-40).<\/p><h4>UMA ALIANÇA INCONDICIONAL<\/h4><blockquote>Jeremias 31:31 Eis que dias vêm, diz o SENHOR, em que farei uma aliança nova com a casa de Israel e com a casa de Judá. 32 Não conforme a aliança que fiz com seus pais, no dia em que os tomei pela mão, para os tirar da terra do Egito; porque eles invalidaram a minha aliança apesar de eu os haver desposado, diz o SENHOR. 33 Mas esta é a aliança que farei com a casa de Israel depois daqueles dias, diz o SENHOR: Porei a minha lei no seu interior, e a escreverei no seu coração; e eu serei o seu Deus e eles serão o meu povo.<\/blockquote><h4>A BENÇÃO DA REGENERAÇÃO<\/h4><p>“Porei a minha lei no seu interior, e a escreverei no seu coração; e eu serei o seu Deus e eles serão o meu povo.”<\/p><h4>A BENÇÃO DA TERRA É GARANTIDA<\/h4><blockquote>Jeremias 31:35 Assim diz o SENHOR, que dá o sol para luz do dia, e as ordenanças da lua e das estrelas para luz da noite, que agita o mar, bramando as suas ondas; o SENHOR dos Exércitos é o seu nome. 36 Se falharem estas ordenanças de diante de mim, diz o SENHOR, deixará também a descendência de Israel de ser uma nação diante de mim para sempre. 37 Assim disse o SENHOR: Se puderem ser medidos os céus lá em cima, e sondados os fundamentos da terra cá em baixo, também eu rejeitarei toda a descendência de Israel, por tudo quanto fizeram, diz o SENHOR. 38 Eis que vêm dias, diz o SENHOR, em que esta cidade será reedificada para o SENHOR, desde a torre de Hananeel até à porta da esquina.<\/blockquote><p>Paulo foi muito enfático em falar sobre a salvação, não de uns poucos israelitas que quando salvos fazem parte da igreja, mas de uma salvação em âmbito nacional (Rm 11). Embora a nova aliança já tenha sido estabelecida, os Israelitas como nação só se beneficiarão da aliança quando forem conduzidos ao reconhecimento do Messias Jesus durante a grande tribulação (Jr 30.7-11; Zc 12.8-11).<\/p><h4>ALIANÇA INCONDICIONAL E IRREVOGÁVEL<\/h4><blockquote>Romanos 11:28 Assim que, quanto ao evangelho, são inimigos por causa de vós; mas, quanto à eleição, amados por causa dos pais. 29 Porque os dons e a vocação de Deus são sem arrependimento.<\/blockquote>"}]}, {"n": 3, "t": "PERSPECTIVAS SOBRE O ARREBATAMENTO", "aulas": [{"n": 12, "t": "O ARREBATAMENTO - PÓS-TRIBULACIONISMO", "html": "<p>Pós-tribulacionismo Defende que a igreja passará pela grande tribulação que há de vir sobre toda a terra, sendo arrebatada imediatamente após esse período por ocasião da segunda vinda, onde então retornará com Cristo para dar início ao reino milenar.<\/p><p>Essa perspectiva afirma que a igreja será arrebatada assim que se encerrar a grande tribulação, no mesmo momento em que Cristo estiver voltando à terra para salvar Israel das garras do anticristo e estabelecer seu Reino.<\/p><p>São numerosos os problemas teológicos que surgem ao sustentar um milênio literal e adotar a perspectiva de que a igreja passará pela grande tribulação sendo arrebatada no segundo advento de Cristo. Há várias perspectivas em relação ao milênio dentre os pós-tribulacionistas, mas, em poucas palavras, podemos adiantar que o teólogo que é pré-milenista e insiste no pós- tribulacionismo é como alguém que tenta misturar água e óleo. Todo pré-tribulacionista é pré- milenista, não há como ser pré-tribulacionista sendo amilenista ou pós-milenista, pois a interpretação literal que nos leva a distinguir igreja de Israel e não permite espiritualizar as profecias referentes ao reino milenar e Israel e substituir a igreja por Israel, como fazem os amilenistas e pós-milenista. Por outro lado, dentre os pós-tribulacionistas há pré-milenistas, amilenistas e pós-milenistas, e consequentemente uma ampla variação de pós-tribulacionismos. Pós-tribulacionismo futurista Essa perspectiva que é mais comum hoje entre os pós-tribulacionistas que são pré-milenistas foi sistematizada por George Ladd em meados do século XX. Esse pós-tribulacionismo é conhecido também pelo título de “pré-milenismo histórico”, pois acreditam que essa era a posição dos primeiros teólogos da igreja, isto é, até os três primeiros séculos. Contudo há diferenças significativas entre o pós-tribulacionismo defendido pelos pais que eram pré- milenistas e o que esses pós-tribulacionistas atuais defendem. Enquanto Ladd e seus discípulos defendem uma tribulação literal de sete anos e que ainda é futura, os teólogos da patrística acreditavam que já estavam vivendo a tribulação que naturalmente não era um futuro período de sete anos como os pré-milenistas históricos de hoje defendem. Logo, pós-tribulacionismo defendido hoje pelos pré-milenistas não é nada histórico, diferindo em vários pontos da visão defendida na patrística, sendo assim, é mais recente que o pré-tribulacionismo e sua sistematização. A pergunta que fazemos para o pós-tribulacionista que é pré-milenista é, você crê que já está na grande tribulação? A resposta será um “não”, logo, esse não é o mesmo pós- tribulacionismo da patrística, pois os pais acreditavam que já estavam vivendo a grande tribulação profetizada por Jesus em Mateus 24 e registrada em detalhes por João em Apocalipse 6-18. Dessa forma, se o pré-milenista afirma que sua posição é a mesma da patrística, ele tem que afirmar que já está na grande tribulação e Jesus pode voltar a qualquer momento.<\/p>"}, {"n": 13, "t": "O ARREBATAMENTO - PRÉ-IRA", "html": "<p>Pré-Ira Os defensores dessa posição afirmam que a igreja passará por pelo menos setenta e cinco por cento da tribulação de sete anos, sendo arrebatada em algum momento da sexta taça, naturalmente antes do segundo advento de Cristo. Marvin Rosenthal foi o talvez o principal expositor dessa posição, em seu livro “Pré-Ira Rapture Of The Church” (O Arrebatamento Pré- Ira Da Igreja). Rosenthal divide os sete anos da septuagésima semana de Daniel em três pontos principais, primeiro, “princípio das dores” que abrangem os três primeiros anos e meio, segundo, “a grande tribulação” que refere-se a primeira metade dos últimos três anos e meio, terceiro, o “dia do Senhor” ou a “Ira de Deus” que compreende a última metade dos três anos e meio finais. Assim, para Rosenthal a igreja é arrebatada antes do dia do Senhor ou da Ira de Deus, que inicia na metade final dos sete anos. Ainda que essa posição resolva os grandes problemas que surgem diante do pós-tribulacionista, todavia, gera outras dificuldades. Primeiro, faz uma distinção artificial entre dia do Senhor, grande tribulação e Ira de Deus, quando na verdade essas nomenclaturas se referem ao mesmo período de tempo, isto é, a septuagésima semana de Daniel. Segundo, a Ira de Deus não se inicia na sexta taça, mas antes mesmo do derramar da primeira taça, pois o texto de Apocalipse 15.1 diz, “E vi outro grande e admirável sinal no céu: sete anjos que tinham as sete últimas pragas, porque nelas é consumada a ira de Deus.” O texto não diz que a Ira começa nas taças, seja com a primeira e muito menos na sexta, mas sim que nas taças a Ira será CONSUMADA, o que indica que teve um início anterior, pois só se consuma o que já teve início.<\/p>"}, {"n": 14, "t": "O ARREBATAMENTO - MESO-TRIBULACIONISMO", "html": "<p>MESO-Tribulacionismo Defende que a igreja estará na terra por três anos e meio, sendo arrebatada no meio do período de sete anos de grande tribulação. Embora não seja tão incomum encontrarmos irmãos que acreditem em um arrebatamento na metade da grande tribulação, todavia, é muito raro alguém que defenda essa posição no meio acadêmico. Talvez o principal expoente do mid- tribulacionismo foi Normam B. Harrison, acreditava que as trombetas do apocalipse já estavam se cumprindo em seus dias. O ponto central dessa posição repousa sobre a sétima trombeta, por ser a última de uma série que é tocada praticamente da metade da tribulação, assim associam a sétima trombeta de Apocalipse 11 com a última trombeta de 1Coríntios 15.<\/p><p>Resumidamente podemos afirmar categoricamente que não há qualquer relação entre essas trombetas por diversas razões. Primeiro, a trombeta de 1 Coríntios 15 é uma trombeta de benção para igreja, a sétima de Apocalipse é uma trombeta de Juízo, pois assim como o sétimo selo anuncia as sete trombetas, a sétima trombeta dá início a série de juízos denominada de taças. Segundo, Paulo quando escreveu sobre a última trombeta para igreja de Corinto, ele escreveu sobre o que a igreja tinha conhecimento, pois jamais poderia estar se referindo a uma trombeta que nem mesmo ele tinha conhecimento, e que seria revelada a João mais de quatro décadas adiante .<\/p>"}, {"n": 15, "t": "O ARREBATAMENTO - PARCIALISMO", "html": "<p>Parcialismo Essa posição escatológica afirma que parte da igreja será arrebatada antes da tribulação, uma outra parcela durante a tribulação. Essa teoria que surgiu entre o fim do século XIX e início do Século XX tem como principais expoentes Robert Govett, George H. Lang e George H. Pember (Pember foi um dos primeiros a sistematizar a teoria da lacuna ou gap, isto é, a ideia onde se afirma que há um hiato de tempo entre o cápitulo 1 e 2 de gênesis abrindo espaço para uma catástrofe que tornou a terra sem forma e vazia). Em suma, com base na parábola das virgens afirmam que antes da grande tribulação Jesus arrebatará apenas parte da igreja, isto é, os espirituais, por outro lado os cistãos carnais serão deixados para serem purgados durante a tribulação, sendo arrebatados em grupos durante todo o período. Habitualmente baseiam essa teoria em textos onde há exortação para vigilância e santidade, como Lucas 21.34-36 e Tito 2.11-13, assim fazem do arrebatamento algo meritório. Lamentavelmente essa teoria apresenta os mais sérios problemas teológicos, como por exemplo, a salvação por obras e a retaliação do corpo de Cristo que é a igreja. Toda a estrutura desta teoria está baseada nas seguintes referências bíblicas: (Mateus 25:1-13; Lucas 21:36) “Vigiai, pois, em todo o tempo, orando, para que sejais havidos por dignos de evitar todas essas coisas que hão de acontecer e de estar em pé diante do Filho do Homem”; (Tito 2:13) “aguardando a bem-aventurada esperança e o aparecimento da glória do grande Deus e nosso Senhor Jesus Cristo”; (Hebreus 9:28) “assim também Cristo, oferecendo-se uma vez, para tirar os pecados de muitos, aparecerá segunda vez, sem pecado, aos que o esperam para a salvação.” e I João 2:28 “E agora, filhinhos, permanecei nele, para que, quando ele se manifestar, tenhamos confiança e não sejamos confundidos por ele na sua vinda.” Em todas estas referências há uma exortação a vigilância, no entanto não há o menor indício de que só serão salvos os “havidos por dignos” até porque este grupo não existe; ninguém é digno. Por esses e muitos outros problemas que não é nosso objetivo tratar no presente texto, essa teoria caiu em total descrédito ao ponto de não haver quem a defenda nos dia atuais, ainda que alguns pré-tribulacionistas inconscientemente adotam a mesma interpretação da parábola das virgens que foi propagada pelos defensores do arrebatamento parcial.<\/p>"}, {"n": 16, "t": "O ARREBATAMENTO - PRÉ-TRIBULACIONISMO", "html": "<p>Pré-tribulacionismo.<\/p><p>Esse é o posicionamento escatológico adotado pelos dispensacionalistas que corretamente creem que Cristo arrebatará a igreja antes do período dos sete anos de grande tribulação. Considerando que boa parte desse curso consiste em uma defesa bíblica dessa perspectiva, seremos bem breves aqui. Os principais teólogos defensores dessa posição no século XX são, Cirus Iscofield, Arno Gaebalain, Clarence Larkin, Herman Hoyt, Lewis Sperry Chafer, Charles Ryrie, Dwight Pentecost, Renald Showers. Não podemos deixar de mencionar aquele que, além de sistematizador e apologeta, talvez foi o grande mentor de muitos pré-tribulacionitas, o notável John Walvoord que além refutar boa parte dos ataques contra o pré-tribulacionismo, demonstrou a fragilidade da argumentação pós-tribulacionista. Walvoord é responsável pelos melhores argumentos em defesa do pré-tribulacionismo, bem como os melhores contra o pós- tribulacionismo. Os melhores argumentos usados hoje nos debates contra pós-tribulacionistas foram desenvolvidos por Walvoord desde há sessenta anos atrás. A base do pré-tribulacionismo é a hermenêutica histórica gramatical, a distinção entre igreja e Israel e pré-milenismo.<\/p>"}]}, {"n": 4, "t": "PERSPECTIVAS SOBRE O MILÊNIO", "aulas": [{"n": 17, "t": "O MILÊNIO - AMILENISMO", "html": "<h4>AMILENISMO<\/h4><p>Essa posição afirma que não haverá um reino literal de mil anos sobre a terra, embora seu principal proponente (Agostinho) entendeu os mil anos como um período de tempo literal, todavia, espiritualizou o reino. Os defensores atuais dessa corrente escatológica entendem que o milênio é símbolo de um longo período de paz sobre a terra. Crêem apenas em um reinado espiritual de Cristo sobre os salvos, e que esse reino se iniciou com o primeiro advento de Cristo e se estenderá até a segunda vinda estabelecendo-se em seguida o estado eterno. O “amilenismo” em si não é a negação do milênio como o termo sugere, nega-se apenas a literalidade de um reino político terreno de Cristo. O amilenista afirma que o milênio já está se realizando espiritualmente, quase todas as profecias de natureza política e material relacionadas a Israel são espiritualizadas tendo assim seu cumprimento sobre a igreja que é o Israel de Deus. Assim, o amilenista além de espiritualizar o milênio, faz da igreja hoje o Israel sobre quem tais promessas dizem respeito. Para defender essa perspectiva é necessário afirmar também que o diabo já está preso e espiritualizar a primeira ressurreição de Apocalipse 20, pois ambos eventos devem ocorrer antes do milênio. Dessa forma, para o amilenista, antes de Cristo estabelecer o milênio espiritual em seu primeiro advento, Ele prendeu satanás ao derrotá-lo na cruz e realizou a primeira ressurreição que é o novo nascimento. Esse é um meio de tentar resolver o problema que o texto de Apocalipse 20 apresenta ao amilenismo.<\/p>"}, {"n": 18, "t": "O MILÊNIO - PÓS-MILENISMO", "html": "<h4>PÓS-MILENISMO<\/h4><p>Essa posição também não crê em um reinado literal de mil anos, sendo assim, afirmam que Cristo implantará o reino milenar sobre a terra através da igreja. Acreditam que como um grão de mostarda que cresce tornando-se uma grande árvore, a igreja irá cristianizar o mundo influenciando o mesmo em todas as esferas, afirmam que haverá um avanço e prosperidade da igreja em sua missão evangelizadora que resultará na conversão do mundo. Após o mundo se tornar cristão haverá o retorno de Cristo para estabelecer o estado eterno, ou seja, Cristo só vem depois que o mundo se tornar cristão, a base para tal pensamento é a interpretação equivocada de Mateus 24.14 que diz “E este evangelho do reino será pregado em todo o mundo, em testemunho a todas as nações, e então virá o fim”. O verso 14 está inserido em um contexto de grande tribulação, é durante esse período que o “evangelho do reino” será pregado para todos os povos, isto é, a mensagem de que o rei está prestes a retornar e estabelecer seu reino colocando um fim a grande tribulação. Dessa forma, o arrebatamento da igreja não depende da evangelização mundial, pois o rapto da noiva será um evento iminente que com tal pode ocorrer a qualquer momento. O pós-milenista crê em um milênio com algum aspecto literal de bênçãos, conforme os profetas profetizaram, entretanto o milênio é implantado não por meio de uma intervenção sobrenatural de Cristo, mas progressivamente através da igreja. O pós-milenismo é a posição otimista em relação ao futuro que antecede a segunda vinda e estado eterno, mas esse otimismo é contrário a diversos textos que afirmam categoricamente que até o segundo advento de Cristo haverá muita apostasia e a própria manifestação do anticristo seguido de uma grande tribulação. Dessa forma, o pós-milenista precisa ser preterista, isto é, defender que Mateus 24 e os grandes eventos de Apocalipse 6 em diante já se cumpriram no ano setenta com a invasão do general Tito sobre Jerusalém, em suma, o anticristo, a grande tribulação e a segunda vinda de Cristo já é um evento histórico passado.<\/p>"}, {"n": 19, "t": "O MILÊNIO - PRÉ-MILENISMO HISTÓRICO", "html": "<h4>PRÉ-MILENISMO HISTÓRICO<\/h4><p>Essa posição defende a literalidade do período de mil anos, bem como a natureza do reino, pois Cristo retornará fisicamente a esse mundo após a grande tribulação e antes do início do milênio que será estabelecido por Ele mesmo nessa terra a partir de Jerusalém.<\/p><p>O tempo ou a duração do Reino que será estabelecido por Jesus sobre essa terra é definido em Apocalipse no capítulo vinte, onde por seis vezes encontramos a afirmação que o reino terá a duração de “mil anos” (Ap 20.2,3,4,5,6,7). Duas verdades precisam ser esclarecidas aqui. Primeiro, esse é o único texto onde encontramos o termo “milênio”, mas deve ser observado que o termo “mil anos” aparece por “seis vezes” apontando para a literalidade e realidade desse período. Segundo, Apocalipse vinte não lida com a natureza do reino, apenas com a duração. Os detalhes de como será esse reinado e como as pessoas viverão durante esse período não é tratado em apocalipse, mas nos textos dos profetas.<\/p><p>O estudante de escatologia deve ter ciência que a doutrina ou teologia do milênio não se fundamenta apenas no texto de Apocalipse, aliás, como já afirmamos acima, em seu texto o Apóstolo João não trata sobre a natureza do reino, apenas faz menção a sua duração, logo, é muito óbvio que o pré-milenista não depende apenas de Apocalipse para formular a doutrina ou uma teologia bíblica do milênio. Aliás, todas as características desse reino são encontradas nas páginas do antigo testamento, onde naturalmente não dependemos do termo “milênio” em si, mas se utilizamos de outras nomenclaturas como “reino messianico” “reino mediatório” ou “reino intermediário”.<\/p><p>O texto do antigo testamento revela os detalhes desse reino mediador ou intermediário, termos esses que definem um reino que fica entre o agora e a eternidade, fazendo assim a intermediação. Assim, afirmamos que o reino que será implantado sobre a terra por Cristo após sua segunda vinda é muito melhor que o agora, mas ainda não pleno e perfeito conforme a eternidade, pois embora haja significativas e numerosas melhorias, ainda haverá pecado ou morte. A natureza e detalhes desse reino milenar serão apresentados adiante.<\/p><p>Contudo, diferente do pré-milenismo dispensacionalista, o pré-milenismo histórico afirma que o arrebatamento da igreja ocorre no fim da tribulação, assim são obrigados a defender um milênio apenas para ímpios, contrariando totalmente o propósito do reino milenar que é o estabelecimento do Israel restaurado na terra a fim de desfrutarem das promessas Messiânicas. Um arrebatamento no fim da tribulação anula a possibilidade de um reino milenar.<\/p>"}, {"n": 20, "t": "O MILÊNIO - PŔEMILENISMO DISPENSACIONALISTA", "html": "<p>A diferença entre o pré-milenismo histórico e dispensacionalista vai muito além do tempo do arrebatamento, pois enquanto o pré-milenismo histórico afirma que Deus não tem um plano futuro para com Israel, uma ideia que anula o milênio (embora não admitam), o dispensacionalista defende piamente a restauração espiritual e nacional de Israel, justamente para que seja possível o estabelecimento do reino milenar. Para o dispensacionista o estabelecimento do Reino só é possível se o arrebatamento da igreja não ocorrer no momento da segunda vinda, e nisso os textos bíblicos concordam.<\/p>"}]}, {"n": 5, "t": "AS SETENTA SEMANAS DE DANIEL", "aulas": [{"n": 21, "t": "AS SETENTA SEMANAS - INTRODUÇÃO", "html": "<h4>AS SETENTA SEMANAS<\/h4><h4>CONTEXTO HISTÓRICO<\/h4><p>Fase final do cativeiro e ministério de Daniel.<\/p><p>Oração, confissão por seus pecados e de seu povo Israel.<\/p><p>Os detalhes envolvidos nas setentas semanas é resposta as oraçẽos de Daniel sobre seu povo, sua cidade e o templo conforme todo capítulo 9 deixa evidente.<\/p><h4>SETENTA ANOS DE CATIVEIRO PARA ISRAEL<\/h4><blockquote>Daniel 9:2 No primeiro ano do seu reinado, eu, Daniel, entendi pelos livros que o número dos anos, de que falara o SENHOR ao profeta Jeremias, em que haviam de cumprir-se as desolações de Jerusalém, era de setenta anos.<\/blockquote><h4>POR QUE UM CATIVEIRO DE SETENTA ANOS?<\/h4><blockquote>Jeremias 25:11 E toda esta terra virá a ser um deserto e um espanto; e estas nações servirão ao rei de Babilônia setenta anos.<\/blockquote><blockquote>2 Crônicas 36:21 Para que se cumprisse a palavra do SENHOR, pela boca de Jeremias, até que a terra se agradasse dos seus sábados; todos os dias da assolação repousou, até que os setenta anos se cumpriram.<\/blockquote><h4>AS SETENTA SEMANAS DIZ RESPEITO A ISRAEL<\/h4><blockquote>Daniel 9:6 E não demos ouvidos aos teus servos, os profetas, que em teu nome falaram aos nossos reis, aos nossos príncipes, e a nossos pais, como também a todo o povo da terra. 11 Sim, todo o Israel transgrediu a tua lei, desviando-se para não obedecer à tua voz; por isso a maldição e o juramento, que estão escritos na lei de Moisés, servo de Deus, se derramaram sobre nós; porque pecamos contra ele. 15 Agora, pois, ó Senhor, nosso Deus, que tiraste o teu povo da terra do Egito com mão poderosa, e ganhaste para ti nome, como hoje se vê; temos pecado, temos procedido impiamente. 16 Ó Senhor, segundo todas as tuas justiças, aparte-se a tua ira e o teu furor da tua cidade de Jerusalém, do teu santo monte; porque por causa dos nossos pecados, e por causa das iniquidades de nossos pais, tornou-se Jerusalém e o teu povo um opróbrio para todos os que estão em redor de nós. 17 Agora, pois, ó Deus nosso, ouve a oração do teu servo, e as suas súplicas, e sobre o teu santuário assolado faze resplandecer o teu rosto, por amor do Senhor.<\/blockquote><h4>O PROPÓSITO DAS SETENTA SEMANAS<\/h4><blockquote>Daniel 9:24 Setenta semanas estão determinadas sobre o teu povo, e sobre a tua santa cidade, para cessar a transgressão, e para dar fim aos pecados, e para expiar a iniquidade, e trazer a justiça eterna, e selar a visão e a profecia, e para ungir o Santíssimo.<\/blockquote><p class='li'>1 - Extinguir a transgressão<\/p><p class='li'>2 - Dar fim aos pecados<\/p><p class='li'>3 - Expiar a iniquidade<\/p><p class='li'>4 - Trazer a justiça eterna<\/p><p class='li'>5 - Selar a visão e a profecia<\/p><p class='li'>6 - Ungir o santo dos santos<\/p>"}, {"n": 22, "t": "AS SETENTA SEMANAS - ÍNICIO E PROPÓSITO", "html": "<h4>SEMANA DE ANOS<\/h4><p>Cada semana são sete anos, não sete dias.<\/p><p class='li'>A - Jacó trabalhou uma semana por Lia e outra por Raquel, Gn 29.18,27-30.<\/p><p class='li'>B - Ano sabático e Jubileu, Lv 25.8.<\/p><blockquote>Levítico 25:8 Também contarás sete semanas de anos, sete vezes sete anos; de maneira que os dias das sete semanas de anos te serão quarenta e nove anos.<\/blockquote><h4>70 X 7=490<\/h4><h4>O PROPÓSITO DAS SETENTA SEMANAS<\/h4><blockquote>Daniel 9:24 Setenta semanas estão determinadas sobre o teu povo, e sobre a tua santa cidade, para cessar a transgressão, e para dar fim aos pecados, e para expiar a iniquidade, e trazer a justiça eterna, e selar a visão e a profecia, e para ungir o Santíssimo.<\/blockquote><p class='li'>1 - Extinguir a transgressão<\/p><p class='li'>2 - Dar fim aos pecados<\/p><p class='li'>3 - Expiar a iniquidade<\/p><p class='li'>4 - Trazer a justiça eterna<\/p><p class='li'>5 - Selar a visão e a profecia<\/p><p class='li'>6 - Ungir o santo dos santos<\/p><h4>O INÍCIO DA CONTAGEM<\/h4><blockquote>Daniel 9:25 Sabe e entende: desde a saída da ordem para restaurar, e para edificar a Jerusalém, até ao Messias, o Príncipe, haverá sete semanas, e sessenta e duas semanas; as ruas e o muro se reedificarão, mas em tempos angustiosos.<\/blockquote><h4>A SAÍDA DA ORDEM PARA RESTAURAR E EDIFICAR JERUSALÉM<\/h4><blockquote>Neemias 2:1 SUCEDEU, pois, no mês de Nisã, no ano vigésimo do rei Artaxerxes, que estava posto vinho diante dele, e eu peguei o vinho e o dei ao rei; porém eu nunca estivera triste diante dele. 5 E disse ao rei: Se é do agrado do rei, e se o teu servo é aceito em tua presença, peço-te que me envies a Judá, à cidade dos sepulcros de meus pais, para que eu a reedifique.<\/blockquote><p>A enciclopédia britânica estabelece o início do reinado de Artaxerxes em 465 antes de Cristo. Neemias diz que a ordem se deu no ano vigésimo de seu reinado, isto é, 445 a.C<\/p><h4>ATÉ O MESSIAS O PRÍNCIPE<\/h4><p>69 semanas ou 483 anos contados a partir de 445 a.C vai até o ano 32 d.C (considerando - 6 a.C).<\/p><p>No ano 32 d.C ocorreu algo especial, Jesus se apresentou como príncipe(Rei-Lider) e foi rejeitado. Lc 19.28-44; Zc 9.9; Sl 118.22-26. Isael não reconheceu o dia de sua visitação, aqui se encerra a sexagésima nona semana.<\/p><blockquote>Lucas 19:41 E, quando ia chegando, vendo a cidade, chorou sobre ela, 42 Dizendo: Ah! Se tu conhecesses também, ao menos neste teu dia, o que à tua paz pertence! Mas agora isto está encoberto aos teus olhos.<\/blockquote><blockquote>Lucas 19:44 E te derrubarão, a ti e aos teus filhos que dentro de ti estiverem, e não deixarão em ti pedra sobre pedra, pois que não conheceste o tempo da tua visitação.<\/blockquote>"}, {"n": 23, "t": "AS SETENTA SEMANAS - O QUE OCORRE DEPOIS DAS 69 SEMANAS?", "html": "<h4>DEPOIS DAS SESSENTA E NOVE SEMANAS<\/h4><h4>1 - MESSIAS FOI CORTADO<\/h4><blockquote>Daniel 9:26 E depois das sessenta e duas semanas será cortado o Messias, mas não para si mesmo; e o povo do príncipe, que há de vir, destruirá a cidade e o santuário, e o seu fim será com uma inundação; e até ao fim haverá guerra; estão determinadas as assolações.<\/blockquote><p>Tirado, hb karath: cortar fora, arrancar, eliminar, matar, morte violenta, 1Sm 17.51; Ob 9.. Sendo assim, cortar não aponta para aliança em si, mas para rejeição e morte violenta do messias.<\/p><blockquote>Obadias 1:9 E os teus poderosos, ó Temã, estarão atemorizados, para que do monte de Esaú seja cada um exterminado pela matança.<\/blockquote><p>Não será mais, hb ´ayin: não ser, não existir, não estar, não ter, não tomar posse. Tradução BV, sem estabelecer seu reino. O messias foi rejeitado, morto e não tomou posse do trono de Davi, não estabeleceu o reino em sua primeira vinda. Não se achou lugar para seu senhorio e reinado entre os Judeus do primeiro século.<\/p><h4>2 - A DESTRUIÇÃO DO TEMPLO<\/h4><p>“e o povo do príncipe, que há de vir, destruirá a cidade e o santuário”<\/p><p>É fato histórico que o exército Romano sob comando de Tito invadiu a cidade e destruiu o templo no ano 70, essa é uma verdade incontestável.<\/p><h4>3 - ATÉ O FIM HAVERÁ GUERRA<\/h4><p>Os perseguidores do povo judeu constantemente fizeram e fazem guerras contra esse povo até os dias de hoje, essa realidade se estenderá até o fim, quando então se encerrará os sete anos finais da septuagésima semana de Daniel com o segundo advento do Messias.<\/p>"}, {"n": 24, "t": "AS SETENTA SEMANAS - A LACUNA ENTRE A SEMANA 69 E 70", "html": "<h4>OS FUNDAMENTOS PARA A LACUNA<\/h4><p>Há razões mais que suficientes para que haja uma necessidade de um intervalo entre a sexagésima nona semana e a septuagésima.<\/p><p class='li'>1 - O templo foi destruído no ano 70. Esse fato histórico demonstra que a septuagésima semana não pode ser imediatamente contínua em relação a sexagésima nona semana.<\/p><p class='li'>2 - A morte do messias e destruição do templo não ocorrem na sexagésima nona semana, muito menos na septuagésima.<\/p><p class='li'>3 - As seis bênçãos descritas no verso 24(nova aliança em Jeremias 31) não se cumpriram no Israel etnico até os dias de hoje. As bençãos descritas em Daniel 9.24 dizem respeito primariamente ao povo de Israel, o que fica claro em todo o contexto.<\/p><p class='li'>4 - Profecias bíblicas aparentam continuidade, mas há uma lacuna. Is 61.1,2 - Lc 4.16.21. Ao ler a profecia de Isaías dá a entender que a mesma teria seu cumprimento pleno no primeiro advento do messias, mas o próprio Cristo omite o trecho: “o dia da vingança do nosso Deus”, pois essa parte da profecia se cumprirá apenas em sua segunda vinda.<\/p><blockquote>Isaías 61:1 O ESPÍRITO do Senhor DEUS está sobre mim; porque o SENHOR me ungiu, para pregar boas novas aos mansos; enviou-me a restaurar os contritos de coração, a proclamar liberdade aos cativos, e a abertura de prisão aos presos; 2 A apregoar o ano aceitável do SENHOR e o dia da vingança do nosso Deus; a consolar todos os tristes;<\/blockquote><blockquote>Lucas 4:17 E foi-lhe dado o livro do profeta Isaías; e, quando abriu o livro, achou o lugar em que estava escrito: 18 O Espírito do Senhor está sobre mim, pois que me ungiu para evangelizar os pobres. Enviou-me a curar os contritos de coração, 19 A proclamar liberdade aos cativos, e restauração da vista aos cegos, a pôr em liberdade os oprimidos, a anunciar o ano aceitável do Senhor.<\/blockquote><p class='li'>5 - Jesus descreveu os eventos da septuagésima semana imediatamente antes de sua segunda vinda. Mt 24.15, 21, 27, 30,31. essa é a maior evidência da lacuna, pois Cristo relaciona os eventos da grande tribulação que antecedem seu retorno com a septuagésima semana de Daniel com clareza, compare Mateus 24.15 com Daniel 9.27.<\/p><p class='li'>6 - O príncipe ou líder que virá no futuro fará uma aliança de sete anos com Israel, mas na metade da semana quebrará o pacto:<\/p><p class='li'>A - Jesus situou esse fato ainda no futuro, Mt 24.15.<\/p><p class='li'>B - Paulo identifica o príncipe com o anticristo que ainda virá, 2Ts 2.3,4, 8-10.<\/p><p class='li'>C - João o declara como a besta que ainda subirá do mar, Ap 13.<\/p><h4>CONCLUSÃO<\/h4><h4>O NT RELACIONA O PRINCIPAL EVENTO DA SEPTUAGÉSIMA SEMANA COM A<\/h4><h4>SEGUNDA VINDA DE CRISTO (MT 24.15), LOGO, HÁ UMA LACUNA.<\/h4>"}, {"n": 25, "t": "AS SETENTA SEMANAS - A SEPTUAGÉSIMA SEMANA", "html": "<h4>O INÍCIO DA SEPTUAGÉSIMA SEMANA<\/h4><blockquote>Daniel 9:26 E depois das sessenta e duas semanas será cortado o Messias, mas não para si mesmo; e o povo do príncipe, que há de vir, destruirá a cidade e o santuário, e o seu fim será com uma inundação; e até ao fim haverá guerra; estão determinadas as assolações. 27 E ele firmará aliança com muitos por uma semana; e na metade da semana fará cessar o sacrifício e a oblação; e sobre a asa das abominações virá o assolador, e isso até à consumação; e o que está determinado será derramado sobre o assolador.<\/blockquote><p>Firmará, hb: Gabar, que transmite principalmente a ideia de força, poder ou prevalecer sobre algo ou alguém.<\/p><p>Aliança, hb: bˆeryith, acordo, aliança, pacto.<\/p><p>Após a destruição do templo, o príncipe cujo povo romano destruiu o templo fará uma aliança com muitos, a maior parte dos Judeus, mas não todos. A morte do messias, a destruição do templo e as guerras, ocorrem após a sexagésima semana, a vinda do príncipe ou anticristo é um evento ainda futuro. A chegada desse príncipe ou líder que é o anticristo marca o início da septuagésima semana.<\/p><h4>O PRÍNCIPE QUE HÁ DE VIR<\/h4><p>“Ele” é o anticristo, a septuagésima semana terá início com um acordo do anticristo que inicialmente virá como homem da paz, por isso será aceito por muitos. 2Ts 2.8-10; Ap 6.1,2.<\/p><h4>A ALIANÇA SERÁ QUEBRADA<\/h4><p class='li'>1 - Na metade da semana(de 7 anos, isto é, 3 anos e meio, 42 meses ou 1260 dias) “ele” fará cessar o sacrifício e a oferta. Mt 24.15; 2Ts 2.4; Ap 13.1-5. Esse é o momento que a paz proposta por esse líder cessará e iniciará o período de perseguição a todos os crentes do período tribulacional, Dn 7.21, 25; 12.1,6-13; Ap 12.6; 13.1, 5, 7, 15; 20.4.<\/p><p class='li'>2 - Sobre as asas das abominações virá o assolador “ele, o príncipe que há de vir, é o anticristo”. Perceba que gramaticalmente o assolador está conectado ao pronome “ele”, este é o príncipe(líder) que há de vir, o anticristo que na última metade da septuagésima semana perseguirá os santos do período tribulacional.<\/p><p>Assolador, hb “shamem”: o que causa horror, o que aterroriza, devastador. Esse líder irá perseguir e aterrorizar quando então cometerá a abominação desoladora, isto é, ele profanará o templo no metade do período tribulacional quando colocar uma uma imagem sua no templo e exigir adoração, Ap 13.14-17.<\/p><h4>O FIM DA SEPTUAGÉSIMA SEMANA<\/h4><p class='li'>1 - DESTRUIÇÃO DO ANTICRISTO. Na consumação algo será derramado sobre o assolador, o príncipe que há de vir, o anticristo. Isto ocorrerá no fim da septuagésima semana que é o fim do período tribulacional de sete anos, Cristo aparecerá, derrotará seu exército e lançará a besta(anticristo) no lago de fogo. Ap 19.20,21.<\/p><p class='li'>2 - A RESTAURAÇÃO PLENA DE ISRAEL. As seis bençãos serão aplicadas a Israel conforme Dn 9.24; Zc 12.10; 14.8-11.<\/p><blockquote>Zacarias 12:10 Mas sobre a casa de Davi, e sobre os habitantes de Jerusalém, derramarei o Espírito de graça e de súplicas; e olharão para mim, a quem traspassaram; e prantearão sobre ele, como quem pranteia pelo filho unigênito; e chorarão amargamente por ele, como se chora amargamente pelo primogênito.<\/blockquote>"}, {"n": 26, "t": "AS SETENTA SEMANAS - CORRIGINDO OS ERROS", "html": "<h4>ERROS EM RELAÇÃO AS SETENTA SEMANAS<\/h4><h4>PRETERISMO (PÓS-MILENISMO E AMILENISMO).<\/h4><p class='li'>A - Consideram o decreto para construção do templo ao invés da cidade. O primeiro decreto para construção do templo foi emitido por Ciro em 539 a.C, Ed 1.3. O segundo por Artaxerxes em 457 a.C, Ed 7.1.<\/p><p class='li'>B - Antíoco Epifânio profanou o templo em 167, 1 Macabeus 1.54.<\/p><p class='li'>C - Antíoco Epifânio não destruiu o templo. Esse detalhe, junto ao fato de que nenhuma das seis bençãos relatadas em Dn 9.24 não se cumpriram nesse período, põe por terra o preterismo.<\/p><p class='li'>D - Onias, o sumo sacerdote assassinado em 171 não é o ungido que foi cortado. 2 Macabeus. Assim, as características e realizaçẽos de Onias não cumprem funções messiânicas.<\/p><p>O problema do preterismo não consiste em colocar apenas o cumprimento das setenta semanas antes de Cristo, mas também no fato de afirmarem que os eventos descritos em Mateus 24 e Apocalipse se cumpriram no ano 70, incluindo a vinda de Cristo. Se utilizam de textos do antigo testamento que apresentam Deus vindo em juízo para julgar, assim dizem que Cristo veio em Juízo no ano 70, uma interpretação fantasiosa e inconsistente diante dos detalhes do texto de Mateus 24 e Apocalipse.<\/p><h4>PRÉ-MILENISMO HISTÓRICO (PÓS-TRIBULACIONISMO)<\/h4><p class='li'>A - Cristo é o príncipe que faz uma aliança de apenas 7 anos(pra alguns pós-tribulacionistas os sete anos podem ser simbólico).<\/p><p>Resposta: A nova aliança traz benefícios eternos e não por apenas sete anos. Se as 69 semanas são literais a septuagésima também o é, temos que ser consistentes com nossa metodologia hermenêutica.<\/p><p class='li'>B - Na metade dos sete anos Cristo é cortado, isto é, morto e dá fim aos sacrifícios conforme Hebreus relata.<\/p><p>Resposta: Os sacrifícios perdem efeitos espirituais com a morte de Cristo, mas o texto de Daniel aponta o fim dos ritos judaicos e não seu efeito, esses ritos só foram interrompidos com a destruição do templo no ano setenta pelos Romanos.<\/p><p class='li'>C - Confundem o messias com o príncipe que há de vir, assim são obrigados a afirmarem que os judeus destruíram o templo.<\/p><p>Resposta: O texto em Daniel 9.26 diz que o povo destruirá direta e literalmente o templo, apenas os romanos cumprem esse requisito.<\/p><p class='li'>D - A septuagésima semana é contínua. Resposta: Se assim fosse, o templo teria que ter sido destruído no ano 37 ou 40. O fato da destruição ter ocorrido no ano 70 os obriga a admitir ao menos uma lacuna de 40 anos entre toda septuagésima semana ou metade da mesma, ou deslocar a destruição do templo para além das setenta semanas, em termos hermenêuticos isso seria um absurdo.<\/p>"}]}, {"n": 6, "t": "O DISPENSACIONALISMO REVISADO", "aulas": [{"n": 27, "t": "O DISPENSACIONALISMO E SUA ESCATOLOGIA", "html": "<h4>DISPENSAÇÃO - OIKONOMIA<\/h4><p>O termo grego traduzido para dispensação é oikonomia. Trata-se da junção de duas palavras: oikos - casa + nemo - dispensar, gerir ou administrar. Assim, podemos definir oikonomia da seguinte forma: “administração de uma casa”.<\/p><p>Oikonomia aparece 9 vezes no novo testamento, (Lc 16.2-4; 1Co 9.17; Ef 1.10; 3.2; 3.9; Cl 1.25; 1Tm 1.4). Refere-se aos modos empregados por Deus para administrar seu mundo. Os meios empregados por Deus para administrar sua vontade soberana em relação ao homem.<\/p><h4>DISPENSACIONALISMO COMO SISTEMA TEOLÓGICO<\/h4><p>Dispensações são períodos na história da humanidade em que Deus revelou sua vontade ao homem exigindo obediência. Diante do fracasso do homem em cumprir a vontade de Deus findou-se tal dispensação em meio ao juízo divino. Para a próxima dispensação mais uma porção de sua vontade é revelada exigindo mais uma vez obediência. Neste sentido a revelação divina (vontade divina inspirada, bíblia sagrada) foi progressiva e parcialmente cumulativa. Dizemos parcialmente cumulativa pelo fato de que alguns padrões ou exigências, não continuam de uma dispensação para outra, como a ordem para não matar o homicida durante a dispensação da consciência (Gn 4,15), pois na dispensação do governo humano essa ordem é abolida e o mandamento é que o assassino seja punido com a morte ao invés de ser protegido (Gn 9.6). Essas mudanças que caracterizam e distinguem uma dispensação da outra são denominadas de elementos de “continuidade e descontinuidade”, isto é, o que é válido ou não como um padrão observável ou praticável de uma para outra dispensação.<\/p><h4>SETE DISPENSAÇÕES<\/h4><p class='li'>1 - Inocência: da criação até a queda - Gênesis 1.26 até 3.24<\/p><p class='li'>2 - Consciência: da Queda ao Dilúvio - Gênesis 4.1 até 8.19<\/p><p class='li'>3 - Governo humano: do Dilúvio até Abraão - Gênesis 8.20 até 11.32<\/p><p class='li'>4 - Promessa: de Abraão a Moisés (entrega da lei) - Gênesis 12 até Êxodo 18<\/p><p class='li'>5 - Lei: de Moisés até a Cruz - Êxodo 19.1 até Mateus 27.56 - Marcos 15.41 - Lucas 23.49 -<\/p><blockquote>João 20.30<\/blockquote><p class='li'>6 - Graça: do Pentecoste até o fim da grande tribulação - Mateus 27.57 - Marcos 15.42 - Lucas 23.50 - João 19.31 até Apocalipse 19.11<\/p><p class='li'>7 - Reino Milenar: Durante todo período do milênio - Apocalipse 20.4 até Apocalipse 20.9<\/p><h4>O PONTO CENTRAL DO DISPENSACIONALISMO<\/h4><p class='li'>1 - Hermenêutica<\/p><p class='li'>2 - Distinção entre Igreja e Israel<\/p><p class='li'>3 - A Glória de Deus O ponto central do dispensacionalismo não é a quantidade de dispensações, e sim seu método hermenêutico ao lidar com as profecias. O dispensacionalista se utiliza do método histórico gramatical para interpretar os textos proféticos, o que leva ao segundo ponto que é a distinção entre Igreja e Israel, isto é, o Israel não é a Igreja no antigo testamento. Sendo assim, Deus tem planos distintos para esses dois povos, plano que compreende a ressurreição, glorificação e arrebatamento da Igreja antes dos sete anos de grande tribulação. Por outro lado, Israel terá sua oportunidade de aceitação a Cristo durante a grande Tribulação, sendo libertos da perseguição do anticristo no final desse período de horror.<\/p><h4>OS SETE PILARES DO DISPENSACIONALISMO<\/h4><p class='li'>1 - Interpretação literal<\/p><p class='li'>2 - Milênio terreno e político<\/p><p class='li'>3 - Futura restauração do Israel etnico<\/p><p class='li'>4 - Distinção entre Igreja e Israel<\/p><p class='li'>5 - Dispensações<\/p><p class='li'>6 - Iminência<\/p><p class='li'>7 - Arrebatamento<\/p>"}, {"n": 28, "t": "O ALIANCISMO E SUA ESCATOLOGIA", "html": "<p>Aliancismo Embora a teologia da aliança começa a ganhar forma já em Zwinglio e Bullinger, é Johannes Cocceius (1603-1669) quem apresentou o aliancismo ou teologia do pacto como um sistema teológico detalhado.<\/p><p>A sistematização dessa teoria é apresentada em sua obra: “The Doctrine of the Covenant and Testament of God” (A doutrina da aliança e o testamento de Deus) publicada em meados do século XVII.<\/p><p>Valendo-se do método alegórico cuja tônica consiste em espiritualizar o texto bíblico, o sistema aliancista desenvolvido por Bullinger e seus pares afirma que há um Deus, um único salvador, uma só aliança e consequentemente um só povo com o qual Deus fez aliança.<\/p><p>Os aliancistas pós-Cocceius trabalham os desdobramentos da aliança em três ou duas alianças. Primeiro, a aliança da redenção que foi feita na eternidade entre a trindade, onde o Filho se compromete a efetuar a redenção. (Hb 9.12; 13.20; Ap 13.8) Segundo, a aliança das obras que foi estabelecida entre Deus e Adão, onde com base em sua obra de obediência este se manteria com todos os privilégios diante de Deus. (Gn 2.15-17). Terceiro, a aliança da graça que foi firmada entre Deus e Adão depois da queda, esta aliança garantiu um redentor e o perdão para o homem penitente. Assim, para o aliancista, a aliança do Sinai é um desdobramento da aliança da graça firmada com Adão e a nova aliança é a plena manifestação da mesma aliança da graça por meio de Cristo. (Os 6.7; Gn 3.21) - (Js 3.16)<\/p><h4>HERMENÊUTICA ALIANCISTA:<\/h4><h4>1 - ALEGORISMO E SUAS CONSEQUÊNCIAS<\/h4><h4>2 - ISRAEL É A IGREJA<\/h4><h4>3 - CONFUSÃO NO PLANO ESCATOLÓGICO<\/h4><h4>4 - PEDOBATISMO<\/h4><h4>5 - PRÁTICAS JUDAICAS ADAPTADAS À IGREJA<\/h4>"}, {"n": 29, "t": "O QUE É A IGREJA? QUAIS AS IMPLICAÇÕES ESCATOLÓGICAS?", "html": "<h4>IGREJA - SUA ORIGEM E FUNDAMENTOS<\/h4><h4>EKKLESIA - ECLÉSIA<\/h4><p>EKKALEO - ek fora - kaleo chamado - Convocação do exército.<\/p><p class='li'>1 - Ekklesia no sentido de assembléia ou congregação Estevão se referiu a Israel como uma ekklesia (At 7.38) Na septuaginta o termo ocorre cerca de 100 vezes Qahal= Ajuntar, reunir é traduzido por: synagoge ou ekklesia.<\/p><p>Convocação para guerra (Nm 22.4) , ou solenidade (2 Cr 6.3).<\/p><p>Um qahal dos malfeitores (Sl 26.5). Qahal ou ekklesia não significa ajuntamento apenas para o culto, mas para qualquer outra atividade.<\/p><p class='li'>2 - Ekklesia - Soma - Igreja como o corpo de Cristo Um mistério oculto (Ef 3.4-10) profetizado (Mt 16.18) e realizado somente após a ascensão de Cristo (Ef 1.20-23).<\/p><p>Seu início em Atos ( 2.4), aqui foi onde a igreja como o corpo de Cristo teve seu início. Igreja militante (Ef 6.10), essa é a igreja enquanto na terra, militando pela causa de Cristo. Igreja como organismo (1Co 12) Somente os regenerados são integrados pelo batismo do Espírito no corpo de Cristo (1Co 12.13).<\/p><p>Igreja como lavoura e templo de Deus (1Co 3) Seus membros e suas funções (1Co 12.17,18)<\/p><p class='li'>3 - Igreja como organização Igrejas locais (1Co 4.17) - A igrejas da Judéia (Gl 1.22) Na organização existem os falsos irmãos, ou seja, pertencentes a denominação, mas não ao corpo de Cristo, são os cristãos nominais. O Senhor conhece os seus (2Tm 2.19).<\/p><p>Os cristãos nominais podem sair (1Jo 2.19) ou não (Ap 3.1,4).<\/p><p>Falsos cristãos podem até exercer funções (At 20.29,30; 2Co 11.13-15).<\/p><blockquote>Ekklesia em Atos 19.32,39. Em meio aos gregos uma ekklesia só existia durante o ajuntamento, se referindo sempre a reunião apenas, nunca aos reunidos.<\/blockquote><p class='li'>4 - Igreja Universal Ekklesia no novo testamento não se refere apenas a assembleia, mas aos indivíduos que compõem a assembleia (At 9.31).<\/p><p>Os crentes espalhados são uma igreja (At 8.1-4).<\/p><p>A universalidade da igreja (1Co 15.9).<\/p><p>Seu aspecto espiritual (Cl 1.8).<\/p><p class='li'>5 - Igreja triunfante As portas do hades não prevalecerão (Mt 16.18) Triunfo na morte (2Tm 4.6-8) Observação A mera habitação do Espírito não constitui a igreja como corpo de Cristo, pois o Espírito Santo já estava habitando nos discípulo antes do pentecostes Jo 20.22, mas igreja como corpo de Cristo só veio a existir em Atos 2.4, após a ascensão de Jesus aos céus, Ef 1.20-22.<\/p>"}, {"n": 30, "t": "O DISPENSACIONALISMO EM 4 MODALIDADES", "html": "<p>As variações no dispensacionalismo O ponto central nessas variações se dá no aspecto da continuidade e descontinuidade entre as dispensações, isto é, o que se aplica ou não da revelação bíblica entregue em uma dispensação para a próxima. O exemplo mais simples é, o que da dispensação da lei se aplica hoje para dispensação da graça, o que do antigo testamento se aplica a Igreja(continuidade) e quais não mais(descontinuidade).<\/p><p>Ultra Ethelbert Willian Bullinger (1837-1913).<\/p><p>Desde muito novo foi reconhecido como um perito em línguas bíblicas, sendo autor de mais de 70 obras incluindo um léxico crítico do grego do NT. Foi ordenado pastor na igreja anglicana em Londres e recebeu seu doutorado em 1881. Bullinger é considerado um ultra- dispensacionalista por entender que a Igreja tem início a partir do ministério de Paulo ao invés de Atos 2. O aspecto da descontinuidade em Bullinger foi bem radical, pois apesar de não ser um liberal, acreditava que apenas as epístolas contêm ensinos normativos para igreja, desprezando assim atos, os evangelhos e todo AT. Exerceu influência em alguns teólogos norte-americanos como: Cornelius R. Stan e Charles F. Baker.<\/p><p>Clássico Darby, Scofield, A. C. Gaebelein, Clarence Larkin, Chafer. (1878 a 1950) A bíblia anotada de Scofield(1917) é o guia para o D.C.<\/p><p>Posições básicas com ênfases da Descontinuidade:<\/p><p class='li'>1 - Nova aliança somente para Israel<\/p><p class='li'>2 - Distinção entre reino de Deus e Reino dos céus<\/p><p class='li'>3 - Sermão do monte é judaico sendo normativo apenas para o milênio<\/p><p class='li'>4 - Deus tem dois povos<\/p><p class='li'>5 - Menos continuidade do AT ao NT Revisado O período em que o revisado se destaca vai de 1950 a 1980.<\/p><p>Walvoord - John V. Mcgee - Ryrie - Pentecost - Alva J. Maclaim - Stanley D. Toussaint - Renald E. Showers - Norman Geisler - Ice - Robert L. Thomas - Andy Woods - John Feinberg - Michael Vlach.<\/p><p>O processo de revisão tem início em Chafer, sua teologia sistemática aponta esse fato. Seu sucessor Walvoord deu continuidade ao seu trabalho, mas é em 1967 que há a primeira amostra das revisões feitas até então com a publicação da bíblia anotada de Scofield agora revisada. As 807 notas da versão de 1917 são editadas, revisadas e ampliadas para um total de 1528 notas.<\/p><p class='li'>1 - A nova aliança se aplica à Igreja<\/p><p class='li'>2 - Reino dos céus e Reino de Deus são termos intercambiáveis<\/p><p class='li'>3 - O sermão do monte é aplicável à Igreja.<\/p><p class='li'>4 - Deus tem um povo<\/p><p class='li'>5 - Mais continuidade do AT para o NT Progressivo Darrell L. Bock - Craig Blaising - Robert Sauncy Seu período teve início em 1980.<\/p><p>O progressivo faz uma ruptura significativa em alguns temas em relação ao clássico e revisado ao ponto de se assemelhar ao aliancismo.<\/p><p>Destarte, essa é a intenção, pois Saucy publica sua obra em 1993 cujo título é “Uma defesa do dispensacionalismo Progressivo - A interface entre a teologia Dispensacionalista e Aliancista”. Logo, os elementos de continuidade no progressivo têm maior destaque a tal ponto que não é possível identificar diferença entre o aliancismo em alguns temas. Um exemplo é sua perspectiva em relação ao reino e ao trono de Davi. Os progressistas creem que Cristo já está reinando no trono de Davi, uma crença aliancista que visa negar um reino terreno literal.<\/p>"}, {"n": 31, "t": "O DISPENSACIONALISMO REVISADO", "html": "<p>O dispensacionalismo Revisado Embora o processo de revisão teve seu início já com Chafer e Walvoord, o grande sistematizador foi Ryrie que publicada em 1965 o “dispensacionalismo hoje”. O grande diferencial do revisado consiste em sua hermenêutica, um método literal “consistente”, e unidade do povo eleito de Deus mantendo a distinção entre Israel e Igreja como um dos elementos essenciais ao dispensacionalismo.<\/p><p>John F. Walvoord (Dallas Theological Seminary) Frank Gaebelein (Stone Brook School) Willian Culbertson (Moody Bible Institute) Charles L. Feinberg ( Talbot Theological Seminary) Alva McClain (Grace Theological Seminary) Scofield Bible 1967 - foi de 807 para 1528 notas O método literal é usado por todos, inclusive por aliancistas, por isso o acréscimo “consistente”. Todos os não-dispensacionalistas fazem uso da interpretação literal, contudo diante dos textos proféticos adotam uma hermenêutica alegórica fazendo uso de uma exegese apostólica. O método histórico gramatical no dispensacionalismo revisado é consistente por interpretar o texto profético de maneira literal, a despeito de seu simbolismo e gênero literário. O dispensacionalismo revisado compreende que Deus tem:<\/p><p class='li'>1 - Um único plano redentor<\/p><p class='li'>2 - Um único salvador<\/p><p class='li'>3 - Um único meio pelo qual os homens são salvos - graça - fé<\/p><p class='li'>4 - Um único povo - os salvos de todas as eras - unidade composta Entretanto, esse único povo é composto por povos de toda tribo, língua e nação. Antes de Abraão Deus salvou os não judeus, após Abraão Deus salva Judeus e gentios que creem nEle como único Deus, assim foi até o pentecostes.<\/p><h4>PENTECOSTES EM DIANTE<\/h4><p>No pentecoste acontece algo inédito, o Espírito vem habitar em todos os crentes formando o corpo de Cristo, isto é a Igreja que também é composta de Judeus e gentios. O diferencial agora são vários:<\/p><p class='li'>1 - A Igreja é formada (Ef 1.20-23)<\/p><p class='li'>2 - Não há barreira de separação (Ef 2.13-16)<\/p><p class='li'>3 - Gentios são cooerdeiros das promessas em igualdade com o Judeu (Ef 3.4-6)<\/p><p class='li'>4 - Cristo foi feito cabeça da Igreja (Ef 1.22) Deus tem programas escatológicos distintos para seu povo. Uma promessa específica para Israel e todos os salvos do milênio (Is 65.17-19; Ap 21.1; 24), e outra para os que fazem parte do corpo de Cristo e os demais santos do antigo testamento que morreram e ressuscitarão em corpos glorificados (Jo 14.1-3; Fp 3.20; Hb 11.10,16; 12.22,23; 2Pe 3.13; Ap 21.12,14). Algumas mudanças em diversos pontos escatológicos no D.R.<\/p><p class='li'>1 - Não há igreja ou arrebatamento em Mateus 24 e 25.<\/p><p class='li'>2 - Arrebatamento: apenas os santos que compõem a Igreja ressuscitarão.<\/p><p class='li'>3 - A segunda vinda é única e individual, não existem duas etapas.<\/p><p class='li'>4 - Há um intervalo entre arrebatamento e o início da Tribulação<\/p><p class='li'>5 - Haverá integração entre céu e terra na eternidade.<\/p>"}, {"n": 32, "t": "O DISPENSACIONALISMO REVISADO - CRENÇAS FUNDAMENTAIS", "html": "<p>Podemos iniciar demonstrando o que não é dispensacionalismo, em seguida apresentaremos uma definição em que consiste o dispensacionalismo como um sistema teológico.<\/p><p>Dispensacionalismo não:<\/p><p class='li'>1 - Não ensina duas formas de salvação.<\/p><p class='li'>2 - Não desconsidera os gêneros literários e o simbolismo bíblico.<\/p><p class='li'>3 - Não fragmente as escrituras.<\/p><p class='li'>4 - Não é antinomista.<\/p><p class='li'>5 - Não se resume em crer em dispensações.<\/p><p class='li'>6 - Não se originou em Darby, Margareth ou Lacunza.<\/p><p class='li'>7 - Não é de origem pentecostal ou arminiana.<\/p><p class='li'>DEFINIÇÃO TEOLÓGICA CONCEITUAL BÁSICA O Dispensacionalismo é um sistema teológico que positivamente:<\/p><p class='li'>1 - Utiliza o método hermenêutico literal e consistente.<\/p><p class='li'>2 - Faz distinção entre Igreja e Israel.<\/p><p class='li'>3 - Único plano divino<\/p><p class='li'>4 - Único meio de salvação<\/p><p class='li'>5 - Único povo de Deus<\/p><p class='li'>6 - Deus tem programas menores para grupos distintos que compõem seu único povo.<\/p><p class='li'>7 - Há diversas dispensações.<\/p><p class='li'>8 - Continuidade e descontinuidade na administração divina de seu plano redentor.<\/p><p class='li'>9 - Compreende o aspecto progresivo e cumulativo(continuidade) da revelação.<\/p><p class='li'>10 - O dispensacionalismo é pré-tribulacional.<\/p><p class='li'>11 - Restauração do Israel étinico em sua pátria.<\/p><p class='li'>12 - Reino intermediário, político e terreno governado pelo descendente de Davi a partir de seu trono em Israel.<\/p><p class='li'>13 - O céu é a morada da Igreja.<\/p><p class='li'>14 - Integração entre céu e terra na eternidade.<\/p>"}, {"n": 33, "t": "QUANTOS POVOS DEUS TEM? - O ÚNICO POVO COMPOSTO DE DEUS", "html": "<h4>CONTEÚDO EXPLICATIVO NA VÍDEO-AULA<\/h4><h4>CONTEÚDO EXPLICATIVO NA VÍDEO-AULA<\/h4><h4>CONTEÚDO EXPLICATIVO NA VÍDEO-AULA<\/h4>"}, {"n": 34, "t": "O DISPENSACIONALISMO E OS ELEMENTOS DE CONTINUIDADE E DESCONTINUIDADE", "html": "<h4>CONTEÚDO EXPLICATIVO NA VÍDEO-AULA<\/h4>"}, {"n": 35, "t": "AS SETE DISPENSAÇÕES E SEUS FATORES GOVERNANTES", "html": "<h4>CONTEÚDO EXPLICATIVO NA VÍDEO-AULA<\/h4>"}]}, {"n": 7, "t": "O DISPENSACIONALISMO ANTES DE DARBY", "aulas": [{"n": 36, "t": "DISPENSACIONALISMO ANTES DE DARBY - CONCEITOS DISPENSACIONALISTAS NA PATRÍSTICA", "html": "<p>A verdadeira Origem do dispensacionalismo Pilares essenciais do dispensacionalismo:<\/p><p class='li'>1 - Interpretação literal - Escola antioquena<\/p><p class='li'>2 - Milênio terreno e político - Todos os pais ante-nicenos<\/p><p class='li'>3 - Futura restauração do Israel etnico - Irineu - Tertuliano - Hipolitus<\/p><p class='li'>4 - Distinção entre Igreja e Israel - Programa distinto para Israel<\/p><p class='li'>5 - Dispensações - Irineu - Tertuliano - Agostinho<\/p><p class='li'>6 - Iminência - Didaquê - Clemente<\/p><p class='li'>7 - Arrebatamento - Victorino - Efrém Esses são os conceitos essenciais ao dispensacionalismo, será que alguém defendeu isso antes de Darby. Meu intuito é de
