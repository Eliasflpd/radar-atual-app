a (de 622 /apóllymi, \"cortar\") – destruição, fazer com que alguém (algo) seja completamente cortado - cortado (inteiramente) do que poderia ou deveria ter sido. (Observe a força do prefixo, apo.) Veja 622 (apollymi).<\/p><p>684 /apṓleia (\"perdição\") não implica \"aniquilação\" (veja o significado do verbo raiz, 622 /apóllymi, \"cortar\"), mas sim \"perda de bem-estar\" em vez de ser (Dicionário Expositivo de Vine, 165; cf. Jo 11,50; At 5,37; 1 Co 10,9-10; Judas 11)<\/p><blockquote>Apocalipse 19:20 E a besta foi presa, e com ela o falso profeta, que diante dela fizera os sinais, com que enganou os que receberam o sinal da besta, e adoraram a sua imagem. Estes dois foram lançados vivos no lago de fogo que arde com enxofre.<\/blockquote><blockquote>Apocalipse 20:10 E o diabo, que os enganava, foi lançado no lago de fogo e enxofre, onde estão a besta e o falso profeta; e de dia e de noite serão atormentados para todo o sempre.<\/blockquote><h4>AIONAS TON AIONON<\/h4><blockquote>Apocalipse 1:18 E o que vivo e fui morto, mas eis aqui estou vivo para todo o sempre. Amém. E tenho as chaves da morte e do inferno.<\/blockquote><blockquote>Apocalipse 4:9 E, quando os animais davam glória, e honra, e ações de graças ao que estava assentado sobre o trono, ao que vive para todo o sempre,<\/blockquote><blockquote>Apocalipse 22:5 E ali não haverá mais noite, e não necessitarão de lâmpada nem de luz do sol, porque o Senhor Deus os ilumina; e reinarão para todo o sempre.<\/blockquote>"}, {"n": 85, "t": "APOCALIPSE - O SEXTO SELO - PRENÚNCIOS DO FIM", "html": "<blockquote>Apocalipse 6:12 E, havendo aberto o sexto selo, olhei, e eis que houve um grande tremor de terra; e o sol tornou-se negro como saco de cilício, e a lua tornou-se como sangue; 13 E as estrelas do céu caíram sobre a terra, como quando a figueira lança de si os seus figos verdes, abalada por um vento forte. 14 E o céu retirou-se como um livro que se enrola; e todos os montes e ilhas foram removidos dos seus lugares. 15 E os reis da terra, e os grandes, e os ricos, e os tribunos, e os poderosos, e todo o servo, e todo o livre, se esconderam nas cavernas e nas rochas das montanhas; 16 E diziam aos montes e aos rochedos: Caí sobre nós, e escondei-nos do rosto daquele que está assentado sobre o trono, e da ira do Cordeiro; 17 Porque é vindo o grande dia da sua ira; e quem poderá subsistir?<\/blockquote><h4>RESPOSTA AO CLAMOR DOS MÁRTIRES<\/h4><p>Ainda faltam sete trombetas e sete taças, um total de treze juízos a serem derramados sobre a terra, mas o sexto selo faz um prenuncio do que ocorrerá no fim da tribulação, o grande e terrível dia do Senhor. Cronologicamente o sexto selo será aberto após o quinto, entretanto o que é revelado neste selo só ocorre no fim da tribulação e não no ato de sua abertura. O quinto selo apresenta as almas clamando por vingança e justiça debaixo do altar, o sexto selo demonstra a resposta a este clamor, mas sua oração será plenamente atendida somente no fim da tribulação.<\/p><p>6.12,13 E, havendo aberto o sexto selo, olhei, e eis que houve um grande tremor de terra; e o sol tornou-se negro como saco de cilício, e a lua tornou-se como sangue. E as estrelas do céu caíram sobre a terra, como quando a figueira lança de si os seus figos verdes, abalada por um vento forte. Esses eventos são simbólicos ou literais? O que tempos aqui é o mesmo relato que Joel, Mateus e muitos outros escritores registraram, o “grande de terrível dia do Senhor”. Tais juízos serão executados durante o segundo advento de Cristo a essa terra. De uma maneira um tanto poética, o escritor do apocalipse está descrevendo que haverá uma escuridão total sobre terra momentos antes de Cristo aparecer em glória, algo semelhante o que ocorreu com a oitava praga do Egito, mas aqui as trevas será universal, o Sol não dará seu brilho, a lua vai escurecer, as estrelas se apagarão. Todos esses detalhes apresentam uma única verdade, haverá um blackout total no último dia da tribulação.<\/p><p>6.14 E o céu retirou-se como um livro que se enrola; e todos os montes e ilhas foram removidos do seu lugar. A retirada do céu como um livro, é uma maneira poética de descrever a trevas absoluta que haverá no fim da tribulação. Há comentadores que interpretam os montes e ilhas como símbolos de pessoas que exercem autoridade em regiões específicas, entretanto, é mais provável que João esteja revelando um efeito próprio da escuridão que sobrevirá, não será possível enxergar nem os montes.<\/p><p>6.15-17 E os reis da terra, e os grandes, e os ricos, e os tribunos, e os poderosos, e todo servo, e todo livre se esconderam nas cavernas e nas rochas das montanhas e diziam aos montes e aos rochedos: Caí sobre nós e escondei-nos do rosto daquele que está assentado sobre o trono e da ira do Cordeiro, porque é vindo o grande Dia da sua ira; e quem poderá subsistir? Esse texto apresenta a mesma verdade expressa pelo profeta Isaias, “E meter-se-ão pelas fendas das rochas e pelas cavernas das penhas, por causa da presença espantosa do Senhor e por causa da glória da sua majestade, quando ele se levantar para assombrar a terra”, (Is 2.21; cf Lc 21.25-27). Os homens desmaiarão de pavor quando esses eventos ocorrerem, entretanto, preferirão a morte ao arrependimento!<\/p>"}, {"n": 86, "t": "APOCALIPSE - OS 144 MIL ISRAELITAS", "html": "<p>O capítulo 7 inicia apresentando o primeiro interlúdio do livro, que é uma espécie de parênteses afim de trazer detalhes relacionados ao presente, passado ou futuro, sem se importar com a ordem cronológica dos selos, trombetas ou taças. O capítulo sete tem o objetivo de demonstrar que mesmo em meio a sua ira, Deus esta salvando milhares de pessoas em meio aos Israelitas e gentios. Contudo, enquanto um grupo é selado e protegido dos juízos, outros são mortos.<\/p><h4>OS QUATRO ANJOS<\/h4><p>7.1.a E, depois destas coisas, vi quatro anjos que estavam sobre os quatro cantos da terra, retendo os quatro ventos da terra, para que nenhum vento soprasse sobre a terra, nem sobre o mar, nem contra árvore alguma.<\/p><p>Depois destas coisas, ou depois da abertura do sexto selo, mas não depois do evento revelado no sexto selo, pois este diz respeito a segunda vinda e fim da tribulação. Essa visão ocorreu depois da revelação do sexto selo, mas trata-se de acontecimentos anteriores ao sexto selo, temos aqui então a primeira recapitulação, onde detalhes adicionais sobre os eventos relatados na abertura dos primeiros selos são apresentados.<\/p><p>Vi quatro anjos que estavam sobre os quatro cantos da terra.<\/p><p>Esses quatro anjos estão de alguma forma relacionados aos quatro primeiros juízos que sobrevirão a terra na abertura dos quatro primeiros selos. O fato de estarem sobre os quatro quantos da terra aponta para a universalidade desses juízos, confirmando que a tribulação será global (3.10).<\/p><p>Retendo os quatro ventos da terra, para que nenhum vento soprasse sobre a terra, nem sobre o mar, nem contra árvore alguma.<\/p><p>A função desses anjos é reter os ventos, ou os juízos, pois esses estão sob o comando do Cordeiro, é Ele quem abre os selos do livro, a grande tribulação só inicia sob sua ordem. Terra, mar e arvores indicam que nada ou ninguém deixará de ser afetado pelos juízos e ira de Deus, exceto os selados.<\/p><p>7.2 E vi outro anjo subir da banda do sol nascente, e que tinha o selo do Deus vivo. Banda do sol nascente, região de Israel. Este anjo tem o selo de proteção divina contra a ira vindoura.<\/p><p>E clamou com grande voz aos quatro anjos, a quem fora dado o poder de danificar a terra e o mar, 3 dizendo:<\/p><p>Ao clamar aos quatro anjos, sugere que tem autoridade sobre esses. Esses anjos tem poder de danificar todo o planeta terra, e é isso que ocorrerá já na abertura dos quatro primeiros selos. Não danifiqueis a terra, nem o mar, nem as árvores, até que hajamos assinalado na testa os servos do nosso Deus. Estes servos receberão o selo de proteção antes da abertura dos quatro primeiro selos, isto é, antes de iniciar a grande tribulação, pois como já foi comentado em (3.10), entre o arrebatamento da igreja e o inicio do dia do Senhor haverá uma lacuna de tempo, onde o anticristo organizará o caos mundial após o rapto da Igreja, por outro lado, nesse intervalo de tempo milhares já se converterão, e dentre estes, cento e quarenta e quatro mil serão escolhidos para que não sejam afetados pelos juízos.<\/p><h4>OS 144 MIL ISRAELITAS<\/h4><p>4 E ouvi o número dos assinalados, e eram cento e quarenta e quatro mil assinalados, de todas as tribos dos filhos de Israel. Seriam estes assinalados a igreja, ou Israel? É muito importante a definição desse grupo, pois temos aqui o povo que tem relações primarias com a grande tribulação. Em algum lugar no novo testamento a igreja é denominada de “doze tribos de Israel”? Na epistola de Tiago lemos: “Tiago, servo de Deus e do Senhor Jesus Cristo, às doze tribos que andam dispersas: saúde, (1.1). Tiago não está dizendo que a igreja é as doze tribos de Israel, mas que dentre as doze tribos dispersas, há um grupo de Israelitas que são crentes em Cristo, e estes se tornam igreja. O irmão de Jesus assim se dirige a uma igreja que em sua maioria era composta por Israelitas, estes não perdem sua identidade ao se tornarem membros do corpo de Cristo. Um outro texto que comumente é usado para sustentar a ideia pífia de que a Igreja é o Israel de Deus é Gálatas 6.16 “E, a todos quantos andarem conforme esta regra, paz e misericórdia sobre eles e sobre o Israel de Deus.” Esse texto não diz que a igreja é o Israel de Deus, mas sim que dentre os Israelitas, os que de fatos são de Deus pertencem ao corpo de Cristo que é a Igreja. O “eles” são os gentios, o “Israel de Deus” são os Israelitas que compõe o corpo de Cristo junto aos gentios, fato que atestado no verso anterior, “Porque, em Cristo Jesus, nem a circuncisão nem a incircuncisão têm virtude alguma, mas sim o ser uma nova criatura”. Em Cristo, isto é, em seu corpo que é a igreja, há a circuncisão (Israelitas) e a incircuncisão (gentios). Para o judeu que se apegava ao outro evangelho, obediência a lei como meio de salvação, Paulo lhes diz, “o Israel de Deus” são os isaraelitas salvos pela fé em Cristo, e junto aos gentios compõe a Igreja.<\/p><p class='li'>7. 5 Da tribo de Judá, havia doze mil assinalados; da tribo de Rúben, doze mil; da tribo de Gade, doze mil; 6 da tribo de Aser, doze mil; da tribo de Naftali, doze mil; da tribo de Manassés, doze mil; 7 da tribo de Simeão, doze mil; da tribo de Levi, doze mil; da tribo de Issacar, doze mil; 8 da tribo de Zebulom, doze mil; da tribo de José, doze mil; da tribo de Benjamim, doze mil.<\/p><p>Aqueles que insistem que essas doze tribos de Israelitas são uma representação da Igreja se apegam ao fato de que essa lista com os nomes das tribos diverge das demais apresentadas em Gênesis 49 e Ezequiel 48. Deve ser observado que já há uma diferença entre a lista de Genesis e de Ezequiel, isso quer dizer que se o fato da lista de João ser diferente é um fator determinante para afirmar que não se trata do Israel literal, então qual das duas listas representada no antigo testamento representa o Israel literal, uma vez que ambas também divergem? O que deve ser compreendido é o propósito dessas listas em seus respectivos contextos.<\/p><p>Em Gênesis 49 tempos uma relação dos doze filhos de Jacó, assim a lista apresenta tanto Levi como José.<\/p><p>O texto de Ezequiel 48 apresenta a repartição de terra, Levi não está pois não tem parte em herança, sendo uma tribo sacerdotal. José também não consta, pois transferiu sua benção para seus dois filhos Manasses é Efraim. Sendo assim, Manasses e Efraim ocupam os lugares de Levi e José no grupo dos doze na lista de Ezequiel.<\/p><p>O contexto da lista de João é totalmente distinto, o objetivo não é apresentar os nomes dos doze filhos de Jacó, tão pouco repartir a terra. Esse grupo é selado para serem preservados dos juízos da septuagésima semana de Daniel.<\/p><p>Charles C. Ryrie sugere que Levi é incluso por ser a tribo sacerdotal, isso aponta para o fato de que liderarão as demais tribos rumo a evangelização mundial após ao arrebatamento e durante a grande tribulação. José está no lugar de Efraim, pois aqui não se trata de divisão de terra. Dã também não está presente, em seu lugar temos Levi, a sugestão de sua exclusão se dá ao fato do constante envolvimento dessa tribo com idolatria (Lv 24.11; Jz 18.1-8, 30,31; 1 Rs 12.28,29), por esse motivo essa tribo é excluída da grande missão evangelística a ser realizada após o arrebatamento da Igreja.<\/p><p>Contudo, Dã não será excluída da herança terrena que será partilhada no milênio (Ez 48.32), pois os dons e vocações são sem arrependimento (Rm 11.29).<\/p><p>Portanto, podemos concluir seguramente que assim como as duas listas do antigo testamento representam Israel literalmente, igualmente a lista de João em Apocalipse também é uma referência a Israelitas literais, descendentes biológicos de Abraão que estão espalhados por esse mundo, mas Deus sabe identificar cada um pelo nome e tribo! A maior prova de que se trata de Israelitas e não da igreja, é o fato de que é dado nome às tribos, pois em nenhum lugar das Escrituras a igreja é descrita como sendo a tribo de Rúben, e Gade! Uma leitura simples do texto, tomando suas palavras no sentido comum intencionado pelo autor sagrado jamais conduzirá o leitor a afirmar que essas tribos são representações da igreja, conforme insiste boa parte dos pós-tribulacionistas influenciados por George Ladd e demais aliancistas superssecionistas.<\/p>"}, {"n": 87, "t": "APOCALIPSE - SALVAÇÃO DURANTE A TRIBULAÇÃO", "html": "<blockquote>Apocalipse 7.9 - Depois destas coisas, olhei, e eis aqui uma multidão, a qual ninguém podia contar, de todas as nações, e tribos, e povos, e línguas, que estavam diante do trono e perante o Cordeiro, trajando vestes brancas e com palmas nas suas mãos.<\/blockquote><p>Essa grande multidão de salvos é composta por pessoas de todas as nações, povos, idiomas, isso inclui gentios de todos os países. O texto fala de tribos, isso quer dizer que dentre todas as tribos Israelitas, muitos morrerão durante os juízos da tribulação, estes são os Israelitas não selados, pois o selo não é para todos, a proteção é parcial a fim de preservar os cento e quarenta e quatro missionários. As vestes brancas indicam que foram justificados por Cristo e as palmas nas mãos apontam para o fato de estarem celebrando sua vitória pelo sangue de Cristo.<\/p><p class='li'>7. 10 e clamavam com grande voz, dizendo: Salvação ao nosso Deus, que está assentado no trono, e ao Cordeiro. Esse clamor trata-se é um ato de adoração, essa multidão está louvando a Deus por sua salvação. Essa é a mesma multidão que na abertura do quinto selo é vista clamando por justiça, nessa visão é revelado o momento e a condição que estes chegam ao céu. 7.11 E todos os anjos estavam ao redor do trono, e dos anciãos, e dos quatro animais; e prostraram-se diante do trono sobre seu rosto e adoraram a Deus, 12 dizendo: Amém! Louvor, e glória, e sabedoria, e ações de graças, e honra, e poder, e força ao nosso Deus, para todo o sempre. Amém! Diante de tão grande salvação, anjos, querubins e a Igreja louva a Deus por seus atos salvíficos!<\/p><p>7.13 E um dos anciãos me falou, dizendo: Estes que estão vestidos de vestes brancas, quem são e de onde vieram? Quem são esses salvos, de onde vieram? João não sabe, mas mesmo ancião que faz a pergunta tem a resposta.<\/p><p>7.14 E eu disse-lhe: Senhor, tu sabes. E ele disse-me: Estes são os que vieram de grande tribulação. Estes são os que vieram da grande tribulação, são os morrerão martirizados ou sob os juízos durante a apertura dos primeiros selos, a fase inicial da grande tribulação. O texto original traz a ideia de “são os que estão vindo da grande tribulação”, um a um ou grupo a grupo, isto é, eles não chegaram de uma só vez como em um arrebatamento geral. Em (6.10) é dito que eles repousarão até que os demais sejam mortos, contudo, esse repouso é em relação ao que sofreram na terra, pois no céu já estarão em constante atividade.<\/p><p>Lavaram as suas vestes e as branquearam no sangue do Cordeiro. É muito comum a afirmação: “durante a grande tribulação as pessoas serão salvas pelo derramamento do próprio sangue”. Sangue de pecador tem poder de salvar pecador? O homem pode salvar a si mesmo pelo martírio? Um crente com o mínimo de entendimento sobre a doutrina da salvação, corretamente vai responder essas questões com um enfático não! O texto diz que eles branquearam suas vestes pelo sangue do Cordeiro, e não pelo próprio sangue. Em todas as dispensações a salvação sempre tem por base o sacrifício vicário de Cristo, que é oferecida por graça e o homem sempre recebe por fé.<\/p>"}]}, {"n": 12, "t": "O APOCALIPSE - TROMBETAS E TAÇAS", "aulas": [{"n": 88, "t": "APOCALIPSE - AS PRIMEIRAS TROMBETAS", "html": "<h4>AS PRIMEIRAS TROMBETAS<\/h4><p>Embora o texto não o diga, é muito possível que tais trombetas sejam tocadas durante os três primeiros anos e meio da tribulação, e isso por uma razão muito simples. Durante os juízos das trombetas não há qualquer menção da besta ou seus adoradores como ocorre com os juízos das taças, assim concluímos que as trombetas, diferente das taças, não tem relações com os últimos três anos e meio, mas sim com os três primeiros anos e meio conforme será demonstrado adiante.<\/p><p>Um detalhe básico e importante em relação as quatro primeiras trombetas é que tais juízos afetarão todo o planeta terra, sua vida vegetal e animal, e esse será o meio utilizado por Deus para julgar e castigar todos os habitantes da terra. Considerando que toda a terra será afetada por tais juízos, é muito óbvio que não somente os ímpios serão afetados, mas igualmente os salvos, exceto os 144 mil selados. Logo, a afirmação de que os santos (que na perspectiva pós- tribulacionista erroneamente é a igreja) sofrerão apenas a perseguição do anticristo, é totalmente descabida conforme demonstraremos adiante. Os juízos das trombetas é uma demonstração clara de que os santos da tribulação não serão guardados em meio aos juízos Divinos, e esse detalhe depõe contra o pós-tribulacionista que usa (3.10) para afirmar que a igreja vai ser guardada durante a tribulação.<\/p><h4>SEGUNDA TROMBETA<\/h4><p>8.8,9 E o segundo anjo tocou a trombeta; e foi lançada no mar uma coisa como um grande monte ardendo em fogo, e tornou-se em sangue a terça parte do mar. E morreu a terça parte das criaturas que tinham vida no mar; e perdeu-se a terça parte das naus.<\/p><p>Ao toque da segunda trombeta João vê algo como uma grande bola de fogo que atinge uma terça parte do mar, um terço de toda a vida marítima morre, o mal cheiro será insuportável, muitas doenças se proliferarão como consequência deste juízo. Será que apenas os ímpios serão afetados por tal juízo? Dificilmente, pois assim como as grandes crises afetam todos os tipos de pessoas, salvos ou não, igualmente ocorrerá em meio aos Juízos durante os sete anos da grande tribulação.<\/p><h4>QUARTA TROMBETA<\/h4><p>8.12 E o quarto anjo tocou a sua trombeta, e foi ferida a terça parte do sol, e a terça parte da lua, e a terça parte das estrelas; para que a terça parte deles se escurecesse, e a terça parte do dia não brilhasse, e semelhantemente a noite.<\/p><p>Esse juízo não tem por objetivo encurtar o dia em um terço, mas sim escurecer o dia e a noite, semelhante ao que ocorreu no Egito. Será que esse escurecimento afetará apenas os ímpios? É obvio que não, assim como os demais juízos, todos habitantes da terra serão afetados, o que não exclui os salvos. A igreja é prometido proteção “te guardarei da hora da tentação”, considerando que esses santos não serão protegidos, a conclusão lógica é que estes nãos são a igreja. Levando em conta que tais juízos afetarão todo o globo terrestre, o único meio da igreja ser guardada é por meio da remoção da terra, como é indicado pela preposição “ek” em (3.10).<\/p>"}, {"n": 89, "t": "APOCALIPSE - A QUINTA TROMBETA - GAFANHOTOS E ESCORPIÕES", "html": "<p>Os eventos relacionados a quinta trombeta são descritos por meio de simbolismo, e isso tem gerado inúmeras especulações, alguns tem sugerido que gafanhotos com caldas semelhantes a de escorpiões são helicópteros de guerra, os quais lançarão bombas durante a tribulação, essa é uma maneira totalmente equivocada e anacrônica que interpretar o simbolismo do Apocalipse. Ao considerar uma literatura do primeiro século, sempre que o contexto bíblico não indicar, temos que recorrer aos costumes e cultura da época para entender os símbolos. Entretanto, conforme analisaremos, o próprio texto apresenta pistas para a correta compreensão de seus símbolos.<\/p><p>9.3 E da fumaça vieram gafanhotos sobre a terra. João vê demônios em forma de gafanhotos, não significa que a forma física seja literalmente como a de gafanhotos, mas esse detalhe aponta para a quantidade e o dano causado por esses seres demoníacos.<\/p><p>E foi-lhes dado poder, como o poder que têm os escorpiões da terra. Escorpiões causam muitas dores quando injetam seu veneno em seres humanos, mas raramente matam, assim será a atuação desses demônios, causarão apenas sofrimento mas não terão permissão para matar.<\/p><blockquote>Apocalipse 9:4 E foi-lhes dito que não fizessem dano à erva da terra, nem a verdura alguma, nem a árvore alguma, mas somente aos homens que não têm nas suas testas o selo de Deus. 5 E foi-lhes permitido, não que os matassem, mas que por cinco meses os atormentassem; e o seu tormento era semelhante ao tormento do escorpião, quando fere o homem. 6 E naqueles dias os homens buscarão a morte, e não a acharão; e desejarão morrer, e a morte fugirá deles.<\/blockquote>"}, {"n": 90, "t": "APOCALIPSE - AS DUAS TESTEMUNHAS", "html": "<h4>AS DUAS TESTEMUNHAS (11.1-13)<\/h4><p>Em linhas gerais, há uma interpretação que diz ser Elias e Moisés, isso pelo tipo de sinais operado por esses servos de Deus. Outros entendem ser Elias e Enoque, estes colocam Enoque no lugar de Moisés pelo fato de que o profeta morreu, e ao homem está destinado morrer uma só vez. Com isso cria-se outro problema, pois Enoque foi tomado para não experimentar a morte, e cremos que Deus não mudará de ideia (Hb 11.5). A interpretação que se encaixa nesse contexto é aquela em que as duas testemunhas são dois personagens que Deus levanta cujos ministérios se assemelham ao ministério de Moisés e Elias, (Ap 11; Mt 11.14). Outros entendem ser as duas testemunhas como símbolo de um testemunho completo, pois duas testemunhas eram o mínimo exigido pela Lei para que alguma mensagem fosse atestada, contudo, essa interpretação que se assemelha a ideia Adventista (dizem ser a bíblia), mas não consegue explicar a morte e ressurreição das duas testemunhas.<\/p><p>Moisés<\/p><blockquote>Deuteronômio 34:5 Assim morreu ali Moisés, servo do SENHOR, na terra de Moabe, conforme a palavra do SENHOR. 6 E o sepultou num vale, na terra de Moabe, em frente de Bete-Peor; e ninguém soube até hoje o lugar da sua sepultura.<\/blockquote><blockquote>Josué 1:2 Moisés, meu servo, é morto; levanta-te, pois, agora, passa este Jordão, tu e todo este povo, à terra que eu dou aos filhos de Israel.<\/blockquote><h4>HB 9.27<\/h4><h4>1CO 15.23<\/h4><h4>ELIAS<\/h4><p>Algo que tem trazido muita discussão está relacionado à futura vinda de Elias, profetizada em<\/p><blockquote>Malaquias 4.5-6, “Eis que eu vos enviarei o profeta Elias, antes que venha o grande e terrível Dia do SENHOR; ele converterá o coração dos pais aos filhos e o coração dos filhos a seus pais, para que eu não venha e fira a terra com maldição.”<\/blockquote><p>Dentre muitas teorias a respeito do assunto será destacada apenas a que tem maior sustentação bíblica. Esta se baseia na afirmação de que João Batista não cumpriu esta profecia pelo fato de Israel o ter rejeitado.<\/p><p>Vemos em Malaquias que a profecia acerca de João Batista está, de certa forma, dividida em duas fases: Ml 3.1 e 4.5-6.<\/p><blockquote>Lucas 1.17 mostra que o Elias predito não era o literal, mas sim alguém “no espírito e poder de Elias”; esta preparação referia-se ao seu primeiro advento e foi confirmado o cumprimento desta profecia pelo próprio Jesus Cristo “Este é de quem está escrito: Eis aí eu envio diante da tua face o meu mensageiro, o qual preparará o teu caminho diante de ti” (Mt 11:10). No entanto o segundo ponto (Ml 4.5-6) da profecia de Malaquias está totalmente relacionado ao dia do Senhor, o qual já sabemos que se refere a grande tribulação; a promessa diz que Elias seria enviado “antes que venha o grande e terrível dia do Senhor”, a fim de preparar a geração que vivesse no tempo final, “Ele converterá o coração dos pais aos filhos e o coração dos filhos a seus pais”; podemos concluir, então que isto ainda não aconteceu. O que deu errado para que a profecia não se cumprisse? Numa resposta aos seus discípulos Jesus dá a entender o que aconteceu “E, se o quereis reconhecer, ele mesmo é Elias, que estava para vir” (Mt 11.14), o que Jesus quis dizer aqui foi que se a nação quisesse reconhecê-lo como o Elias profetizado automaticamente o reconheceria como o Messias, assim o reino seria instituído, os inimigos julgados, e Israel seria restaurado; a questão é que isso não aconteceu, ou seja não o reconheceram como o que cumpria a profecia fazendo com que esta parte ficasse pendente.<\/blockquote><blockquote>1 Coríntios 15:50 E agora digo isto, irmãos: que a carne e o sangue não podem herdar o reino de Deus, nem a corrupção herdar a incorrupção.<\/blockquote><blockquote>Em Mateus 17.10-11, o assunto volta à tona e Jesus é enfático na resposta aos discípulos: “Mas os discípulos o interrogaram: Por que dizem, pois, os escribas ser necessário que Elias venha primeiro? Então, Jesus respondeu: De fato, Elias virá e restaurará todas as coisas”; o versículo seguinte vem reafirmar o que ele já havia dito anteriormente “Eu, porém, vos declaro que Elias já veio, e não o reconheceram”, sendo assim João não pode cumprir toda a profecia; ele mesmo, ao ser perguntado se era Elias disse que não. “Então, lhe perguntaram: Quem és, pois? És tu Elias? Ele disse: Não sou” (Jo 1.21).<\/blockquote><p>Podemos então afirmar que haverá um ministério profético futuro que deverá cumprir em sua totalidade a profecia de Malaquias, entretanto esse “futuro Elias” não precisa ser literal, pois Jesus demonstrou, reconhecendo em João o Elias predito, que este será alguém “no espírito e poder de Elias”. Logo, as duas testemunhas serão dois crentes comuns do período tribulacional que serão revestidos de autoridade e poder para tal ministério.<\/p><p>É bem improvável que sejam identificados como Elias e Enoque porque o fato de terem sido arrebatados não os obriga a voltarem a terra para morrerem baseando-se em Hebreus 9.27, pois se os temos como tipo da igreja que há de ser arrebatada, temos que ter em mente que da mesma forma, se nós formos arrebatados agora, também não provaremos a morte física, excluindo a total necessidade de ressuscitarmos para morrermos e outra vez sermos levados por Cristo, portanto este argumento é totalmente inválido para estabelecermos esta identificação. Ou fato é que, corporalmente no céu, o salvo só entra com a glorificação (1Co 15.50).<\/p><h4>DOIS CRENTES ISRAELITAS<\/h4><p>Podemos acrescentar mais alguns detalhes sobre esse dois personagens sob outra perspectiva, pois muitas teorias surgem quando se tenta identificá-los, porém em 11.4 temos uma informação valiosa, pois revela de maneira simbólica, que podem ser judeus, já que candeeiros e oliveiras estão totalmente ligados a Israel (Zc 4). O verso 5 caracteriza o ministério como sendo profético: “Elas têm autoridade para fechar o céu, para que não chova durante os dias em que profetizarem. Têm autoridade também sobre as águas, para convertê-las em sangue, bem como para ferir a terra com toda sorte de flagelos, tantas vezes quantas quiserem” e são chamados de “profetas” no verso 10. O grande problema está em que vários escritores e comentaristas buscam uma identificação para estes, o que tem gerado uma série de especulações infundadas conforme vimos acima, pois uns dizem ser Elias e Enoque, outros dizem ser Elias e Moisés, entretanto, tudo se resume a dois pontos básicos para que se chegue a esta suposição, o primeiro aspecto que leva a esta conclusão é o fato de Elias e Enoque terem sido arrebatados, portanto não morreram, o segundo ponto defende ser Elias e Moisés baseando-se nos milagres apontados no texto (11.6), que são semelhantes aos feitos pelos dois profetas no passado. Preferimos a posição que não identifica as duas testemunhas, reconhecendo-as apenas como dois homens escolhidos para serem profetas durante o período tribulacional.<\/p>"}, {"n": 91, "t": "APOCALIPSE - A SÉTIMA TROMBETA - PRENÚNCIOS DO FIM", "html": "<h4>A SÉTIMA TROMBETA (11.15-19)<\/h4><p>Esta última trombeta não se trata de apenas mais um juízo, mas é também o anúncio dos eventos finais:<\/p><blockquote>Apocalipse 11:15 E o sétimo anjo tocou a sua trombeta, e houve no céu grandes vozes, que diziam: Os reinos do mundo vieram a ser de nosso Senhor e do seu Cristo, e ele reinará para todo o sempre. 16 E os vinte e quatro anciãos, que estão assentados em seus tronos diante de Deus, prostraram-se sobre seus rostos e adoraram a Deus, 17 Dizendo: Graças te damos, Senhor Deus Todo-Poderoso, que és, e que eras, e que hás de vir, que tomaste o teu grande poder, e reinaste. 18 E iraram-se as nações, e veio a tua ira, e o tempo dos mortos, para que sejam julgados, e o tempo de dares o galardão aos profetas, teus servos, e aos santos, e aos que temem o teu nome, a pequenos e a grandes, e o tempo de destruíres os que destroem a terra. 19 E abriu- se no céu o templo de Deus, e a arca da sua aliança foi vista no seu templo; e houve relâmpagos, e vozes, e trovões, e terremotos e grande saraiva.<\/blockquote><blockquote>Apocalipse 8:5 E o anjo tomou o incensário, e o encheu do fogo do altar, e o lançou sobre a terra; e houve depois vozes, e trovões, e relâmpagos e terremotos.<\/blockquote><p>a)Cristo Reina.<\/p><p>b)Os vinte quatro anciãos adoram a Deus.<\/p><p>c)A ira das nações e o tempo de dar os galardões aos profetas.<\/p><p>d)O juízo Relâmpagos, trovões terremotos, e vozes.<\/p><p>e)As sete taças da ira e Deus As vozes provavelmente seja referência aos últimos juízos, isto é, as sete salvas da ira de Deus, (15.1). Devemos atentar ao fato que haverá vários juízos após o toque da sétima trombeta, logo não podemos confundi-la com a última trombeta de 1Co15.51. Em apocalipse a sétima trombeta é de juízo e corresponde aos eventos da última metade da tribulação. Em 1Co 15.51 a trombeta é sinal de benção para os salvos, onde os mesmos serão transformados para imediatamente serem arrebatados. Ou seja, são trombetas distintas, em contextos e alvos distintos.<\/p><blockquote>Apocalipse 10:7 Mas nos dias da voz do sétimo anjo, quando estiver por tocar a trombeta, se cumprirá o segredo de Deus, como anunciou aos profetas, seus servos.<\/blockquote><p>O fato de Apocalipse 10.7 afirmar que a sétima trombeta revela o mistério dito “aos profetas” confirma de forma categórica que esta não é a mesma trombeta de 1 Coríntios 15, pois aquela foi um mistério revelado para Paulo.<\/p><p>O prezado estudante tem que atentar para o fato de que embora a sétima seja tocada na metade da tribulação, os eventos anunciados não ocorrem no ato de seu toque, mas sim no fim da tribulação. Enquanto o midi-tribulacionista falha ao afirmar que essa trombeta é a última de 1Co 15, o pós-tribulacionista comete o erro em dizer que a mesma será tocada no fim da tribulação.<\/p><p>O pós-tribulacionista diante da necessidade de colocar o arrebatamento no momento da segunda vinda, afirma que 11.18 confirma o arrebatamento por fala do tempo dos mortos, seu julgamento e galardão. Contudo, deve ficar claro não há um único texto que descreve a segunda vinda de Cristo após a tribulação e mencione ressuirreição e arrebatamento. O texto diz: “E iraram-se as nações, e veio a tua ira, e o tempo dos mortos, para que sejam julgados, e o tempo de dares o galardão aos profetas, teus servos, e aos santos, e aos que temem o teu nome, a pequenos e a grandes, e o tempo de destruíres os que destroem a terra”(Ap 11.18). Perceba que antes do tempo dos mortos, seu julgamento e recompensas, haverá a ira das nações e a ira de Deus. A ira das nações é o ajuntamento para a batalha do armagedom, a ira de Deus é a destruição do exército do anticristo no momento da segunda vinda, apenas após esses eventos que haverá o tempo dos mortos e a entrega dos galardões. Esse detalhe está em plena harmonia com Apocalipse 19 e 20, onde primeiro há a batalha do armagedom, depois a prisão de satanás e por último a ressurreição dos mártires da tribulação que ocorre após o segundo advento, não durante.<\/p>"}, {"n": 92, "t": "APOCALIPSE - A MULHER E O DRAGÃO", "html": "<h4>A MULHER E O DRAGÃO (12.1-6)<\/h4><p>Uma mulher vestida do sol tendo debaixo dos pés a lua, e uma coroa de doze estrelas em sua cabeça, (Ap 12.1-6). A mulher dá à luz um filho varão que há de reger todas as nações com vara de ferro. Um dragão persegue a mulher a fim de lhe tragar o filho. O filho é arrebatado e a mulher recebe asas e foge para o deserto. O dragão faz guerra contra o resto da semente da mulher.<\/p><p>Quem é essa mulher, personagem central nessa trama? Há três respostas:<\/p><p class='li'>a) A mulher é Maria que gerou Jesus, interpretação romanista.<\/p><p class='li'>b) A posição pós-tribulacionista necessita afirmar que a mulher é a igreja que será perseguida pelo anticristo durante a grande tribulação. O problema é que a mulher gera um filho, e o tal filho todos concordam ser Jesus. Sendo assim, essa interpretação forçosamente diz que a igreja gera Jesus no coração dos pecadores, entretanto a bíblia diz que é o Espírito santo quem opera o novo nascimento pela pregação do evangelho e gerando novo nascimento ( Jo 16.8; Tg 1.18;<\/p><blockquote>Tt 3.5-7). Outros dizem que de fato é Israel, mas para estes Israel no antigo testamento é a igreja, o que contraria a verdade de que a Igreja só veio a existir após a ascensão de Cristo (Ef 1.20-22).<\/blockquote><p class='li'>c) A mulher é Israel (Gn 37.9), os descendentes bioloǵocos de Abraão, o povo de Deus por quem veio o Cristo segundo a carne. Essa é a interpretação mais coerente, pois sabemos que Satanás sempre tentou destruir Israel por ser o povo eleito instrumentalmente para trazer o Messias, esse é o motivo do porque o diabo sempre tentou destruir a nação de Israel. Satanás fará uma grande investida contra Israel durante a grande tribulação, mas como o texto sagrado nos diz, Deus dará proteção física para muitos do seu povo (Ap 12.14). O fato dessa mulher ser um símbolo de Israel, e estes são descritos como perseguidos durante a grande tribulação, é mais uma prova de que esta tribulação tem relações com Israel e não com a igreja.<\/p>"}, {"n": 93, "t": "APOCALIPSE - A BESTA QUE SOBE DO MAR", "html": "<h4>A BESTA QUE SOBE DO MAR (13.1-10)<\/h4><p>Uma besta com sete cabeças e dez chifres, (Ap 13.1).<\/p><p>A besta é o anticristo com seu poder político e militar, o mar é os povos e nações, (Ap.17.15). As sete cabeças são os sete impérios mundiais por quem o espírito do anticristo operou para destruir o povo de Deus.<\/p><blockquote>Em Apocalipse 17.10 é dito que cinco desses impérios já haviam caído no tempo em que João recebeu a revelação.<\/blockquote><p>Todo o apocalipse deve ser estudado em harmonia com as revelações dadas a Daniel, mas esse texto em si é uma dos mais específicos, pois apresenta a besta e seu governo conforme revelado em Daniel capítulos 2 e 7.<\/p><p>Faremos um breve estudo do texto para entender esta revelação que vem num processo de desenvolvimento dentro das Escrituras, ou seja, na estátua foram dadas algumas informações, a visão dos quatro animais soma alguns dados não encontrados na estátua, como também este texto de Apocalipse que, mesmo tendo menos versículos, contém mais informações sobre a besta que todos os outros, ainda assim precisaremos recorrer a (Ap. 17) onde são revelados os símbolos mencionados no capítulo 13. Vejamos as informações que contém neste texto. “Vi emergir do mar uma besta que tinha dez chifres e sete cabeças e, sobre os chifres, dez diademas e, sobre as cabeças, nomes de blasfêmia”. (Ap. 13.1) Vi emergir do mar uma besta. Muitos estudiosos do assunto afirmam, por esta informação, que o anticristo será um gentio, já que o mar frequentemente simboliza as nações (Ap 17.15)<\/p><h4>VIRÁ DA EUROPA<\/h4><blockquote>Daniel 9:26 E depois das sessenta e duas semanas será cortado o Messias, mas não para si mesmo; e o povo do príncipe, que há de vir, destruirá a cidade e o santuário, e o seu fim será com uma inundação; e até ao fim haverá guerra; estão determinadas as assolações. 27 E ele firmará aliança com muitos por uma semana; e na metade da semana fará cessar o sacrifício e a oblação; e sobre a asa das abominações virá o assolador, e isso até à consumação; e o que está determinado será derramado sobre o assolador.<\/blockquote><h4>DEZ CHIFRES<\/h4><p>Tinha dez chifres (...) e, sobre os chifres, dez diademas -<\/p><blockquote>Ap 17.12-13 esclarece: “Os dez chifres que viste são dez reis, os quais ainda não receberam reino”. Assim como os dedos da estátua e como os chifres do animal terrível.<\/blockquote><blockquote>Daniel 7:7 Depois disto eu continuei olhando nas visões da noite, e eis aqui o quarto animal, terrível e espantoso, e muito forte, o qual tinha dentes grandes de ferro; ele devorava e fazia em pedaços, e pisava aos pés o que sobejava; era diferente de todos os animais que apareceram antes dele, e tinha dez chifres.<\/blockquote><p>Estes reis receberão sua autoridade no tempo designado por Deus para que todo seu plano seja estabelecido. O fato de terem diademas sobre os chifres demonstra essa futura autoridade, pois diadema significa, de um modo geral, ornamento real para a cabeça, coroa.<\/p><p>Uma característica importante aqui revelada, se refere a duração deste governo: “recebem autoridade como reis, com a besta, durante uma hora”; este período de domínio será muito curto. O verso 13 nos informa que devido serem uma confederação “Têm estes um só pensamento”, e isto faz com que elejam um líder “e oferecem à besta o poder e a autoridade que possuem”. Esta escolha obviamente está ligada à permissão de Deus já que seu propósito é completar seu plano com Israel e os gentios.<\/p><p>E sete cabeças (...) e, sobre as cabeças, nomes de blasfêmia.<\/p><blockquote>Apocalipse 17:9 Aqui o sentido, que tem sabedoria. As sete cabeças são sete montes, sobre os quais a mulher está assentada. 10 E são também sete reis; cinco já caíram, e um já é; o outro ainda não é vindo; e, quando vier, convém que dure um pouco de tempo.<\/blockquote><p>O fato da besta ter sete cabeças é porque ele está relacionado a sete governos “As sete cabeças são sete montes, (...). E são também sete reis: cinco já caíram, e um existe; outro ainda não é vindo; e, quando vier, convém que dure um pouco de tempo” (Ap 17.9-10). Os sete montes se referem a Roma chamada “a cidade das sete colinas”<\/p><p>Os sete reis e seus respectivos reinos são representados pelas sete cabeças, são objetos de controvérsia entre os especialistas em escatologia; alguns entendem como sendo fases do Império Romano, no entanto a visão dispensacionalista crê que os cinco reis que “já caíram” representam os impérios que dominaram o mundo, que são:<\/p><p class='li'>1- Egípcio, 2 - Assírio, 3 - Babilônico, 4 - Medo-Persa e o 5 - Grego. O que “existe” (o sexto) no tempo de João é o império Romano, e o que é futuro é justamente o império sob o qual o anticristo reinará. Uma observação interessante é quanto à descrição feita por João, onde são demonstradas características de suas atitudes enquanto governo “A besta que vi era semelhante a leopardo, com pés como de urso e boca como de leão” comparar com Daniel 7.3-6. Com isso o anticristo parece representar uma confluência dos impérios já existentes que com seu poder assolaram o mundo.<\/p><blockquote>Apocalipse 13:2 E a besta que vi era semelhante ao leopardo, e os seus pés como os de urso, e a sua boca como a boca de leão; e o dragão deu-lhe o seu poder, e o seu trono, e grande poderio.<\/blockquote><blockquote>Apocalipse 17:13 Estes têm um mesmo intento, e entregarão o seu poder e autoridade à besta.<\/blockquote><p class='li'>d) “E deu-lhe o dragão o seu poder, o seu trono e grande autoridade”. O dragão é Satanás (Ap 12.9) e este dará poder e autoridade à besta. Paulo diz que seu aparecimento é segundo a “energia”, ou seja, seu trabalhar, sua força sobrenatural, isto demonstra que o anticristo tem sua origem em satanás, sua habilidade política vem das trevas (Dn 8.25), sua prosperidade é de procedência maligna (Dn 11:36), e toda esta relação com satanás o constituirá inimigo de Deus, “abriu a boca em blasfêmias contra Deus, para lhe difamar o nome e difamar o tabernáculo, a saber, os que habitam no céu” (Ap 13.6). Mais uma vez é indicado o período em que a besta governará, que é de quarenta e dois meses (Ap 13.5), ou 1260 dias (Ap 12.6). Dominará o mundo e perseguirá todo aquele que se recusar a adorá-lo uma vez que são servos de Deus (Ap 13.7-8), perseguirá Israel, mas parte desse povo será preservado pelo próprio Deus (Ap 12.6).<\/p><p>Nunca o mundo teve um governo desta maneira como também um líder desta conjuntura, por mais que se tente associar estas profecias a qualquer fase da história será um esforço sem êxito, agora, quando olhamos para o quadro europeu atual vemos todo o sistema governamental sendo preparado para o surgimento de um líder. Algo relevante é o fato dos países europeus fazerem parte do mesmo território que o antigo Império Romano, e isto demonstra que a possibilidade da união européia ser a confederação que dará ao anticristo o poder de governar é muito grande, quase impossível de ser de outra maneira.<\/p>"}, {"n": 94, "t": "APOCALIPSE - 666 O NÚMERO DA BESTA", "html": "<p>Nada tem gerado mais especulação no decorrer da história da igreja do que o 666, (Ap 13.16-<\/p><p class='li'>18) em uma tentativa de descobrir quem é o anticristo. Guematria é nome da ciência por trás do cálculo usado a partir da soma numérica dos nomes de imperadores, papas, e até mesmo presidentes americanos. Todavia isso é um estudo inútil, pois muitos nomes quando transliterados em algarismo romanos e feito a soma desses algarismo o resultado é 666, talvez o nome do caro leitor feito a soma dê 666, e por certo você não é o anticristo!<\/p><p>Outros afirmam que o biochip que estão implantado nas mãos de alguns é o sinal da besta. Essa é uma possibilidade, mas devemos lembrar que quando surgiu o CPF, muitos cristãos pensaram ser o número da besta devido ao fato que quem não tivesse tal registro não poderia ter conta em banco. Ora, sabemos que esses são meios que poderão ser usado para controle dos habitantes durante a grande tribulação, como já o é hoje As mesmas informações pessoais que já estão sendo transferidas para o chip são as que temos em nossos documentos dentro de nossas carteiras. O diferencial é que essas informações já estão sendo transferidas para o chip, e isso é questão de comodidade tecnológica. O que quero dizer é que possuindo CPF já estamos sob controle do governo, pois quem consegue fazer alguma coisa sem CPF? Durante a Grande Tribulação, para que esses documentos estejam ativos seja por um chip ou nos documentos na carteira, será necessária uma aliança com o anticristo. Esse é o cerne da questão, a negação de Cristo e a aliança que farão com o anticristo para que possam continuar comprando e vendendo. Entre outras palavras, essa tecnologia até poderá ser usada pelo anticristo, mas só será considerada como o sinal da besta mediante o pacto com o anticristo que por sua vez só se manifestará depois do arrebatamento da igreja. Portanto, o pré-tribulacionista não deve temer as especulações sobre esse assunto, pois cremos que seremos arrebatados antes da grande tribulação, e o sinal da besta só será implantado após os três primeiros anos e meio de tribulação.<\/p><p>5480 /xáragma (\"marca-marca\") era originalmente qualquer impressão em uma moeda ou um selo, usada por um gravador em um dado (selo, ferro de marcar). 5480 (xáragma) mais tarde se tornou \"o marcador de identificação\" (como com a \"marca-marca\" exclusiva de um proprietário).<\/p><p>sphragís – um objeto gravado (gravado) pressionado em cera macia ou argila para selar um documento (carta); um \"selo\".<\/p><blockquote>Apocalipse 13:18 Aqui há sabedoria. Aquele que tem entendimento, calcule o número da besta; porque é o número de um homem, e o seu número é seiscentos e sessenta e seis.<\/blockquote><blockquote>Daniel 12:10 Muitos serão purificados, e embranquecidos, e provados; mas os ímpios procederão impiamente, e nenhum dos ímpios entenderá, mas os sábios entenderão.<\/blockquote>"}, {"n": 95, "t": "APOCALIPSE - UM ANJO PREGANDO O EVANGELHO ETERNO", "html": "<h4>ANJO PREGANDO O EVANGELHO ETERNO?<\/h4><blockquote>Apocalipse 14:6 E vi outro anjo voar pelo meio do céu, e tinha o evangelho eterno, para o proclamar aos que habitam sobre a terra, e a toda a nação, e tribo, e língua, e povo, 7 Dizendo com grande voz: Temei a Deus, e dai-lhe glória; porque é vinda a hora do seu juízo. E adorai aquele que fez o céu, e a terra, e o mar, e as fontes das águas.<\/blockquote><h4>QUE EVANGELHO SERIA ESSE?<\/h4><blockquote>Gálatas 1:8 Mas, ainda que nós mesmos ou um anjo do céu vos anuncie outro evangelho além do que já vos tenho anunciado, seja anátema.<\/blockquote><blockquote>Mateus 24:14 E este evangelho do reino será pregado em todo o mundo, em testemunho a todas as nações, e então virá o fim.<\/blockquote><blockquote>1 Pedro 1:11 Indagando que tempo ou que ocasião de tempo o Espírito de Cristo, que estava neles, indicava, anteriormente testificando os sofrimentos que a Cristo haviam de vir, e a glória que se lhes havia de seguir. 12 Aos quais foi revelado que, não para si mesmos, mas para nós, eles ministravam estas coisas que agora vos foram anunciadas por aqueles que, pelo Espírito Santo enviado do céu, vos pregaram o evangelho; para as quais coisas os anjos desejam bem atentar.<\/blockquote><blockquote>Hebreus 1:14 Não são porventura todos eles espíritos ministradores, enviados para servir a favor daqueles que hão de herdar a salvação?<\/blockquote>"}, {"n": 96, "t": "APOCALIPSE - TAÇAS - A CONSUMAÇÃO DA IRA DE DEUS", "html": "<h4>APOCALIPSE 15 - A CONSUMAÇÃO DA IRA<\/h4><h4>AS TAÇAS DA IRA DE DEUS, ÚLTIMOS JUÍZOS (15; 16)<\/h4><p>“E VI outro grande e admirável sinal no céu: sete anjos, que tinham as sete últimas pragas; porque nelas é consumada a ira de Deus” (Ap 15.1).<\/p><p>As taças ou salvas da ira de Deus são os juízos que serão derramados primariamente sobre os adoradores da besta, esse detalhe indica que estes juízes compreendem os últimos três anos e meio da tribulação.<\/p><p>O detalhe, “porque nelas é consumada a ira de Deus”, indica que nas taças a ira não se inicia, mas se consuma, isso aponta para o fato de que a ira de Deus teve um início anterior, pois as taças é apenas a consumação da ira que teve seu início na abertura do primeiro selo. O pensamento de que a ira será derramada apenas na sexta taça ou no momento da segunda vinda não se sustenta biblicamente.<\/p><h4>A SEGUNDA TAÇA<\/h4><p>“E o segundo anjo derramou a sua taça no mar, que se tornou em sangue como de um morto, e morreu no mar toda a alma vivente” (Ap 16.3).<\/p><blockquote>Apocalipse 8:8 E o segundo anjo tocou a trombeta; e foi lançada no mar uma coisa como um grande monte ardendo em fogo, e tornou-se em sangue a terça parte do mar. 9 E morreu a terça parte das criaturas que tinham vida no mar; e perdeu-se a terça parte das naus.<\/blockquote><p>Como a segunda taça, a segunda trombeta também atinge o mar, contudo, enquanto a trombeta afeta apenas um terço do mar, na segunda taça a totalidade da vida marítima é atingida e morre. Esses detalhes demonstram claramente que aquela trombeta e essa taça não são o mesmo juízo, vistos sob prismas diferentes, onde há uma complementação, pois tratam-se de juízos separados que serão derramados sobre a terra em momentos distintos. O fato de que na taça todo o mar é afetado, leva-nos a concluir que o juízo da segunda taça será mais severo que a segunda trombeta, e logicamente impossibilita de serem, os mesmos juízos. Essa segunda taça afetará tudo que há no mar, o mundo se tornará em um caos, além do prejuízo financeiro haverá mais uma vez um desequilíbrio global na natureza, o que obviamente afetará a todos os habitantes da terra, ímpios e salvos. Detalhes como esses revelam que além dos santos sofrerem a perseguição do anticristo, sofrerão todos os demais juízos, direta ou indiretamente, assim, reafirmamos que esses santos não podem ser a igreja, pois à noiva do cordeiro foi feita a promessa de proteção total e imparcial, e num contexto de tentação global isso só é possível através da remoção da igreja do planeta.<\/p><p>O guardar não é “espiritual”<\/p><h4>A SEXTA TAÇA<\/h4><p>“E o sexto anjo derramou a sua taça sobre o grande rio Eufrates; e a sua água secou-se, para que se preparasse o caminho dos reis do oriente” (Ap 16.12).<\/p><p>A penúltima taça aponta para o fim da tribulação, o rio Eufrates será totalmente seco, com isso o caminho para os exércitos de reis subordinados ao anticristo será preparado. Essa convocação será tão ampla que a tríade satânica estará atuando, pois o dragão (Satanás), a besta (anticristo) e o falso profeta liberarão espíritos malignos semelhantes a rãs (espíritos imundos) a fim de ajuntar esse grande exército para a grande batalha do armagedom (Dn 11.35-44,45).<\/p><h4>A SÉTIMA TAÇA<\/h4><blockquote>Apocalipse 16:17 E o sétimo anjo derramou a sua taça no ar, e saiu uma grande voz do templo do céu, do trono, dizendo: Está feito. 18 E houve vozes, e trovões, e relâmpagos, e houve um grande terremoto, como nunca houve desde que há homens sobre a terra; tal foi este tão grande terremoto. 19 E a grande cidade fendeu-se em três partes, e as cidades das nações caíram; e da grande Babilônia se lembrou Deus, para lhe dar o cálice do vinho da indignação da sua ira. 20 E toda a ilha fugiu; e os montes não se acharam. 21 E sobre os homens caiu do céu uma grande saraiva, pedras aproximadamente do peso de um talento; e os homens blasfemaram de Deus por causa da praga da saraiva; porque a sua praga era mui grande.<\/blockquote><h4>A SÉTIMA TAÇA É O DESFECHO FINAL DA IRA<\/h4><p class='li'>A - Um grande terremoto<\/p><p class='li'>B - A grande cidade se fente e as cidades caem<\/p><p class='li'>C - A queda da Babilônia<\/p><p class='li'>D - Pedras caem sobre os homens<\/p><p class='li'>E - Segundo advento de Cristo e o Armagedom<\/p>"}, {"n": 97, "t": "APOCALIPSE - A PROSTITUDA E A BABILÔNIA", "html": "<blockquote>Apocalipse 17:5 E na sua testa estava escrito o nome: Mistério, a grande Babilônia, a mãe das prostituições e abominações da terra. 16 E os dez chifres que viste na besta são os que odiarão a prostituta, e a colocarão desolada e nua, e comerão a sua carne, e a queimarão no fogo. 17 Porque Deus tem posto em seus corações, que cumpram o seu intento, e tenham uma mesma ideia, e que seu reino deem à besta, até que se cumpram as palavras de Deus. 18 E a mulher que viste é a grande cidade que reina sobre os reis da terra.<\/blockquote><h4>A MERETRIZ E A GRANDE BABILÔNIA (17; 18)<\/h4><p>A Prostituta e Babilônia são dois lados da mesma moeda. A mulher é o aspecto religioso, e Babilônia fala da opulência e riqueza dessa cidade. Pois tanto a mulher como Babilônia são identificadas como a mesma cidade (Ap 17.5,18; 18.2,19-20; 19.2,3), POIS TANTO A<\/p><h4>RELIGIÃO COMO A CIDADE SÃO COMPOSTOS DE PESSOAS.<\/h4><p>Babilônia é o nome simbólico de uma cidade, capital turística e comercial do último império mundial governado pelo anticristo.<\/p><p>A prostituta é a falsa religião que tem perseguido e perseguirá o povo de Deus.<\/p><p>Logo após o anticristo romper o acordo de paz com Israel na metade da grande tribulação, essa falsa religião será devastada pelos dez governantes aliados ao anticristo a fim de que toda adoração seja convergida ao mesmo, (Ap 13.11-12,15; Ap 17.16). E por fim Deus julgará a opulenta cidade, os mercadores vão chorar e lamentar a queda dessa rica e bela cidade turística.<\/p><blockquote>Apocalipse 18:2 E clamou fortemente com grande voz, dizendo: Caiu, caiu a grande Babilônia, e se tornou morada de demônios, e covil de todo espírito imundo, e esconderijo de toda ave imunda e odiável. 9 E os reis da terra, que fornicaram com ela, e viveram em delícias, a chorarão, e sobre ela prantearão, quando virem a fumaça do seu incêndio; 10 Estando de longe pelo temor do seu tormento, dizendo: Ai! Ai daquela grande cidade de Babilônia, aquela forte cidade! Pois em uma hora veio o teu juízo. 15 Os mercadores destas coisas, que dela se enriqueceram, estarão de longe, pelo temor do seu tormento, chorando e lamentando, 16 E dizendo: Ai, ai daquela grande cidade! Que estava vestida de linho fino, de púrpura, de escarlata; e adornada com ouro e pedras preciosas e pérolas! Porque numa hora foram assoladas tantas riquezas. 17 E todo piloto, e todo o que navega em naus, e todo marinheiro, e todos os que negociam no mar se puseram de longe; 24 E nela se achou o sangue dos profetas, e dos santos, e de todos os que foram mortos na terra.<\/blockquote><p>Quanto a localização dessa cidade temos algumas opções:<\/p><p class='li'>a) Roma<\/p><p class='li'>b) Babilônia reconstruída<\/p><p class='li'>c) Nova Iorque<\/p><p class='li'>d) Emirados Árabe É óbvio que não há como provar que qualquer uma das cidades mencionadas acima de fato venham cumprir a profecia, mas considerando as características comerciais, geográficas e topográficas apresentadas no texto, podemos afirmar que será uma cidade muito rica e cercada por águas, algo como uma grande península ou ilha.<\/p>"}, {"n": 98, "t": "APOCALIPSE - A BATALHA DO ARMAGEDOM", "html": "<blockquote>Apocalipse 16:12 E o sexto anjo derramou a sua taça sobre o grande rio Eufrates; e a sua água secou-se, para que se preparasse o caminho dos reis do oriente. 13 E da boca do dragão, e da boca da besta, e da boca do falso profeta vi sair três espíritos imundos, semelhantes a rãs. 14 Porque são espíritos de demônios, que fazendo milagres vão ao encontro dos reis da terra e de todo o mundo, para os congregar para a batalha, daquele grande dia do Deus Todo-Poderoso. 15 Eis que venho como ladrão. Bem-aventurado aquele que vigia, e guarda as suas roupas, para que não ande nu, e não se vejam as suas vergonhas. 16 E os congregaram no lugar que em hebreu se chama Armagedom.<\/blockquote><h4>COMO UM LADRÃO<\/h4><blockquote>Daniel 12:10 Muitos serão purificados, e embranquecidos, e provados; mas os ímpios procederão impiamente, e nenhum dos ímpios entenderá, mas os sábios entenderão.<\/blockquote><blockquote>Mateus 24:50 Virá o senhor daquele servo num dia em que o não espera, e à hora em que ele não sabe,<\/blockquote><blockquote>Mateus 25:11 E depois chegaram também as outras virgens, dizendo: Senhor, Senhor, abre- nos. 12 E ele, respondendo, disse: Em verdade vos digo que não vos conheço. 13 Vigiai, pois, porque não sabeis o dia nem a hora em que o Filho do homem há de vir.<\/blockquote><blockquote>Daniel 7:25 E proferirá palavras contra o Altíssimo, e destruirá os santos do Altíssimo, e cuidará em mudar os tempos e a lei; e eles serão entregues na sua mão, por um tempo, e tempos, e a metade de um tempo.<\/blockquote><p>Essa batalha será a última tentativa de satanás destruir Israel antes do estabelecimento do reino. Quando os exércitos do anticristo estiverem para destruir esse povo, aparecerá do céu o senhor Jesus Cristo montado em um cavalo branco. Embora satanás estará agindo através do anticristo e falso profeta para arregimentar esse exército, de uma maneira mais ampla estão cumprindo a vontade de Deus, pois em Zacaria 14.2 diz que é Deus quem vai juntar os exércitos de todas as nações contra Jerusalém. Durante a grande tribulação em todo o instante é perceptível a soberania de Deus em ação, pois até mesmo o Satanás é servo de Deus, uma vez que não dá um passo além do que permite Deus.<\/p><p>A temida batalha do armagedom será nada mais que uma tentativa frustrada do anticristo de derrotar Israel, pois quando tiverem cercado a terra santa, Cristo aparecerá no céu, e com uma única palavra destruirá os exércitos aliados ao anticristo (Ap 19.21; Is 63; Zc 14.12).<\/p>"}, {"n": 99, "t": "APOCALIPSE - AS BODAS E A CEIA DAS BODAS DO CORDEIRO", "html": "<blockquote>Apocalipse 19:7 Regozijemo-nos, e alegremo-nos, e demos-lhe glória; porque vindas são as bodas do Cordeiro, e já a sua esposa se aprontou. 8 E foi-lhe dado que se vestisse de linho fino, puro e resplandecente; porque o linho fino são as justiças dos santos. 9 E disse-me: Escreve: Bem-aventurados aqueles que são chamados à ceia das bodas do Cordeiro. E disse-me: Estas são as verdadeiras palavras de Deus.<\/blockquote><blockquote>Apocalipse 19:7 Regozijemo-nos, e alegremo-nos, e demos-lhe glória; porque vindas são as bodas do Cordeiro, e já a sua esposa se aprontou. hētoimasen - aoristo - já está preparada ēlthen (aoristo) ho gamos - realizado já foi o casamento<\/blockquote><blockquote>Apocalipse 19:8 E foi-lhe dado que se vestisse de linho fino, puro e resplandecente; porque o linho fino são as justiças dos santos.<\/blockquote><blockquote>Apocalipse 19:9 E disse-me: Escreve: Bem-aventurados aqueles que são chamados à ceia das bodas do Cordeiro. E disse-me: Estas são as verdadeiras palavras de Deus.<\/blockquote><p>Deipnon: jantar, ou seja, a refeição principal, festa, (Mt 8.11; Is 25.6).<\/p><blockquote>Mateus 8:11 Mas eu vos digo que muitos virão do oriente e do ocidente, e assentar-se-ão à mesa com Abraão, e Isaque, e Jacó, no reino dos céus;<\/blockquote><blockquote>Mateus 26:29 E digo-vos que, desde agora, não beberei deste fruto da vide, até aquele dia em que o beba novo convosco no reino de meu Pai.<\/blockquote><blockquote>Isaías 25:6 E o SENHOR dos Exércitos dará neste monte a todos os povos uma festa com animais gordos, uma festa de vinhos velhos, com tutanos gordos, e com vinhos velhos, bem purificados.<\/blockquote>"}]}, {"n": 13, "t": "O APOCALIPSE - DA SEGUNDA VINDA A ETERNIDADE", "aulas": [{"n": 100, "t": "APOCALIPSE - A SEGUNDA VINDA DE CRISTO A TERRA", "html": "<h4>O RETORNO GLORIOSO DE CRISTO (19.11-21)<\/h4><blockquote>Apocalipse 19.11 “E vi o céu aberto, e eis um cavalo branco; e o que estava assentado sobre ele chama-se Fiel e Verdadeiro; e julga e peleja com justiça.”<\/blockquote><p>Jesus montado em um cavalo branco, a figura é militar, não devemos pensar que no céu tenha cavalos. Isso quer dizer que Cristo vem como um grande general para derrotar seus inimigos. Esse é o evento descrito em Mateus 24.31 e Apocalipse 1.7, onde todo olho o verá, trata-se de algo totalmente distinto do arrebatamento, pois no rapto Cristo vem apenas para sua noiva de levá-la ao céu, (Jo 14.3; 1Ts 4.16-18; Hb 9.28; Ap 4.1-2). Perceba que em momento algum<\/p><blockquote>Apocalipse 19.11-21 faz menção a ressurreição ou arrebatamento, e isso por um motivo muito simples, não há arrebatamento no momento da segunda vinda, pois antes da “parusia” ter seu início em (19.11) a igreja já está no céu galardoada em (19.7,8).<\/blockquote><blockquote>Em Apocalipse 19.14 há uma menção a igreja, mas a esposa que já estava no céu agora está retornando com Cristo.<\/blockquote><p>Outro ponto importante é que não pode ser ignorado que a ressurreição dos “mártires” da tribulação só ocorre após a segunda vinda e prisão de Satanás, e instantes antes do estabelecimento do milênio. Se esses fossem a igreja, deveriam ter ressuscitado no momento da segunda vinda, não após, e sua ressurreição seria para o arrebatamento, contudo, o texto em (20.4) é claro, eles ressuscitarão para entrarem no milênio e reinarem com Cristo, não para serem arrebatados e levados ao céu.<\/p><p>É muito importante o estudioso da escatologia bíblica atentar para o fato que não existe um único texto que descreva a vinda de Cristo após a tribulação e faça menção de ressurreição e arrebatamento da igreja no momento da vinda. Esse silêncio é eloquente, e aponta para uma verdade óbvia, a vinda após a tribulação nada tem haver com o arrebatamento da igreja, mas sim com Israel e o estabelecimento do reino (Zc 14.4-21; Mt 24.29-31; 25.31; Is 27.12,13; Lc 21.31).<\/p><h4>O ARMAGEDOM<\/h4><blockquote>Apocalipse 19:19 E vi a besta, e os reis da terra, e os seus exércitos reunidos, para fazerem guerra àquele que estava assentado sobre o cavalo, e ao seu exército. 20 E a besta foi presa, e com ela o falso profeta, que diante dela fizera os sinais, com que enganou os que receberam o sinal da besta, e adoraram a sua imagem. Estes dois foram lançados vivos no lago de fogo que arde com enxofre. 21 E os demais foram mortos com a espada que saía da boca do que estava assentado sobre o cavalo, e todas as aves se fartaram das suas carnes.<\/blockquote><blockquote>Zacarias 14:12 E esta será a praga com que o SENHOR ferirá a todos os povos que guerrearam contra Jerusalém: a sua carne apodrecerá, estando eles postados de pé, e lhes apodrecerão os olhos nas suas órbitas, e a língua lhes apodrecerá na sua boca. 13 Naquele dia também acontecerá que haverá da parte do SENHOR uma grande perturbação entre eles; porque cada um pegará na mão do seu próximo, e cada um levantará a mão contra a mão do seu próximo.<\/blockquote><p>Os adoradores da Besta serão destruídos<\/p><h4>OS ÍMPIOS SÃO DESTRUÍDOS<\/h4><blockquote>Mateus 13:40 Assim como o joio é colhido e queimado no fogo, assim será na consumação deste mundo. 41 Mandará o Filho do homem os seus anjos, e eles colherão do seu reino tudo o que causa escândalo, e os que cometem iniqüidade. 42 E lançá-los-ão na fornalha de fogo; ali haverá pranto e ranger de dentes. O FIM DA PRESENTE ERA<\/blockquote><blockquote>Mateus 13:47 Igualmente o reino dos céus é semelhante a uma rede lançada ao mar, e que apanha toda a qualidade de peixes. 48 E, estando cheia, a puxam para a praia; e, assentando- se, apanham para os cestos os bons; os ruins, porém, lançam fora. 49 Assim será na consumação do mundo: virão os anjos, e separarão os maus de entre os justos, 50 E lançá-los-ão na fornalha de fogo; ali haverá pranto e ranger de dentes.<\/blockquote><blockquote>Joel 3:1 PORQUE, eis que naqueles dias, e naquele tempo, em que removerei o cativeiro de Judá e de Jerusalém, 2 Congregarei todas as nações, e as farei descer ao vale de Jeosafá; e ali com elas entrarei em juízo, por causa do meu povo, e da minha herança, Israel, a quem elas espalharam entre as nações e repartiram a minha terra. 12 Suscitem-se os gentios, e subam ao vale de Jeosafá; pois ali me assentarei para julgar todos os gentios em redor. 13 Lançai a foice, porque já está madura a seara; vinde, descei, porque o lagar está cheio, e os vasos dos lagares transbordam, porque a sua malícia é grande. 14 Multidões, multidões no vale da decisão; porque o dia do SENHOR está perto, no vale da decisão.<\/blockquote><blockquote>Zacarias 13:8 E acontecerá em toda a terra, diz o SENHOR, que as duas partes dela serão extirpadas, e expirarão; mas a terceira parte restará nela. 9 E farei passar esta terceira parte pelo fogo, e a purificarei, como se purifica a prata, e a provarei, como se prova o ouro. Ela invocará o meu nome, e eu a ouvirei; direi: É meu povo; e ela dirá: O SENHOR é o meu Deus.<\/blockquote><h4>OS JUSTOS ENTRAM NO REINO<\/h4><h4>ISRAELITAS<\/h4><blockquote>Mateus 13:41 Mandará o Filho do homem os seus anjos, e eles colherão do seu reino tudo o que causa escândalo, e os que cometem iniqüidade. 42 E lançá-los-ão na fornalha de fogo; ali haverá pranto e ranger de dentes. 43 Então os justos resplandecerão como o sol, no reino de seu Pai. Quem tem ouvidos para ouvir, ouça.<\/blockquote><blockquote>Mateus 24:30 Então aparecerá no céu o sinal do Filho do homem; e todas as tribos da terra se lamentarão, e verão o Filho do homem, vindo sobre as nuvens do céu, com poder e grande glória. 31 E ele enviará os seus anjos com rijo clamor de trombeta, os quais ajuntarão os seus escolhidos desde os quatro ventos, de uma à outra extremidade dos céus.<\/blockquote><blockquote>Zacarias 12:10 Mas sobre a casa de Davi, e sobre os habitantes de Jerusalém, derramarei o Espírito de graça e de súplicas; e olharão para mim, a quem traspassaram; e prantearão sobre ele, como quem pranteia pelo filho unigênito; e chorarão amargamente por ele, como se chora amargamente pelo primogênito. 11 Naquele dia será grande o pranto em Jerusalém, como o pranto de Hadade-Rimom no vale de Megido.<\/blockquote><blockquote>Romanos 11:26 E assim todo o Israel será salvo, como está escrito: De Sião virá o Libertador, e desviará de Jacó as impiedades. 27 E esta será a minha aliança com eles, quando eu tirar os seus pecados. 28 Assim que, quanto ao evangelho, são inimigos por causa de vós; mas, quanto à eleição, amados por causa dos pais.<\/blockquote><h4>GENTIOS<\/h4><blockquote>Zacarias 14:16 E acontecerá que, todos os que restarem de todas as nações que vieram contra Jerusalém, subirão de ano em ano para adorar o Rei, o SENHOR dos Exércitos, e para celebrarem a festa dos tabernáculos. 17 E acontecerá que, se alguma das famílias da terra não subir a Jerusalém, para adorar o Rei, o SENHOR dos Exércitos, não virá sobre ela a chuva.<\/blockquote><blockquote>Zacarias 14:18 E, se a família dos egípcios não subir, nem vier, não virá sobre ela a chuva; virá sobre eles a praga com que o SENHOR ferirá os gentios que não subirem a celebrar a festa dos tabernáculos. 19 Este será o castigo do pecado dos egípcios e o castigo do pecado de todas as nações que não subirem a celebrar a festa dos tabernáculos.<\/blockquote><blockquote>Mateus 25:31 E quando o Filho do homem vier em sua glória, e todos os santos anjos com ele, então se assentará no trono da sua glória; 32 E todas as nações serão reunidas diante dele, e apartará uns dos outros, como o pastor aparta dos bodes as ovelhas; 33 E porá as ovelhas à sua direita, mas os bodes à esquerda. 34 Então dirá o Rei aos que estiverem à sua direita: Vinde, benditos de meu Pai, possuí por herança o reino que vos está preparado desde a fundação do mundo; 35 Porque tive fome, e destes-me de comer; tive sede, e destes-me de beber; era estrangeiro, e hospedastes-me; 36 Estava nu, e vestistes-me; adoeci, e visitastes-me; estive na prisão, e fostes me ver. 37 Então os justos lhe responderão, dizendo: Senhor, quando te vimos com fome, e te demos de comer? Ou com sede, e te demos de beber?<\/blockquote>"}, {"n": 101, "t": "APOCALIPSE - AS RESSURREIÇÕES", "html": "<h4>A RESSURREIÇÃO NO TEXTO DO ANTIGO TESTAMENTO<\/h4><blockquote>Jó 14:7 Porque há esperança para a árvore que, se for cortada, ainda se renovará, e não cessarão os seus renovos. 8 Se envelhecer na terra a sua raiz, e o seu tronco morrer no pó, 9 Ao cheiro das águas brotará, e dará ramos como uma planta. 10 Porém, morto o homem, é consumido; sim, rendendo o homem o espírito, então onde está ele? 11 Como as águas se retiram do mar, e o rio se esgota, e fica seco, 12 Assim o homem se deita, e não se levanta; até que não haja mais céus, não acordará nem despertará de seu sono. 14 Morrendo o homem, porventura tornará a viver? Todos os dias de meu combate esperaria, até que viesse a minha mudança.<\/blockquote><blockquote>Jó 19:25 Contudo, eu sei que meu Redentor vive, e que no fim se levantará para me defender e vindicar ainda que eu esteja no pó do meu túmulo. 26 E depois que todo o meu corpo estiver consumido pela terra, sem carne, então contemplarei a face de Deus. 27 Eu o verei com os meus próprios olhos; eu pessoalmente, não outra pessoa o verá e me dirá como ele é! Oh! Quão intenso é o desejo do meu coração por esse dia!<\/blockquote><blockquote>Eclesiastes 12:13 De tudo o que se tem ouvido, o fim é: Teme a Deus, e guarda os seus mandamentos; porque isto é o dever de todo o homem. 14 Porque Deus há de trazer a juízo toda a obra, e até tudo o que está encoberto, quer seja bom, quer seja mau.<\/blockquote><blockquote>Daniel 12:2 E muitos dos que dormem no pó da terra ressuscitarão, uns para vida eterna, e outros para vergonha e desprezo eterno.<\/blockquote><h4>A RESSURREIÇÃO SEGUNDO JESUS<\/h4><blockquote>João 5:28 Não vos maravilheis disto; porque vem a hora em que todos os que estão nos sepulcros ouvirão a sua voz. 29 E os que fizeram o bem sairão para a ressurreição da vida; e os que fizeram o mal para a ressurreição da condenação.<\/blockquote><blockquote>João 6:39 E a vontade do Pai que me enviou é esta: Que nenhum de todos aqueles que me deu, eu perca, mas que o ressuscite no último dia. 40 Porquanto a vontade daquele que me enviou é esta: Que todo aquele que vê o Filho, e crê nele, tenha a vida eterna; e eu o ressuscitarei no último dia. 44 Ninguém pode vir a mim, se o Pai que me enviou o não trouxer; e eu o ressuscitarei no último dia.<\/blockquote><blockquote>João 11:23 Disse-lhe Jesus: Teu irmão há de ressuscitar. 24 Disse-lhe Marta: Eu sei que há de ressuscitar na ressurreição do último dia.<\/blockquote><blockquote>Atos dos Apóstolos 2:16 Mas isto é o que foi dito pelo profeta Joel: 17 E nos últimos dias acontecerá, diz Deus, que do meu Espírito derramarei sobre toda a carne; E os vossos filhos e as vossas filhas profetizarão, os vossos jovens terão visões, e os vossos velhos sonharão sonhos;<\/blockquote><blockquote>1 João 2:18 Filhinhos, é já a última hora; e, como ouvistes que vem o anticristo, também agora muitos se têm feito anticristos, por onde conhecemos que é já a última hora.<\/blockquote><h4>A RESSURREIÇÃO SEGUNDO PAULO<\/h4><blockquote>1 Coríntios 15:16 Porque, se os mortos não ressuscitam, também Cristo não ressuscitou. 20 Mas de fato Cristo ressuscitou dentre os mortos, e foi feito as primícias dos que dormem. 23 Mas cada um por sua ordem: Cristo as primícias, depois os que são de Cristo, na sua vinda.<\/blockquote><blockquote>1 Coríntios 15:52 Num momento, num abrir e fechar de olhos, ante a última trombeta; porque a trombeta soará, e os mortos ressuscitarão incorruptíveis, e nós seremos transformados.<\/blockquote><h4>NOSSO CORPO SERÁ COMO O DE CRISTO<\/h4><blockquote>1 João 3:1 VEDE quão grande amor nos tem concedido o Pai, que fôssemos chamados filhos de Deus. Por isso o mundo não nos conhece; porque não o conhece a ele. 2 Amados, agora somos filhos de Deus, e ainda não é manifestado o que havemos de ser. Mas sabemos que, quando ele se manifestar, seremos semelhantes a ele; porque assim como é o veremos. 3 E qualquer que nele tem esta esperança purifica-se a si mesmo, como também ele é puro.<\/blockquote><h4>O CORPO DA RESSURREIÇÃO (1CO 15.35-50).<\/h4><p class='li'>a) não é o mesmo corpo meramente reconstituído<\/p><p class='li'>b) tem relação com o original, mas diferente em sua essência<\/p><p class='li'>CORPO NÃO PRESO A LEIS FÍSICAS (JO 20.26). CORPO QUE SE ALIMENTA (Lc 24.41-43).<\/p><p>JESUS NÃO FOI IDENTIFICADO IMEDIATAMENTE (Lc 24.16,30,31; Jo 20.14-16; 21.7,12).<\/p><blockquote>1 Tessalonicenses 4:14 Porque, se cremos que Jesus morreu e ressuscitou, assim também aos que em Jesus dormem, Deus os tornará a trazer com ele. 16 Porque o mesmo Senhor descerá do céu com alarido, e com voz de arcanjo, e com a trombeta de Deus; e os que morreram em Cristo ressuscitarão primeiro.<\/blockquote><h4>A RESSURREIÇÃO SEGUNDO JOÃO<\/h4><h4>AS DUAS TESTEMUNHAS<\/h4><blockquote>Apocalipse 11:11 E depois daqueles três dias e meio o espírito de vida, vindo de Deus, entrou neles; e puseram-se sobre seus pés, e caiu grande temor sobre os que os viram. 12 E ouviram uma grande voz do céu, que lhes dizia: Subi para aqui. E subiram ao céu em uma nuvem; e os seus inimigos os viram.<\/blockquote><h4>OS MÁRTIRES DA TRIBULAÇÃO<\/h4><blockquote>Apocalipse 20:4 E vi tronos; e assentaram-se sobre eles, e foi-lhes dado o poder de julgar; e vi as almas daqueles que foram degolados pelo testemunho de Jesus, e pela palavra de Deus, e que não adoraram a besta, nem a sua imagem, e não receberam o sinal em suas testas nem em suas mãos; e viveram, e reinaram com Cristo durante mil anos. 5 Mas os outros mortos não reviveram, até que os mil anos se acabaram. Esta é a primeira ressurreição. 6 Bem-aventurado e santo aquele que tem parte na primeira ressurreição; sobre estes não tem poder a segunda morte; mas serão sacerdotes de Deus e de Cristo, e reinarão com ele mil anos.<\/blockquote><h4>OS SANTOS DO AT<\/h4><blockquote>Daniel 12:2 E muitos dos que dormem no pó da terra ressuscitarão, uns para vida eterna, e outros para vergonha e desprezo eterno. 6 E ele disse ao homem vestido de linho, que estava sobre as águas do rio: Quando será o fim destas maravilhas? 7 E ouvi o homem vestido de linho, que estava sobre as águas do rio, o qual levantou ao céu a sua mão direita e a sua mão esquerda, e jurou por aquele que vive eternamente que isso seria para um tempo, tempos e metade do tempo, e quando tiverem acabado de espalhar o poder do povo santo, todas estas coisas serão cumpridas. 11 E desde o tempo em que o sacrifício contínuo for tirado, e posta a abominação desoladora, haverá mil duzentos e noventa dias. 12 Bem-aventurado o que espera e chega até mil trezentos e trinta e cinco dias. 13 Tu, porém, vai até ao fim; porque descansarás, e te levantarás na tua herança, no fim dos dias.<\/blockquote><h4>OS ÍMPIOS<\/h4><blockquote>Apocalipse 20:12 E vi os mortos, pequenos e grandes, que estavam diante de Deus, e abriram- se os livros; e abriu-se outro livro, que é o da vida. E os mortos foram julgados pelas coisas que estavam escritas nos livros, segundo as suas obras. 13 E deu o mar os mortos que nele havia; e a morte e o inferno deram os mortos que neles havia; e foram julgados cada um segundo as suas obras.<\/blockquote>"}, {"n": 102, "t": "APOCALIPSE - O REINO MILENAR", "html": "<h4>O MILÊNIO - QUEM ENTRA ? - COMO SERÁ A VIDA ALI?<\/h4><p>O milênio é o cumprimento da aliança abraâmica, palestínica e davídica.<\/p><h4>O MILÊNIO (20.4-10)<\/h4><p>O Que distingue o reino milenar de qualquer outro reino é seu Rei, Cristo será o governante. Sendo assim, esse reino será o mais próspero da história humana; quando falo em prosperidade não o digo apenas em termos financeiros (Am 9.13-15; Jl 2.18-27), mas principalmente em tudo que é próprio de um reino. Vejamos algumas das condições características desse futuro e glorioso período:<\/p><p class='li'>a) Paz (Zc 9.10), justiça (Jr 23.5; Ez 32.17,8), segurança (Ez 28.25,26.), saúde ( Jr 30.17) e instrução (Is 2.2,3). Esses serão alguns dos pilares do reino milenar de Cristo.<\/p><p class='li'>b) Retirada da maldição. A maldição colocada sobre a terra em decorrência do pecado do homem será removida. Os animais voltarão a serem herbívoros, a ferocidade será tirada, (Is 11.6-9; 65.25)<\/p><p class='li'>c) Restauração dos deficientes. O cegos, surdos-mudos, e coxos e qualquer outra deficiência será restaurada, haja vista quando Cristo retornar muitos dos sobreviventes da grande tribulação estarão mutilados, (Is 35.4-6). Entretanto o Rei dos reis e Senhor dos senhores os restaurará para que possam desfrutar do reino em plena condição física. Já desfrutamos em um grau menor das curas divinas, todavia no reino milenar esse direito legal resultante da obra redentora será manifesto plenamente, pois Ele levou sobre si as nossas enfermidades, (Mt 8.14-17).<\/p><p class='li'>d) Santidade. A terra será santa, a cidade será santa, e os súditos serão santos. Não poderia ser diferente, pois trata-se de um governo teocrático, cujo Rei é santo por natureza, (Is 29.22-24; 35.8; 52.1).<\/p><p class='li'>e) Plenitude do Espírito. A promessa do derramamento do Espírito sobre toda carne se cumpre parcialmente hoje, mas no milênio haverá cumprimento pleno, pois aquilo que apenas a igreja desfruta hoje, será experimentado por todos ali, (Jl 2.28,29; Is 44.3).<\/p><p class='li'>f) Adoração unificada. Durante o milênio todos adorarão o único e verdadeiro Deus na pessoa de Cristo o Rei por excelência. Entretanto, apesar do diabo estar preso e haver uma plenitude do Espírito, alguns se recusarão adorar o Rei dos reis, esses, como castigo serão privados de alguns privilégios, ( Zc 14.16-20).<\/p><p>Jesus Cristo é o descendente legal de Davi que reinará sobre a terra por mil anos, (Is 9.6,7; Ez 34.22-24). O reino do Messias será sem fim, isto é, não se encerra no milênio, ao contrário, se estenderá ao novo céu e nova terra (Ez 37.24-28; Dn 7.24; Lc 1.1.31-33).<\/p><h4>OS HABITANTES DO MILÊNIO<\/h4><p>Há inúmeras promessas no AT que Israel herdará a terra, (Is 65.8,9,17-25; Zc 14) Os fieis sobreviventes da grande tribulação são os que vão habitar na terra durante o reino milenar, junto com Israel haverá povos de toda tribo e língua que se converterão a Cristo durante a grande tribulação. Esses tomarão posse da terra junto com Israel, e por não possuírem corpos glorificados, plantarão, edificarão e procriarão.<\/p><p>Pecado e morte durante o milênio Como pode haver morte durante o milênio se o diabo estará preso? Essa é a pergunta feita por muitos, e a resposta é simples. Os habitantes desse reino serão pessoas que foram fiéis a Cristo durante a grande tribulação, e que sobreviverão esse período. Embora restaurados fisicamente, não possuirão corpos glorificados, continuarão possuindo natureza carnal. Esse é o fato pelo qual ainda haverá pecado no reino milenar. Pois o homem não precisa do diabo para cometer o pecado, a natureza carnal é uma fábrica de pecados, (Is 65.20; Gl 5.17-21).<\/p><p>A igreja no reino milenar Os salvos pertencentes à igreja em seu corpo glorificado participarão do reino milenar, pois somos reis e sacerdotes, (Ap 1.6; 5.10). A igreja participará ativamente do reino milenar, reinaremos com Cristo naquele futuro reino, (Ap 2.26; 3.21). Os galardões definirão a posição e função de cada salvo como governante no reino milenar.<\/p><p>A grande questão é, como será a interação entre santos em corpos glorificados junto aos demais salvos que sobreviverão à grande tribulação e entrarão no milênio em corpos naturais? Esse não é um problema, pois Cristo ao ressuscitar em corpo glorificado interagiu com seus discípulos por quarenta dias realizando tarefas terrenas (Lc 24.41,43; Jo 21.4,13). Ora, se Cristo conviveu com seus discípulos, inclusive comendo, podemos concluir que não haverá problemas em nossa interação com os santos ou ímpios que habitarão no milênio. Contudo, devemos entender que embora possamos realizar muitas atividades terrenas, por certo muitas outras não as realizaremos, por exemplo, não será preciso dormir! Por outro lado, a semelhança de Cristo, poderemos aparecer em ambientes ainda que estes estejam trancados, isso devido a natureza do corpo glorificado (Jo 20.19).<\/p><h4>O FINAL DO MILÊNIO E A SOLTURA DE SATANÁS<\/h4><p>No final dos mil anos o diabo será solto de sua prisão e enganará muitos, (Ap 20.7-10). Esses que serão enganados provavelmente serão os que se recusarão adorar Cristo durante o milênio, (Zc 14.16,17). Sim, mesmo com a prisão de satanás e tendo Cristo como governante nessa terra haverá muitos insatisfeitos com Jesus e seu governo. Esses se juntarão ao diabo em uma última e frustrada tentativa de rebelião contra Israel e o Rei dos reis. O motivo da rebelião contra Israel e seu Rei possivelmente se dará por conta da supremacia de Israel em relação às nações, dessa forma haverá um descontentamento por parte de muitos em relação ao governo de Cristo. Esses povos insatisfeitos são os que nascerão durante o milênio e não se converterão a Cristo e nem o servirá (Zc 14.17-19). Consequentemente, quando o diabo for solto atuarão de acordo com o de
