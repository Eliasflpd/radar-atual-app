scontentamento já demonstrado antes da soltura de satanás, mas Deus enviará fogo do céu e os devorará,em seguida o diabo será lançado no lago de fogo.<\/p>"}, {"n": 103, "t": "APOCALIPSE - A BATALHA DE GOGUE E MAGOGUE", "html": "<h4>INTRODUÇÃO<\/h4><p>O contexto histórico em que a profecia foi entregue.<\/p><p>O contexto literário e gramatical da profecia.<\/p><p>A fidelidade da profecia pode ser atestada por fatos históricos.<\/p><h4>I - IDENTIDADE DOS POVOS<\/h4><p>Gogue - monte elevado - Babilônicos .. Citas .. Cabises rei da Pérsia .. Alexandre o grande .. Antíoco epifânio .. Turcos .. Armênios .. Russia .. Alemanha .. Arabes Ros - Chefe, Cabeça, Lider máximo.<\/p><p>Magogue - Cidade ou país Meseque e Tubal (Moscou e Tobolsk) - Sul da turquia O Ataque do Norte - Israel sempre foi atacada pelo norte<\/p><h4>II O TEMPO ESCATOLÓGICO DO ATAQUE<\/h4><p class='li'>A- Passado - Antíoco Epifânio - Tito ano 70<\/p><p class='li'>B- Entre o Arrebatamento e Inicio da Tribulação<\/p><p class='li'>C- Primeira metade da Tribulação<\/p><p class='li'>D- Segunda metade da Tribulação<\/p><p class='li'>E- Batalha do Armagedom<\/p><p class='li'>F- Final do Milênio<\/p><h4>CONTEXTO PARA O ATAQUE<\/h4><p class='li'>1 - A nação restaurada a sua terra<\/p><p class='li'>2 - Habitarão seguros<\/p><p class='li'>3 - Sem espadas<\/p><p class='li'>4 - Sem muro<\/p><h4>GOGUE SERÁ PUNIDO<\/h4><p class='li'>1 - Com fogo<\/p><p class='li'>2 - Suas armas serão queimadas por SETE ANOS<\/p><p class='li'>3 - Serão enterrado por SETE MESES<\/p><h4>III O DEUS QUE SALVA SEU POVO<\/h4><p class='li'>A- A fidelidade de Deus à suas promessas<\/p><p class='li'>B- O grande livramento de Deus<\/p><p class='li'>C- O nome de Deus será engrandecido<\/p>"}, {"n": 104, "t": "APOCALIPSE - TRONO BRANCO - O JUÍZO FINAL", "html": "<h4>O JUÍZO FINAL (20.11-15)<\/h4><blockquote>Apocalipse 20:11 E vi um grande trono branco, e o que estava assentado sobre ele, de cuja presença fugiu a terra e o céu; e não se achou lugar para eles. 12 E vi os mortos, pequenos e grandes, que estavam diante de Deus, e abriram-se os livros; e abriu-se outro livro, que é o da vida. E os mortos foram julgados pelas coisas que estavam escritas nos livros, segundo as suas obras. 13 E deu o mar os mortos que nele havia; e a morte e o inferno deram os mortos que neles havia; e foram julgados cada um segundo as suas obras. 14 E a morte e o inferno foram lançados no lago de fogo. Esta é a segunda morte. 15 E aquele que não foi achado escrito no livro da vida foi lançado no lago de fogo.<\/blockquote><h4>CONDENAÇÃO JUSTA<\/h4><blockquote>Lucas 12:47 E o servo que soube a vontade do seu senhor, e não se aprontou, nem fez conforme a sua vontade, será castigado com muitos açoites; 48 Mas o que a não soube, e fez coisas dignas de açoites, com poucos açoites será castigado. E, a qualquer que muito for dado, muito se lhe pedirá, e ao que muito se lhe confiou, muito mais se lhe pedirá.<\/blockquote><h4>O LIVRO DA VIDA<\/h4><blockquote>Mateus 7:22 Muitos me dirão naquele dia: Senhor, Senhor, não profetizamos nós em teu nome? E em teu nome não expulsamos demônios? E em teu nome não fizemos muitas maravilhas? 23 E então lhes direi abertamente: Nunca vos conheci; apartai-vos de mim, vós que praticais a iniquidade.<\/blockquote><p>E um grande trono branco, e o que estava assentado sobre ele, (Ap 20.11-15). O trono do Juiz é grande, pois fala da grandeza do Juiz, é branco pois fala da santidade e pureza do mesmo. Diante de tamanha magnificência o céus e a terra fogem, e não há lugar para eles. Se a terra e o céu fogem da presença do Grande Juiz, imagine a reação dos que serão julgados! Eles não terão em que se apoiar, não poderão se esconder. Esta é a última e final ressurreição, onde serão julgados e condenados todos os ímpios desde Adão até o último dia do reino milenar. Abriram-se os livros, esses contém o relato detalhado do pensamento e obra de cada um dos que serão julgados, não vai ficar em branco um só pensamento pecaminoso. O livro da vida também será aberto, pois é onde está o registro dos salvos, assim será feito para comprovar que não estão inscritos dentre os salvos. Sequencialmente serão lançados no lago de fogo.<\/p>"}, {"n": 105, "t": "APOCALIPSE - OS VÁRIOS JULGAMENTOS ESCATOLÓGICOS", "html": "<p class='li'>1 - TRIBUNAL DE CRISTO - (Rm 14.10-12; 1Co 3.11-15; 2Co 5.10,11)<\/p><p class='li'>2 - JULGAMENTO DAS NAÇÕES - (Mt 25.31; Jl 3.2,12-15)<\/p><p class='li'>3 - JULGAMENTO DE ISRAEL - (Mt 19.28; Lc 22.29.30)<\/p><p class='li'>4 - JULGAMENTO DO TRONO BRANCO (Ap 20.11-15)<\/p>"}, {"n": 106, "t": "APOCALIPSE - O LAGO DE FOGO - CONDENAÇÃO ETERNA", "html": "<h4>A DURAÇÃO DO TORMENTO<\/h4><blockquote>Daniel 12:2 E muitos dos que dormem no pó da terra ressuscitarão, uns para vida eterna, e outros para vergonha e desprezo eterno.<\/blockquote><blockquote>Mateus 25:46 E irão estes para o tormento eterno, mas os justos para a vida eterna.<\/blockquote><blockquote>Apocalipse 14:10 Também este beberá do vinho da ira de Deus, que se deitou, não misturado, no cálice da sua ira; e será atormentado com fogo e enxofre diante dos santos anjos e diante do Cordeiro. 11 E a fumaça do seu tormento sobe para todo o sempre; e não têm repouso nem de dia nem de noite os que adoram a besta e a sua imagem, e aquele que receber o sinal do seu nome.<\/blockquote><blockquote>Apocalipse 17:11 E a besta que era e já não é, é ela também o oitavo, e é dos sete, e vai à perdição.<\/blockquote><p>apṓleia (de 622 /apóllymi, \"cortar\") – destruição, fazer com que alguém (algo) seja completamente cortado - cortado (inteiramente) do que poderia ou deveria ter sido. (Observe a força do prefixo, apo.) Veja 622 (apollymi).<\/p><blockquote>Apocalipse 19:20 E a besta foi presa, e com ela o falso profeta, que diante dela fizera os sinais, com que enganou os que receberam o sinal da besta, e adoraram a sua imagem. Estes dois foram lançados vivos no lago de fogo que arde com enxofre.<\/blockquote><blockquote>Apocalipse 20:10 E o diabo, que os enganava, foi lançado no lago de fogo e enxofre, onde estão a besta e o falso profeta; e de dia e de noite serão atormentados para todo o sempre.<\/blockquote><h4>AIONAS TON AIONON<\/h4><blockquote>Apocalipse 1:18 E o que vivo e fui morto, mas eis aqui estou vivo para todo o sempre. Amém. E tenho as chaves da morte e do inferno.<\/blockquote><blockquote>Apocalipse 4:9 E, quando os animais davam glória, e honra, e ações de graças ao que estava assentado sobre o trono, ao que vive para todo o sempre,<\/blockquote><blockquote>Apocalipse 22:5 E ali não haverá mais noite, e não necessitarão de lâmpada nem de luz do sol, porque o Senhor Deus os ilumina; e reinarão para todo o sempre.<\/blockquote><h4>O LAGO DE FOGO<\/h4><blockquote>Apocalipse 20:14 E a morte e o inferno foram lançados no lago de fogo. Esta é a segunda morte. 15 E aquele que não foi achado escrito no livro da vida foi lançado no lago de fogo.<\/blockquote><blockquote>Apocalipse 21:8 Mas, quanto aos covardes, e aos incrédulos, e aos abomináveis, e aos homicidas, e aos fornicadores, e aos feiticeiros, e aos idólatras e a todos os mentirosos, a sua parte será no lago que arde com fogo e enxofre; o que é a segunda morte.<\/blockquote><h4>A NATUREZA DO SOFRIMENTO<\/h4><h4>A - FOGO LITERAL<\/h4><blockquote>Marcos 9:43 E, se a tua mão te escandalizar, corta-a; melhor é para ti entrares na vida aleijado do que, tendo duas mãos, ires para o inferno, para o fogo que nunca se apaga, 44 Onde o seu bicho não morre, e o fogo nunca se apaga.<\/blockquote><blockquote>Mateus 13:41 Mandará o Filho do homem os seus anjos, e eles colherão do seu reino tudo o que causa escândalo, e os que cometem iniqüidade. 42 E lançá-los-ão na fornalha de fogo; ali haverá pranto e ranger de dentes.<\/blockquote><blockquote>Apocalipse 14:10 Também este beberá do vinho da ira de Deus, que se deitou, não misturado, no cálice da sua ira; e será atormentado com fogo e enxofre diante dos santos anjos e diante do Cordeiro. 11 E a fumaça do seu tormento sobe para todo o sempre; e não têm repouso nem de dia nem de noite os que adoram a besta e a sua imagem, e aquele que receber o sinal do seu nome.<\/blockquote><h4>B - FOGO METAFÓRICO<\/h4><blockquote>Mateus 25:41 Então dirá também aos que estiverem à sua esquerda: Apartai-vos de mim, malditos, para o fogo eterno, preparado para o diabo e seus anjos;<\/blockquote><blockquote>Mateus 25:30 Lançai, pois, o servo inútil nas trevas exteriores; ali haverá pranto e ranger de dentes.<\/blockquote><blockquote>Mateus 22:12 E disse-lhe: Amigo, como entraste aqui, não tendo veste nupcial? E ele emudeceu. 13 Disse, então, o rei aos servos: Amarrai-o de pés e mãos, levai-o, e lançai-o nas trevas exteriores; ali haverá pranto e ranger de dentes.<\/blockquote><blockquote>Mateus 25:46 E irão estes para o tormento eterno, mas os justos para a vida eterna.<\/blockquote><blockquote>Apocalipse 20:10 E o diabo, que os enganava, foi lançado no lago de fogo e enxofre, onde estão a besta e o falso profeta; e de dia e de noite serão atormentados para todo o sempre. basanistés O que e como será o lago de fogo? O texto responde: a segunda morte, isto é, a final e definitiva separação de Deus, (Ap 21.8). É um lago, pois o lago aqui é símbolo de algo sem vida e sem saída, pois não haverá escape para esses condenados; de dia e de noite serão atormentados para todo o sempre. Assim, o fogo tanto pode ser literal como um símbolo do Juízo divino sobre os condenados. A natureza e essência do castigo em si será o tormento eterno ( Mt 25.46; Ap 20.10). Ainda que haja todo um debate sobre a natureza exata do tormento eterno, podemos afirmar enfaticamente que o inferno é um lugar horrível e de tormento consciente, e sua duração é perpétua.<\/blockquote>"}, {"n": 107, "t": "APOCALIPSE - NOVO CÉU E NOVA TERRA - ESTADO ETERNO", "html": "<h4>O NOVO CÉU<\/h4><p>O cosmos será restaurado. Todo efeito do pecado será definitivamente eliminado, não haverá mais rastros ou vestígios de pecado no universo (Rm 8.18-21; Ap 21.1). O novo céu não é a dimensão espiritual onde Deus habita e há moradas preparadas para nós (Ap 21.16-23), mas sim o universo, ou o céu físico. A obra redentora de Cristo abrangerá também o cosmos, o que inclui o planeta terra, isso significa que a nova terra será semelhante ao que Deus criou em Gênesis 1 e 2. O planeta terra terá todo um ecossistema para seu perfeito funcionamento a fim de que seja habitado. Os habitantes da nova terra serão os Israelitas e gentios fiéis a Cristo após a soltura de satanás no fim do milênio (Is 65.17-19; Ap 21.24).<\/p><h4>A NOVA TERRA<\/h4><p>Uma restauração do universo automaticamente exige que a terra também seja restaurada, uma vez que a terra pertence ao universo. Quem serão os habitantes da nova terra? Os mesmos que nela habitaram durante o reino milenar, os quais permaneceram fiéis a Cristo depois da soltura do diabo. Vale lembrar que no estado eterno, haverá a perpetuidade do reino milenar, o reino milenar é o estágio preparatório para a nova terra (Is 65.17-25).<\/p><h4>DISTINÇÃO ENTRE IGREJA E OS DEMAIS SANTOS<\/h4><blockquote>Apocalipse 21:9 E veio a mim um dos sete anjos que tinham as sete taças cheias das últimas sete pragas, e falou comigo, dizendo: Vem, mostrar-te-ei a esposa, a mulher do Cordeiro. 10 E levou-me em espírito a um grande e alto monte, e mostrou-me a grande cidade, a santa Jerusalém, que de Deus descia do céu. 12 E tinha um grande e alto muro com doze portas, e nas portas doze anjos, e nomes escritos sobre elas, que são os nomes das doze tribos dos filhos de Israel. 14 E o muro da cidade tinha doze fundamentos, e neles os nomes dos doze apóstolos do Cordeiro.<\/blockquote><h4>UMA CIDADE COM MUROS E QUADRADA?<\/h4><blockquote>Apocalipse 21:16 E a cidade estava situada em quadrado; e o seu comprimento era tanto como a sua largura. E mediu a cidade com a cana até doze mil estádios; e o seu comprimento, largura e altura eram iguais.<\/blockquote>"}, {"n": 108, "t": "APOCALIPSE - CÉU MORADA DA IGREJA", "html": "<h4>O CÉU MORADA DA IGREJA (DIMENSÃO ESPIRITUAL)<\/h4><blockquote>João 14:2 Na casa de meu Pai há muitas moradas; se não fosse assim, eu vo-lo teria dito. Vou preparar-vos lugar. 3 E quando eu for, e vos preparar lugar, virei outra vez, e vos levarei para mim mesmo, para que onde eu estiver estejais vós também.<\/blockquote><blockquote>Filipenses 3:20 Mas a nossa cidade está nos céus, de onde também esperamos o Salvador, o Senhor Jesus Cristo,<\/blockquote><blockquote>Hebreus 11:10 Porque esperava a cidade que tem fundamentos, da qual o artífice e construtor é Deus.<\/blockquote><blockquote>Apocalipse 21:22 E nela não vi templo, porque o seu templo é o Senhor Deus Todo-Poderoso, e o Cordeiro. 23 E a cidade não necessita de sol nem de lua, para que nela resplandeçam, porque a glória de Deus a tem iluminado, e o Cordeiro é a sua lâmpada. 24 E as nações dos salvos andarão à sua luz; e os reis da terra trarão para ela a sua glória e honra.<\/blockquote><p>Reconheceremos<\/p><blockquote>Mateus 8:11 Mas eu vos digo que muitos virão do oriente e do ocidente, e assentar-se-ão à mesa com Abraão, e Isaque, e Jacó, no reino dos céus;<\/blockquote><blockquote>Mateus 17:3 E eis que lhes apareceram Moisés e Elias, falando com ele. 4 E Pedro, respondendo, disse a Jesus: Senhor, bom é estarmos aqui; se queres, façamos aqui três tabernáculos, um para ti, um para Moisés, e um para Elias.<\/blockquote><blockquote>Lucas 24:31 Abriram-se-lhes então os olhos, e o conheceram, e ele desapareceu-lhes.<\/blockquote><blockquote>João 20:14 E, tendo dito isto, voltou-se para trás, e viu Jesus em pé, mas não sabia que era Jesus.<\/blockquote><blockquote>1 Coríntios 15:37 E, quando semeias, não semeias o corpo que há de nascer, mas o simples grão, como de trigo, ou de outra qualquer semente. 42 Assim também a ressurreição dentre os mortos. Semeia-se o corpo em corrupção; ressuscitará em incorrupção.<\/blockquote><p>Não haverá velhos Haverá plena comunhão Não estarmos sujeitos ao espaço tempo<\/p><blockquote>Atos dos Apóstolos 8:39 E, quando saíram da água, o Espírito do Senhor arrebatou a Filipe, e não o viu mais o eunuco; e, jubiloso, continuou o seu caminho.<\/blockquote><h4>HAVERÁ NAÇÕES, REIS E POVOS SOBRE A TERRA<\/h4><blockquote>Apocalipse 21:23 E a cidade não necessita de sol nem de lua, para que nela resplandeçam, porque a glória de Deus a tem iluminado, e o Cordeiro é a sua lâmpada. 24 E as nações dos salvos andarão à sua luz; e os reis da terra trarão para ela a sua glória e honra. 25 E as suas portas não se fecharão de dia, porque ali não haverá noite. 26 E a ela trarão a glória e honra das nações.<\/blockquote>"}, {"n": 109, "t": "APOCALIPSE - OS SALVOS NO CÉU E TERRA PARA SEMPRE", "html": "<blockquote>Apocalipse 21:1 E VI um novo céu, e uma nova terra. Porque já o primeiro céu e a primeira terra passaram, e o mar já não existe.<\/blockquote><p>néos – novo (\"novo em cena\"); recentemente revelado ou \"o que não estava lá antes\" (TDNT), incluindo o que foi descoberto recentemente.<\/p><p>3501 /néos (\"novo em cena\") sugere algo \"novo no tempo\" – em contraste com seu quase sinônimo (2537 /kainós, \"novo em qualidade\").<\/p><blockquote>2 Pedro 3:10 Mas o dia do Senhor virá como o ladrão de noite; no qual os céus passarão com grande estrondo, e os elementos, ardendo, se desfarão, e a terra, e as obras que nela há, se queimarão. 12 Aguardando, e apressando-vos para a vinda do dia de Deus, em que os céus, em fogo se desfarão, e os elementos, ardendo, se fundirão?<\/blockquote><blockquote>Atos dos Apóstolos 2:19 E farei aparecer prodígios em cima, no céu; e sinais embaixo na terra, sangue, fogo e vapor de fumo. 20 O sol se converterá em trevas, e a lua em sangue, antes de chegar o grande e glorioso dia do Senhor;<\/blockquote><blockquote>Isaías 65:17 Porque, eis que eu crio novos céus e nova terra; e não haverá mais lembrança das coisas passadas, nem mais se recordarão. 18 Mas vós folgareis e exultareis perpetuamente no que eu crio; porque eis que crio para Jerusalém uma alegria, e para o seu povo gozo. 19 E exultarei em Jerusalém, e me alegrarei no meu povo; e nunca mais se ouvirá nela voz de choro nem voz de clamor.<\/blockquote><blockquote>Isaías 65:20 Não haverá mais nela criança de poucos dias, nem velho que não cumpra os seus dias; porque o menino morrerá de cem anos; porém o pecador de cem anos será amaldiçoado. 22 Não edificarão para que outros habitem; não plantarão para que outros comam; porque os dias do meu povo serão como os dias da árvore, e os meus eleitos gozarão das obras das suas mãos.<\/blockquote><p>23 Não trabalharão em vão, nem terão filhos para a perturbação; porque são a posteridade bendita do SENHOR, e os seus descendentes estarão com eles.<\/p><blockquote>Isaías 65:24 E será que antes que clamem eu responderei; estando eles ainda falando, eu os ouvirei. 25 O lobo e o cordeiro se apascentarão juntos, e o leão comerá palha como o boi; e pó será a comida da serpente. Não farão mal nem dano algum em todo o meu santo monte, diz o<\/blockquote><h4>SENHOR<\/h4><p>yalad: dar à luz, produzir, gerar Original Word: דלַ יָ tseetsa: emitir, descendência, produzir Original Word: אצֶ אֱ צֶ<\/p><h4>ELES FRUTIFICARÃO<\/h4><blockquote>Jeremias 3:16 E sucederá que, quando vos multiplicardes e frutificardes na terra, naqueles dias, diz o SENHOR, nunca mais se dirá: A arca da aliança do SENHOR, nem lhes virá ao coração; nem dela se lembrarão, nem a visitarão; nem se fará outra. 17 Naquele tempo chamarão a Jerusalém o trono do SENHOR, e todas as nações se ajuntarão a ela, em nome do SENHOR, em Jerusalém; e nunca mais andarão segundo o propósito do seu coração maligno.<\/blockquote><h4>GERAR FILHOS: EZ 37.24-28.<\/h4><blockquote>Ezequiel 37:24 E meu servo Davi será rei sobre eles, e todos eles terão um só pastor; e andarão nos meus juízos e guardarão os meus estatutos, e os observarão. 25 E habitarão na terra que dei a meu servo Jacó, em que habitaram vossos pais; e habitarão nela, eles e seus filhos, e os filhos de seus filhos, para sempre, e Davi, meu servo, será seu príncipe eternamente. 26 E farei com eles uma aliança de paz; e será uma aliança perpétua. E os estabelecerei, e os multiplicarei, e porei o meu santuário no meio deles para sempre. 27 E o meu tabernáculo estará com eles, e eu serei o seu Deus e eles serão o meu povo. 28 E os gentios saberão que eu sou o SENHOR que santifico a Israel, quando estiver o meu santuário no meio deles para sempre.<\/blockquote><blockquote>Apocalipse 21:3 E ouvi uma grande voz do céu, que dizia: Eis aqui o tabernáculo de Deus está com os homens, pois com eles habitará, e eles serão o seu povo, e o mesmo Deus estará com eles, e será o seu Deus.<\/blockquote><p>rabah: multiplicar Original Word: הבָ רָ Ez 37.26; Gn 1.22,28.<\/p><h4>NOVO MODELO DE CRIAÇÃO - CORPO NATURAL<\/h4><blockquote>Apocalipse 21:5 E o que estava assentado sobre o trono disse: Eis que faço novas todas as coisas. E disse-me: Escreve; porque estas palavras são verdadeiras e fiéis.<\/blockquote><h4>TERRA RESTAURADA COM ANIMAIS<\/h4><h4>UNIVERSO POVOADO<\/h4><h4>COMEREMOS<\/h4><blockquote>Lucas 24:42 Então eles apresentaram-lhe parte de um peixe assado, e um favo de mel; 43 O que ele tomou, e comeu diante deles.<\/blockquote><h4>A IGREJA NÃO PROCRIA<\/h4><h4>REINAREMOS SOBRE AS NAÇÕES<\/h4><blockquote>Apocalipse 22:1 E MOSTROU-ME o rio puro da água da vida, claro como cristal, que procedia do trono de Deus e do Cordeiro. 2 No meio da sua praça, e de um e de outro lado do rio, estava a árvore da vida, que produz doze frutos, dando seu fruto de mês em mês; e as folhas da árvore são para a saúde das nações. 3 E ali nunca mais haverá maldição contra alguém; e nela estará o trono de Deus e do Cordeiro, e os seus servos o servirão. 4 E verão o seu rosto, e nas suas testas estará o seu nome. 5 E ali não haverá mais noite, e não necessitarão de lâmpada nem de luz do sol, porque o Senhor Deus os ilumina; e reinarão para todo o sempre.<\/blockquote><blockquote>2 Pedro 3:13 Mas nós, segundo a sua promessa, aguardamos novos céus e nova terra, em que habita a justiça.<\/blockquote><p>A igreja glorificada atuará de maneira dinâmica e intensa, reinaremos com Cristo sobre esses povos por toda eternidade (Ap 22.5). Esse reino eterno será perfeito, e sem o pecado, o homem será capaz de fazer uso de sua capacidade mental em seu pleno potencial. O mundo será de tal forma que sequer podemos imaginar. Todo progresso positivo da humanidade chegará ao seu ápice na nova terra. Imagine tudo de bom que o homem foi capaz de desenvolver até agora, pois bem, não tem nem como compararmos com o que haverá na nova terra! E a igreja vai interagir com esses súditos, pois anjos sempre interagiram com o povo de Deus a serviço do mesmo, (Gn 18.8). Jesus depois de ressurreto esteve com seus discípulos durante quarenta dias, o fato de que possuímos corpos glorificados será impedimento tal relacionamento, ainda que haja alguns limites.<\/p><h4>CONCLUSÃO<\/h4><p>A vida eterna consiste em conhecer a Deus, um dos atributos do Divino é a infinitude, isso quer dizer que vamos viver a eternidade em função de conhecer e servir à Deus, não de forma teórica apenas, mas experimental e prática, (Jo 17.3). Isso quer dizer que nunca esgotamos o conhecimento de Deus, jamais alguém poderá dizer “agora eu conheço a Deus em sua totalidade”, pois nunca esgotamos o conhecimento do infinito!<\/p><blockquote>João 17:3 E a vida eterna é esta: que te conheçam, a ti só, por único Deus verdadeiro, e a Jesus Cristo, a quem enviaste.<\/blockquote>"}]}, {"n": 14, "t": "FUNDAMENTOS PRÉ-TRIBULACIONISTA", "aulas": [{"n": 110, "t": "OS PRINCIPAIS ARGUMENTOS PRÉ-TRIBULACIONISTA", "html": "<h4>1 - ARGUMENTO HERMENÊUTICO<\/h4><h4>2 - ARGUMENTO BÍBLICO<\/h4><h4>3 - ARGUMENTO EXEGÉTICO<\/h4><h4>4 - ARGUMENTO TEOLÓGICO<\/h4><h4>5 - ARGUMENTO HISTÓRICO<\/h4>"}, {"n": 111, "t": "RESPOSTAS ÀS PRINCIPAIS OBJEÇÕES AO PRÉ-TRIBULACIONISMO", "html": "<p>Objeção numero 1: O pré-tribulacionismo é uma teoria jovem.<\/p><p>Resposta: O dispensacionalismo e o pré-tribulacionismo como sistema escatológico organizados, foi de fato desenvolvido e sistematizado com os irmãos de Plymouth, mais precisamente na pessoa de John Nelson Darby no século XIX.<\/p><p>Todavia, a pesar de sua pouca idade, a tentativa de invalidar o dispensacionalismo por este ser recente é sem fundamento por pelo menos 3 motivos: (1) não é a idade de uma doutrina que a torna válida, pois há inúmeras doutrinas heréticas que perduram no Cristianismo as quais foram elaboradas nos primeiros séculos, e o fato de existirem a milênios não as torna válidas, (2) o aliancismo como sistema e a própria sistematização do pós-tribulacionismo como encontramos hoje são igualmente recentes, (3) a ideia de um arrebatamento pré-tribulacional, e outros conceitos chaves do dispensacionalismo não surgiram exclusivamente da mente de Darby. Joseph Made(1586-1639), já defendia a possibilidade da igreja ser isenta da grande tribulação usando como analogia o episódio de Noé e o diluvio.[11] Além de Made podemos citar nomes como Thomas Draxe, Robert Maton e Willian Aspinwall, pois todos esses teólogos e pastores pertenceram ao século século XVII e defendiam a ideia da Igreja ser poupada de uma futura grande Tribulação.<\/p><p>Objeção numero 2: J.N. Darby usou a teoria de Margareth MacDonald.<\/p><p>Resposta: É muito comum os pós-tribulacionistas fazerem falsas acusações contra a origem do pré-tribulacionismo e seus sistematizadores. Pois ligeiramente afirmam que o pré- tribulacionismo é fruto das visões de Margaret Macdonald, tal afirmação foi propagada por Dave MacPherson em seu livro “The Incredible Cover Up”. Porém, quando analisamos os textos com as declarações de Margaret MacDonald fica evidente que ela esperava que Igreja iria passar pela grande tribulação, ou pelo menos por parte, pois Mcdonald pede que Deus dê forças para seu povo suportar os horrores daquele período. Além disso, levantam afirmações caluniosas sobre a pessoa de J.N. Darby e Scofield, atribuindo a eles falhas de suas vidas regressas antes da conversão, como se fossem fatos pós-conversão. Walvoord apresenta os fatos documentais que evidenciam que essas e outras afirmações não passavam de calunia e difamação[12], pois é sabido que esses homens eram teólogos piedosos de origem reformada e que tinham grande empenho pela causa do Reino.<\/p><p>Objeção numero 3: A Igreja sempre passou por tribulações.<\/p><p>Os pós-tribulacionistas afirmam que à Igreja foi prometido que por muitas tribulações importa entrar no reino dos céus. Alegam que a Igreja sempre foi perseguida e afligida, logo não teria sentido Deus livrar seu povo de uma futura e grande tribulação.<\/p><p>Resposta. Esse argumento contem alguns erros primários, pois os textos que utilizam para afirmar que Igreja passará pela grande tribulação dizem respeito a tribulações gerais de alcance local. Vejamos Lucas 21.12 “Mas antes de toas as coisas lançarão mão de vós, e vos perseguirão, entregando-vos as sinagogas e prisões”. Esse texto está claramente relacionado as perseguições do primeiro século antes da destruição do templo no ano 70, logo nada tem a ver com a futura grande tribulação. Uma outra referencia utilizada para corroborar a ideia de que a Igreja não será isenta da grande tribulação é Atos 14.22 “Pois que por muitas tribulações nos importa entrar no reino de Deus”. Esse é o texto mais citado por pós-tribulacionistas, dizem: “olha aí, a igreja tem que passar por muitas tribulações para chegar ao céu”. Essa ideia é tosca, pois cheira “penitência”. Muitos veem a grande tribulação como uma espécie de “purgatório”, e creem que com base em textos como esses a igreja terá que enfrentar a grande tribulação para ser purificada. É verdade que Deus usa tribulações para purificar a fé do crente, mas esse não é o único meio que Deus tem para tal. Alguns pós-tribulacionistas pensam ser injusto A igreja de todas as eras terem sofrido perseguições e martírio, e agora a igreja da faze final ser isenta. Esses são todos argumentos simplistas, pois cremos que Igreja será isenta da grande tribulação pelo simples fato de Bíblia assim o diz. Vejamos Lucas 21.36: “ Vigiai pois em todo o tempo, orando, para que sejais havidos por dignos de evitar todas essas coisas e estar em pé diante do Filho do homem”. Quais são “essas coisas” das quais os discípulos de Jesus podem evitar? Ao ler o contexto de Lucas 21 fica nítido que “essas coisas” não se referem apenas a perseguição antes da destruição do templo, pois o texto aponta para algo maior, isto é, uma futura e grande tribulação, e é sobre isso que Jesus afirma que é possível sua igreja evitar. Essa promessa de que a Igreja será arreatada antes da ultima, intensa e global tribulação é muito clara. O erro básico do pós-tribulacionista consiste em não fazer distinção entre tribulações gerais e locais da grande tribulação. Jesus fez essa distinção com muita clareza: Mateus 24.21 “Porque haverá então grande aflição, como nunca houve desde o principio do mundo até agora, nem tão pouco há de haver”. A igreja tem passado por muitas tribulações em vários períodos da história, mas essa tribulação da qual falou Jesus é única e está reservada para o tempo final, mas para Igreja foi prometido que será arrebatada antes.<\/p><p>Objeção 4: O anticristo tem que se manifestar antes do “dia do Senhor”.<\/p><p>É um grande erro do pós-tribulacionista identificar o “dia do Senhor” como uma referência à vinda de Cristo para arrebatar sua Igreja. Há diversos textos onde o dia do Senhor é uma clara referência ao período de tempo em que Deus vai derramar os mais severos juízos sobre esse mundo e colocar Israel a prova a fim de trazê-los ao arrependimento e a aceitação de Cristo. Dessa forma fica nítido que quando o texto de 2 Tessalonicenses 2.3 diz que antes que venha o “dia do Senhor” deve primeiro haver a manifestação do anticristo, Paulo está afirmando que antes que comecem os juízos do dia do Senhor(grande tribulação - dia do Senhor), o anticristo se manifestará. Aliás, todo o contexto gramatical de 2 Tessalonicenses 2 favorece ao pré- tribulacionismo, pois ali é dito que ele se assentará como Deus, no templo de Deus, e isso é nitidamente uma alusão direta à Mateus 24.15 e Daniel 9.27, textos cujos contextos remetem imediatamente à nação de Israel. Além disso, é inconcebível que o templo mencionado em 2<\/p><blockquote>Tessalonicenses 2.4 seja uma referência a Igreja, pois é inimaginável que Cristo permita o anticristo usurpar sua posição na Igreja, sendo essa seu corpo de fieis. Dessa forma, podemos concluir que essa é uma clara referência ao templo físico de Jerusalém, o que consequentemente conecta o anticristo e a grande tribulação à nação de Israel e não à Igreja. Outro ponto nesse texto de destaque é o detentor, isto é, o único que tem poder de deter e impedir a manifestação do anticristo é o Espirito Santo através da igreja, e assim que o Espírito santo for afastado retirando e arrebatamento a Igreja, o anticristo se manifestará.<\/blockquote><h4>5 - A VOLTA DE JESUS É ÚNICA<\/h4><h4>6 - JESUS VOLTA NO FIM DA TRIBULAÇÃO<\/h4>"}, {"n": 112, "t": "OS QUATRO TIPOS DE PÓS-TRIBULACIONISMO", "html": "<p>A bíblia diz que antes de Cristo vir estabelecer o reinado de mil anos haverá um período de sete anos que é denominado a \"grande tribulação\". Entre os pré-milenistas há divergências se a igreja passará por esse período de grande tribulação na terra ou será arrebatada antes, segue algumas propostas:<\/p><p>Pós-tribulacionismo Defende que a igreja passará pela grande tribulação que há de vir sobre toda a terra, sendo arrebatada imediatamente após esse período por ocasião da segunda vinda, onde então retornará com Cristo para dar início ao reino milenar.<\/p><p>Essa perspectiva afirma que a igreja será arrebatada assim que se encerrar a grande tribulação, no mesmo momento em que Cristo estiver voltando à terra para salvar Israel das garras do anticristo e estabelecer seu Reino.<\/p><p>São numerosos os problemas teológicos que surgem ao sustentar um milênio literal e adotar a perspectiva de que a igreja passará pela grande tribulação sendo arrebatada no segundo advento de Cristo. Há várias perspectivas em relação ao milênio dentre os pós-tribulacionistas, mas, em poucas palavras, podemos adiantar que o teólogo que é pré-milenista e insiste no pós- tribulacionismo é como alguém que tenta misturar água e óleo. Todo pré-tribulacionista é pré- milenista, não há como ser pré-tribulacionista sendo amilenista ou pós-milenista, pois a interpretação literal que nos leva a distinguir igreja de Israel e não permite espiritualizar as profecias referentes ao reino milenar e Israel e substituir a igreja por Israel, como fazem os amilenistas e pós-milenista. Por outro lado, dentre os pós-tribulacionistas há pré-milenistas, amilenistas e pós-milenistas, e consequentemente uma ampla variação de pós-tribulacionismos. Pós-tribulacionismo clássico Esse é o pós-tribulacionismo defendido na patrística, onde os sete anos da tribulação não eram considerados literalmente. Assim, acreditavam que já estavam vivendo a tribulação. Hoje, o amilenista se identifica com esse tipo de pós-tribulacionismo, pois entendem que a grande tribulação já está ocorrendo desde o primeiro século, o anticristo já pode estar presente e Jesus pode voltar a qualquer momento. Esse pós-tribulacionismo tem a tendência de espiritualizar quase todos os eventos da grande tribulação, e essa é uma característica do amilensimo. Pós-tribulacionismo semi-clássico Essa posição entende que parte da grande tribulação já se cumpriu, mas que ainda haverá um período mais intenso de tribulação, ocasião em que o anticristo se manifestará. Os defensores dessa posição interpretam parte dos textos proféticos literalmente e outra parte espiritualmente, assim, sempre que alguma ideia não se harmoniza com seu sistema escatológico, abandonam o método literal e apelam para o alegorismo. Alguns interpretam metade da septuagésima semana de Daniel como três anos e meio literais e afirmam que já se cumpriu no ministério de Jesus, contudo, como não há possibilidade de sustentar todos os sete anos literais com os três anos e meio finais após o ministério de terreno de Cristo, afirmam que os últimos três anos e meio não são literais e se estende desde a crucificação até a segunda vinda, essa é uma manobra absurda em termos hermenêuticos. Alguns amilenistas e pré-milenistas que são pós- tribulacionistas adotam essa perspectiva.<\/p><p>Pós-tribulacionismo futurista Essa perspectiva que é mais comum hoje entre os pós-tribulacionistas que são pré-milenistas foi sistematizada por George Ladd em meados do século XX. Esse pós-tribulacionismo é conhecido também pelo título de “pré-milenismo histórico”, pois acreditam que essa era a posição dos primeiros teólogos da igreja, isto é, até os três primeiros séculos. Contudo há diferenças significativas entre o pós-tribulacionismo defendido pelos pais que eram pré- milenistas e o que esses pós-tribulacionistas atuais defendem. Enquanto Ladd e seus discípulos defendem uma tribulação literal de sete anos e que ainda é futura, os teólogos da patrística acreditavam que já estavam vivendo a tribulação que naturalmente não era um futuro período de sete anos como os pré-milenistas históricos de hoje defendem. Logo, pós-tribulacionismo defendido hoje pelos pré-milenistas não é nada histórico, diferindo em vários pontos da visão defendida na patrística, sendo assim, é mais recente que o pré-tribulacionismo e sua sistematização. A pergunta que fazemos para o pós-tribulacionista que é pré-milenista é, você crê que já está na grande tribulação? A resposta será um “não”, logo, esse não é o mesmo pós- tribulacionismo da patrística, pois os pais acreditavam que já estavam vivendo a grande tribulação profetizada por Jesus em Mateus 24 e registrada em detalhes por João em Apocalipse 6-18. Dessa forma, se o pré-milenista afirma que sua posição é a mesma da patrística, ele tem que afirmar que já está na grande tribulação e Jesus pode voltar a qualquer momento. Pós-tribulacionismo dispensacionalista Desenvolvido por Robert Gundry, esse é um pós-tribulacionismo bem distinto e ao mesmo tempo incoerente, pois como dispensacionalista, Gundry faz distinção entre igreja e Israel, mas insere a igreja no dia do Senhor que claramente foi profetizado para Israel. Além de haver uma total incoerência em querer conciliar dispensacionalismo com pós-tribulacionismo, Robert Gundry empreendeu muito esforço em pelo menos tentar resolver alguns problemas que Ladd ignorou, como por exemplo um julgamento das nações após a segunda vinda para definir quem são as ovelhas que entram no reino, para Gundry, diferente dos demais pós-tribulacionistas, tal julgamento ocorre após o milênio, uma posição semelhante ao amilenismo que faz dos julgamentos um único evento antes do estabelecimento do estado eterno. Uma outra proposta apresentada por Gundry diz respeito ao arrebatamento e segunda vinda, pois para ele o arrebatamento ocorre antes do ajuntamento para a batalha do armagedom, ao passo que para Ladd ocorre após. Gundry foi um dos primeiros a tentar resolver o problema da igreja estar na tribulação que é a ira de Deus. É fato que a grande tribulação é a ira de Deus, e a igreja não está destinada à ira (1Ts 1.10; 5.9), assim, Gundry faz uma distinção entre ira de Deus e ira de satanás. Para Gundry, a igreja ao estar na grande tribulação sofrerá a ira de satanás, mas não de Deus. Entretanto, não há essa distinção. A ira ou perseguição do diabo por intermédio do anticristo aos santos da tribulação que naturalmente não é a igreja, é apenas uma aspecto da ira de Deus que se inicia na abertura do primeiro selo, ou seja, o próprio anticristo é o primeiro aspecto da ira de Deus que sobrevirá ao mundo na abertura do primeiro selo (Ap 6.1,2). O pós- tribulacionismo de Gundry assemelha-se em muito à posição defendida mais tarde por alguns dispensacionalistas progressivos, que são pré-ira. Assim, podemos dizer que o dispensacionalismo progressivo que é pré-ira, é uma reformulação da teoria de Gundry.<\/p>"}, {"n": 113, "t": "OS NUMEROSOS PROBLEMAS DO PÓS-TRIBULACIONISMO", "html": "<h4>1 - HERMENÊUTICA ALEGÓRICA<\/h4><h4>2 - NÃO DISTINGUIR IGREJA DE ISRAEL<\/h4><h4>3 - NEGAR A NATUREZA E PROPÓSITO DA TRIBULAÇÃO<\/h4><h4>4 - A IGREJA NÃO ESTÁ EM APOCALIPSE 6 AO 18 NA TERRA<\/h4><h4>5 - AFIRMAR QUE A IGREJA SERÁ GUARDADA EM MEIO A TRIBULAÇÃO<\/h4><h4>6 - NÃO HÁ ARREBATAMENTO NA SEGUNDA VINDA<\/h4><h4>7 - CONFUNDIR ARREBATAMENTO COM SEGUNDA VINDA<\/h4><h4>8 - CONFUNDIR OS JULGAMENTOS<\/h4><h4>9 - NÃO IDENTIFICAR O PROPÓSITO DO MILÊNIO<\/h4><h4>10 - NÃO RESTA SANTOS EM CORPOS NATURAIS PARA ENTRAR NO MILÊNIO<\/h4><h4>11 - NÃO CONSIDERAR O TODO DA REVELAÇÃO ESCATOLÓGICA<\/h4>"}]}, {"n": 15, "t": "INDICAÇÕES DE LIVROS", "aulas": [{"n": 114, "t": "LIVROS SOBRE O ARREBATAMENTO", "html": "<p class='soon'>Conteúdo desta aula disponível na vídeo-aula do curso.<\/p>"}, {"n": 115, "t": "LIVROS SOBRE O MILÊNIO", "html": "<p class='soon'>Conteúdo desta aula disponível na vídeo-aula do curso.<\/p>"}, {"n": 116, "t": "LIVROS SOBRE A HISTORICIDADE DO DISPENSACIONALISMO", "html": "<p class='soon'>Conteúdo desta aula disponível na vídeo-aula do curso.<\/p>"}, {"n": 117, "t": "LIVROS SOBRE O DISPENSACIONALISMO E ALIANCISMO", "html": "<p class='soon'>Conteúdo desta aula disponível na vídeo-aula do curso.<\/p>"}, {"n": 118, "t": "LIVROS SOBRE HERMENÊUTICA ESCATOLÓGICA", "html": "<p class='soon'>Conteúdo desta aula disponível na vídeo-aula do curso.<\/p>"}, {"n": 119, "t": "LIVROS SOBRE PERSPECTIVAS NÃO DISPENSACIONALISTAS", "html": "<p class='soon'>Conteúdo desta aula disponível na vídeo-aula do curso.<\/p>"}, {"n": 120, "t": "LIVROS SOBRE O APOCALIPSE", "html": "<p class='soon'>Conteúdo desta aula disponível na vídeo-aula do curso.<\/p>"}]}, {"n": 16, "t": "ATUALIZAÇÕES MENSAIS COM AULAS COMPLEMENTARES", "aulas": []}], "n_mod": 16, "n_aula": 120, "n_conteudo": 113};

async function validar(s){
  const r=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'curso',senha:s})});
  const d=await r.json(); return !!(d&&d.ok);
}
async function entrar(){
  const s=$('senha').value.trim(); if(!s) return;
  $('btnEntrar').disabled=true; $('erro').textContent='';
  try{
    if(await validar(s)){ try{localStorage.setItem('curso_senha',s);}catch(_){} abrir(); }
    else{ $('erro').textContent='Senha incorreta.'; $('btnEntrar').disabled=false; }
  }catch(e){ $('erro').textContent='Sem conexão. Tente de novo.'; $('btnEntrar').disabled=false; }
}
$('senha').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();entrar();} });

function abrir(){
  $('gate').style.display='none';
  const L=$('livro'); L.style.display='block';
  let h=`
    <div class="capa">
      <span class="badge">Apostila do curso</span>
      <h1>Escatologia Avançada</h1>

      <div class="stats">
        <div><b>${DATA.n_mod}</b>módulos</div>
        <div><b>${DATA.n_aula}</b>aulas</div>
      </div>
    </div>`;
  if(DATA.apr){ h+=`<div class="bloco apr"><h2 class="sec">Apresentação</h2>${DATA.apr}</div>`; }
  h+=`<div class="bloco" id="indice"><h2 class="sec">Índice</h2>`;
  DATA.mods.forEach((m,i)=>{
    h+=`<a class="ix" href="#mod${i}" onclick="return irMod(${i})">
      <div class="n">${String(m.n).padStart(2,'0')}</div>
      <div class="ti"><b>${esc(m.t)}</b><span>${m.aulas.length} aula${m.aulas.length!==1?'s':''}</span></div>
      <div class="seta">›</div></a>`;
  });
  h+=`</div>`;
  DATA.mods.forEach((m,i)=>{
    h+=`<div class="mod" id="mod${i}" data-i="${i}"><div class="mod-h" onclick="toggleMod(${i})">
      <div class="n">${String(m.n).padStart(2,'0')}</div>
      <div class="ti"><small>Módulo ${String(m.n).padStart(2,'0')}</small><b>${esc(m.t)}</b><span>${m.aulas.length} aula${m.aulas.length!==1?'s':''}</span></div>
      <div class="seta">›</div></div><div class="mod-body"></div></div>`;
  });
  L.insertAdjacentHTML('beforeend',h);
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function limpaTitulo(t){return esc((t||'').replace(/\s+/g,' ').trim());}

function renderMod(i){
  const el=document.querySelector('.mod[data-i="'+i+'"] .mod-body');
  if(el.dataset.done) return;
  const m=DATA.mods[i];
  let h='';
  m.aulas.forEach(a=>{
    h+=`<div class="aula"><h3><span class="an">Aula ${String(a.n).padStart(2,'0')}</span>${limpaTitulo(a.t)}</h3>${a.html}</div>`;
  });
  el.innerHTML=h; el.dataset.done='1';
}
function toggleMod(i){
  const mod=document.querySelector('.mod[data-i="'+i+'"]');
  const wasOpen=mod.classList.contains('aberto');
  if(!wasOpen){ renderMod(i); }
  mod.classList.toggle('aberto');
}
function irMod(i){
  const mod=document.querySelector('.mod[data-i="'+i+'"]');
  if(!mod.classList.contains('aberto')){ renderMod(i); mod.classList.add('aberto'); }
  mod.scrollIntoView({behavior:'smooth',block:'start'});
  return false;
}
function irIndice(){ const ix=$('indice'); if(ix) ix.scrollIntoView({behavior:'smooth',block:'start'}); }

window.addEventListener('scroll',()=>{ $('toTop').classList.toggle('on', window.scrollY>600); });

(async function(){
  let s=''; try{ s=localStorage.getItem('curso_senha')||''; }catch(_){}
  if(s){ try{ if(await validar(s)){ abrir(); return; } }catch(_){} }
  $('senha').focus();
})();
</script>
