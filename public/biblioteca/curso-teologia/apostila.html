e admirável sinal no céu: sete anjos, que tinham as sete últimas pragas; porque nelas é consumada a ira de Deus.<\/blockquote>"}, {"n": 70, "t": "OS QUE ATRIBULAM A IGREJA SERÃO PUNIDOS APÓS A SEGUNDA VINDA DE CRISTO A TERRA - 2TS 1", "html": "<h4>SEGUNDA VINDA DE CRISTO A TERRA - 2TS 1<\/h4><blockquote>2 Tessalonicenses 1:4 De maneira que nós mesmos nos gloriamos de vós nas igrejas de Deus por causa da vossa paciência e fé, e em todas as vossas perseguições e aflições que suportais; 5 Prova clara do justo juízo de Deus, para que sejais havidos por dignos do reino de Deus, pelo qual também padeceis; 6 Se de fato é justo diante de Deus que dê em paga tribulação aos que vos atribulam, 7 E a vós, que sois atribulados, descanso conosco, quando se manifestar o Senhor Jesus desde o céu com os anjos do seu poder, 8 Com labareda de fogo, tomando vingança dos que não conhecem a Deus e dos que não obedecem ao evangelho de nosso Senhor Jesus Cristo; 9 Os quais, por castigo, padecerão eterna perdição, longe da face do Senhor e da glória do seu poder, 10 Quando vier para ser glorificado nos seus santos, e para se fazer admirável naquele dia em todos os que creem (porquanto o nosso testemunho foi crido entre vós).<\/blockquote>"}, {"n": 71, "t": "O DIA DO SENHOR EM 2TS 2 - ARREBATAMENTO OU GRANDE TRIBULAÇÃO?", "html": "<p>Em 2 Tessalonicenses 2 está registrado que “o dia do “Senhor”(Kurios), isto é, o dia da grande ira, que é a grande tribulação, não sobreviverá sem que antes se manifeste o homem do pecado (anticristo), e essa manifestação ocorrerá apenas quando o detentor for afastado.<\/p><p>A ordem dos eventos apresentados por Paulo é,<\/p><p class='li'>1 - Remoção do poder que impede a manifestação do anticristo, que se dará por meio do arrebatamento da igreja. (6,7,)<\/p><p class='li'>2 - A grande apostasia, ocorrerá uma grande rebelião contra Deus e sua palavra. (3)<\/p><p class='li'>3 - O anticristo será revelado. (3,4,8)<\/p><p class='li'>4 - O dia do Senhor terá seu início. (2)<\/p><p class='li'>5 - A derrota do anticristo no segundo advento de Cristo no fim da grande tribulação. (8) O modelo que apresentei está considerando a “apostasia” como afastamento dos princípios morais, uma rebelião contra Deus e sua palavra, Walvoord, Ryrie, Brainard dentro outros dispensacionalistas seguem essa interpretação. Entretanto há dispensacionalistas, Woods, Ice dentre outros que entendem “apostasia” como a partida ou o afastamento da igreja.<\/p>"}, {"n": 72, "t": "A APOSTASIA EM 2TS 2 É O ARREBATAMENTO?", "html": "<blockquote>2 Tessalonicenses 1:4 De maneira que nós mesmos nos gloriamos de vós nas igrejas de Deus por causa da vossa paciência e fé, e em todas as vossas perseguições e aflições que suportais; 5 Prova clara do justo juízo de Deus, para que sejais havidos por dignos do reino de Deus, pelo qual também padeceis; 6 Se de fato é justo diante de Deus que dê em paga tribulação aos que vos atribulam,<\/blockquote><blockquote>2 Tessalonicenses 2:1 ORA, irmãos, rogamo-vos (Erōtōmen), pela vinda de nosso Senhor Jesus Cristo, e pela nossa reunião com ele, 2 Que não vos movais facilmente do vosso entendimento, nem vos perturbeis, quer por espírito, quer por palavra, quer por epístola, como de nós, como se o dia de Cristo estivesse já perto, 3 Ninguém de maneira alguma vos engane; porque não será assim sem que antes venha a apostasia, e se manifeste o homem do pecado, o filho da perdição, 4 O qual se opõe, e se levanta contra tudo o que se chama Deus, ou se adora; de sorte que se assentará, como Deus, no templo de Deus, querendo parecer Deus. 5 Não vos lembrais de que estas coisas vos dizia quando ainda estava convosco? 6 E agora vós sabeis o que o detém, para que a seu próprio tempo seja manifestado. 7 Porque já o mistério da injustiça opera; somente há um que agora o retém até que do meio seja tirado; 8 E então será revelado o iníquo, a quem o Senhor desfará pelo Espírito da sua boca, e aniquilará pelo esplendor da sua vinda; 9 A esse cuja vinda é segundo a eficácia de Satanás, com todo o poder, e sinais e prodígios de mentira,<\/blockquote><h4>CONSIDERANDO APOSTASIA COMO O ARREBATAMENTO, PODEMOS<\/h4><h4>ESTABELECER A SEGUINTE ORDEM DOS EVENTOS:<\/h4><p>VERSO 1: Nossa reunião com Cristo, é o arrebatamento, contudo, aqui Paulo está apenas pedindo para os irmãos rogarem por esse evento, em seguida Paulo estabelece a sequência cronológica para os eventos escatológicos.<\/p><p class='li'>1 - APOSTASIA (RAPTO) v. 3<\/p><p class='li'>2 - O ANTICRISTO É REVELADO v. 3<\/p><p class='li'>3 - O DIA DO SENHOR TEM INÍCIO v. 2<\/p><p class='li'>4 - O TEMPLO É PROFANADO v. 4<\/p><p class='li'>5 - JESUS DESTROI O ANTICRISTO v. 8<\/p><h4>EM SEGUIDA OS VERSOS 6 E 7 EXPLICAM OS VERSOS 2 E 3<\/h4><p class='li'>1 - HÁ UM PODER RESTRINGINDO A MANIFESTAÇÃO DO ANTICRISTO Esse poder é ação do espírito santo por intermédio da igreja que é a luz do mundo, pois único interessado em restringir o homem do pecado é Deus, e apenas ele tem poder para tal, todavia, essa ação é exercida por intermédio da igreja.<\/p><p class='li'>2 - O verso sete está dizendo que quando o poder restritivo e meio pelo qual esse poder atua (igreja) for tirado do meio, o anticristo será revelado. Esse afastamento é a “apostasia” do verso 3, ou seja, quando a igreja foi arrebatada ou tirada do meio, o anticristo será revelado e em seguida iniciará o dia do Senhor (grande tribulação), pois o verso descreve o anticristo se estabelecendo como um Deus no templo em Jerusalém (Mt 24.15; Dn 9.27; Ap 13.1,11-18).<\/p><p class='li'>3 - Os versos oito e nove demonstram como o anticristo se manifestará e como será derrotado quando Jesus voltar no fim da tribulação.<\/p><h4>ARGUMENTOS QUE FAVORECEM A IDEIA DE APOSTASIA COMO O<\/h4><h4>ARREBATAMENTO, E NÃO UM AFASTAMENTO DA FÉ.<\/h4><h4>1 - 1 E 2 TESSALONICENSES FORAM OS PRIMEIROS ESCRITOS DE PAULO, E<\/h4><h4>SOMENTE NO FIM DE SEU MINISTÉRIO CONSIDEROU APOSTASIA COMO<\/h4><h4>AFASTAMENTO DA FÉ, E ESPECIFICOU (1TM 4.1).<\/h4><h4>2 - HARPAZO NÃO É TERMO TÉCNICO PARA O ARREBATAMENTO DA IGREJA,<\/h4><h4>PAULO USOU OUTROS TERMOS, E APOSTASIA FOI UM DELES.<\/h4><blockquote>1Co 1.7 Apokalypsin - 15.23 Parousia - 1Ts 1.10 Rhyomenon; 4.17 Harpazo - 2Ts 2.1 Episynagōgēs; 2.3 Apostasia - Tt 2.13 Epiphaneian<\/blockquote><h4>3 - O ARTIGO DEFINIDO DEFINE A “APOSTASIA” COMO ALGO DISTINTO.<\/h4><p>ἡ ἀποστασία - A APOSTASIA<\/p><h4>4 - O SENTIDO DO SUBSTANTIVO APOSTASIA É APENAS AFASTAMENTO.<\/h4><p>Apostasia é um substantivo deverbal que tem por base o verbo aphístēmi \"sair, partir\". Apostasia é composto pela preposição apó , \"longe de\" e histémi , \"ficar de pé\", propriamente, partida (implicando afastamento); apostasia – literalmente \"uma saída, de alguma posição anterior \".<\/p><h4>HÁ APENAS TRÊS OCORRÊNCIAS NO NT<\/h4><p class='li'>1 - Atos 21:21 σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ - se apartam de Moises<\/p><p class='li'>2 - 2 Tessalonicenses 2:3 ἔλθῃ ἡ ἀποστασία πρῶτον κα - “A APOSTASIA” ὶ<\/p><p class='li'>3 - Mateus 19:7 δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι - Divorcio<\/p><p class='li'>AS SETE TRADUÇÕES BÍBLICAS Há diversas traduções que ao invés de transliterar o termo “ ἀποστασία - apostasia” traduziram por “falling away: afastamento” ou “departure: partida”. Contudo, a primeira tradução veio da pena de São Jerônimo onde “apostasia” foi traduzido para o latim “discessio” cujo significado é partida, distanciamento. Mais tarde tivemos diversas traduções para o inglês, ao invés de transliterações, entretanto, tais tradutores não eram dispensacionalistas. Assim, as primeiras traduções para o inglês que traduziram “apostasia” por “partida” ou “afastamento” são:<\/p><p class='li'>1) Wycliffe Bible (1384)<\/p><p class='li'>2) Tyndale Bible(1526)<\/p><p class='li'>3) Coverdale Bible (1535)<\/p><p class='li'>4) Cranmer Bible (1539)<\/p><p class='li'>5) Breeches Bible (1576)<\/p><p class='li'>6) Beza Bible (1583)<\/p><p class='li'>7) Geneva Bible (1608) O que esses tradutores tinham em mente quando traduziram o termo “apostasia” por partida ou afastamento, afastamento da fé ou a partida da igreja (arrebatamento), é óbvio que é afastamento da fé.<\/p><p>Alguns entendem que a primeira tradução com o sentido de afastamento da fé foi a Rheims Bible (1576), um tradução católica do latim para o inglês, contudo, devemos entender que os tradutores das sete versões acima não eram pré-tribulacionistas e sim pós-tribulacionistas, e óbvio que não tinham em mente o afastamento físico da igreja, mas sim da fé.<\/p><h4>5 - O VERBO “APHISTEMI” E SUAS QUATORZE OCORRÊNCIAS<\/h4><p>Apo e Histemi cujo sentido é remover, ou seja, desistir, desertar, afastar-se, abster-se, retirar- se para longe, ser estabelecido em outro lugar.<\/p><p class='li'>1 - Lucas 2:37 ἣ οὐκ ἀφίστατο τοῦ ἱεροῦ - Ana não se afastava do templo<\/p><p class='li'>2 - Lucas 4:13 ὁ διάβολος ἀπέστη ἀπ' αὐτοῦ - O diabo se afastou de Jesus<\/p><p class='li'>3 - Lucas 8:13 καιρῷ πειρασμοῦ ἀφίστανται - Se afasta da fé<\/p><p class='li'>4 - Lucas 13:27 πόθεν ἐστέ ἀπόστητε ἀπ' ἐμοῦ - Iniquos serão afastados do reino<\/p><p class='li'>5 - Atos 5:37 ἀπογραφῆς καὶ ἀπέστησεν λαὸν ὀπίσω - Judas levou muitos após si<\/p><p class='li'>6 - Atos 5:38 λέγω ὑμῖν ἀπόστητε ἀπὸ τῶν - Deixar os discipulos irem<\/p><p class='li'>7 - Atos 12:10 καὶ εὐθέως ἀπέστη ὁ ἄγγελος - O anjo de apartou de Pedro<\/p><p class='li'>8 - Atos 15:38 ἠξίου τὸν ἀποστάντα ἀπ' αὐτῶν - Marcos se aparta de Paulo e Barnabé<\/p><p class='li'>9 - Atos 19:9 τοῦ πλήθους ἀποστὰς ἀπ' αὐτῶν - Paulo se retira a sinagoga em Corinto<\/p><p class='li'>10 - Atos 22:29 εὐθέως οὖν ἀπέστησαν ἀπ ' αὐτοῦ - Os examinadores se afastam de Paulo<\/p><p class='li'>11 - 2 Coríntios 12:8 παρεκάλεσα ἵνα ἀποστῇ ἀπ' ἐμοῦ Paulo pede a Deus que afaste o mensageiro de satanás<\/p><p class='li'>12- 1 Timóteo 4:1ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς - Alguns se afastarão da fé<\/p><p class='li'>13 - 2 Timothy 2:19 αὐτοῦ καί Ἀποστήτω ἀπὸ ἀδικίας - Quem pofessa Cristo se afasta da iniquidade<\/p><p class='li'>14 - Hebrews 3:12 ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ - Não se apartar do Deus vivo<\/p><p class='li'>6 - A apostasia como afastamento da fé ocorrerá durante a grande tribulação, isto é, após a manifestação do anticristo, pois este liderará tal apostasia.<\/p><p class='li'>7 - O contexto de 2Ts 2 não lida com afastamento da fé, mas com os eventos escatológicos, logo apostasia não pode significar afastamento da fé.<\/p><h4>CONCLUSÃO<\/h4><p>Dentre as quatorze ocorrências do verbo “aphistemi” apenas três trata-se afastamento espiritual (Lc 8.13; 1Tm 4.1; Hb 3.12), as outras doze vezes se referem a algum tipo de afastamento físico. Sendo assim, concluímos que o sentido básico de “aphistemi” é de afastamento físico, pois quando se trata de afastamento da fé o contexto indica claramente, ou há um complemento.<\/p><p class='li'>1 - APOSTASIA (REMOÇÃO DO DETENTOR) - ARREBATAMENTO v. 3; 7<\/p><p class='li'>2 - O HOMEM DO PECADO SERÁ REVELADO COM MILAGRES v. 9<\/p><p class='li'>3 - O DIA DO SENHOR TERÁ INÍCIO (ACORDO DE SETE ANOS) v. 3<\/p><p class='li'>4 - O ANTICRISTO SENTARÁ NO TEMPLO v. 4<\/p><p class='li'>5 - JESUS VEM NO FIM DA TRIBULAÇÃO E DERROTA O ANTICRISTO v. 8<\/p><p class='li'>6 - SEREMOS SALVOS DO DIA DO DIA DO SENHOR v. 13<\/p>"}, {"n": 73, "t": "“PAROUSIA” É TERMO TÉCNICO PARA A SEGUNDA VINDA DE CRISTO A TERRA?", "html": "<p>Uma simples análise das ocorrências do termo demonstra que parousia não é termo técnico para “segunda vinda de Cristo à terra”.<\/p><p>Parousia: visita, chegada, vinda, presença<\/p><blockquote>1Co 15.23 - vinda arrebatamento<\/blockquote><blockquote>2Co 7.6 vinda de Tito<\/blockquote><blockquote>Fp 2.12 vinda - presença física<\/blockquote><blockquote>1Ts 2.19 arrebatamento<\/blockquote><blockquote>1Ts 3.13 arrebatamento<\/blockquote><blockquote>1Ts 4.15 vinda - arrebatamento<\/blockquote><blockquote>2Ts 2.8 vinda - segunda vinda<\/blockquote><blockquote>2Ts 2.9 vinda - anticristo O arrebatamento ou a segunda vinda à terra também são descritos com outros termos, Epifania O significado básico de ἐπιφάνεια “epipháneia” é “aparição”, e enfatiza tanto o impacto que a aparição visível de Cristo ocasionará quando aparecer para sua igreja no arrebatamento, como em sua segunda vinda no fim da tribulação, onde todo o olho o verá (Ap 1,7). O termo ocorre seis vezes no novo testamento, uma vês em relação a primeira vinda (2Tm 1.10), duas vezes em relação a segunda vinda (2Ts 2.8; 2Tm 4.1) e outras três vezes tendo o arrebatamento em vista (1Tm 6.14; 2Tm 4.8; Tt 2.13). Esse é mais um termo cujo significado é determinado pelo contexto, isto é, em qual momento se dá a aparição, primeira vinda, arrebatamento ou segunda vinda, o contexto fala por sí.<\/blockquote><p>Phanerósis Existe ainda uma palavra usada por alguns escritores para designar a volta gloriosa de Cristo, que é Phanerósis, no entanto, esta não é usada nos textos que falam da vinda de Cristo, este termo aparece em (1Co 12:7) “A manifestação (phanerósis) do Espírito é concedida a cada um visando a um fim proveitoso”, não indicando a manifestação de Cristo na sua vinda, mas uma manifestação do Espírito Santo, no sentido simples de demonstração. O verbo que está relacionado ao termo em questão é phaneró (revelar, mostrar, fazer conhecido, como em (Mc 4:22; Jo 7:4; 17:6; 21:14; Rm 1:19; 3:21; 2Co 2:14; Ef 5:13; 1Tm 3:16; Tt 1:3; Hb 9:8; 9:26;<\/p><blockquote>1Jo 1:2 e 2:28). Nunca e em nenhuma de suas formas (phanerós-adjetivo, phanerôs-advérbio ou phaneró-verbo) o termo se refere à manifestação de Cristo.<\/blockquote><p>Apocalipse O significado de ἀποκάλυψις “apokalupsis” é revelação, ou revelar o que está o oculto. Há dezoito ocorrências de apokalupsis em todo o novo testamento, na maioria das vezes não se refere a revelação ou vinda de Jesus, seja para arrebatar a igreja ou para estabelecer o reino, mas sim a revelação de algum conhecimento (2Co 12.7). Em 1 Coríntios 1.7 e 1Pe 1.7 “apokalupsis” é usado para apontar para revelação de Jesus para sua igreja, esse é o arrebatamento, já em 2Ts 2.8 “apokalupsis” é uma referência a revelação do anticristo, quando o Senhor vai derrotá-lo, por outro lado em 1Pe 1.13 “apokalupsis” aponta para o primeiro advento de Cristo. Há outros termos que se referem ao arrebatamento ou a segunda vinda, mas de igual forma, não são termos técnicos, sempre é o contexto quem vai determinar se é a primeira vinda, a vinda nos ares para arrebatar a igreja ou a segunda vinda a essa terra a fim de estabelecer o reino milenar.<\/p>"}, {"n": 74, "t": "O DIA DO SENHOR EM 2 PE 3", "html": "<blockquote>2 Pedro 3:3 Sabendo primeiro isto, que nos últimos dias virão escarnecedores, andando segundo as suas próprias concupiscências, 4 E dizendo: Onde está a promessa da sua vinda? Porque desde que os pais dormiram, todas as coisas permanecem como desde o princípio da criação. 5 Eles voluntariamente ignoram isto, que pela palavra de Deus já desde a antiguidade existiram os céus, e a terra, que foi tirada da água e no meio da água subsiste. 6 Pelas quais coisas pereceu o mundo de então, coberto com as águas do dilúvio, 7 Mas os céus e a terra que agora existem pela mesma palavra se reservam como tesouro, e se guardam para o fogo, até o dia do juízo, e da perdição dos homens ímpios. 8 Mas, amados, não ignoreis uma coisa, que um dia para o Senhor é como mil anos, e mil anos como um dia. 9 O Senhor não retarda a sua promessa, ainda que alguns a têm por tardia; mas é longânimo para conosco, não querendo que alguns se percam, senão que todos venham a arrepender-se. 10 Mas o dia do Senhor virá como o ladrão de noite; no qual os céus passarão com grande estrondo, e os elementos, ardendo, se desfarão, e a terra, e as obras que nela há, se queimarão. 11 Havendo, pois, de perecer todas estas coisas, que pessoas vos convém ser em santo trato, e piedade, 12 Aguardando, e apressando-vos para a vinda do dia de Deus, em que os céus, em fogo se desfarão, e os elementos, ardendo, se fundirão? 13 Mas nós, segundo a sua promessa, aguardamos novos céus e nova terra, em que habita a justiça.<\/blockquote><blockquote>2 Pedro 3:11 Ora, se tudo o que existe será assim aniquilado, que espécie de pessoas é necessário que sejais? Pessoas que vivem em santidade e piedade,<\/blockquote><h4>O DIA DO SENHOR E DIA DE DEUS - FIM DO MILÊNIO<\/h4><blockquote>Apocalipse 20:7 E, acabando-se os mil anos, Satanás será solto da sua prisão, 8 E sairá a enganar as nações que estão sobre os quatro cantos da terra, Gogue e Magogue, cujo número é como a areia do mar, para as ajuntar em batalha. 9 E subiram sobre a largura da terra, e cercaram o arraial dos santos e a cidade amada; e de Deus desceu fogo, do céu, e os devorou.<\/blockquote><h4>HÁ INTERVALOS<\/h4><blockquote>Daniel 12:2 E muitos dos que dormem no pó da terra ressuscitarão, uns para vida eterna, e outros para vergonha e desprezo eterno.<\/blockquote><blockquote>Apocalipse 20:4 E vi tronos; e assentaram-se sobre eles, e foi-lhes dado o poder de julgar; e vi as almas daqueles que foram degolados pelo testemunho de Jesus, e pela palavra de Deus, e que não adoraram a besta, nem a sua imagem, e não receberam o sinal em suas testas nem em suas mãos; e viveram, e reinaram com Cristo durante mil anos. 5 Mas os outros mortos não reviveram, até que os mil anos se acabaram. Esta é a primeira ressurreição. 6 Bem-aventurado e santo aquele que tem parte na primeira ressurreição; sobre estes não tem poder a segunda morte; mas serão sacerdotes de Deus e de Cristo, e reinarão com ele mil anos.<\/blockquote><blockquote>2 Pedro 3:15 E tende por salvação a longanimidade de nosso Senhor; como também o nosso amado irmão Paulo vos escreveu, segundo a sabedoria que lhe foi dada; 16 Falando disto, como em todas as suas epístolas, entre as quais há pontos difíceis de entender, que os indoutos e inconstantes torcem, e igualmente as outras Escrituras, para sua própria perdição.<\/blockquote>"}, {"n": 75, "t": "O DIA DO SENHOR E SEUS VÁRIOS SIGNIFICADOS", "html": "<p>O dia do Senhor, diferente do que muitos pensam, tem uma ampla variação de significados de acordo com o contexto. Contudo, sempre se refere às intervenções do Senhor na história a fim de cumprir seus propósitos soberanos.<\/p><h4>1 - O DIA DO SENHOR - DOMINGO DE RESSURREIÇÃO - AP 1.10<\/h4><h4>2 - O DIA DE CRISTO - ARREBATAMENTO - 1CO 1.7<\/h4><h4>3 - O DIA DO SENHOR - GRANDE TRIBULAÇÃO - JL 2.1,2 - MT 24.21 - DN 12.1<\/h4><h4>4 - O TERRÍVEL DIA DO SENHOR - SEGUNDA VINDA - JL 2.31 - MT 24.29-31<\/h4><h4>5 - O DIA DO SENHOR - MILÊNIO - JL 3.18-21; ZC 14.6-11<\/h4><h4>6 - O DIA DO SENHOR - DESTRUIÇÃO DA TERRA - 2PE 3.10,12<\/h4><p>Expressões como “o dia” ou “aquele dia” são abreviações de “o dia do Senhor”, sendo assim, temos muitas passagens que também se referem a algum aspecto do dia do Senhor com essas expressões menores.<\/p>"}]}, {"n": 11, "t": "O APOCALIPSE - SELOS", "aulas": [{"n": 76, "t": "APOCALIPSE - INTRODUÇÃO", "html": "<p class='li'>1. O Titulo Apocalipse Ἀποκάλυψις(Apocalupsis), em latim é revelação. O termo Apocalipse pode siginificar: divulgação, aparecer, vir, iluminar, manifestação, o que é revelado, revelação. É o descortinar de acontecimentos futuros até então ocultos como mistérios divinos, que são apresentados a João por meio de visões.<\/p><p class='li'>2. Data Há três posições quanto a data de escrita do Apocalipse<\/p><p class='li'>A- Data tardia A.D 68-70. Os teólogos da escola preterista defendem essa data mais tardia, pois acreditam que há elementos internos e externos ao texto que fundamentam essa ideia, Primeiro, detalhes como o templo em Apocalipse 11 é um ponto em que se apegam, considerando que o templo em Jerusalém foi destruído no ano 70, alegam que o texto foi escrito antes de sua destruição.<\/p><p>Segundo, entendem que expressões como “cedo venho” devem ser entendidas como a brevidade do retorno de Cristo e já se cumpriu no ano 70.<\/p><p>Terceiro, como um argumento externo se apegam em alguns textos esporádicos de alguns Pais. Entretanto testemunho majoritário dos Pais não confirmam uma da anterior ao ano 70 para o texto de João.<\/p><p class='li'>B - A Data posterior A.D 100-300. Essa data é defendida pela maioria dos teólogos liberais. Alegam uma suposta falta de unidade no livro, assim afirmam que o texto possui diversos autores e recortes desconexos.<\/p><p class='li'>C - A data tradicional A.D 95-96. A maioria dos estudiosos conservadores defendem essa data por vários motivos.<\/p><p>Primeiro, evidências externas. Irineu, o qual teve contato direto com Policarpo, discípulo de João, confirma a data sugerida entre 95-96.<\/p><p>Segundo, João foi confinado à ilha de Patmos, prisioneiros só começam ser levados a ilha no período que Roma foi governada pelo Imperador Domiciano, isto entre os anos A.D. 81-96. Terceiro, evidências internas. João descreve perseguições locais quando escreve a mensagem de Cristo às igrejas da Ásia, e não globais, algo próprio do período em que Domiciano foi imperador.<\/p><p class='li'>3. Gênero Por que o gênero é importante? O gênero serve de guia para a metodologia hermenêutica adequada empregada na interpretação do texto.<\/p><p>Apocalíptico, suas características:<\/p><p>Primeiro, em tais livros o autor não se identifica e se utiliza de pseudônimos, isto é, faz uso de um outro autor conhecido. Ao não se identificar tais escritores evitam serem perseguidos pelos governantes devido às duras críticas ao sistema vigente, e ao utilizarem o nome de algum personagem bíblico ganham aceitação dentre o Judaísmo e Cristianismo, principalmente de seus dias.<\/p><p>Segundo, a perspectiva em relação ao presente é sempre pessimista, a história narrada por tais autores é determinista e sem intervenções Divinas, a influência helenista e estoica é evidentes em tais escritos.<\/p><p>Terceiro, a linguagem altamente simbólica e fantasiosa é característico de tais escritos, suas narrativas são frutos dos sofrimentos em que estavam inseridos e de suas imaginações. Seguindo tais padrões, descreveram como a história prosseguiria até o fim.<\/p><p>Epistolar O gênero epistolar é bem fácil de se identificar devido às muitas epístolas que tempos do N.T. Sua característica básica consiste em uma saudação no início e no fim do texto, onde o autor se apresenta e se dirige ao seu público.<\/p><p>Profético O profeta é o porta voz de Deus para revelar os aspectos ocultos quanto ao passado e o presente, mas principalmente o futuro que Deus tem estabelecido, seja para seu povo ou os ímpios. Diferente do escritor apocalíptico que faz uma crítica do seu período usando palavras e simbolismo ao seu bel prazer, o profeta escreve a revelação que Deus lhe deu, e ainda que escreva com seu estilo linguístico e vocabulário próprios, o faz sob a inspiração do Espírito santo, o que não ocorre com o escritor apocalíptico.<\/p><p>Há elementos internos ao texto de Apocalipse que claramente indicam ser esse livro pertencente ao gênero profético igual a Daniel, Ezequiel e Isaías. O próprio João define o seu texto como sendo uma profecia, em suas palavras iniciais e finais: Apocalipse 1.3 “Bem- aventurado aquele que lê, e os que ouvem as palavras desta profecia, e guardam as coisas que nela estão escritas; porque o tempo está próximo.” Apocalipse 22.7 “Eis que cedo venho: Bem-aventurado aquele que guarda as palavras da profecia deste livro.” O capítulo 22 vai então afirmar mais três vezes que o livro é uma profecia, Ap 22.10,18,10.<\/p><p>Eclético Alguns estudiosos afirmam ser essa uma literatura de gênero eclético, pois contém elementos característicos dos três gêneros já mencionados. É possível, pois realmente há característica de tais gêneros no texto de Apocalipse, entretanto o que predomina é a profecia, independente da linguagem ser por vezes literal ou simbólica.<\/p><p class='li'>4. Perspectiva Hermenêutica<\/p><p class='li'>a. Preterista. Essa perspectiva hermenêutica defendida por alguns teólogos reformados, afirma que os eventos descritos em Apocalipse já ocorreram, João escreve o Apocalipse antes da queda do templo no ano 70, assim, não há praticamente nada para se cumprir no futuro. O capitulo 6 apresenta o cavalo branco, que é próprio Cristo que já veio em Juízo na destruição do templo, as bestas do capítulo 13 é uma referência a Nero. O preterismo nega quase todo aspecto futuro do livro de Apocalipse, esse é o motivo que leva boa parte dos teólogos liberais abraçarem essa posição. O grande idealizador dessa perspectiva, Daniel Whitby foi um unitarista com tendências liberais que, a fim de sustentar a utopia do pós-milenismo teve que situar o fim caótico revelado em Apocalipse colocando-o como anterior ao ano 70 do primeiro século. Assim, o preterista é pós-milenista e pós-tribulacionista, entretanto, a grande tribulação não será futura, pois já ocorreu no ano 70.<\/p><p class='li'>b. Historicista. Perspectiva hermenêutica que interpreta o Apocalipse a luz do acontecimentos históricos. O historicista olha para os acontecimentos mundiais e tenta encontrar respaldo bíblico para tais eventos. Joaquim de Fiori no século XII foi o grande idealizador dessa metodologia. Fiori afirmou que os 1260 dias de Apocalipse se referiam aos 1260 anos contando do período apostólico, assim, acreditava que estava vivendo a grande tribulação.<\/p><p>Os reformadores Lutero e Calvino adotaram essa perspectiva, esse é o motivo pelo qual viam no catolicismo a babilônia, e no papado a pessoa do anticristo. De um modo geral, acreditavam que já estavam vivento a grande tribulação e assim defendiam também a doutrina da iminência. O historicista está sempre associando os eventos atuais com algum selo, trombeta e taça, ou, algum líder político ao anticristo. Diferente dos historicistas do passado, atualmente, embora defendam que o Apocalipse vem se cumprindo, creem que ainda haverá um futuro período tribulacional ante a manifestação do Anticristo, sendo então pós-tribulacionistas e amilenistas.<\/p><p class='li'>c. Idealista. O idealismo é a perspectiva hermenêutica que interpreta os símbolos e eventos descritos em Apocalipse sem relação com acontecimentos históricos ou futuros, mas com verdade espirituais atemporais.<\/p><p>O idealista vê em Apocalipse a narrativa da batalha entre Deus e o mal, a igreja e o sistema mundano durante todos os períodos da igreja. Os juízos, taças, trombetas e selos apontam para as ações de Deus contra os ímpios durante toda a era da igreja. Todo líder anticristão é o anticristo do seu tempo, e toda falsa religião é a Babilônia. Essa perspectiva tem suas fileiras nomes como Willian Hendriksen, Antony Hoekema dentre outros teólogos reformados, os quais são amilenistas e creem em algum aspecto futuro de tribulação e manifestação de um anticristo específico o qual perseguirá a igreja, sendo então pós-tribulacionistas.<\/p><p class='li'>d. Futurista. Como o nome já diz, os que adotam essa perspectiva hermenêutica, creem que os eventos registrados do capítulo 4 ao 22 são ainda futuros, onde então haverá o cumprimento literal dos mesmos. Todo pré-milenista é adepto dessa perspectiva, porém, há duas escolas pré-milenistas, os históricos e os dispensacionalistas.<\/p><p>O pré-milenismo histórico Os primeiros intérpretes de Apocalipse, Inácio, Justino, dentre outros, entendiam o livro razoavelmente literal compreendendo um milênio literal e futuro. Porém, já havia a tendência de espiritualizar algumas porções do apocalipse dentre esses primeiros pré-milenistas. Embora adotassem uma perspectiva futurista na leitura do livro, acreditavam que de alguma forma já estavam vivendo a grande tribulação. Os pré-milenistas históricos de hoje, como George Ladd ou Robert Gundry, não creem que a igreja já esteja passando por uma grande tribulação, pois são plenamente futuristas em relação à tribulação.<\/p><p>Pré-milenismo dispensacionalista.<\/p><p>Adotando uma leitura mais literal do texto de apocalipse, essa escola lê o texto com mais literalidade, a despeito do grande número de símbolos e linguagem figurada que o livro apresenta. Entendem que a igreja não tem relações com a grande tribulação, pois o texto de Apocalipse quando descreve a tribulação, não liga a igreja a esse período, mas sim Israel e as nações. Dentre os dispensacionalistas podemos destacar nomes de Lewis Sperry Chafer, John Walvoord, Charles Ryrie, Renald Showers dentre outros. Quanto a futura grande tribulação, pré-milenista histórico é pós-tribulacionista, ao passo que pré-milenista dispensacionalista é pré-tribulacionista.<\/p><p class='li'>5. Estrutura do Livro Uma organização temática favorece a antiga teoria da recapitulação já desenvolvida por Agostinho, que posteriormente foi melhor elaborada por Hoekema e Hendriksen. Com esses últimos dois autores a teoria temática ou recapitulação ganha mais detalhes, sendo então denominada de “paralelismo progressivo”.<\/p><p>Teoria da Recapitulação (Paralelismo Progressivo).<\/p><p>Desenvolvida por Agostinho a fim de validar o amilenismo, essa teoria afirma que selos trombetas e taças descrevem os mesmo juízos sob prismas distintos, é como se a mesma história fosse contada por diversas vezes, como ocorre nos evangelhos sinópticos. Entretanto, eis um grande problema, o primeiro selo, primeira trombeta e primeira taça não descrevem o mesmo juízo, esses juízos não se complementam, ao invés disso eles são opostos nos detalhes, sua harmonização é contraditória. Assim ocorre também com a terceira, sexta e sétima sequência de Juízos, isso por si só impossibilita qualquer tentativa de harmonizar tais juízos como se fossem um e ocorrendo no mesmo instante. A teoria da recapitulação tem um objetivo, validar o amilenismo, foi com esse intuito que Agostinho elaborou tal pensamento. Ao aplicar essa teoria ao capítulo vinte, conseguem sustentar as fantasiosas ideias de que o milênio já está ocorrendo, o diabo está preso e a ressurreição de apocalipse 20.4 já ocorreu, isto é, essa é uma tática para quebrar a sequência dos eventos conforme Apocalipse 19.11 ao 20.11 descrevem, o objetivo último é negar o estabelecimento do milênio após a segunda vinda.<\/p><p>Recentemente, esse aspecto mais bem elaborado da teoria da recapitulação tende a organizar selos, trombetas e taças como sendo os mesmos eventos vistos sob prismas distintos ou com uma progressão de ideias. Sob essa perspectiva o primeiro selo, primeira trombeta e primeira taça falam de um único juízo, o mesmo ocorre com os demais juízos, sendo então o sétimo selo, trombeta e taça um e o mesmo evento descrito com detalhes que se complementam. Cronologia Progressiva A alternativa mais plausível é entendermos o texto conforme foi agrupado, pois há uma cronologia que flui naturalmente à medida que os selos são abertos. O sétimo selo apresenta uma série denominada de sete trombetas, e a sétima trombeta dá início aos últimos sete juízos que são as taças da ira de Deus. Assim, o sétimo selo contém as sete trombetas e sete taças, isto é, as trombetas e taças são uma extensão do sétimo selo. Embora os selos, trombetas e taças seguem uma sequência cronológica exata, os eventos apresentados em cada selo, trombeta e taça nem sempre estão agrupados em uma ordem cronológica. O sexto selo e a sétima trombeta apresentam o desfecho final da grande tribulação, contudo, a sétima trombeta não será tocada no fim da tribulação, e muito menos o sexto selo será aberto no fim, mas apresentam prenúncios do fim antes que este ocorra. Há também interlúdios entre o anúncio dos juízos, é como parênteses onde João apresenta detalhes que ocorrerão durante ou após a tribulação sem que estes estejam necessariamente em ordem cronológica, um exemplo é o os eventos apresentados no capítulo 14, onde há o relato dos 144 mil selados no monte sião com Cristo, um fato que não ocorre durante a tribulação, mas após a segunda vinda. Como ocorre em qualquer livro bíblico, independente do gênero, o escritor do livro profético de Apocalipse também se utiliza do recurso linguístico da recapitulação em alguns momentos, entretanto, a ordem geral dos eventos seguem uma cronologia progressiva ao invés de recapitulações.<\/p><p>A organização cronológica é amplamente defendida por dispensacionalistas.<\/p><p>O que encontramos no texto de Apocalipse é uma progressão cronológica dos eventos. Não há como negar o elemento cronológico na sequência dos sete selos e trombetas, mas é reconhecido que há prenúncios, isto é, cronologicamente o sexto selo está após o quinto e o sétimo, entretanto, faz o anúncio dos eventos finais da tribulação, ainda que tenha sido aberto nos primeiros três anos e meio. Há elementos internos ao texto os quais indicam que a sétima trombeta é tocada na metade da tribulação dando inicio a série de juízos denominada de taças da ira de Deus, contudo, anuncia também eventos que ocorrerão apenas no fim da tribulação. É evidente também que em alguns pontos o texto faz leves recapitulações, o que não deve causar estranheza, pois isso é próprio de qualquer livro.<\/p><p>É de conhecimento geral que os Judeus não pensavam cronologicamente, mas sim de forma temática, ao passo que o pensamento cronológico é próprio dos gregos. João, o santo Apóstolo traz em sua bagagem um pouco da mentalidade judaica e grega, pois vive em um contexto helenizado. Assim, é bem possível que na organização do livro, João trabalha com temas organizando-os de forma cronológica, pois não estava escrevendo os hebreus, mas para Igrejas que em sua maioria era composta por não judeus, e os Israelitas pertencentes a essa igrejas possuem a mentalidade helênica devido ao tempo e contexto em que vivem.<\/p><p>Os capítulos 6 ao 18 descrevem os eventos que ocorrerão durante a septuagésima semana de Daniel, isto é, os sete anos da grande tribulação. As setentas semanas em si já pressupõe o elemento cronológico, pois há uma contagem de anos que segue naturalmente uma cronologia, tanto a profecia como o cumprimento dos eventos relacionados as sessenta e nove semanas seguiram uma cronologia, o que leva a concluirmos que o registro e cumprimento dos acontecimentos relativos a septuagésima semana seguirá o mesmo padrão.<\/p>"}, {"n": 77, "t": "APOCALIPSE - ESTAMOS NO FIM DOS TEMPOS?", "html": "<h4>ESTAMOS NO TEMPO DO FIM?<\/h4><p>Abaixo apresento algumas razões para crermos que estamos na reta final, isto é, embora o arrebatamento seja iminente, sabemos que já não resta tanto tempo!<\/p><h4>O RETORNO DE ISRAEL A SUA TERRA<\/h4><blockquote>Deuteronômio 30:3 Então o SENHOR teu Deus te fará voltar do teu cativeiro, e se compadecerá de ti, e tornará a ajuntar-te dentre todas as nações entre as quais te espalhou o SENHOR teu Deus. 4 Ainda que os teus desterrados estejam na extremidade do céu, desde ali te ajuntará o SENHOR teu Deus, e te tomará dali; 5 E o SENHOR teu Deus te trará à terra que teus pais possuíram, e a possuirás; e te fará bem, e te multiplicará mais do que a teus pais. 6 E o SENHOR teu Deus circuncidará o teu coração, e o coração de tua descendência, para amares ao SENHOR teu Deus com todo o coração, e com toda a tua alma, para que vivas.<\/blockquote><blockquote>Oséias 3:4 Porque os filhos de Israel ficarão por muitos dias sem rei, e sem príncipe, e sem sacrifício, e sem estátua, e sem éfode ou terafim. 5 Depois tornarão os filhos de Israel, e buscarão ao SENHOR seu Deus, e a Davi, seu rei; e temerão ao SENHOR, e à sua bondade, no fim dos dias.<\/blockquote><h4>A IGREJA DE LAODICÉIA<\/h4><p>Uma igreja cuja máxima é a prosperidade<\/p><h4>O SÉTIMO MILÊNIO<\/h4><blockquote>Gênesis 2:2 E havendo Deus acabado no dia sétimo a obra que fizera, descansou no sétimo dia de toda a sua obra, que tinha feito. 3 E abençoou Deus o dia sétimo, e o santificou; porque nele descansou de toda a sua obra que Deus criara e fizera.<\/blockquote><blockquote>Êxodo 20:8 Lembra-te do dia do sábado, para o santificar.<\/blockquote><blockquote>Levítico 25:3 Seis anos semearás a tua terra, e seis anos podarás a tua vinha, e colherás os seus frutos; 4 Porém ao sétimo ano haverá sábado de descanso para a terra, um sábado ao SENHOR; não semearás o teu campo nem podarás a tua vinha.<\/blockquote><h4>A TECNOLOGIA<\/h4><blockquote>Apocalipse 1:7 Eis que vem com as nuvens, e todo o olho o verá, até os mesmos que o traspassaram; e todas as tribos da terra se lamentarão sobre ele. Sim. Amém.<\/blockquote><blockquote>Apocalipse 13:14 E engana os que habitam na terra com sinais que lhe foi permitido que fizesse em presença da besta, dizendo aos que habitam na terra que fizessem uma imagem à besta que tinha a ferida da espada e vivia. 15 E foi-lhe concedido que desse espírito à imagem da besta, para que também a imagem da besta falasse, e fizesse que fossem mortos todos os que não adorassem a imagem da besta.<\/blockquote><h4>O CONTROLE DO GOVERNO<\/h4><blockquote>Apocalipse 13.16 E faz que a todos, pequenos e grandes, ricos e pobres, livres e servos, lhes seja posto um sinal na sua mão direita, ou nas suas testas, 17 Para que ninguém possa comprar ou vender, senão aquele que tiver o sinal, ou o nome da besta, ou o número do seu nome. 18 Aqui há sabedoria. Aquele que tem entendimento, calcule o número da besta; porque é o número de um homem, e o seu número é seiscentos e sessenta e seis.<\/blockquote>"}, {"n": 78, "t": "APOCALIPSE - TE GUARDAREI DA HORA DA TENTAÇÃO", "html": "<p class='li'>a - Apocalipse 3.10 Tereso ek tes horas tou peirasmou guardar fora da hora da tentação Para guardar dentro, em meio, durante ou através, a preposição usada deveria ser um Epi, En ou Eis. Contudo, João usou Ek<\/p><blockquote>EK em João 17.15, guardar fora do maligno. EK em 2Pe 2.7,9. Livrou o justo Jó - Livrar “fora” DA TENTAÇÃO.<\/blockquote><blockquote>2 Pedro 2:7 E livrou o justo Ló, enfadado da vida dissoluta dos homens abomináveis.<\/blockquote><blockquote>2 Pedro 2:9 Assim, sabe o Senhor livrar da tentação (EK PEIRASMOU) os piedosos, e reservar os injustos para o dia do juízo, para serem castigados;<\/blockquote><blockquote>EK em Provérbios 23.14 e Tiago 5.20 - com o sentido de APO.<\/blockquote><blockquote>Provérbios 23:14 Tu a fustigarás com a vara, e livrarás a sua alma do inferno.<\/blockquote><blockquote>Tiago 5:20 Saiba que aquele que converter um pecador do erro do seu caminho, salvará da morte uma alma, e cobrirá uma multidão de pecados.<\/blockquote>"}, {"n": 79, "t": "APOCALIPSE - JOÃO É ARREBATADO AO CÉU", "html": "<h4>APOCALIPSE 4 - JOÃO É ARREBATADO<\/h4><blockquote>Apocalipse 4:1 DEPOIS destas coisas, olhei, e eis que estava uma porta aberta no céu; e a primeira voz que, como de trombeta, ouvira falar comigo, disse: Sobe aqui, e mostrar-te-ei as coisas que depois destas devem acontecer. 2 E logo fui arrebatado no Espírito, e eis que um trono estava posto no céu, e um assentado sobre o trono. 3 E o que estava assentado era, na aparência, semelhante à pedra jaspe e sardônica; e o arco celeste estava ao redor do trono, e parecia semelhante à esmeralda.<\/blockquote><p>DEPOIS DESTAS COISAS. O esboço do livro foi apresentado em 1.19 “Escreve as coisas que tens visto, e as que são, e as que depois destas hão de acontecer”.<\/p><p class='li'>1 - As que tem visto (a visão do Cristo em glória) Capítulo 1<\/p><p class='li'>2 - As que são (as sete igrejas) Capítulos 2 - 3<\/p><p class='li'>3 - As que depois destas hão de acontecer - Capítulos 4 - 22 O dia do Senhor, o tempo da ira ou septuagésima semana de Daniel, este é o período de sete anos também denominado por Jesus de a grande tribulação (Mt 24.21) que é retratada do capítulo 6 ao 18. O segundo advento de Cristo, Milênio, Julgamento final e novo céu e nova terra são narrados do capítulo 19 ao 22. Assim, podemos concluir seguramente que a grande tribulação (6-18) está incluída entre os eventos que ocorrem “DEPOIS DESTAS COISAS”, isto é, após a era da igreja, e não antes!<\/p><h4>JOÃO SOBE AO CÉU<\/h4><p>4.1.a Depois destas coisas. Após as mensagens enviadas às sete igrejas, isso indica que a as sete igrejas representam também toda uma era da igreja na face da terra e João só foi levado ao céu após a era da igreja se encerrar.<\/p><p>4.1.b Eis que estava uma porta aberta no céu. Não foi João quem abriu a porta no céu, esta porta quem abre é o próprio Deus por meio de sua palavra.<\/p><p>4.1c E a primeira voz que, como de trombeta, ouvira falar comigo, disse: Sobe aqui, e mostrar- te-ei as coisas que depois destas devem acontecer. Essa voz é a mesma de 1.10. João foi exilado na ilha para ali ter o fim de seus dias, mas é levado aos céus para receber a revelação sobre os eventos futuros!<\/p><p>4.2 E logo fui arrebatado no Espírito, e eis que um trono estava posto no céu, e um assentado sobre o trono. O arrebatamento de João não foi corpóreo, e sim em espirito. O que você gostaria de ver no céu por primeiro? João chega no céu, a primeira coisa que ele avista é um trono, e um assentado sobre o trono, esse é Deus o Pai. Deus vai se revelar por meio de símbolos que descrevem seus atributos. Com o trono Deus está comunicando para João que ele é o Soberano do universo. Em tempos onde os césares governavam o império Romano, Deus se revela como o governante supremo. Em um período de perseguição e opressão contra a igreja, essa revelação teve grande impacto sobre a vida dos Cristãos, a palavra final não vem do imperador, e sim do Soberano do universo, é Ele controla a história.<\/p><p>4.3.a E o que estava assentado era, na aparência, semelhante à pedra jaspe e sardônica. A aparência de Deus é revelada, ele se assemelha a uma pedra de Jaspe. A pedra de jaspe é semelhante ao cristal ( 21.11), trata-se de algo cristalino e puro. É evidente que Deus está se revelando por meio de um outro atributo, que é sua santidade. A base de todos os demais atributos divinos é a santidade, há todo um livro nas escrituras que apresenta a santidade de Deus e como o homem deve se aproximar do Santo, esse livro é Levíticos. Isaias viu serafins adorando o Senhor, eles cantavam “Santo, Santo, Santo é o Senhor dos exércitos”, esse cântico exalta Deus por meio de seu atributo santidade, como em (4.8). A pedra sardônica é avermelhada. Essa pedra revela o atributo amor, e a obra da redenção. Deus é redentor, o amor é o atributo que comoveu nosso Deus a enviar seu Filho para efetuar a obra da redenção. 4.3.b E o arco celeste estava ao redor do trono, e parecia semelhante à esmeralda. Esse arco aponta para pelo menos três aspectos de nosso Deus.<\/p><p>Primeiro, Deus é eterno. O arco é um circulo que não tem inicio nem fim, àquele que está assentado sobreo trono não tem inicio nem fim, Ele é o eterno.<\/p><p>Segundo, Deus é Fiel, após o Diluvio um arco foi apresentado no céus como sinal da fidelidade de Deus em sua palavra de que a terra jamais seria destruída por água.<\/p><p>Terceiro, Deus é Deus de aliança. Deus fez uma aliança com Noé quando este sai da arca para novos recomeços. Esse arco demonstra que o Senhor do universo está preso em uma aliança eterna com seu povo, essa aliança foi firmada na Cruz, e temos a fidelidade de Deus e sua palavra quanto aos efeitos e garantia das bençãos decorrentes dessa aliança! Esmeralda é verde, que representa a vida e esperança, a aliança que Deus propõe é de vida e esperança.<\/p>"}, {"n": 80, "t": "APOCALIPSE - OS VINTE E QUATRO ANCIÃOS", "html": "<blockquote>Apocalipse 4:1 DEPOIS destas coisas, olhei, e eis que estava uma porta aberta no céu; e a primeira voz que, como de trombeta, ouvira falar comigo, disse: Sobe aqui, e mostrar-te-ei as coisas que depois destas devem acontecer. 2 E logo fui arrebatado no Espírito, e eis que um trono estava posto no céu, e um assentado sobre o trono. 3 E o que estava assentado era, na aparência, semelhante à pedra jaspe e sardônica; e o arco celeste estava ao redor do trono, e parecia semelhante à esmeralda.<\/blockquote><blockquote>Apocalipse 4:4 E ao redor do trono havia vinte e quatro tronos; e vi assentados sobre os tronos vinte e quatro anciãos vestidos de vestes brancas; e tinham sobre suas cabeças coroas de ouro. É ampla a discussão sobre a identidade dos vinte e quatro anciãos, sendo assim vamos apresentar algumas posições quanto ao assunto.<\/blockquote><p>Primeiro, há quem afirme serem anjos. Essa linha de interpretação alega que esses anciãos é uma classe angelical especifica que fazem parte do conselho divino, o fato de serem anciãos aponta para sua antiguidade e sabedoria. Não há qualquer fundamento bíblico para substanciar essa posição, a não ser a especulação.<\/p><p>Segundo, são os santos do antigo e novo testamento. Essa posição afirma que o número vinte e quatro representa o Israel representado pelas doze tribos e a igreja representada pelos doze apóstolos. Essa interpretação é melhor que a anterior, entretanto, se esbarra em um grande problema teológico, isto é, igreja e Israel são um mesmo povo.<\/p><p>Terceiro, é a igreja. Essa é a posição mais coerente, pois os detalhes apresentados no texto aponta para essa direção.<\/p><p class='li'>A – Estão ao redor do trono em seus tronos. A proximidade do trono de Deus indica ser a igreja, pois Cristo prometeu que onde ele estivesse, iríamos estar juntos.<\/p><p class='li'>B – Estão assentados sobre seus tronos, esse fato demonstra que são reis, a igreja foi prometido reinar com Cristo.<\/p><p class='li'>C – Vestes brancas, as vestes brancas são a justiça dos santos, isso indica que foram justificados pela fé em Cristo.<\/p><p class='li'>D – Coroas de ouro. No grego “στεφάνους” – “stefanous”, essa era a coroa de louros cujo competidor recebia por sua vitória em jogos olímpicos. Isso indica que esses anciãos venceram uma competição e receberam seu prêmio, isto é, seus galardões, e agora são reis.<\/p><p>Em 2 Crônicas somos informados sobre os vinte e quatro turnos do ofício sacerdotal estabelecido por Davi, assim, os vinte e quatro anciãos apontam para sacerdócio pleno e perfeito que será exercido pela igreja após o arrebatamento.<\/p><blockquote>Apocalipse 5:8 E, havendo tomado o livro, os quatro animais e os vinte e quatro anciãos prostraram-se diante do Cordeiro, tendo todos eles harpas e salvas de ouro cheias de incenso, que são as orações dos santos. 9 E cantavam um novo cântico, dizendo: Digno és de tomar o livro, e de abrir os seus selos; porque foste morto, e com o teu sangue nos compraste para Deus de toda a tribo, e língua, e povo, e nação; 10 E para o nosso Deus nos fizeste reis e sacerdotes; e reinaremos sobre a terra. 11 E olhei, e ouvi a voz de muitos anjos ao redor do trono, e dos animais, e dos anciãos; e era o número deles milhões de milhões, e milhares de milhares,<\/blockquote><h4>OS 24 ANCIÃOS ESTÃO NO CÉU ANTES DA ABERTURA DOS SELOS<\/h4><h4>TEXTUS RECEPTUS X MAJORITÁRIO<\/h4><p>Scrivener's Textus Receptus 1894 καὶ ἐποίησας ἡμᾶς τῷ Θεῷ ἡμῶν βασιλεῖς καὶ ἱερεῖς, καὶ βασιλεύσομεν ἐπὶ τῆς γῆς.<\/p><p>RP Byzantine Majority Text 2005 καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν βασιλεῖς καὶ ἱερεῖς, καὶ βασιλεύσουσιν ἐπὶ τῆς γῆς.<\/p>"}, {"n": 81, "t": "APOCALIPSE - O TRIBUNAL DE CRISTO", "html": "<h4>O TRIBUNAL DE CRISTO<\/h4><p>Logo após a retirada da igreja iniciará a grande tribulação de 7 anos, todavia, os salvos serão levados ao céu onde seremos julgados por nossas obras não para condenação mas para que possamos receber nossas recompensas pelo serviço prestado a Deus.<\/p><p>Todos os salvos hão de comparecer perante o tribunal de Cristo (2Co 5.10). Ali seremos julgados pelo tipo de material que usamos para edificação do templo de Deus que é a Igreja. Em 1 Coríntios 3 Paulo usa duas metáforas para descrever a igreja em seu processo de edificação, “vós sois lavoura de Deus e edifício de Deus”. Como lavoura a igreja é edificada por meio do plantio e da irrigação, “eu plantei, Apolo regou”, Paulo colaborou para a edificação da igreja plantando, isso fala da pregação evangelística, logo, exerceu a função de um evangelista, Apolo regou, pois foi um mestre. O que fica evidente é que o trabalho de ambos, embora distintos, tinha um mesmo objetivo, a edificação da igreja, e isso se deu por meio da palavra de Deus, pois esse é o único meio eficaz para edificação da igreja como corpo de Cristo. Quando Paulo vai fazer menção aos galardões que nós como educadores e trabalhadores receberemos no tribunal de Cristo, Paulo usa a metáfora do templo e os materiais usados em sua edificação, seja ouro, prata, pedras preciosas, ou madeira, palha e feno. Com qualquer um dos tipos de materiais é possível edificar um templo, contudo, apenas o primeiro tipo resiste o fogo, o que isso tem haver com nossos galardões e o nosso trabalho para a edificação da igreja? O que levará alguém a receber recompensas?<\/p><p>Tudo o que fazemos para Deus tem embasamento bíblico, cujas intenções são a glória de Deus.<\/p><blockquote>Mateus 7:24 Todo aquele, pois, que escuta estas minhas palavras, e as pratica, assemelhá-lo-ei ao homem prudente, que edificou a sua casa sobre a rocha; 25 E desceu a chuva, e correram rios, e assopraram ventos, e combateram aquela casa, e não caiu, porque estava edificada sobre a rocha.<\/blockquote><blockquote>1 Coríntios 10:31 Portanto, quer comais quer bebais, ou façais qualquer outra coisa, fazei tudo para glória de Deus.<\/blockquote><p class='li'>6 - O que levará alguém perder recompensas Tudo que fizemos sem fundamentação bíblica, ou ainda que seja bíblico, com motivações erradas.<\/p><blockquote>Mateus 15:9 Mas, em vão me adoram, ensinando doutrinas que são preceitos dos homens.<\/blockquote><blockquote>Mateus 6:5 E, quando orares, não sejas como os hipócritas; pois se comprazem em orar em pé nas sinagogas, e às esquinas das ruas, para serem vistos pelos homens. Em verdade vos digo que já receberam o seu galardão.<\/blockquote><p>Ouro, prata e pedras preciosas.<\/p><p>Paulo compara o exercício de nossos dons na edificação da igreja como a construção de um templo, o ouro, a prata e as pedras preciosas dizem respeito aos materiais nobres referência ao material adequado para edificar o corpo de cristo, ou seja, são mensagens, letras (louvores), aconselhamentos e praticas cristãs fundamentados na palavra de Deus, pois o que edifica a igreja é a palavra. Todas as vezes que eu ou você servimos a Cristo conforme a palavra determina, é como edificar um templo que as pedras mencionadas por Paulo, isso pode resultar em galardão.<\/p><p>Contudo, além de nosso culto e serviços prestados a Deus serem fundamentados em sua palavra, devemos fazer o que fazemos com as motivações corretas. Eu posso pregar uma mensagem bíblica, mas se a minha motivação não for a glória de Deus e a edificação da igreja, perderei meu galardão conforme veremos adiante. Paulo foi enfático, 1 Coríntios 10.31 “Portanto, quer comais quer bebais, ou façais qualquer outra coisa, fazei tudo para glória de Deus”. Tudo que fazemos para Deus cuja fundamentação é bíblica e o alvo é a glória de Deus, resultará em galardão.<\/p><p>Madeira, palha e feno.<\/p><p>Esses itens são referências às vãs filosofias que em nada edificam o povo de Deus, a igreja de Corinto era altamente influenciada pelas mais diversas correntes filosóficas, amavam mensagens com pensamentos filosóficas, pois isso Paulo disse em 1 Coríntios 2.1,2 “E eu, irmãos, quando fui ter convosco, anunciando-vos o testemunho de Deus, não fui com sublimidade de palavras ou de sabedoria. Porque nada me propus saber entre vós, senão a Jesus Cristo, e este crucificado”. Muitos membros da igreja de Corinto estava edificando com palha quanto a pregação da palavra.<\/p><p>Toda prática cristã, seja a pregação, o cântico, a liturgia, ou qualquer prática “cristã”, cujos fundamentos principais é a filosofia, política, ou ideias humanas ao invés da palavra de Deus, é edificar com madeira, palha e feno. Tudo que fazemos na obra de Deus cujos fundamentos não é a palavra, perderemos recompensas, Mateus 15.9 “Mas, em vão me adoram, ensinando doutrinas que são preceitos dos homens”. Mas há ainda o outro e talvez principal motivo que resultará em perdas de galardão, é quando fazemos o que é bíblico, mas não fazemos para glória de Deus e sim para o nosso louvor, penso que é nesse ponto onde a maioria dos cristãos sofrerão perdas no no tribunal de Cristo, pois tem gente fazendo muita coisa, trabalhando muito, mas não é para Deus, é para si mesmo, Mateus 6,5 “E, quando orares, não sejas como os hipócritas; pois se comprazem em orar em pé nas sinagogas, e às esquinas das ruas, para serem vistos pelos homens. Em verdade vos digo que já receberam o seu galardão”.<\/p><p>Os fatores que determinarão o ganho de galardões, material adequado (palavra), e motivação O galardão da santificação<\/p><blockquote>1 Coríntios 9.25 “E todo aquele que luta de tudo se abstém; eles o fazem para alcançar uma coroa corruptível; nós, porém, uma incorruptível”.<\/blockquote><p>Paulo está usando como analogia os jogos instimos, muito comum em todo império romano, possivelmente a luta greco romana e as corridas, onde o atleta tinha que se abster de tudo para ter êxito, assim, Paulo fala sobre nossa jornada cristã, devemos renunciar o pecado que tão de perto nos rodeia, e nos desvencilharmos de todos o embaraço. Isso é a vida de santificação, Paulo está dizendo que, embora não somos salvos através da santificação, uma vida santa e de abstinência do pecado resultará em galardão, não somos salvos por obras, mas as boas obras resultará em galardão.<\/p><p>Conforme já expus acima, seremos recompensados pelo uso adequado dos nossos dons, qualquer ato de obediência fundamentado na palavra de Deus é adoração e quando obedecemos para a glória de Deus receberemos galardão, contudo a bíblia dá algumas informações sobre recompensas específicas:<\/p><p>O galardão de quem ganha almas<\/p><blockquote>1 Tessalonicenses 2.19 “Porque, qual é a nossa esperança, ou gozo, ou coroa de glória? Porventura não o sois vós também diante de nosso Senhor Jesus Cristo em sua vinda?”<\/blockquote><p>O ganhador de almas, isto é, aquele que exerce o ministério de uma evangelista, ou qualquer salvo que direta ou indiretamente ganhou almas, receberá a recompensa proporcional ao seu trabalho.<\/p><p>O galardão para quem ama e espera o arrebatamento<\/p><blockquote>2 Timóteo 4.8 “Desde agora, a coroa da justiça me está guardada, a qual o Senhor, justo juiz, me dará naquele dia; e não somente a mim, mas também a todos os que amarem a sua vinda”. Em um mundo onde os salvos vivem tão envolvidos com as atividades terrenas, o que é normal, as vezes alguns podem perder o desejo de que o arrebatamento ocorrra em seus dias, mas Paulo afirma que há um galardão específico para aqueles que vivem com os pés na terra mas a mente no céu!<\/blockquote><p>O galardão do pastor<\/p><blockquote>1 Pedro 5.2-4 “Apascentai o rebanho de Deus, que está entre vós, tendo cuidado dele, não por força, mas voluntariamente; nem por torpe ganância, mas de ânimo pronto; Nem como tendo domínio sobre a herança de Deus, mas servindo de exemplo ao rebanho. E, quando aparecer o Sumo Pastor, alcançareis a incorruptível coroa da glória.”<\/blockquote><p>O pastor que trata o povo como se fosse sua propriedade, com intuito de apenas tirar vantagens financeiras será reprovado, mas aquele que exerce sua liderança de forma bíblica, com zelo e amor, para honra de Deus, receberá sua justa recompensa lá, não é aqui.<\/p><p>O galardão do mártir<\/p><blockquote>Apocalipse 2.10 “Nada temas das coisas que hás de padecer. Eis que o diabo lançará alguns de vós na prisão, para que sejais tentados; e tereis uma tribulação de dez dias. Sê fiel até à morte, e dar-te-ei a coroa da vida.”<\/blockquote><p>Martírio é um dom, que se usa uma única vez, sim, só é possivel um salvo morrer por Cristo mediante a ação do espiríto ao conceder esse dom afim de que Cristo venha ser glorificado dessa forma na vinda do crente, e esses receberão sua recompensa espefíca por sua fidelidade a Cristo diande de uma execução.<\/p><p>correta (glória de Deus).<\/p><p>Nunca ganhei almas, será que vou receber galardões?<\/p><p>Esse é um grande erro, imaginar que apenas os evangelistas receberão recompensas! Todos temos dons, e recebemos recompensas com base em como exercemos os dons que Deus confiou a nós, se o seu dom é diaconia, serviços gerais que visam o bom andamento do culto, e você o faz com alegria e para glória de Deus, receberá galardão! Deus não vai exigir de mim algo que não diz respeito ao meu dom, ainda que esporadicamente façamos qualquer outra atividade que resulte em galardão, como o simples ato de dar um copo de água fria a um servo de Deus. Alguém pode ficar sem receber nenhum galardão?<\/p><p>Penso que não, pois quando o texto de 1coríntios falar da perda de galardão, está descrevendo a atividades específicas, isto é, eu posso ser reprovado em todo ao assistencialismo que prestei aos necessitados caso sempre o faça para me aparecer, entretanto receberei galardão devido oraçẽos fundamentadas na bíblia cujas intençẽos eram a glória de Deus! Assim, posso ter perda total em algumas áreas, mas ganho em outras. Se alguém não receber nenhum galardão, significa que em nada serviu a Deus de forma bíblica, e tudo que fez foi para sua honra, e não para glória de Deus. Uma das marcas do salvo é o fruto do espírito, se alguém não tem nenhum fruto não é de Deus, logo, é impossível que um salvo em toda sua jornada não se preste nem para servir um copo de água para os demais filhos de Deus. Assim concluo afirmando que todos (salvos) receberemos recompensas, uns mais outros menos.<\/p><h4>A NATUREZA DO GALARDÃO<\/h4><p>A bíblia fala de coroas, (1Co 9.26; 2Tm 4.8) ora, não devemos imaginar que receberemos coroas literais. Quem usa coroa são os reis, o rei é aquele que governa. Logo, o galardão simbolizado por uma coroa é uma indicação que nossa recompensa está ligada ao fato que reinaremos com Cristo. Sim, como recompensa receberemos responsabilidades e posições governamentais no milênio e no Reino eterno de Deus ( Ap 2.26; 3.21; 20.6; 22.5).<\/p><p>Talvez uma das parábolas que melhor ilustra e define a questão dos galardẽos seja a parábola das minas registrada em Lucas 19.11-27. Esse texto demonstra claramente que a recompensa está atrelada à autoridade sobre povos, pois ao que fez o devido uso da mina foi dito, Lucas 19.17 “E ele lhe disse: Bem está, servo bom, porque no mínimo foste fiel, sobre dez cidades terás autoridade”. Logo, podemos concluir que nossos galardões dizem respeito às posiçẽos de autoridade que receberemos no reino de Deus, seja o milênio ou no estado eterno, Apocalipse 22.5 “E ali não haverá mais noite, e não necessitarão de lâmpada nem de luz do sol, porque o Senhor Deus os ilumina; e reinarão para todo o sempre”.<\/p>"}, {"n": 82, "t": "APOCALIPSE - O LIVRO SELADO", "html": "<blockquote>Apocalipse 5:1 E VI na destra do que estava assentado sobre o trono um livro escrito por dentro e por fora, selado com sete selos. 2 E vi um anjo forte, bradando com grande voz: Quem é digno de abrir o livro e de desatar os seus selos? 3 E ninguém no céu, nem na terra, nem debaixo da terra, podia abrir o livro, nem olhar para ele. 4 E eu chorava muito, porque ninguém fora achado digno de abrir o livro, nem de o ler, nem de olhar para ele. 5 E disse-me um dos anciãos: Não chores; eis aqui o Leão da tribo de Judá, a raiz de Davi, que venceu, para abrir o livro e desatar os seus sete selos.<\/blockquote><blockquote>Apocalipse 5:6 E olhei, e eis que estava no meio do trono e dos quatro animais viventes e entre os anciãos um Cordeiro, como havendo sido morto, e tinha sete chifres e sete olhos, que são os sete espíritos de Deus enviados a toda a terra. 7 E veio, e tomou o livro da destra do que estava assentado no trono.<\/blockquote><blockquote>Apocalipse 5:9 E cantavam um novo cântico, dizendo: Digno és de tomar o livro, e de abrir os seus selos; porque foste morto, e com o teu sangue nos compraste para Deus de toda a tribo, e língua, e povo, e nação;<\/blockquote><h4>A ESCRITURA DA TERRA?<\/h4><p>Os Romanos usavam um contrato selado por sete selos Jeremias 32 temos um contrato<\/p><blockquote>Jeremias 32:6 Disse, pois, Jeremias: Veio a mim a palavra do SENHOR, dizendo: 7 Eis que Hanameel, filho de Salum, teu tio, virá a ti dizendo: Compra para ti a minha herdade que está em Anatote, pois tens o direito de resgate para comprá-la. 10 E assinei a escritura, e selei-a, e fiz confirmar por testemunhas; e pesei-lhe o dinheiro numa balança. 11 E tomei a escritura da compra, selada segundo a lei e os estatutos, e a cópia aberta.<\/blockquote><h4>QUAL O CONTEÚDO DO LIVRO?<\/h4><h4>O DESFECHO FINAL DA HISTÓRIA DA REDENÇÃO!<\/h4>"}, {"n": 83, "t": "APOCALIPSE - OS QUATRO PRIMEIROS SELOS", "html": "<h4>CAVALO BRANCO<\/h4><p>6.2 E olhei, e eis um cavalo branco; e o que estava assentado sobre ele tinha um arco; e foi-lhe dada uma coroa, e saiu vitorioso e para vencer. Talvez a questão mais debatida dentre todos os selos seja a identidade do cavaleiro sobre o cavalo branco. Há diversas perspectivas sobre esse cavaleiro, desde os partas até o império Romano, contudo as posições principais são três, Cristo, a propagação do evangelho ou o anticristo.<\/p><p>Cristo, os que defendem ser Cristo se apegam na cor branca e na coroa, assim o associam com o cavaleiro em Apocalipse dezenove. Apelam ao fato de que a cor branca sempre é associada a algo bom e positivo em Apocalipse (1.14; 2,17; 4.4; 7.9,13; 14.14; 19.11,14; 20.11). A cor branca sempre é usada em relação a Deus ou o que é bom. Esse é outro argumento frágil, pois nem sempre uma figura que majoritariamente é usada para algo específico tem o mesmo signidicado em todas as ocorrencias, o contexto é quem determina os significados dos textos, independente de quantas vezes o termo é usado de maneira oposta. Deus sempre chamou de ungido aqueles que fazem parte do seu povo, mas Ciro também foi chamado de pastor ungido, sem nunca fazer parte do povo de Deus. Satanás foi chamado de anjo de Luz, em outro texto esse é considerado um leão. É impossível que o cordeiro abra o selo e Ele mesmo sai em um cavalo, quando ele retorna como cordeiro para abrir os demais selos?<\/p><p>A pregação do evangelho da paz. Outro posição afirma que o cavalo branco e seu cavaleiro é a proclamação do evangelho. Os argumentos em defesa dessa ideia são bem parecidos aqueles usados em defesa de que é o Cristo. A cor branca creem ser um símbolo do evangelho da paz, assim o evangelho será pregado em todo o mundo em testemunho a todos os povos, Ladd afirma “O cavaleiro não é o próprio Cristo, mas simboliza a pregação do evangelho de Cristo em todo o mundo. Os detalhes do cavaleiro não enfraquecem esta conclusão. Na Escritura muitas vezes o arco é um símbolo das vitórias divinas”. É impossível que esse cavalo represente a pregação do evangelho, não uma única referência onde “arcos e flechas” seja símbolo da proclamação ou alcance do evangelho. Como veremos adiante, este cavalo branco está em um contexto negativo onde os primeiro juízos são apresentados por meio de quatro cavalos, o que impossibilita apenas um cavalo representar o bem.<\/p><p>O anticristo. Essa é melhor explicação para o cavalo branco, pois esse é o inicio da septuagésima semana de Daniel onde o anticristo se manifestará de forma pacifica firmando um acordo de Paz com Israel (Dn 9.27; Jo 5.43; 2Ts 2.9,10). A manifestação do anticristo será o primeiro e um dos mais terríveis juízos divino sobre todo o mundo. Os povos desejam um líder que seja contra os propósitos divinos e que aprove leis que afrontam a palavra de Deus, então Cristo os entregará tal líder. Inicialmente o anticristo será pacífico em relação a Israel e o mundo, vai conseguir estabelecer a paz no oriente médio, e vai devolver o território para reconstrução do templo em Israel, esse é o motivo pelo qual esse governante será aclamado, pois fará algo que nenhum outro jamais conseguiu. Embora inicialmente esse homem mantenha a paz com Israel e as nações, o que inclui a falsa e ecumênica religião, não significa que os crentes em Cristo nesse primeiro momento não sofram perseguições por parte dessa falsa religião ou do próprio anticristo. O contexto em que o cavalo branco está inserido indica que este é uma representação do mal, na sua pior espécie, isto é, o mal disfarçado de bem! É impossível que este seja Cristo, pois há muita divergência entre este cavalo e seu cavaleiro e o cavaleiro de apocalipse dezenove. A coroa deste é “stephanos” a cora em (Ap 19.12) é “diadema”, o cavaleiro aqui possui um arco, em apocalipse dezenove uma espada, enquanto este é acompanhado por outros três cavaleiros em cores distintas, aquele é seguido por exército em cavalos brancos, este é o anticristo que aparece no inicio da tribulação, aquele é o Cristo que surge no fim da tribulação. O argumento da conquista que é baseado no fato de sair vitorioso e para vencer indica ser o Cristo é tão simplório que até mesmo o amilenista G. K. Beale o rejeita, “A ideia de ‘conquista’ é usada em outros lugares onde a besta oprime os santos (11.7; 13.7). Essa ‘conquista’ (vixéo) ocorre em 6.2 sem um alvo específico, como em 5.5, mas tem um alvo em (11.7) e (13.7) quando se refere ao anticristo, mas a ausência de alvo em (6.2) não exige que o primeiro cavaleiro seja Cristo, uma vez que Cristo e a ‘conquista’ dos santos tem um alvo em outras partes do livro (Ap 12.7;17.14)”.[N] É notório em Apocalipse e em outros textos que o anticristo obterá vitória em alguns momentos específicos da grande tribulação (Ap 13.7; Dn 7.21,25; 2Ts 2.8-12), o que corrobora a ideia de que o cavalo branco é de fato um símbolo do anticristo, negar esse fato é rejeitar o óbvio.<\/p><h4>CAVALO VERMELHO<\/h4><p>6.3,4 E, havendo aberto o segundo selo, ouvi o segundo animal, dizendo: Vem e vê! E saiu outro cavalo, vermelho; e ao que estava assentado sobre ele foi dado que tirasse a paz da terra e que se matassem uns aos outros; e foi-lhe dada uma grande espada. O segundo Querubim anuncia o segundo cavalo, vermelho pois grande será o derramamento de sangue, acabou a paz! Um paz que não provem de Deus não pode durar muito, e isso é o que o anticristo pode oferecer, ilusão! O primeiro grande juízo vem por meio de um cavalo branco, o segundo, por meio de uma cavalo vermelho que representa uma guerra que haverá logo no inicio da grande tribulação. No momento que a humanidade pensar que seu líder resolveu os problemas mundiais, e estiverem dizendo a paz e segurança, na verdade já estarão no inicio do dia do Senhor, “Porque vós mesmos sabeis muito bem que o Dia do Senhor virá como o ladrão de noite. Pois que, quando disserem: Há paz e segurança, então, lhes sobrevirá repentina destruição, como as dores de parto àquela que está grávida; e de modo nenhum escaparão” 1Ts 5.2,3. O ladrão não avisa quando virá, e quando chega só é notado quando age, assim será chegada do dia do Senhor, não perceberão sua chegada, até que logo vem o cavalo vermelho! Este cavalo representa uma guerra civil, um espirito maligno vai agir e influenciar as pessoas a matarem umas as outras, o texto não revela o motivo que levará essa guerra civil, mas podemos ter por certo que será uma grande matança! Nesse momento haverá muitos salvos, pessoas que se converterão após o arrebatamento da igreja, logo podemos deduzir que esse espírito maligno no cavalo vermelho vai influenciar as pessoas a matarem muitos crentes já nessa etapa inicial da tribulação. Devemos ter em mente que o acordo de Paz será entre Israel e as nações, para que o templo seja reconstruído e a religião judaica plenamente restabelecida, entretanto, os seguidores de Cristo, sejam judeus ou gentios, em nenhum momento gozarão dessa paz, mas serão perseguidos e hostilizados desde sempre.<\/p><h4>CAVALO PRETO<\/h4><p>6.5,6 E, havendo aberto o terceiro selo, ouvi o terceiro animal, dizendo: Vem e vê! E olhei, e eis um cavalo preto; e o que sobre ele estava assentado tinha uma balança na mão. E ouvi uma voz no meio dos quatro animais, que dizia: Uma medida de trigo por um dinheiro; e três medidas de cevada por um dinheiro; e não danifiques o azeite e o vinho. O terceiro juízo, é a manifestação da ira de Deus através da escassez de alimentos, uma consequência natural de uma guerra. Trigo, azeite e vinho representam desde os mantimentos mais essenciais aos refinados, haverá uma inflação tal como nunca houve, e todos serão afetados, seja rico ou pobre! Vale lembrar que isso ocorrerá em algum momento dos três anos e meio iniciais da tribulação, e seria um ingenuidade imaginar que apenas os ímpios serão afetados por essa aflição, é certo que os salvos igualmente sofrerão essa manifestação da ira de Deus. Duas ideias errada em relação a grande tribulação, primeiro, a ira de Deus será derramada apenas no fim, segundo, a ira de Deus afeta apenas os ímpios, entretanto, a abertura dos primeiros selos demonstra o contrário!<\/p><h4>CAVALO AMARELO<\/h4><p>6.7,8. E, havendo aberto o quarto selo, ouvi a voz do quarto animal, que dizia: Vem e vê! E olhei, e eis um cavalo amarelo; e o que estava assentado sobre ele tinha por nome Morte; e o inferno o seguia; e foi-lhes dado poder para matar a quarta parte da terra com espada, e com fome, e com peste, e com as feras da terra. Há uma progressão cronológica e lógica na abertura dos quatro primeiros selos que é nítida. O quarto selo revela um juízo que é consequência lógica dos e três primeiros selos, a falsa paz proposta pelo anticristo promove uma guerra civil, guerra gera escassez de alimento e inflação, e na sequencia vem fome e doenças.<\/p><p>E o que estava assentado sobre ele tinha por nome Morte; e o inferno o seguia. Aqui tempos a personificação da morte, algo que Paulo já fez em seus textos, isto é, a morte é tratada como sendo um ser. O quarto selo revela que um quarto da população será morta em sua abertura, essa mortandade será tamanha que o cavaleiro é denominado de morte. O inferno o segue, isto é, o hades, a região habitada pelo espíritos dos mortos. Há um simbolismo poético aqui, é como se o hades seguisse a morte para receber os mortos, de tantos que serão!<\/p><p>E foi-lhes dado poder para matar a quarta parte da terra. Esse é um detalhe muito importante, uma quarto da população seria algo em torno de dois bilhões de Pessoas, é muita gente. Jesus disse que se esses dias não fosse breves, nenhuma carne se salvaria, tamanho a severidade dos juízos! Esse relado diz respeito a primeira metade da tribulação, esse selo faz parte dos primeiros juízos sobre essa terra, essa é fase inicial da ira de Deus, será que apenas os ímpios serão afetados pelo quarto selo? Por certo que não, milhares de salvos também morrerão no tempo do quarto selo, aqueles que não morrerem, contemplará seus familiares morrendo, não haverá uma casa que luto! Assim, podemos concluir seguramente que os já estiverem convertidos a Cristo nesse momento direta ou indiretamente sofrerão as angustias do quarto cavaleiro, aquela ideia de que a ira de Deus não afetará os justos durante a primeira metade da tribulação é falsa.<\/p><p>Espada, e com fome, e com peste, e com as feras da terra. Dentre um quarto dos mortos, muitos serão executados a espada, é bem possível que a espada aqui seja aplicada aos salvos, estes serão perseguidos e mortos desde sempre. Isso explica porque muitos judeus convertidos a Cristo receberão um selo de proteção no capítulo sete, para que não morram todos logo de início.<\/p>"}, {"n": 84, "t": "APOCALIPSE - O QUINTO SELO - ALMAS DEBAIXO DO ALTAR", "html": "<h4>O ESTADO INTERMEDIÁRIO<\/h4><h4>O QUINTO SELO – ALMAS DEBAIXO DO ALTAR<\/h4><p>6.9,10,11 E, havendo aberto o quinto selo, vi debaixo do altar as almas dos que foram mortos por amor da palavra de Deus e por amor do testemunho que deram. E clamavam com grande voz, dizendo: Até quando, ó verdadeiro e santo Dominador, não julgas e vingas o nosso sangue dos que habitam sobre a terra? E a cada um foi dada uma comprida veste branca e foi-lhes dito que repousassem ainda um pouco de tempo, até que também se completasse o número de seus conservo e seus irmãos que haviam de ser mortos como eles foram.<\/p><p>6.9 Vi debaixo do altar as almas dos que foram mortos por amor da palavra de Deus e por amor do testemunho que deram. Essa são as almas dos que foram mortos a espada com a abertura dos primeiro selos, cavalo vermelho e cavalo amarelo, serão mortos por seu testemunho e fidelidade a cristo. Estão debaixo do altar, Paulo também usou essa linguagem para descrever sua morte, isso remete aos sacrifícios do antigo testamento onde o sangue do animal oferecido a Deus no altar do holocausto era derramado e escorrido para debaixo do altar. Ali é dito que a alma do animal estava no sangue, isto é, sua vida. Aqui vemos as almas dos santos, que darão suas vidas em sacrifício a Cristo, suas mortes serão aceitas por Deus como uma libação! 6.10 E clamavam com grande voz, dizendo: Até quando, ó verdadeiro e santo Dominador, não julgas e vingas o nosso sangue dos que habitam sobre a terra? A prova de que essas almas são literais e não metáforas, é o fato de que elas clamam e há o registro de seu clamor, diferente do “sangue de Caim que clama desde a terra” que claramente não é literal, pois sangue não clama, e tão pouco há o registro de tal clamor. Aqui temos o registro do clamor dos mártires da tribulação, diferente da oração de Jesus ou Estevão que pede que seus algozes sejam perdoados, estes querem justiça. Típica linguagem dos salmos imprecatórios, onde o salmista entende que seu inimigo é também inimigo de Deus, assim clama por vingança e justiça imediata. Esse é um típico clamor veterotestamentário, não poderia ser diferente, pois embora sejam seguidores de Cristo, essa é a septuagésima semana de Daniel, o tratado final com Israel e o mundo. 6.11 E a cada um foi dada uma comprida veste branca e foi-lhes dito que repousassem ainda um pouco de tempo, até que também se completasse o número de seus conservo e seus irmãos que haviam de ser mortos como eles foram. Vestes brancas aqui é a justiça de Cristo, a base de sua salvação. Sua oração foi ouvida, mas não é atendida de imediato, pois ainda há muitos outros para serem mortos. Esses outros irmãos e conservos são os que morrerão durante a intensa perseguição do anticristo que se inicia com o término da primeira metade da tribulação. Sono da Alma<\/p><blockquote>1 Tessalonicenses 4:15 Dizemo-vos, pois, isto, pela palavra do Senhor: Que nós, os que ficarmos vivos para a vinda do Senhor, não precederemos os que dormem.<\/blockquote><blockquote>1 Coríntios 11:30 Por causa disto há entre vós muitos fracos e doentes, e muitos que dormem. Koimethentas - Koimaó Textos utilizados em defesa do sono da alma<\/blockquote><blockquote>Isaías 38:17 Eis que foi para a minha paz que tive grande amargura, mas a ti agradou livrar a minha alma da cova da corrupção; porque lançaste para trás das tuas costas todos os meus pecados.<\/blockquote><p>De shuwach; um buraco (especialmente como armadilha); figurativamente, destruição – corrupção, destruição, vala, sepultura, covaisão) - cisterna, masmorra, fonte, poço, poço. 18 Porque não te louvará a sepultura, nem a morte te glorificará; nem esperarão em tua verdade os que descem à cova.<\/p><p>De buwr (no sentido de bo'r); um buraco (especialmente aquele usado como cisterna ou prcorrupção, destruição, vala, sepultura, poço<\/p><blockquote>Salmos 6:5 Porque na morte não há lembrança de ti; no sepulcro quem te louvará?<\/blockquote><blockquote>Salmos 115:17 Os mortos não louvam ao SENHOR, nem os que descem ao silêncio. 18 Mas nós bendiremos ao SENHOR, desde agora e para sempre. Louvai ao SENHOR.<\/blockquote><blockquote>Eclesiastes 9:2 Tudo sucede igualmente a todos; o mesmo sucede ao justo e ao ímpio, ao bom e ao puro, como ao impuro; assim ao que sacrifica como ao que não sacrifica; assim ao bom como ao pecador; ao que jura como ao que teme o juramento. 3 Este é o mal que há entre tudo quanto se faz debaixo do sol; a todos sucede o mesmo; e que também o coração dos filhos dos homens está cheio de maldade, e que há desvarios no seu coração enquanto vivem, e depois se vão aos mortos. 4 Ora, para aquele que está entre os vivos há esperança (porque melhor é o cão vivo do que o leão morto). 5 Porque os vivos sabem que hão de morrer, mas os mortos não sabem coisa nenhuma, nem tampouco terão eles recompensa, mas a sua memória fica entregue ao esquecimento. 10 Tudo quanto te vier à mão para fazer, faze-o conforme as tuas forças, porque na sepultura, para onde tu vais, não há obra nem projeto, nem conhecimento, nem sabedoria alguma.<\/blockquote><blockquote>Salmos 146:4 Sai-lhe o espírito, volta para a terra; naquele mesmo dia perecem os seus pensamentos. OU Planos ashath<\/blockquote><blockquote>Salmos 37:9 Porque os malfeitores serão desarraigados; mas aqueles que esperam no SENHOR herdarão a terra. 10 Pois ainda um pouco, e o ímpio não existirá; olharás para o seu lugar, e não aparecerá. 11 Mas os mansos herdarão a terra, e se deleitarão na abundância de paz.<\/blockquote><blockquote>Salmos 68:1 LEVANTE-SE Deus, e sejam dissipados os seus inimigos; fugirão de diante dele os que o odeiam. 2 Como se impele a fumaça, assim tu os impeles; assim como a cera se derrete diante do fogo, assim pereçam os ímpios diante de Deus. 3 Mas alegrem-se os justos, e se regozijem na presença de Deus, e folguem de alegria.<\/blockquote><h4>O QUE O NT FALA SOBRE O ESTADO INTERMEDIÁRIO<\/h4><h4>O RICO E O LÁZARO<\/h4><h4>DEIXANDO NOSSO TABERNÁCULO<\/h4><blockquote>2 Coríntios 5:4 Porque também nós, os que estamos neste tabernáculo, gememos carregados; não porque queremos ser despidos, mas revestidos, para que o mortal seja absorvido pela vida. 5 Ora, quem para isto mesmo nos preparou foi Deus, o qual nos deu também o penhor do Espírito. 6 Por isso estamos sempre de bom ânimo, sabendo que, enquanto estamos no corpo, vivemos ausentes do Senhor 8 Mas temos confiança e desejamos antes deixar este corpo, para habitar com o Senhor.<\/blockquote><h4>PEDRO<\/h4><blockquote>2 Pedro 1:14 Sabendo que brevemente hei de deixar este meu tabernáculo, como também nosso Senhor Jesus Cristo já me tem revelado. 15 Mas também eu procurarei em toda a ocasião que depois da minha morte tenhais lembrança destas coisas.<\/blockquote><h4>PAULO<\/h4><blockquote>Filipenses 1:21 Porque para mim o viver é Cristo, e o morrer é ganho. 22 Mas, se o viver na carne me der fruto da minha obra, não sei então o que deva escolher. 23 Mas de ambos os lados estou em aperto, tendo desejo de partir, e estar com Cristo, porque isto é ainda muito melhor. 24 Mas julgo mais necessário, por amor de vós, ficar na carne.<\/blockquote><h4>APOCALIPSE 6.9 - ALMAS CLAMANDO<\/h4><blockquote>Apocalipse 6:9 E, havendo aberto o quinto selo, vi debaixo do altar as almas dos que foram mortos por amor da palavra de Deus e por amor do testemunho que deram. 10 E clamavam com grande voz, dizendo: Até quando, ó verdadeiro e santo Dominador, não julgas e vingas o nosso sangue dos que habitam sobre a terra? 11 E foram dadas a cada um compridas vestes brancas e foi-lhes dito que repousassem ainda um pouco de tempo, até que também se completasse o número de seus conservos e seus irmãos, que haviam de ser mortos como eles foram.<\/blockquote><p>Anapauó= dar descanso, dar intervalo do trabalho, por implicação refrescar.<\/p><h4>ANIQUILACIONISMO<\/h4><blockquote>Mateus 25:46 E irão estes para o tormento eterno, mas os justos para a vida eterna.<\/blockquote><blockquote>Apocalipse 14:9 E seguiu-os o terceiro anjo, dizendo com grande voz: Se alguém adorar a besta, e a sua imagem, e receber o sinal na sua testa, ou na sua mão, 10 Também este beberá do vinho da ira de Deus, que se deitou, não misturado, no cálice da sua ira; e será atormentado com fogo e enxofre diante dos santos anjos e diante do Cordeiro. 11 E a fumaça do seu tormento sobe para todo o sempre; e não têm repouso nem de dia nem de noite os que adoram a besta e a sua imagem, e aquele que receber o sinal do seu nome.<\/blockquote><blockquote>Apocalipse 17:11 E a besta que era e já não é, é ela também o oitavo, e é dos sete, e vai à perdição.<\/blockquote><p>apṓlei
