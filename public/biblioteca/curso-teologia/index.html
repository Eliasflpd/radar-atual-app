<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cursos de Teologia — RADAR</title>
<style>
  :root{--bg:#f5f7fb;--card:#fff;--txt:#1b2436;--navy:#0f3d5c;--teal:#0f6d78;--dourado:#a9791c;--linha:#e4e7ec;--suave:#6b7480}
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,Arial,sans-serif;max-width:860px;margin:0 auto;min-height:100dvh}
  header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  header .ico{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--teal),var(--dourado));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  header .t{flex:1;min-width:0}
  header .t b{display:block;font-size:1.06rem;line-height:1.15}
  header .t span{font-size:.76rem;color:#bcd3dc}
  header button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:9px;padding:9px 11px;font-weight:700;font-family:inherit;cursor:pointer;font-size:.9rem}
  .wrap{padding:16px 14px 40px}

  /* ===== CADEADO / SENHA ===== */
  #gate{min-height:calc(100dvh - 66px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;text-align:center;gap:14px}
  #gate .lock{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--teal));display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 10px 30px rgba(15,61,92,.28)}
  #gate h2{margin:4px 0 0;color:var(--navy);font-size:1.3rem}
  #gate p{margin:0;color:var(--suave);font-size:.95rem;max-width:320px;line-height:1.5}
  #gate .campo{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
  #gate input{border:1.6px solid var(--linha);border-radius:13px;padding:14px 16px;font-size:1.05rem;font-family:inherit;text-align:center;background:#fff}
  #gate input:focus{outline:none;border-color:var(--teal)}
  #gate .btn{background:var(--navy);color:#fff;border:none;border-radius:13px;padding:14px;font-size:1.05rem;font-weight:800;font-family:inherit;cursor:pointer}
  #gate .erro{color:#a8162a;font-size:.9rem;font-weight:700;min-height:18px}

  /* ===== CURSO ===== */
  #curso{display:none}
  .capa{background:linear-gradient(135deg,var(--navy),#14507a);color:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(15,61,92,.18);display:flex;gap:15px;align-items:center}
  .capa .foto{width:94px;height:94px;border-radius:15px;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,255,255,.28);box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .capa .info{flex:1;min-width:0}
  .capa .badge{display:inline-block;background:rgba(255,255,255,.16);color:#ffe4a8;font-size:.72rem;font-weight:800;letter-spacing:.5px;padding:5px 10px;border-radius:20px;text-transform:uppercase}
  .capa h1{margin:9px 0 4px;font-size:1.5rem;line-height:1.15}
  .capa .prof{color:#cfe3ec;font-size:.95rem}
  .capa .stats{display:flex;gap:18px;margin-top:12px;font-size:.8rem;color:#e7f1f6}
  .capa .stats b{display:block;font-size:1.15rem;color:#ffd98a}
  .pdf-link{display:flex;align-items:center;gap:10px;background:#fff8e6;border:1px solid #f0dcaa;color:#6b551f;border-radius:12px;padding:11px 13px;margin-bottom:14px;text-decoration:none;font-weight:700;font-size:.92rem}
  .lista-tit{font-size:.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#8a91a0;margin:2px 2px 12px}
  .capa-click{cursor:pointer;position:relative;transition:transform .12s}
  .capa-click:active{transform:scale(.99)}
  .capa-arr{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#ffd98a;font-size:1.7rem;font-weight:700}
  .voltar-curso{background:none;border:none;color:#0f3d5c;font-weight:800;font-family:inherit;font-size:.98rem;cursor:pointer;padding:2px 0 10px}
  .sec-mod{font-size:.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#8a91a0;margin:6px 2px 10px}
  .mentor{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:16px 16px 6px;margin-bottom:16px;box-shadow:0 4px 14px rgba(15,61,92,.06)}
  .mentor-sel{font-size:.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dourado);margin-bottom:10px}
  .mentor-top{display:flex;align-items:center;gap:13px;margin-bottom:12px}
  .mentor-top img{width:66px;height:66px;border-radius:13px;object-fit:cover;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .mentor-id b{display:block;color:var(--navy);font-size:1.12rem;font-family:Georgia,serif}
  .mentor-id span{font-size:.84rem;color:var(--suave)}
  .mentor p{font-size:.95rem;line-height:1.6;color:#33404f;text-align:justify;margin:0 0 12px}
  .mentor-list{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:7px}
  .mentor-list li{font-size:.85rem;font-weight:700;color:#0f3d5c;background:#eef4f8;border:1px solid #d7e6ee;border-radius:999px;padding:6px 12px}
  .mentor-list li::before{content:'✓ ';color:#1a8a4a;font-weight:900}
  .mentor-foot{font-style:italic;color:var(--suave)!important;font-size:.9rem!important}

  .mod{background:var(--card);border:1px solid var(--linha);border-radius:14px;margin-bottom:11px;overflow:hidden;box-shadow:0 2px 6px rgba(20,40,70,.05)}
  .mod-h{display:flex;align-items:center;gap:12px;padding:14px 15px;cursor:pointer;user-select:none}
  .mod-h .n{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex-shrink:0}
  .mod-h .ti{flex:1;min-width:0}
  .mod-h .ti b{display:block;font-size:1rem;color:var(--navy);line-height:1.2}
  .mod-h .ti span{font-size:.76rem;color:var(--suave)}
  .mod-h .seta{color:var(--dourado);font-size:1.1rem;transition:transform .2s}
  .mod.aberto .seta{transform:rotate(90deg)}
  .aulas{display:none;border-top:1px solid var(--linha)}
  .mod.aberto .aulas{display:block}
  .aula{display:flex;align-items:center;gap:11px;padding:12px 15px 12px 14px;border-top:1px solid #f0f2f5;cursor:pointer}
  .aula:first-child{border-top:none}
  .aula:active{background:#f2f6fb}
  .aula .pl{width:30px;height:30px;border-radius:50%;background:#eaf3f5;color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
  .aula.vista .pl{background:#e5f6ec;color:#1a8a4a}
  .aula .txt{flex:1;min-width:0;font-size:.92rem;line-height:1.35}
  .aula .txt small{display:block;color:var(--suave);font-size:.72rem;margin-top:1px}
  .vazio-mod{padding:14px 15px;color:var(--suave);font-size:.85rem}

  /* ===== PLAYER ===== */
  #player{position:fixed;inset:0;background:#0a1420;z-index:50;display:none;flex-direction:column}
  #player.on{display:flex}
  #player .pbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;color:#fff}
  #player .pbar button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:9px;padding:8px 12px;font-weight:700;font-family:inherit;cursor:pointer}
  #player .pbar .pt{flex:1;min-width:0;font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #player .vwrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000}
  #player video{width:100%;max-height:100%}
  #player .prox{padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#0f1d2e;color:#cfe0ee;font-size:.85rem;display:flex;align-items:center;justify-content:space-between;gap:10px}
  #player .prox button{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:800;font-family:inherit;cursor:pointer}
  .carregando{text-align:center;color:var(--suave);padding:40px 20px}
</style>
</head>
<body>
  <header>
    <div class="ico">🎓</div>
    <div class="t"><b>Cursos de Teologia</b><span>Área particular — trancada</span></div>
    <button onclick="location.href='/'">🏠</button>
  </header>

  <!-- CADEADO -->
  <div id="gate">
    <div class="lock">🔒</div>
    <h2>Conteúdo particular</h2>
    <p>Esta área é sua. Digite a senha para liberar os vídeos do curso.</p>
    <div class="campo">
      <input id="senha" type="password" placeholder="Senha" autocomplete="off" enterkeyhint="go">
      <button class="btn" id="btnEntrar" onclick="entrar()">Entrar 🔓</button>
      <div class="erro" id="erro"></div>
    </div>
  </div>

  <!-- CURSO -->
  <div id="curso" class="wrap"></div>

  <!-- PLAYER -->
  <div id="player">
    <div class="pbar">
      <button onclick="fecharPlayer()">‹ Voltar</button>
      <div class="pt" id="p-titulo"></div>
    </div>
    <div class="vwrap"></div>
    <div class="prox">
      <span id="p-mod"></span>
      <button id="p-prox" style="display:none" onclick="proximaAula()">Próxima aula ›</button>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
let DADOS=null, PLANO=[], atual=-1, CURSO_ATUAL='';

// Metadados (capa/mentor) de cada curso — casa pelo slug 'curso' vindo do banco
const META={
  'escatologia-ivan-santos':{
    titulo:'Escatologia Avançada', prof:'com Ivan Santos', foto:'/img/curso/ivansantos.jpg', badge:'Curso completo',
    apostila:{href:'apostila.html', sub:'Texto completo — 16 módulos, leitura com índice'},
    site:{href:'https://ivansantosescatologia.com.br/', label:'ivansantosescatologia.com.br — Ivan Santos'},
    mentor:{ nome:'Ivan Santos', cargo:'Pastor, teólogo e especialista em Escatologia', foto:'/img/curso/ivansantos.jpg',
      bio:'Pastor, teólogo e especialista em Escatologia com mais de 10 anos de experiência no ensino e estudo das profecias bíblicas, reconhecido no Brasil como uma das maiores autoridades sobre dispensacionalismo. Ivan dedicou sua carreira a traduzir e revisar as mais importantes obras escatológicas (John Walvoord, Renald Showers, Darrell Bock, Craig Blaising, William Watson, dentre outros), trazendo conhecimento profundo e revelador sobre os últimos tempos.',
      tags:['Tradutor','Escritor','Teólogo','Especialista em Escatologia Dispensacionalista','Professor em diversos institutos teológicos'],
      foot:'Seu trabalho vai além da sala de aula — Ivan tem participado dos mais relevantes debates teológicos nos principais programas de TV e podcasts.' }
  },
  'giom-teologia':{
    titulo:'Instituto Teológico GIOM', prof:'com Dr. Wagner Cordeiro', foto:'/img/curso/wagner-cordeiro.jpg', badge:'Curso completo',
    site:{href:'https://www.instagram.com/giomoficial/', label:'Instituto Teológico GIOM — @giomoficial'},
    mentor:{ nome:'Dr. Wagner Cordeiro', cargo:'Pastor e professor de teologia', foto:'/img/curso/wagner-cordeiro.jpg',
      bio:'Pastor e professor à frente do Instituto Teológico GIOM, com ensino teológico semanal voltado a enriquecer o conhecimento da Palavra de Deus. As aulas percorrem temas como Parakletologia, Escatologia, Batalha Espiritual, o Tabernáculo e a Igreja, entre outros.',
      tags:['Pastor','Professor de Teologia','Instituto Teológico GIOM'],
      foot:'Conteúdo do Instituto Teológico GIOM Online.' }
  }
};
function meta(slug){ return META[slug] || {titulo:slug, prof:'', foto:'', badge:'Curso'}; }

function marcarVista(u,v){ try{ localStorage.setItem('curso_vista_'+btoa(unescape(encodeURIComponent(u))).slice(0,40), v?'1':''); }catch(_){} }
function estaVista(u){ try{ return localStorage.getItem('curso_vista_'+btoa(unescape(encodeURIComponent(u))).slice(0,40))==='1'; }catch(_){ return false; } }
function salvarPos(u,t){ try{ localStorage.setItem('curso_pos_'+btoa(unescape(encodeURIComponent(u))).slice(0,40), String(Math.floor(t))); }catch(_){} }
function lerPos(u){ try{ return parseInt(localStorage.getItem('curso_pos_'+btoa(unescape(encodeURIComponent(u))).slice(0,40))||'0',10)||0; }catch(_){ return 0; } }

async function entrar(){
  const s=$('senha').value.trim();
  if(!s){ return; }
  $('btnEntrar').disabled=true; $('erro').textContent='';
  try{
    const r=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'curso',senha:s})});
    const d=await r.json();
    if(d && d.ok){
      try{ localStorage.setItem('curso_senha', s); }catch(_){}
      DADOS=d; render();
    }else{
      $('erro').textContent='Senha incorreta.';
      $('btnEntrar').disabled=false;
    }
  }catch(e){ $('erro').textContent='Sem conexão. Tente de novo.'; $('btnEntrar').disabled=false; }
}
$('senha').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); entrar(); } });

// NÍVEL 1 — lista de cursos (cada curso é um card; clica pra entrar)
function render(){
  $('gate').style.display='none';
  const cur=$('curso'); cur.style.display='block';
  const cursos = DADOS.cursos || (DADOS.modulos ? [{curso:DADOS.curso||'escatologia-ivan-santos', total:DADOS.total, modulos:DADOS.modulos}] : []);
  let html=`<div class="lista-tit">Meus cursos</div>`;
  cursos.forEach(cs=>{
    const m=meta(cs.curso);
    let vistas=0; cs.modulos.forEach(mo=>mo.aulas.forEach(a=>{ if(estaVista(a.url)) vistas++; }));
    html+=`
    <div class="capa capa-click" onclick="abrirCurso('${cs.curso}')">
      <img class="foto" src="${m.foto}" alt="${m.titulo}" onerror="this.style.display='none'">
      <div class="info">
        <span class="badge">${m.badge}</span>
        <h1>${m.titulo}</h1>
        <div class="prof">${m.prof}</div>
        <div class="stats">
          <div><b>${cs.modulos.length}</b>módulos</div>
          <div><b>${cs.total}</b>aulas</div>
          <div><b>${vistas}</b>assistidas</div>
        </div>
      </div>
      <span class="capa-arr">›</span>
    </div>`;
  });
  cur.innerHTML=html;
  window.scrollTo(0,0);
}
function cursoPorSlug(slug){
  const cursos = DADOS.cursos || [{curso:DADOS.curso, total:DADOS.total, modulos:DADOS.modulos}];
  return cursos.find(c=>c.curso===slug) || cursos[0];
}

// NÍVEL 2 — dentro do curso: apostila + módulos/aulas
function abrirCurso(slug){
  const cur=$('curso');
  const cs=cursoPorSlug(slug); CURSO_ATUAL=cs.curso;
  const m0=meta(cs.curso);
  PLANO=[];
  cs.modulos.forEach(m=>{ m.aulas.forEach(a=>{ PLANO.push({m:m.nome,mo:m.ordem,a}); }); });
  let html=`
    <button class="voltar-curso" onclick="render()">‹ Meus cursos</button>
    <div class="capa">
      <img class="foto" src="${m0.foto}" alt="${m0.titulo}" onerror="this.style.display='none'">
      <div class="info">
        <span class="badge">${m0.badge}</span>
        <h1>${m0.titulo}</h1>
        <div class="prof">${m0.prof}</div>
      </div>
    </div>
    <div class="sec-mod" style="margin-top:2px">Módulos e aulas</div>`;
  cs.modulos.forEach((m,mi)=>{
    html+=`<div class="mod" data-mi="${mi}"><div class="mod-h" onclick="toggleMod(${mi})">
      <div class="n">${m.ordem}</div>
      <div class="ti"><b>${limpaModulo(m.nome)}</b><span>${m.aulas.length} aula${m.aulas.length>1?'s':''}</span></div>
      <div class="seta">›</div></div><div class="aulas">`;
    if(!m.aulas.length){ html+=`<div class="vazio-mod">Subindo os vídeos deste módulo…</div>`; }
    m.aulas.forEach(a=>{
      const gi=PLANO.findIndex(p=>p.a.url===a.url);
      html+=`<div class="aula ${estaVista(a.url)?'vista':''}" data-gi="${gi}" onclick="abrir(${gi})">
        <div class="pl">▶</div>
        <div class="txt">${limpaAula(a.titulo)}<small>Aula ${a.ordem}</small></div></div>`;
    });
    html+=`</div></div>`;
  });
  if(m0.apostila || m0.site){
    html+=`<div class="sec-mod" style="margin-top:22px">Material do curso</div>`;
    if(m0.apostila){
      html+=`<a class="pdf-link" href="${m0.apostila.href}">
        <span style="font-size:22px">📖</span>
        <span style="flex:1"><b style="display:block;font-size:1rem;color:#0f3d5c">Apostila do Curso</b>
        <span style="font-size:.82rem;color:#6b551f">${m0.apostila.sub}</span></span>
        <span style="color:#a9791c;font-size:1.2rem">›</span></a>`;
    }
    if(m0.site){
      html+=`<a class="pdf-link" href="${m0.site.href}" target="_blank" style="background:#eef4f8;border-color:#cfe0ee">
        <span style="font-size:22px">🌐</span>
        <span style="flex:1"><b style="display:block;font-size:1rem;color:#0f3d5c">Site oficial do curso</b>
        <span style="font-size:.82rem;color:#41607a">${m0.site.label}</span></span>
        <span style="color:#0f6d78;font-size:1.2rem">›</span></a>`;
    }
  }
  if(m0.mentor){
    const mt=m0.mentor;
    html+=`<div class="mentor">
      <div class="mentor-sel">Conheça o mentor</div>
      <div class="mentor-top">
        <img src="${mt.foto||m0.foto}" alt="${mt.nome}" onerror="this.style.display='none'">
        <div class="mentor-id"><b>${mt.nome}</b><span>${mt.cargo}</span></div>
      </div>
      <p>${mt.bio}</p>
      <ul class="mentor-list">${(mt.tags||[]).map(t=>`<li>${t}</li>`).join('')}</ul>
      ${mt.foot?`<p class="mentor-foot">${mt.foot}</p>`:''}
    </div>`;
  }
  cur.innerHTML=html;
  window.scrollTo(0,0);
}
function limpaModulo(s){ return (s||'').replace(/^M[ÓO]DULO\s*\d+\s*-\s*/i,'').replace(/\s+\d+$/,'').trim(); }
function limpaAula(s){ return (s||'').replace(/\.(mkv|mp4)$/i,'').replace(/^AULA\s*[O0]?\d+\s*-\s*/i,'').trim(); }
function toggleMod(mi){ document.querySelector('.mod[data-mi="'+mi+'"]').classList.toggle('aberto'); }

function idDrive(url){ const m=(url||'').match(/\/d\/([^/]+)/)||(url||'').match(/[?&]id=([^&]+)/); return m?m[1]:''; }
function abrir(gi){
  atual=gi; const p=PLANO[gi]; if(!p) return;
  $('player').classList.add('on');
  $('p-titulo').textContent=limpaAula(p.a.titulo);
  $('p-mod').textContent=limpaModulo(p.m);
  const vw=document.querySelector('#player .vwrap');
  const url=p.a.url||'';
  const gid=idDrive(url);
  if(gid || /drive\.google\.com/.test(url)){
    // vídeo do Drive embutido DENTRO do app (a pessoa não sai do app)
    const emb = gid ? ('https://drive.google.com/file/d/'+gid+'/preview') : url;
    vw.innerHTML='<iframe src="'+emb+'" allow="autoplay; fullscreen" allowfullscreen playsinline style="width:100%;height:100%;border:0;background:#000"></iframe>';
    marcarVista(url,true);
    const el=document.querySelector('.aula[data-gi="'+gi+'"]'); if(el) el.classList.add('vista');
  } else {
    vw.innerHTML='<video id="vid" controls playsinline preload="metadata" style="width:100%;max-height:100%"></video>';
    const v=$('vid'); v.src=url;
    const pos=lerPos(url);
    v.onloadedmetadata=()=>{ if(pos>5 && pos<v.duration-10){ v.currentTime=pos; } };
    v.ontimeupdate=()=>{ if(v.currentTime>0) salvarPos(url,v.currentTime); };
    v.onended=()=>{ marcarVista(url,true); const el=document.querySelector('.aula[data-gi="'+gi+'"]'); if(el) el.classList.add('vista'); };
    v.play().catch(()=>{});
  }
  $('p-prox').style.display = (gi+1<PLANO.length)?'inline-block':'none';
}
function proximaAula(){ if(atual+1<PLANO.length) abrir(atual+1); }
function fecharPlayer(){ try{ const v=$('vid'); if(v){ v.pause(); v.src=''; } }catch(_){} const vw=document.querySelector('#player .vwrap'); if(vw) vw.innerHTML=''; $('player').classList.remove('on'); abrirCurso(); }

// auto-desbloqueio (aparelho do Elias): se já entrou antes, não pede senha de novo
(async function(){
  let s=''; try{ s=localStorage.getItem('curso_senha')||''; }catch(_){}
  if(s){
    try{
      const r=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'curso',senha:s})});
      const d=await r.json();
      if(d && d.ok){ DADOS=d; render(); return; }
    }catch(_){}
  }
  $('senha').focus();
})();
</script>
</body>
</html>
