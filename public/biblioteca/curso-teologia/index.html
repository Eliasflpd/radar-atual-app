<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cursos de Teologia — RADAR</title>
<style>
  :root{--bg:#f5f7fb;--card:#fff;--txt:#1b2436;--navy:#0f3d5c;--teal:#0f6d78;--dourado:#a9791c;--linha:#e4e7ec;--suave:#6b7480}
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,Arial,sans-serif;max-width:860px;margin:0 auto;min-height:100dvh}
  header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  header .ico{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--teal),var(--dourado));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  header .t{flex:1;min-width:0}
  header .t b{display:block;font-size:1.06rem;line-height:1.15}
  header .t span{font-size:.76rem;color:#bcd3dc}
  header button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:9px;padding:9px 11px;font-weight:700;font-family:inherit;cursor:pointer;font-size:.9rem}
  .wrap{padding:16px 14px 40px}

  /* ===== CADEADO / SENHA ===== */
  #gate{min-height:calc(100dvh - 66px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;text-align:center;gap:14px}
  #gate .lock{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--teal));display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 10px 30px rgba(15,61,92,.28)}
  #gate h2{margin:4px 0 0;color:var(--navy);font-size:1.3rem}
  #gate p{margin:0;color:var(--suave);font-size:.95rem;max-width:320px;line-height:1.5}
  #gate .campo{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
  #gate input{border:1.6px solid var(--linha);border-radius:13px;padding:14px 16px;font-size:1.05rem;font-family:inherit;text-align:center;background:#fff}
  #gate input:focus{outline:none;border-color:var(--teal)}
  #gate .btn{background:var(--navy);color:#fff;border:none;border-radius:13px;padding:14px;font-size:1.05rem;font-weight:800;font-family:inherit;cursor:pointer}
  #gate .erro{color:#a8162a;font-size:.9rem;font-weight:700;min-height:18px}

  /* ===== CURSO ===== */
  #curso{display:none}
  .capa{background:linear-gradient(135deg,var(--navy),#14507a);color:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(15,61,92,.18);display:flex;gap:15px;align-items:center}
  .capa .foto{width:142px;height:80px;border-radius:12px;object-fit:cover;object-position:center top;flex-shrink:0;border:2px solid rgba(255,255,255,.28);box-shadow:0 4px 12px rgba(0,0,0,.25)}
  @media(max-width:430px){ .capa .foto{width:118px;height:66px} .capa h1{font-size:1.25rem} }
  .capa .info{flex:1;min-width:0}
  .capa .badge{display:inline-block;background:rgba(255,255,255,.16);color:#ffe4a8;font-size:.72rem;font-weight:800;letter-spacing:.5px;padding:5px 10px;border-radius:20px;text-transform:uppercase}
  .capa h1{margin:9px 0 4px;font-size:1.5rem;line-height:1.15}
  .capa .prof{color:#cfe3ec;font-size:.95rem}
  .capa .stats{display:flex;gap:18px;margin-top:12px;font-size:.8rem;color:#e7f1f6}
  .capa .stats b{display:block;font-size:1.15rem;color:#ffd98a}
  /* ===== CARD: imagem 16:9 na ESQUERDA + títulos na DIREITA ===== */
  /* CARD estilo HERO: foto colada à esquerda + gradiente dissolvendo pra direita + título */
  .ccard{position:relative;display:block;min-height:206px;background:linear-gradient(135deg,var(--navy),#14507a);border-radius:16px;margin-bottom:14px;cursor:pointer;box-shadow:0 8px 22px rgba(15,61,92,.20);transition:transform .12s;overflow:hidden}
  .ccard:active{transform:scale(.99)}
  .ccard .cover{position:absolute;left:0;top:0;height:100%;width:58%;object-fit:cover;object-position:center top;z-index:0;
    -webkit-mask-image:linear-gradient(to right,#000 48%,rgba(0,0,0,.4) 72%,transparent 100%);
    mask-image:linear-gradient(to right,#000 48%,rgba(0,0,0,.4) 72%,transparent 100%)}
  .ccard::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,rgba(15,61,92,0) 20%,rgba(15,61,92,.5) 42%,var(--navy) 62%)}
  .ccard .info{position:relative;z-index:2;width:54%;margin-left:auto;color:#fff;padding:16px 18px 16px 4px}
  .ccard .info .badge{display:inline-block;background:rgba(255,255,255,.16);color:#ffe4a8;font-size:.62rem;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:20px;text-transform:uppercase}
  .ccard .info h1{margin:8px 0 2px;font-size:1.32rem;line-height:1.13;font-weight:800}
  .ccard .info .prof{color:#cfe3ec;font-size:.84rem}
  .ccard .info .stats{display:flex;gap:13px;margin-top:11px;font-size:.66rem;color:#e7f1f6}
  .ccard .info .stats b{display:block;font-size:1rem;color:#ffd98a;line-height:1}
  .ccard .arr{position:absolute;top:50%;right:8px;transform:translateY(-50%);color:#ffd98a;font-size:1.4rem;font-weight:700;opacity:.8;z-index:3}
  @media(max-width:360px){ .ccard .info h1{font-size:1.18rem} .ccard{min-height:188px} }
  /* ===== CARD HERO (só GIOM): retrato à esquerda com brilho azul + títulos à direita ===== */
  .ccard.hero{background:linear-gradient(120deg,#02375e 0%,#0a4a7d 100%);min-height:212px}
  .ccard.hero .hglow{position:absolute;left:-4%;top:-6%;width:64%;height:96%;z-index:0;pointer-events:none;
    background:radial-gradient(52% 46% at 44% 40%,rgba(40,110,230,.55) 0%,rgba(40,110,230,.18) 46%,transparent 70%)}
  .ccard.hero .hfoto{position:absolute;left:-14px;bottom:0;height:112%;width:auto;max-width:none;z-index:1;
    object-fit:contain;object-position:left bottom;pointer-events:none;
    -webkit-mask-image:linear-gradient(to right,#000 72%,rgba(0,0,0,.35) 90%,transparent 100%);
    mask-image:linear-gradient(to right,#000 72%,rgba(0,0,0,.35) 90%,transparent 100%)}
  .ccard.hero .hinfo{position:relative;z-index:2;width:55%;margin-left:auto;color:#fff;padding:15px 16px 14px 4px}
  .ccard.hero .hpill{display:inline-block;background:rgba(255,255,255,.16);color:#f0c24b;font-size:.6rem;font-weight:800;letter-spacing:.7px;padding:5px 12px;border-radius:20px;text-transform:uppercase}
  .ccard.hero h1{margin:9px 0 3px;font-size:1.35rem;line-height:1.1;font-weight:800;color:#fff;text-shadow:0 1px 6px rgba(2,25,45,.45)}
  .ccard.hero .hprof{color:#cfe0ee;font-size:.86rem;text-shadow:0 1px 4px rgba(2,25,45,.4)}
  .ccard.hero .hstats{display:flex;align-items:center;gap:10px;margin-top:12px}
  .ccard.hero .hstats .st{text-align:left}
  .ccard.hero .hstats .st b{display:block;font-size:1.18rem;color:#f0c24b;line-height:1;font-weight:800}
  .ccard.hero .hstats .st span{display:block;font-size:.6rem;color:#e7f1f6;margin-top:3px;white-space:nowrap}
  .ccard.hero .hstats .dv{width:1px;height:28px;background:rgba(255,255,255,.26);flex-shrink:0}
  .ccard.hero .hprog{margin-top:13px}
  .ccard.hero .hbar{height:7px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
  .ccard.hero .hfill{height:100%;border-radius:6px;background:linear-gradient(90deg,#2f9e8f,#1a8a4a);transition:width .35s}
  .ccard.hero .hlbl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.75rem;color:#e7f1f6}
  .ccard.hero .hlbl b{color:#f0c24b;font-weight:800}
  .ccard.hero .hcnt{margin-top:9px;color:#cfe0ee;font-size:.76rem}
  .ccard.hero .hcnt.clik{text-decoration:underline dotted rgba(207,224,238,.5)}
  .ccard.hero .harr{position:absolute;top:50%;right:9px;transform:translateY(-50%);color:#f0c24b;font-size:1.4rem;font-weight:700;opacity:.85;z-index:3}
  @media(max-width:430px){ .ccard.hero .hinfo{width:57%} .ccard.hero h1{font-size:1.22rem} }
  @media(max-width:360px){ .ccard.hero{min-height:196px} .ccard.hero h1{font-size:1.1rem} .ccard.hero .hstats{gap:7px} .ccard.hero .hstats .st b{font-size:1.02rem} }
  .pdf-link{display:flex;align-items:center;gap:10px;background:#fff8e6;border:1px solid #f0dcaa;color:#6b551f;border-radius:12px;padding:11px 13px;margin-bottom:14px;text-decoration:none;font-weight:700;font-size:.92rem}
  .lista-tit{font-size:.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#8a91a0;margin:2px 2px 12px}
  .capa-click{cursor:pointer;position:relative;transition:transform .12s}
  .capa-click:active{transform:scale(.99)}
  .capa-arr{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#ffd98a;font-size:1.7rem;font-weight:700}
  .voltar-curso{background:none;border:none;color:#0f3d5c;font-weight:800;font-family:inherit;font-size:.98rem;cursor:pointer;padding:2px 0 10px}
  .sec-mod{font-size:.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#8a91a0;margin:6px 2px 10px}
  .mentor{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:16px 16px 6px;margin-bottom:16px;box-shadow:0 4px 14px rgba(15,61,92,.06)}
  .mentor-sel{font-size:.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dourado);margin-bottom:10px}
  .mentor-top{display:flex;align-items:center;gap:13px;margin-bottom:12px}
  .mentor-top img{width:66px;height:66px;border-radius:13px;object-fit:cover;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .mentor-id b{display:block;color:var(--navy);font-size:1.12rem;font-family:Georgia,serif}
  .mentor-id span{font-size:.84rem;color:var(--suave)}
  .mentor p{font-size:.95rem;line-height:1.6;color:#33404f;text-align:justify;margin:0 0 12px}
  .mentor-list{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:7px}
  .mentor-list li{font-size:.85rem;font-weight:700;color:#0f3d5c;background:#eef4f8;border:1px solid #d7e6ee;border-radius:999px;padding:6px 12px}
  .mentor-list li::before{content:'✓ ';color:#1a8a4a;font-weight:900}
  .mentor-foot{font-style:italic;color:var(--suave)!important;font-size:.9rem!important}

  .mod{background:var(--card);border:1px solid var(--linha);border-radius:14px;margin-bottom:11px;overflow:hidden;box-shadow:0 2px 6px rgba(20,40,70,.05)}
  .mod-h{display:flex;align-items:center;gap:12px;padding:14px 15px;cursor:pointer;user-select:none}
  .mod-h .n{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex-shrink:0}
  .mod-h .ti{flex:1;min-width:0}
  .mod-h .ti b{display:block;font-size:1rem;color:var(--navy);line-height:1.2}
  .mod-h .ti span{font-size:.76rem;color:var(--suave)}
  .mod-h .seta{color:var(--dourado);font-size:1.1rem;transition:transform .2s}
  .mod.aberto .seta{transform:rotate(90deg)}
  .aulas{display:none;border-top:1px solid var(--linha)}
  .mod.aberto .aulas{display:block}
  .aula{display:flex;align-items:center;gap:11px;padding:12px 15px 12px 14px;border-top:1px solid #f0f2f5;cursor:pointer}
  .aula:first-child{border-top:none}
  .aula:active{background:#f2f6fb}
  .aula .pl{width:30px;height:30px;border-radius:50%;background:#eaf3f5;color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
  .aula.vista .pl{background:#e5f6ec;color:#1a8a4a}
  .aula .txt{flex:1;min-width:0;font-size:.92rem;line-height:1.35}
  .aula .txt small{display:block;color:var(--suave);font-size:.72rem;margin-top:1px}
  .vazio-mod{padding:14px 15px;color:var(--suave);font-size:.85rem}

  /* ===== PROGRESSO (barra do curso) ===== */
  .prog{margin-top:12px}
  .prog .bar{height:8px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden}
  .prog .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--dourado));width:0;transition:width .35s}
  .prog .lbl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.72rem;color:#e7f1f6}
  .prog .lbl b{color:#ffd98a;font-weight:800}
  /* barra em fundo claro (dentro do card de curso, nível 2) */
  .ccard .prog{margin-top:9px}
  .concluido-tag{display:inline-flex;align-items:center;gap:4px;background:#1a8a4a;color:#fff;font-size:.6rem;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:20px;text-transform:uppercase;margin-left:7px}
  /* ===== CONTINUAR DE ONDE PAROU ===== */
  .resume{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--teal),#0c5a63);color:#fff;border-radius:14px;padding:13px 15px;margin-bottom:14px;cursor:pointer;box-shadow:0 6px 18px rgba(15,109,120,.25);transition:transform .12s}
  .resume:active{transform:scale(.99)}
  .resume .ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .resume .rt{flex:1;min-width:0}
  .resume .rt small{display:block;font-size:.68rem;letter-spacing:.5px;text-transform:uppercase;color:#d6f2f5;font-weight:800}
  .resume .rt b{display:block;font-size:.98rem;line-height:1.25;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .resume .go{color:#fff;font-size:1.5rem;font-weight:700;flex-shrink:0}
  /* ===== BUSCA DE AULA ===== */
  .busca{position:relative;margin-bottom:14px}
  .busca input{width:100%;border:1.6px solid var(--linha);border-radius:12px;padding:11px 38px 11px 38px;font-size:.95rem;font-family:inherit;background:#fff;color:var(--txt)}
  .busca input:focus{outline:none;border-color:var(--teal)}
  .busca .lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--suave);font-size:1rem}
  .busca .limpar{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--suave);font-size:1.1rem;cursor:pointer;display:none;padding:4px}
  .busca.tem .limpar{display:block}
  .aula.oculta{display:none}
  .mod.busca-vazio{display:none}
  .mod-h .cont{font-size:.72rem;color:var(--suave);white-space:nowrap;margin-left:auto;padding-left:8px}
  .mod-h .cont b{color:#1a8a4a}
  /* checkbox "concluída" na aula (Udemy-style) */
  .aula .chk{width:24px;height:24px;border-radius:7px;border:2px solid #cfd6df;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;font-size:.9rem;font-weight:900;cursor:pointer;transition:all .12s}
  .aula.vista .chk{background:#1a8a4a;border-color:#1a8a4a;color:#fff}
  .aula .chk:active{transform:scale(.88)}
  /* botão copiar (link do site) */
  .copiar-btn{background:#eef4f8;border:1px solid #cfe0ee;color:#0f6d78;border-radius:9px;padding:7px 11px;font-weight:800;font-family:inherit;font-size:.8rem;cursor:pointer;flex-shrink:0}
  .copiar-btn:active{transform:scale(.96)}
  /* marcar concluída dentro do player */
  #player .pbar .pchk{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:9px;padding:8px 11px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;font-size:.82rem}
  #player .pbar .pchk.on{background:#1a8a4a}

  /* ===== PLAYER ===== */
  #player{position:fixed;inset:0;background:#0a1420;z-index:50;display:none;flex-direction:column}
  #player.on{display:flex}
  #player .pbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;color:#fff}
  #player .pbar button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:9px;padding:8px 12px;font-weight:700;font-family:inherit;cursor:pointer}
  #player .pbar .pt{flex:1;min-width:0;font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #player .vwrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000;padding:0 10px}
  /* vídeo encaixado num quadro 16:9 que cabe na largura do celular (não estoura a tela) */
  #player .vbox{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;max-height:100%;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #player .vbox iframe,#player .vbox video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}
  #player .prox{padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#0f1d2e;color:#cfe0ee;font-size:.85rem;display:flex;align-items:center;justify-content:space-between;gap:10px}
  #player .prox button{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:800;font-family:inherit;cursor:pointer}
  .carregando{text-align:center;color:var(--suave);padding:40px 20px}
  .quem-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
  .quem-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--linha);border-radius:999px;padding:7px 14px 7px 10px;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(15,61,92,.08)}
  .quem-pill .qe{font-size:1.15rem;line-height:1}
  .quem-pill .qn{color:#0f3d5c;font-size:.95rem}
  .quem-pill .qc{color:#8aa;font-size:.9rem}
  .quem-hint{font-size:.72rem;color:var(--suave)}
  .cnt-pessoas{margin-top:8px;font-size:.8rem;color:#5b7186}
  .cnt-pessoas.clik{cursor:pointer;text-decoration:underline dotted rgba(91,113,134,.5)}
  .cnt-pessoas .agora{color:#1a8a4a;font-weight:700}
  /* módulos com miniatura de capa (pôster) — visual de plataforma de curso */
  .mod-cap .mod-h{padding:10px 12px;gap:13px}
  .mod-h .mthumb{position:relative;width:47px;height:84px;border-radius:9px;overflow:hidden;flex-shrink:0;background:var(--navy);box-shadow:0 3px 8px rgba(20,40,70,.22)}
  .mod-h .mthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .mod-h .mthumb .mnum{position:absolute;left:4px;top:4px;min-width:18px;height:18px;padding:0 4px;border-radius:6px;background:rgba(10,20,32,.85);color:#fff;font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
  .mod-h .mthumb.semimg{display:flex;align-items:center;justify-content:center}
  .mod-h .mthumb.semimg .mnum{position:static;background:transparent;font-size:1.1rem}
  .mod-cap .mod-h .ti b{font-size:1.02rem;font-weight:800}
  .mod-h .ti .mbar{height:4px;border-radius:3px;background:#e6ebf1;margin-top:8px;overflow:hidden;max-width:190px}
  .mod-h .ti .mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#1a8a4a);border-radius:3px;transition:width .25s}
</style>
</head>
<body>
  <header>
    <div class="ico">🎓</div>
    <div class="t"><b>Cursos de Teologia</b><span>Área particular — trancada</span></div>
    <button onclick="location.href='/'">🏠</button>
  </header>

  <!-- CADEADO -->
  <div id="gate">
    <div class="lock">🔒</div>
    <h2>Conteúdo particular</h2>
    <p>Esta área é sua. Digite a <b>senha</b> ou o <b>PIN</b> para liberar os vídeos do curso.</p>
    <div class="campo">
      <input id="senha" type="password" placeholder="Senha ou PIN (ex: 0607)" autocomplete="off" enterkeyhint="go">
      <button class="btn" id="btnEntrar" onclick="entrar()">Entrar 🔓</button>
      <div class="erro" id="erro"></div>
    </div>
  </div>

  <!-- CURSO -->
  <div id="curso" class="wrap"></div>

  <!-- PLAYER -->
  <div id="player">
    <div class="pbar">
      <button onclick="fecharPlayer()">‹ Voltar</button>
      <div class="pt" id="p-titulo"></div>
      <button class="pchk" id="p-chk" onclick="toggleVistaPlayer()">✓ Concluída</button>
    </div>
    <div class="vwrap"></div>
    <div class="prox">
      <span id="p-mod"></span>
      <button id="p-prox" style="display:none" onclick="proximaAula()">Próxima aula ›</button>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
let DADOS=null, PLANO=[], atual=-1, CURSO_ATUAL='', PERFIL='';
let _syncQ={}, _syncT=null;

// Metadados (capa/mentor) de cada curso — casa pelo slug 'curso' vindo do banco
const META={
  'escatologia-ivan-santos':{
    titulo:'Escatologia Avançada', prof:'com Ivan Santos', foto:'/img/curso/ivansantos.jpg', badge:'Curso completo',
    apostila:{href:'apostila.html', sub:'Texto completo — 16 módulos, leitura com índice'},
    site:{href:'https://ivansantosescatologia.com.br/', label:'ivansantosescatologia.com.br — Ivan Santos'},
    mentor:{ nome:'Ivan Santos', cargo:'Pastor, teólogo e especialista em Escatologia', foto:'/img/curso/ivansantos.jpg',
      bio:'Pastor, teólogo e especialista em Escatologia com mais de 10 anos de experiência no ensino e estudo das profecias bíblicas, reconhecido no Brasil como uma das maiores autoridades sobre dispensacionalismo. Ivan dedicou sua carreira a traduzir e revisar as mais importantes obras escatológicas (John Walvoord, Renald Showers, Darrell Bock, Craig Blaising, William Watson, dentre outros), trazendo conhecimento profundo e revelador sobre os últimos tempos.',
      tags:['Tradutor','Escritor','Teólogo','Especialista em Escatologia Dispensacionalista','Professor em diversos institutos teológicos'],
      foot:'Seu trabalho vai além da sala de aula — Ivan tem participado dos mais relevantes debates teológicos nos principais programas de TV e podcasts.' }
  },
  'giom-teologia':{
    titulo:'Instituto Teológico GIOM', prof:'com Dr. Wagner Cordeiro', foto:'/img/curso/wagner-cordeiro.jpg', badge:'Curso completo',
    site:{href:'https://www.instagram.com/giomoficial/', label:'Instituto Teológico GIOM — @giomoficial'},
    mentor:{ nome:'Dr. Wagner Cordeiro', cargo:'Pastor e professor de teologia', foto:'/img/curso/wagner-cordeiro.jpg',
      bio:'Pastor e professor à frente do Instituto Teológico GIOM, com ensino teológico semanal voltado a enriquecer o conhecimento da Palavra de Deus. As aulas percorrem temas como Parakletologia, Escatologia, Batalha Espiritual, o Tabernáculo e a Igreja, entre outros.',
      tags:['Pastor','Professor de Teologia','Instituto Teológico GIOM'],
      foot:'Conteúdo do Instituto Teológico GIOM Online.' }
  }
};
function meta(slug){ return META[slug] || {titulo:slug, prof:'', foto:'', badge:'Curso'}; }

// chave ÚNICA por vídeo (hash da URL inteira). O esquema antigo — btoa(url).slice(0,40) —
// dava a MESMA chave pra todo link do Drive (o prefixo "https://drive.google.com/file/" é igual),
// então marcar 1 aula marcava TODAS. Este hash é único por aula.
function keyU(u){ u=String(u||''); let h=5381; for(let i=0;i<u.length;i++){ h=((h*33)^u.charCodeAt(i))>>>0; } return h.toString(36); }

// ===== PERFIS: cada pessoa da casa tem o SEU progresso (estilo Netflix) =====
function perfis(){ try{ return JSON.parse(localStorage.getItem('curso_perfis')||'[]'); }catch(_){ return []; } }
function salvarPerfis(a){ try{ localStorage.setItem('curso_perfis', JSON.stringify(a)); }catch(_){} }
function perfilAtivo(){ return perfis().find(p=>p.id===PERFIL) || perfis()[0] || null; }
function novoIdPerfil(){ return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function definirPerfil(id){ PERFIL=id; try{ localStorage.setItem('curso_perfil_ativo', id); sessionStorage.setItem('curso_perfil_escolhido','1'); }catch(_){} }
function migrarProgressoAntigo(id){ // 1º uso: leva o progresso já existente (sem perfil) pro 1º perfil
  try{ const mv=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
      if(k && /^curso_(vista|pos|ultima)_/.test(k)) mv.push(k); }
    mv.forEach(k=>{ const v=localStorage.getItem(k);
      const nk=k.replace(/^curso_(vista|pos|ultima)_/,(m,p)=>'curso_'+p+'_'+id+'_');
      if(!localStorage.getItem(nk)) localStorage.setItem(nk,v); }); }catch(_){}
}
function initPerfis(){
  let ps=perfis();
  if(!ps.length){ const id=novoIdPerfil(); ps=[{id,nome:'Eu',emoji:'👤'}]; salvarPerfis(ps); migrarProgressoAntigo(id); definirPerfil(id); }
  let ativo=''; try{ ativo=localStorage.getItem('curso_perfil_ativo')||''; }catch(_){}
  PERFIL = ativo || ps[0].id;
  if(!perfis().find(p=>p.id===PERFIL)) PERFIL=perfis()[0].id;
}

function marcarVista(u,v){ try{ localStorage.setItem('curso_vista_'+PERFIL+'_'+keyU(u), v?'1':''); }catch(_){} syncProg(u,{vista:!!v}); }
function estaVista(u){ try{ return localStorage.getItem('curso_vista_'+PERFIL+'_'+keyU(u))==='1'; }catch(_){ return false; } }
function salvarPos(u,t){ try{ localStorage.setItem('curso_pos_'+PERFIL+'_'+keyU(u), String(Math.floor(t))); }catch(_){} syncProg(u,{pos:Math.floor(t)}); }
function lerPos(u){ try{ return parseInt(localStorage.getItem('curso_pos_'+PERFIL+'_'+keyU(u))||'0',10)||0; }catch(_){ return 0; } }
// última aula aberta por curso (pra "continuar de onde parou") — por perfil
function salvarUltima(slug,gi){ try{ localStorage.setItem('curso_ultima_'+PERFIL+'_'+slug, String(gi)); }catch(_){} }
function lerUltima(slug){ try{ const v=localStorage.getItem('curso_ultima_'+PERFIL+'_'+slug); return v===null?-1:(parseInt(v,10)); }catch(_){ return -1; } }

// ===== NUVEM: grava onde cada pessoa parou + serve pra contar quem está estudando =====
function syncProg(u,ch){ if(!CURSO_ATUAL||!PERFIL) return; const p=perfilAtivo(); if(!p) return;
  const key=keyU(u); _syncQ[key]=Object.assign(_syncQ[key]||{curso:CURSO_ATUAL,perfil:PERFIL,nome:p.nome,aula:key}, ch);
  clearTimeout(_syncT); _syncT=setTimeout(flushSync,1500); }
function flushSync(){ const itens=Object.values(_syncQ); _syncQ={}; if(!itens.length) return;
  try{ fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'curso-prog',itens})}).catch(()=>{}); }catch(_){} }
async function contarPessoas(slug){ try{ const r=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'curso-quem',curso:slug})}); const d=await r.json(); return (d&&d.ok)?d:null; }catch(_){ return null; } }
initPerfis();
// progresso de um curso: {vistas,total,pct}
function progressoCurso(cs){ let v=0,t=0; cs.modulos.forEach(mo=>mo.aulas.forEach(a=>{ t++; if(estaVista(a.url)) v++; })); return {vistas:v,total:t,pct:t?Math.round(v/t*100):0}; }

async function entrar(){
  const s=$('senha').value.trim();
  if(!s){ return; }
  $('btnEntrar').disabled=true; $('erro').textContent='';
  try{
    const r=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'curso',senha:s})});
    const d=await r.json();
    if(d && d.ok){
      try{ localStorage.setItem('curso_senha', s); }catch(_){}
      DADOS=d; render();
    }else{
      $('erro').textContent='Senha incorreta.';
      $('btnEntrar').disabled=false;
    }
  }catch(e){ $('erro').textContent='Sem conexão. Tente de novo.'; $('btnEntrar').disabled=false; }
}
$('senha').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); entrar(); } });

// NÍVEL 1 — lista de cursos (cada curso é um card; clica pra entrar)
function render(){
  $('gate').style.display='none';
  const cur=$('curso'); cur.style.display='block';
  const cursos = DADOS.cursos || (DADOS.modulos ? [{curso:DADOS.curso||'escatologia-ivan-santos', total:DADOS.total, modulos:DADOS.modulos}] : []);
  const pa=perfilAtivo()||{nome:'Eu',emoji:'👤'};
  let html=`<div class="quem-bar">
    <button class="quem-pill" onclick="abrirQuem()"><span class="qe">${pa.emoji||'👤'}</span><b class="qn">${pa.nome}</b><span class="qc">⌄</span></button>
    <span class="quem-hint">toque no nome pra trocar quem está estudando</span>
  </div>
  <div class="lista-tit">Meus cursos</div>`;
  cursos.forEach(cs=>{
    const m=meta(cs.curso);
    const pg=progressoCurso(cs);
    const feito = pg.total>0 && pg.vistas>=pg.total;
    if(cs.curso==='giom-teologia'){
      // CARD HERO — retrato do Dr. Wagner com brilho azul; números 100% dinâmicos
      html+=`
    <div class="ccard hero" onclick="abrirCurso('${cs.curso}')">
      <div class="hglow"></div>
      <img class="hfoto" src="/img/curso/wagner-hero.png" alt="${m.titulo}" onerror="this.style.display='none'">
      <div class="hinfo">
        <span class="hpill">${m.badge}</span>${feito?'<span class="concluido-tag">✓ Concluído</span>':''}
        <h1>${m.titulo}</h1>
        <div class="hprof">${m.prof}</div>
        <div class="hstats">
          <div class="st"><b>${cs.modulos.length}</b><span>módulos</span></div>
          <div class="dv"></div>
          <div class="st"><b>${cs.total}</b><span>aulas</span></div>
          <div class="dv"></div>
          <div class="st"><b>${pg.vistas}</b><span>assistidas</span></div>
        </div>
        <div class="hprog">
          <div class="hbar"><div class="hfill" style="width:${pg.pct}%"></div></div>
          <div class="hlbl"><span>Seu progresso</span><b>${pg.pct}%</b></div>
        </div>
        <div class="cnt-pessoas hcnt" id="pess-${cs.curso}"></div>
      </div>
      <span class="harr">›</span>
    </div>`;
    } else {
      html+=`
    <div class="ccard" onclick="abrirCurso('${cs.curso}')">
      <img class="cover" src="${m.foto}" alt="${m.titulo}" onerror="this.style.visibility='hidden'">
      <div class="info">
        <span class="badge">${m.badge}</span>${feito?'<span class="concluido-tag">✓ Concluído</span>':''}
        <h1>${m.titulo}</h1>
        <div class="prof">${m.prof}</div>
        <div class="stats">
          <div><b>${cs.modulos.length}</b>módulos</div>
          <div><b>${cs.total}</b>aulas</div>
          <div><b>${pg.vistas}</b>assistidas</div>
        </div>
        <div class="prog">
          <div class="bar"><div class="fill" style="width:${pg.pct}%"></div></div>
          <div class="lbl"><span>Seu progresso</span><b>${pg.pct}%</b></div>
        </div>
        <div class="cnt-pessoas" id="pess-${cs.curso}"></div>
      </div>
      <span class="arr">›</span>
    </div>`;
    }
  });
  cur.innerHTML=html;
  window.scrollTo(0,0);
  // contador de quem está estudando (nuvem) — enche cada card sem travar a tela
  cursos.forEach(cs=>{ contarPessoas(cs.curso).then(d=>{ const el=$('pess-'+cs.curso); if(!el||!d) return;
    if(!d.total){ el.innerHTML='👥 seja o primeiro a estudar'; return; }
    el.innerHTML='👥 <b>'+d.total+'</b> '+(d.total===1?'pessoa estudando':'pessoas estudando')+(d.online?' · <span class="agora">'+d.online+' agora</span>':'');
    el.classList.add('clik'); el.onclick=function(e){ e.stopPropagation(); verPessoas(cs.curso); };
  }); });
  // primeira vez com 2+ perfis nesta sessão: pergunta quem é
  if(perfis().length>1 && !(function(){ try{ return sessionStorage.getItem('curso_perfil_escolhido'); }catch(_){ return 0; } })()) abrirQuem();
}
// overlay "Quem está estudando?" (trocar/criar perfil)
function abrirQuem(){
  let ov=document.getElementById('quem-ov');
  if(!ov){ ov=document.createElement('div'); ov.id='quem-ov';
    ov.style.cssText='position:fixed;inset:0;z-index:70;background:rgba(8,18,28,.72);display:none;align-items:center;justify-content:center;padding:20px';
    ov.onclick=function(e){ if(e.target===ov) ov.style.display='none'; };
    document.body.appendChild(ov);
  }
  const ps=perfis();
  ov.innerHTML='<div style="background:#fff;border-radius:18px;max-width:430px;width:100%;padding:22px 18px 18px;box-shadow:0 18px 50px rgba(0,0,0,.4)">'
    +'<h3 style="margin:0 0 4px;text-align:center;color:#0f3d5c;font-size:1.18rem">Quem está estudando?</h3>'
    +'<p style="margin:0 0 18px;text-align:center;color:#6b7c8c;font-size:.85rem">Cada pessoa continua de onde parou</p>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px">'
    + ps.map(p=>'<button onclick="escolherPerfil(\''+p.id+'\')" style="background:'+(p.id===PERFIL?'#eaf4fb':'#f4f7fa')+';border:2px solid '+(p.id===PERFIL?'#2f88c4':'transparent')+';border-radius:14px;padding:14px 6px;cursor:pointer;font-family:inherit">'
        +'<div style="font-size:2.1rem;line-height:1">'+(p.emoji||'👤')+'</div>'
        +'<div style="font-size:.83rem;font-weight:800;color:#12405e;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+p.nome+'</div></button>').join('')
    +'<button onclick="novoPerfil()" style="background:#f4f7fa;border:2px dashed #c3d2de;border-radius:14px;padding:14px 6px;cursor:pointer;font-family:inherit">'
      +'<div style="font-size:2.1rem;line-height:1;color:#9ab">＋</div><div style="font-size:.83rem;font-weight:800;color:#4a6377;margin-top:6px">Novo</div></button>'
    +'</div>'
    + (ps.length>1?'<button onclick="removerPerfilUI()" style="display:block;margin:18px auto 0;background:none;border:none;color:#b04a4a;font-size:.82rem;font-family:inherit;cursor:pointer">Remover um perfil</button>':'')
    +'</div>';
  ov.style.display='flex';
}
function escolherPerfil(id){ definirPerfil(id); const ov=document.getElementById('quem-ov'); if(ov) ov.style.display='none'; render(); }
function novoPerfil(){ const nome=(prompt('Nome de quem vai estudar:')||'').trim(); if(!nome) return;
  const emojis=['🧑','👩','👨','🧔','👧','👦','🧓','👵','👴','🙋','📖','👤']; const em=emojis[perfis().length % emojis.length];
  const ps=perfis(); const id=novoIdPerfil(); ps.push({id,nome:nome.slice(0,20),emoji:em}); salvarPerfis(ps); definirPerfil(id);
  const ov=document.getElementById('quem-ov'); if(ov) ov.style.display='none'; render(); }
function removerPerfilUI(){ const ps=perfis(); if(ps.length<2) return;
  const nome=prompt('Digite o NOME do perfil a remover:\n('+ps.map(p=>p.nome).join(', ')+')'); if(!nome) return;
  const alvo=ps.find(p=>p.nome.toLowerCase()===nome.trim().toLowerCase()); if(!alvo){ alert('Perfil não encontrado.'); return; }
  const rest=ps.filter(p=>p.id!==alvo.id); salvarPerfis(rest);
  if(PERFIL===alvo.id) definirPerfil(rest[0].id);
  const ov=document.getElementById('quem-ov'); if(ov) ov.style.display='none'; render(); }
// detalhe: quem está estudando e quanto cada um já viu
async function verPessoas(slug){ const d=await contarPessoas(slug); if(!d) return;
  let ov=document.getElementById('pessoas-ov');
  if(!ov){ ov=document.createElement('div'); ov.id='pessoas-ov';
    ov.style.cssText='position:fixed;inset:0;z-index:70;background:rgba(8,18,28,.72);display:none;align-items:center;justify-content:center;padding:20px';
    ov.onclick=function(e){ if(e.target===ov) ov.style.display='none'; };
    document.body.appendChild(ov);
  }
  const linhas=(d.pessoas||[]).map(p=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-top:1px solid #eef2f6">'
    +'<span style="font-weight:700;color:#12405e">'+(p.nome||'Alguém')+'</span>'
    +'<span style="font-size:.85rem;color:#5b7186"><b style="color:#1a8a4a">'+p.vistas+'</b> aula'+(p.vistas===1?'':'s')+'</span></div>').join('') || '<p style="color:#6b7c8c;text-align:center;margin:14px 0">Ainda ninguém começou.</p>';
  ov.innerHTML='<div style="background:#fff;border-radius:18px;max-width:430px;width:100%;padding:20px 18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.4)">'
    +'<h3 style="margin:0 0 2px;text-align:center;color:#0f3d5c;font-size:1.12rem">👥 '+d.total+' '+(d.total===1?'pessoa estudando':'pessoas estudando')+'</h3>'
    +(d.online?'<p style="margin:0 0 10px;text-align:center;color:#1a8a4a;font-size:.85rem;font-weight:700">'+d.online+' online agora</p>':'<p style="margin:0 0 10px"></p>')
    +linhas
    +'<button onclick="document.getElementById(\'pessoas-ov\').style.display=\'none\'" style="display:block;margin:16px auto 0;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:10px 22px;font-weight:800;font-family:inherit;cursor:pointer">Fechar</button>'
    +'</div>';
  ov.style.display='flex';
}
function cursoPorSlug(slug){
  const cursos = DADOS.cursos || [{curso:DADOS.curso, total:DADOS.total, modulos:DADOS.modulos}];
  return cursos.find(c=>c.curso===slug) || cursos[0];
}

// Banner "continuar de onde parou" / "começar" — escolhe a aula certa
function proximaAlvo(cs){
  const ult=lerUltima(cs.curso);
  // 1ª aula não concluída (retoma o fluxo natural do curso)
  let prim=-1;
  cs.modulos.forEach(mo=>mo.aulas.forEach(a=>{ if(prim<0 && !estaVista(a.url)) prim=a._gi; }));
  // se a última aula aberta ainda não foi concluída, retoma exatamente nela
  if(ult>=0 && PLANO[ult] && !estaVista(PLANO[ult].a.url)) return ult;
  if(prim>=0) return prim; // senão, 1ª aula ainda não concluída
  return ult>=0?ult:0;     // tudo concluído: reabre a última
}
function bannerResume(cs){
  if(!PLANO.length) return '';
  const gi=proximaAlvo(cs); const p=PLANO[gi]; if(!p) return '';
  const algum = cs.modulos.some(mo=>mo.aulas.some(a=>estaVista(a.url)));
  const rot = algum? 'Continuar de onde parou' : 'Começar o curso';
  const ic = algum? '▶' : '🎬';
  return `<div class="resume" onclick="abrir(${gi})">
    <div class="ic">${ic}</div>
    <div class="rt"><small>${rot}</small><b>${limpaAula(p.a.titulo)}</b></div>
    <div class="go">›</div></div>`;
}
// marcar/desmarcar aula concluída direto na lista (não abre o player)
function toggleVistaAula(ev,gi){
  ev.stopPropagation();
  const p=PLANO[gi]; if(!p) return;
  const nv=!estaVista(p.a.url); marcarVista(p.a.url,nv);
  const el=document.querySelector('.aula[data-gi="'+gi+'"]'); if(el) el.classList.toggle('vista',nv);
  atualizarProgresso();
}
// recalcula e atualiza as barras/contadores sem re-renderizar tudo
function atualizarProgresso(){
  if(!CURSO_ATUAL) return;
  const cs=cursoPorSlug(CURSO_ATUAL); if(!cs) return;
  const pg=progressoCurso(cs);
  const capa=$('prog-capa');
  if(capa){ const f=capa.querySelector('.fill'); if(f) f.style.width=pg.pct+'%';
    const lbl=capa.querySelector('.lbl'); if(lbl) lbl.innerHTML='<span>'+pg.vistas+' de '+pg.total+' aulas</span><b>'+pg.pct+'%</b>'; }
  cs.modulos.forEach((m,mi)=>{ const feito=m.aulas.filter(a=>estaVista(a.url)).length;
    const c=document.querySelector('.cont[data-mc="'+mi+'"]'); if(c) c.innerHTML='<b>'+feito+'</b>/'+m.aulas.length;
    const bar=document.querySelector('[data-mb="'+mi+'"]'); if(bar) bar.style.width=(m.aulas.length?Math.round(feito/m.aulas.length*100):0)+'%'; });
}
// busca de aula (filtra as visíveis, abrindo os módulos com resultado)
function filtrarAulas(q){
  const box=$('busca-box'); if(box) box.classList.toggle('tem', !!q.trim());
  const termo=(q||'').trim().toLowerCase();
  document.querySelectorAll('.mod').forEach(mod=>{
    const mi=mod.getAttribute('data-mi');
    if(termo){ // garante que as aulas do módulo estão montadas
      const cont=mod.querySelector('.aulas');
      if(cont && !cont.dataset.pronto){ toggleMod(parseInt(mi,10)); }
    }
    let achou=0;
    mod.querySelectorAll('.aula').forEach(a=>{
      const t=a.getAttribute('data-t')||'';
      const ok = !termo || t.indexOf(termo)>=0;
      a.classList.toggle('oculta', !ok);
      if(ok) achou++;
    });
    if(termo){ mod.classList.toggle('busca-vazio', achou===0); mod.classList.add('aberto'); }
    else { mod.classList.remove('busca-vazio'); }
  });
}
function limparBusca(){ const i=$('busca-aula'); if(i){ i.value=''; } filtrarAulas(''); }
// copiar texto (link) com feedback no botão
function copiarTxt(txt,btn){
  const ok=()=>{ if(btn){ const o=btn.textContent; btn.textContent='Copiado ✓'; setTimeout(()=>btn.textContent=o,1400); } };
  try{ navigator.clipboard.writeText(txt).then(ok,()=>fallbackCopy(txt,ok)); }catch(_){ fallbackCopy(txt,ok); }
}
function fallbackCopy(txt,ok){ try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); ok&&ok(); }catch(_){} }

// NÍVEL 2 — dentro do curso: apostila + módulos/aulas
function abrirCurso(slug){
  const cur=$('curso');
  const cs=cursoPorSlug(slug); CURSO_ATUAL=cs.curso;
  const m0=meta(cs.curso);
  PLANO=[];
  cs.modulos.forEach(m=>{ m.aulas.forEach(a=>{ a._gi=PLANO.length; PLANO.push({m:m.nome,mo:m.ordem,a}); }); });
  const pg=progressoCurso(cs);
  const feito = pg.total>0 && pg.vistas>=pg.total;
  let html=`
    <button class="voltar-curso" onclick="render()">‹ Meus cursos</button>
    <div class="capa">
      <img class="foto" src="${m0.foto}" alt="${m0.titulo}" onerror="this.style.display='none'">
      <div class="info">
        <span class="badge">${m0.badge}</span>${feito?'<span class="concluido-tag">✓ Concluído</span>':''}
        <h1>${m0.titulo}</h1>
        <div class="prof">${m0.prof}</div>
        <div class="prog" id="prog-capa">
          <div class="bar"><div class="fill" style="width:${pg.pct}%"></div></div>
          <div class="lbl"><span>${pg.vistas} de ${pg.total} aulas</span><b>${pg.pct}%</b></div>
        </div>
        <div class="cnt-pessoas" id="pess-capa"></div>
      </div>
    </div>
    ${bannerResume(cs)}
    <div class="busca" id="busca-box">
      <span class="lupa">🔎</span>
      <input id="busca-aula" type="search" placeholder="Buscar aula por nome…" enterkeyhint="search" oninput="filtrarAulas(this.value)">
      <button class="limpar" onclick="limparBusca()" aria-label="Limpar">✕</button>
    </div>
    <div class="sec-mod" style="margin-top:2px">Módulos e aulas</div>`;
  // LAZY: só os cabeçalhos dos módulos entram agora (abre instantâneo mesmo em celular fraco);
  // as aulas de cada módulo são montadas quando ele é aberto (toggleMod).
  const temCapas = cs.curso==='giom-teologia';
  cs.modulos.forEach((m,mi)=>{
    const feitoMod=m.aulas.filter(a=>estaVista(a.url)).length;
    const nA=m.aulas.length; const pctM=nA?Math.round(feitoMod/nA*100):0;
    const esq = temCapas
      ? `<div class="mthumb"><img src="/biblioteca/curso-teologia/capas/mod-${String(mi+1).padStart(2,'0')}.jpg" alt="" loading="lazy" onerror="this.style.display='none';this.parentNode.classList.add('semimg')"><span class="mnum">${m.ordem}</span></div>`
      : `<div class="n">${m.ordem}</div>`;
    html+=`<div class="mod${temCapas?' mod-cap':''}" data-mi="${mi}"><div class="mod-h" onclick="moduloTap(${mi})">
      ${esq}
      <div class="ti"><b>${limpaModulo(m.nome)}</b><span>${nA} aula${nA>1?'s':''}</span>${temCapas?`<div class="mbar"><i data-mb="${mi}" style="width:${pctM}%"></i></div>`:''}</div>
      <div class="cont" data-mc="${mi}"><b>${feitoMod}</b>/${nA}</div>
      <div class="seta">›</div></div><div class="aulas">`;
    if(!m.aulas.length){ html+=`<div class="vazio-mod">Subindo os vídeos deste módulo…</div>`; }
    html+=`</div></div>`;
  });
  if(m0.apostila || m0.site){
    html+=`<div class="sec-mod" style="margin-top:22px">Material do curso</div>`;
    if(m0.apostila){
      html+=`<a class="pdf-link" href="${m0.apostila.href}">
        <span style="font-size:22px">📖</span>
        <span style="flex:1"><b style="display:block;font-size:1rem;color:#0f3d5c">Apostila do Curso</b>
        <span style="font-size:.82rem;color:#6b551f">${m0.apostila.sub}</span></span>
        <span style="color:#a9791c;font-size:1.2rem">›</span></a>`;
    }
    if(m0.site){
      html+=`<div class="pdf-link" style="background:#eef4f8;border-color:#cfe0ee">
        <span style="font-size:22px">🌐</span>
        <a href="${m0.site.href}" target="_blank" style="flex:1;text-decoration:none;color:inherit"><b style="display:block;font-size:1rem;color:#0f3d5c">Site oficial do curso</b>
        <span style="font-size:.82rem;color:#41607a">${m0.site.label}</span></a>
        <button class="copiar-btn" onclick="copiarTxt('${m0.site.href}',this)">Copiar</button></div>`;
    }
  }
  if(m0.mentor){
    const mt=m0.mentor;
    html+=`<div class="mentor">
      <div class="mentor-sel">Conheça o mentor</div>
      <div class="mentor-top">
        <img src="${mt.foto||m0.foto}" alt="${mt.nome}" onerror="this.style.display='none'">
        <div class="mentor-id"><b>${mt.nome}</b><span>${mt.cargo}</span></div>
      </div>
      <p>${mt.bio}</p>
      <ul class="mentor-list">${(mt.tags||[]).map(t=>`<li>${t}</li>`).join('')}</ul>
      ${mt.foot?`<p class="mentor-foot">${mt.foot}</p>`:''}
    </div>`;
  }
  cur.innerHTML=html;
  window.scrollTo(0,0);
  // quem está estudando (nuvem) na capa
  contarPessoas(cs.curso).then(d=>{ const el=$('pess-capa'); if(!el||!d) return;
    if(!d.total){ el.innerHTML='👥 seja o primeiro a estudar'; return; }
    el.innerHTML='👥 <b>'+d.total+'</b> '+(d.total===1?'pessoa estudando':'pessoas estudando')+(d.online?' · <span class="agora">'+d.online+' agora</span>':'');
    el.classList.add('clik'); el.onclick=function(){ verPessoas(cs.curso); };
  });
  // GIOM: índice só texto (não auto-abre; toca no módulo -> capa cheia -> aulas).
  // Outros cursos: abre o 1º módulo automaticamente (feedback imediato).
  if(cs.curso!=='giom-teologia' && cs.modulos.length && cs.modulos[0].aulas.length) toggleMod(0);
}
function limpaModulo(s){ return (s||'').replace(/^M[ÓO]DULO\s*\d+\s*-\s*/i,'').replace(/\s+\d+$/,'').trim(); }
function limpaAula(s){ return (s||'').replace(/\.(mkv|mp4)$/i,'').replace(/^AULA\s*[O0]?\d+\s*-\s*/i,'').trim(); }
function toggleMod(mi){
  const el=document.querySelector('.mod[data-mi="'+mi+'"]'); if(!el) return;
  const cont=el.querySelector('.aulas');
  if(cont && !cont.dataset.pronto){
    const cs=cursoPorSlug(CURSO_ATUAL); const m=cs&&cs.modulos[mi];
    if(m && m.aulas.length){
      cont.innerHTML=m.aulas.map(a=>`<div class="aula ${estaVista(a.url)?'vista':''}" data-gi="${a._gi}" data-t="${(limpaAula(a.titulo)||'').toLowerCase().replace(/"/g,'')}" onclick="abrir(${a._gi})">
        <div class="chk" title="Marcar como concluída" onclick="toggleVistaAula(event,${a._gi})">✓</div>
        <div class="pl">▶</div>
        <div class="txt">${limpaAula(a.titulo)}<small>Aula ${a.ordem}</small></div></div>`).join('');
    }
    cont.dataset.pronto='1';
  }
  el.classList.toggle('aberto');
}
// GIOM: toca no módulo -> abre a CAPA cheia; toca na capa -> mostra as aulas.
// Outros cursos: abre as aulas direto (acordeão).
function moduloTap(mi){
  if(CURSO_ATUAL==='giom-teologia'){ abrirCapaModulo(mi); }
  else { toggleMod(mi); }
}
function abrirCapaModulo(mi){
  const src='/biblioteca/curso-teologia/capas/mod-'+String(mi+1).padStart(2,'0')+'.jpg';
  let ov=document.getElementById('capa-mod-ov');
  if(!ov){
    ov=document.createElement('div'); ov.id='capa-mod-ov';
    ov.style.cssText='position:fixed;inset:0;z-index:60;background:#0a1420;display:none;cursor:pointer;overflow:hidden';
    ov.innerHTML='<div id="capa-mod-bg" style="position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(26px) brightness(.45)"></div>'
      +'<img id="capa-mod-img" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1">'
      +'<div id="capa-mod-fb" style="position:absolute;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px"><div style="font-size:2.6rem;margin-bottom:14px">📖</div><div id="capa-mod-fbt" style="color:#fff;font-size:1.7rem;font-weight:800;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.5)"></div><div style="color:#9db8cc;margin-top:10px;font-size:.9rem">Instituto Teológico GIOM</div></div>'
      +'<button id="capa-mod-back" style="position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;z-index:3;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:999px;padding:9px 16px;font-weight:800;font-family:inherit;cursor:pointer">&lsaquo; Índice</button>'
      +'<div style="position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;z-index:3"><span style="display:inline-block;background:rgba(15,61,92,.9);color:#fff;padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.28);font-weight:800;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.4)">▶ Toque para ver as aulas</span></div>';
    document.body.appendChild(ov);
    document.getElementById('capa-mod-back').onclick=function(e){ e.stopPropagation(); ov.style.display='none'; };
    // toque na capa -> abre SÓ as aulas desse módulo (tela dedicada), não o índice inteiro
    ov.onclick=function(){ ov.style.display='none'; abrirModuloSolo(ov._mi); };
  }
  ov._mi=mi;
  const csM=cursoPorSlug(CURSO_ATUAL); const nomeM=(csM&&csM.modulos[mi])?limpaModulo(csM.modulos[mi].nome):'';
  const img=document.getElementById('capa-mod-img'), fb=document.getElementById('capa-mod-fb');
  document.getElementById('capa-mod-fbt').textContent=nomeM;
  fb.style.display='none'; img.style.display='block';
  img.onerror=function(){ img.style.display='none'; fb.style.display='flex'; };  // sem capa ainda -> mostra o nome bonito
  img.onload=function(){ fb.style.display='none'; img.style.display='block'; };
  img.src=src;
  document.getElementById('capa-mod-bg').style.backgroundImage="url('"+src+"')";
  ov.style.display='block';
}
// Tela DEDICADA de UM módulo: mostra só o título + as aulas daquele estudo (nada do índice geral).
function abrirModuloSolo(mi){
  const cs=cursoPorSlug(CURSO_ATUAL); const m=cs&&cs.modulos[mi]; if(!m) return;
  let ov=document.getElementById('mod-solo-ov');
  if(!ov){
    ov=document.createElement('div'); ov.id='mod-solo-ov';
    ov.style.cssText='position:fixed;inset:0;z-index:40;background:#eef3f7;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch';
    ov.innerHTML='<div style="position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 12px">'
      +'<button id="mod-solo-back" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:9px;padding:8px 13px;font-weight:800;font-family:inherit;cursor:pointer">&lsaquo; Índice</button>'
      +'<div id="mod-solo-h" style="flex:1;min-width:0;font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div>'
      +'<div id="mod-solo-body" style="padding:14px 12px calc(24px + env(safe-area-inset-bottom))"></div>';
    document.body.appendChild(ov);
    document.getElementById('mod-solo-back').onclick=function(){ ov.style.display='none'; };
  }
  document.getElementById('mod-solo-h').textContent=limpaModulo(m.nome);
  const feito=m.aulas.filter(a=>estaVista(a.url)).length;
  let body='<div style="display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px">'
    +'<h2 style="margin:0;font-size:1.2rem;color:#0f3d5c">'+limpaModulo(m.nome)+'</h2>'
    +'<span style="font-size:.85rem;color:#5b7186;font-weight:700"><b style="color:#1a8a4a">'+feito+'</b>/'+m.aulas.length+'</span></div>';
  if(!m.aulas.length){
    body+='<div class="vazio-mod">Subindo os vídeos deste módulo…</div>';
  }else{
    body+=m.aulas.map(a=>'<div class="aula '+(estaVista(a.url)?'vista':'')+'" data-gi="'+a._gi+'" onclick="abrir('+a._gi+')" style="background:#fff;margin-bottom:8px;border-radius:12px">'
      +'<div class="chk" title="Marcar como concluída" onclick="toggleVistaAula(event,'+a._gi+')">✓</div>'
      +'<div class="pl">▶</div>'
      +'<div class="txt">'+limpaAula(a.titulo)+'<small>Aula '+a.ordem+'</small></div></div>').join('');
  }
  document.getElementById('mod-solo-body').innerHTML=body;
  ov.style.display='block'; ov.scrollTop=0;
}

function idDrive(url){ const m=(url||'').match(/\/d\/([^/]+)/)||(url||'').match(/[?&]id=([^&]+)/); return m?m[1]:''; }
function abrir(gi){
  atual=gi; const p=PLANO[gi]; if(!p) return;
  salvarUltima(CURSO_ATUAL, gi);
  $('player').classList.add('on');
  $('p-titulo').textContent=limpaAula(p.a.titulo);
  $('p-mod').textContent=limpaModulo(p.m);
  const vw=document.querySelector('#player .vwrap');
  const url=p.a.url||'';
  const gid=idDrive(url);
  if(gid || /drive\.google\.com/.test(url)){
    // vídeo do Drive embutido DENTRO do app (a pessoa não sai do app)
    const emb = gid ? ('https://drive.google.com/file/d/'+gid+'/preview') : url;
    vw.innerHTML='<div class="vbox"><iframe src="'+emb+'" allow="autoplay; fullscreen" allowfullscreen playsinline></iframe></div>';
    marcarVista(url,true);
    const el=document.querySelector('.aula[data-gi="'+gi+'"]'); if(el) el.classList.add('vista');
    atualizarProgresso();
  } else {
    vw.innerHTML='<div class="vbox"><video id="vid" controls playsinline preload="metadata"></video></div>';
    const v=$('vid'); v.src=url;
    const pos=lerPos(url);
    v.onloadedmetadata=()=>{ if(pos>5 && pos<v.duration-10){ v.currentTime=pos; } };
    v.ontimeupdate=()=>{ if(v.currentTime>0) salvarPos(url,v.currentTime); };
    v.onended=()=>{ marcarVista(url,true); const el=document.querySelector('.aula[data-gi="'+gi+'"]'); if(el) el.classList.add('vista'); syncPlayerChk(); atualizarProgresso(); };
    v.play().catch(()=>{});
  }
  $('p-prox').style.display = (gi+1<PLANO.length)?'inline-block':'none';
  syncPlayerChk();
}
function syncPlayerChk(){ const p=PLANO[atual]; if(!p)return; const on=estaVista(p.a.url); const b=$('p-chk'); if(b){ b.classList.toggle('on',on); b.textContent=on?'✓ Concluída':'Marcar concluída'; } }
function toggleVistaPlayer(){ const p=PLANO[atual]; if(!p)return; const nv=!estaVista(p.a.url); marcarVista(p.a.url,nv); const el=document.querySelector('.aula[data-gi="'+atual+'"]'); if(el) el.classList.toggle('vista',nv); syncPlayerChk(); atualizarProgresso(); }
function proximaAula(){ if(atual+1<PLANO.length) abrir(atual+1); }
function fecharPlayer(){ try{ const v=$('vid'); if(v){ v.pause(); v.src=''; } }catch(_){} const vw=document.querySelector('#player .vwrap'); if(vw) vw.innerHTML=''; $('player').classList.remove('on'); abrirCurso(CURSO_ATUAL); }

// auto-desbloqueio (aparelho do Elias): se já entrou antes, não pede senha de novo
(async function(){
  let s=''; try{ s=localStorage.getItem('curso_senha')||''; }catch(_){}
  if(s){
    try{
      const r=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'curso',senha:s})});
      const d=await r.json();
      if(d && d.ok){ DADOS=d; render(); return; }
    }catch(_){}
  }
  $('senha').focus();
})();
</script>
</body>
