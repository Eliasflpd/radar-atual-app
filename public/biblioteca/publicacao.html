<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Publicação — Escavador de Pérolas Bíblicas</title>
<!-- Página que mostra uma peça vinda do banco (radar_publicacoes) no MESMO visual
     das mensagens/sermões que já existem em arquivo. O molde é o de
     public/biblioteca/sermoes/_gerar.js — navy, teal, dourado, vinho, Georgia nos títulos. -->
<style>
  :root{--branco:#ffffff;--texto:#1c2230;--navy:#0f3d5c;--teal:#0f6d78;--dourado:#a9791c;--vinho:#8a1c1c}
  *{box-sizing:border-box;-webkit-text-size-adjust:100%}
  html{font-size:17px}
  body{margin:0 auto;max-width:820px;background:var(--branco);color:var(--texto);font-family:'Segoe UI',system-ui,Arial,sans-serif;line-height:1.7;padding:16px 13px calc(46px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .topo{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .voltar{display:inline-block;background:#1c2230;color:#fff;border:none;border-radius:999px;padding:9px 17px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none}
  .voltar.ouro{background:var(--dourado)} .voltar.teal{background:var(--teal)}
  .selo{text-align:center;color:var(--teal);font-size:.82rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
  h1{font-family:Georgia,'Times New Roman',serif;text-align:center;color:var(--navy);font-size:1.85rem;line-height:1.22;font-weight:800;margin:2px 0 4px}
  .ref{text-align:center;color:var(--dourado);font-weight:800;font-size:1.1rem;margin-bottom:6px}
  .quem{text-align:center;color:var(--teal);font-weight:700;font-size:.9rem;margin-bottom:14px}
  .divisor{height:3px;width:64px;background:var(--dourado);border-radius:3px;margin:0 auto 22px}
  .intro{background:#f2f7f8;border:1px solid #d5e6e8;border-radius:14px;padding:16px;margin-bottom:26px}
  .intro p{margin:0}
  p{font-size:1.12rem;margin:0 0 16px;text-align:justify;text-justify:inter-word}
  strong{color:var(--vinho);font-weight:800}
  em{color:var(--navy);font-style:italic}
  h2.sec{font-family:Georgia,serif;text-align:center;color:var(--navy);font-size:1.28rem;font-weight:800;line-height:1.35;margin:30px 0 14px;padding-top:18px;border-top:1px solid #e8e8ee}
  h2.sec .num{display:inline-block;background:var(--navy);color:#fff;border-radius:50%;width:1.7em;height:1.7em;line-height:1.7em;font-size:.85rem;margin-right:6px;font-family:inherit}
  ul{list-style:none;margin:0 0 16px;padding:0}
  ul li{position:relative;padding:0 0 0 22px;margin:0 0 10px;font-size:1.1rem;text-align:left}
  ul li::before{content:"\25C6";color:var(--dourado);position:absolute;left:2px;top:0}
  ul li strong{color:var(--vinho)}
  .final{background:#fbf6ea;border:2px solid #ecd9ad;border-radius:16px;padding:18px 16px;margin-top:24px}
  .final h2.sec{margin-top:0;border-top:none;padding-top:0}
  .acoes{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
  .acoes button{flex:1;min-width:140px;border:none;border-radius:12px;padding:12px;font-size:.98rem;font-weight:800;font-family:inherit;cursor:pointer}
  .acoes .cop{background:var(--dourado);color:#fff}
  .acoes .lnk{background:rgba(15,61,92,.08);color:var(--navy);border:1px solid #e4e7ec}
  .assinatura{text-align:center;color:var(--teal);font-weight:700;font-size:.95rem;margin-top:22px}
  .aviso{text-align:center;color:#6b7280;padding:40px 10px;font-size:1rem}
  .erro{background:#fdeaea;border:1px solid #f2c2c2;color:var(--vinho);border-radius:13px;padding:14px 15px;font-weight:700;text-align:center}
</style>
</head>
<body>
  <div class="topo" id="topo">
    <a class="voltar" id="bVoltar" href="/biblioteca/mensagens/">← Voltar</a>
    <a class="voltar teal" href="/biblioteca/concilio/">📖 Concílio</a>
    <a class="voltar ouro" href="/">🏠 Início</a>
  </div>

  <div id="alvo"><div class="aviso">Abrindo a publicação…</div></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var slug = (new URLSearchParams(location.search).get('s') || '').trim();
  var LISTA = { mensagem:'/biblioteca/mensagens/', estudo:'/biblioteca/estudo/' };
  var NOME  = { mensagem:'Mensagens', estudo:'Estudos' };

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function copiar(t, b){
    function fb(){ try{ var a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0';
      document.body.appendChild(a); a.focus(); a.select(); document.execCommand('copy'); document.body.removeChild(a); }catch(e){} }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fb); else fb();
    if(b){ var o=b.textContent; b.textContent='✅ Copiado'; setTimeout(function(){ b.textContent=o; },1600); }
  }

  if(!slug){
    $('alvo').innerHTML = '<div class="erro">Faltou dizer qual publicação abrir.</div>';
    return;
  }

  fetch('/api/publicacoes?slug=' + encodeURIComponent(slug))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.ok || !d.item) throw new Error((d && d.erro) || 'não encontrada');
      var p = d.item;
      var tipo = p.tipo === 'estudo' ? 'estudo' : 'mensagem';
      document.title = p.titulo + ' — Escavador de Pérolas Bíblicas';
      var v = $('bVoltar'); v.href = LISTA[tipo]; v.textContent = '← ' + NOME[tipo];

      var data = '';
      try{ data = new Date(p.criado_em).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}); }catch(e){}

      var h = '<div class="selo">✦ Escavador de Pérolas Bíblicas ✦</div>'
        + '<h1>' + (p.emoji ? esc(p.emoji)+' ' : '') + esc(p.titulo) + '</h1>'
        + (p.referencia ? '<div class="ref">' + esc(p.referencia) + '</div>' : '')
        + '<div class="quem">' + esc((p.expositor_nome
              ? (tipo === 'estudo' ? 'Forjado com ' : 'Forjada com ') + p.expositor_nome
              : 'Concílio dos Expositores')
            + (data ? ' · ' + data : '')) + '</div>'
        + '<div class="divisor"></div>'
        + (p.resumo ? '<div class="intro"><p>' + esc(p.resumo) + '</p></div>' : '')
        + p.corpo_html
        + '<div class="acoes"><button class="cop" id="bCop">📋 Copiar</button>'
        + '<button class="lnk" id="bLink">🔗 Copiar o link</button></div>'
        + '<div class="assinatura">✦ Análise selada pelo Escavador de Pérolas Bíblicas ✦</div>';
      $('alvo').innerHTML = h;

      $('bCop').addEventListener('click', function(){
        var t = p.corpo_texto || ($('alvo').innerText || '');
        copiar(t, this);
      });
      $('bLink').addEventListener('click', function(){ copiar(location.href, this); });
    })
    .catch(function(e){
      $('alvo').innerHTML = '<div class="erro">Não consegui abrir esta publicação ('
        + esc((e && e.message) || 'falha') + ').<br>Volte para a lista e tente de novo.</div>';
    });
})();
</script>
</body>
</html>
